name: "Labels: Branch staging"

on:
  pull_request_target:
    types:
      - opened
    branches:
      - 'staging'

concurrency:
  # WOLFGATE(Ci): on pull_request_target the ref is the base branch, so every PR shared one group and cancelled the others
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  add_label:
    # WOLFGATE(Ci) START: default token permissions are read-only
    permissions:
      pull-requests: write
    # WOLFGATE END
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Branch: Staging"
