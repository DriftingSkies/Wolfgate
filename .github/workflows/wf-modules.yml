# WOLFGATE(Ci): checks the module docs and non-modular edits with Tools/_WF/Ci/modules.py (see AGENTS.md)
name: Wolfgate Modules

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: Wolfgate Modules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install pyyaml pillow # WOLFGATE(ClothingLayer): shapes.py reads the clothing sprites

    - name: Check module docs and markers
      run: python3 Tools/_WF/Ci/modules.py --check

    # WOLFGATE(ClothingLayer): fails when a clothing sprite was added or changed without regenerating the shapes list
    - name: Check clothing shapes
      if: ${{ !cancelled() }}
      run: python3 Tools/_WF/ClothingLayer/shapes.py --check

    # Runs even when the check above failed; skipped for Monolith ports, whose upstream edits carry no markers.
    - name: Check edits outside _WF
      if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'autoport/') && !startsWith(github.event.pull_request.title, '[AUTOPORT]') }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: python3 Tools/_WF/Ci/modules.py --pr-check "origin/$BASE_REF"
