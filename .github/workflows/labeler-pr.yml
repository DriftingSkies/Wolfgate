name: "Labels: PR"

on:
- pull_request_target

concurrency:
  # WOLFGATE(Ci): on pull_request_target the ref is the base branch, so every PR shared one group and cancelled the others
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v5
