    - type: Add
      message: >-
        Xenomorphs. Every RMC-14 caste is playable: larva, drone, lesser drone,
        runner, lurker, warrior, ravager, praetorian (all strains), defender,
        crusher, boiler, spitter, sentinel, burrower, hivelord (with the
