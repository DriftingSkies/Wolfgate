        available. Burst larva nobody claims become ghost roles.
    - type: Add
      message: >-
        A Xenonids section in the ghost menu and a Xenonids group in the admin
        spawn menu; xeno_larva and hive admin commands.
    - type: Add
      message: Xenonid guidebook pages.
    - type: Tweak
      message: >-
        Xeno acid melts any structure; xeno claws damage walls and airlocks by
        RMC's rules (sharp claws and up; drones pry or acid). Fire burns weeds
        and spreads along them; xenos pat fires out by clicking them. The queen
        cannot be set on fire; king and ravager resist burn damage.
    - type: Tweak
      message: >-
        Queens can pilot shuttle consoles but no xeno can use gunnery. Queens
        and kings ignore air pressure. Station (CC) turrets shoot xenos.
    - type: Tweak
      message: >-
        C4 and grenades collapse xeno tunnels; shovels and entrenching tools
        fill them. Tunnels and burrowing never cross between grids.
