        evolution and strains.
    - type: Add
      message: >-
        The hive: hivemind chat (;), plasma, weeds and hive weeds, resin walls,
        doors and membranes, nests, tunnels, hive core, clusters, pylons,
        recovery and plasma nodes, egg morpher, acid pillar, traps, resin fruit,
        and a resin sensor that works as a mass scanner.
    - type: Add
      message: >-
        Eggs and facehuggers. Hosts (humans and monkeys) can be infected and
        burst into larva. Anyone can plant an egg anywhere.
    - type: Add
      message: >-
        Alien Embryo Removal surgery: surgeons and the autodoc can remove a
        larva from an infected host.
    - type: Add
