# Step 2: a burrow at the walk-in spot that keeps sending the world's wildlife until it is destroyed or filled in.
- type: entity
  abstract: true
  id: WFRaidBurrowBase
  name: burrow
  description: A fresh hole, wide enough for whatever dug it to keep coming up. Break it in or fill it with a shovel.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _WF/Fauna/Mobs/NuclearPhase/burrow.rsi
    state: burrow
    scale: 2, 2
    drawdepth: FloorObjects
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: WFRaidBurrow

- type: entity
  parent: WFRaidBurrowBase
  id: WFRaidBurrowVerda
  components:
  - type: FaunaBurrow
    prototypes: [ WFMobVerdaScarRat ]
    interval: 20
    maxAlive: 4

- type: entity
  parent: WFRaidBurrowBase
  id: WFRaidBurrowMerak
  components:
  - type: FaunaBurrow
    prototypes: [ WFMobDesertTarantula ]
