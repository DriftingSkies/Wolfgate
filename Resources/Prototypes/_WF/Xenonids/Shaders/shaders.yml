- type: shader
  id: RMCXenoScreechShockWave
  kind: source
  path: "/Textures/_WF/Xenonids/Shaders/screech_shock_wave.swsl"

- type: shader
  id: RMCDoomVision
  kind: source
  path: "/Textures/_WF/Xenonids/Shaders/night_vision.swsl"
  params:
    nv_color: 0.5, 0.5, 0.5

# Used by the explosion shock wave overlay.
- type: shader
  id: RMCShockWave
  kind: source
  path: "/Textures/_WF/Xenonids/Shaders/shock_wave.swsl"

# Used by invisible xenos (lurker stealth).
- type: shader
  id: RMCInvisible
  kind: source
  path: "/Textures/_WF/Xenonids/Shaders/invisible.swsl"

# Used by the aura outline (berserker rage, pheromones); the swsl is upstream's outline shader.
- type: shader
  id: RMCAuraOutline
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#000000FF"
    light_boost: 4.0
    light_gamma: 1.0
    light_whitepoint: 1.0
