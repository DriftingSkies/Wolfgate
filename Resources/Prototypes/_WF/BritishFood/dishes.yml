        - ReagentId: Flavorol
          Quantity: 10
  - type: Tag
    tags:
    - Meat

# The bitten sprite shows once someone has had a go at it. Its volume must stay full to show whole.
- type: entity
  parent: WFFoodBritishDishBase
  id: WFFoodCheesyBeanMelt
  components:
  - type: Sprite
    layers:
    - state: cheesy_bean_melt-2
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: cheesy_bean_melt-
    changeColor: false
    solutionName: food
  - type: FlavorProfile
    flavors:
    - WFPastry
    - meaty
    - WFBakedBeans
    - cheesy
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 33
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Protein
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 2
        - ReagentId: Ketchup
          Quantity: 3
        - ReagentId: Flavorol
          Quantity: 10
  - type: Tag
    tags:
    - Meat

