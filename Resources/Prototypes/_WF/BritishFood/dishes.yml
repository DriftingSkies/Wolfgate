# Home-cooked British dishes. Ported from Meridian Rift PR #242. Cooking them earns Flavorol; the vendor versions in
# packs.yml have none and come salted or sugared instead.

- type: entity
  parent: FoodInjectableBase
  id: WFFoodBritishDishBase
  abstract: true
  components:
  - type: Sprite
    sprite: _WF/BritishFood/dishes.rsi
  - type: Item
    size: Small

- type: entity
  parent: WFFoodBritishDishBase
  id: WFFoodHuntersChicken
  components:
  - type: Sprite
    state: hunters_chicken
  - type: FlavorProfile
    flavors:
    - chicken
    - bacon
    - WFBarbecueSauce
    - cheesy
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 40
        reagents:
        - ReagentId: Protein
          Quantity: 10
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 4
        - ReagentId: BbqSauce
          Quantity: 5
        - ReagentId: Flavorol
          Quantity: 10
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: WFFoodBritishDishBase
  id: WFFoodBeansOnToast
  components:
  - type: Sprite
    state: beans_on_toast
  - type: FlavorProfile
    flavors:
    - WFBakedBeans
    - bread
    - butter
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Protein
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 3
        - ReagentId: Ketchup
          Quantity: 3
        - ReagentId: Flavorol
          Quantity: 5

# Eating it leaves the drinking glass the recipe took, as soups leave their bowls.
- type: entity
