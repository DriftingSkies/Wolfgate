# Battered in the assembler, then fried in the deep fryer.
- type: entity
  parent: FoodSnackChocolateBar
  id: WFFoodMarsBarBattered
  components:
  - type: Sprite
    sprite: _WF/BritishFood/dishes.rsi
    state: deep_fried_mars_bar_battered
  - type: FlavorProfile
    flavors:
    - chocolate
    - batter
  - type: DeepFrySpawn
    output: WFFoodDeepFriedMarsBar

- type: entity
  parent: WFFoodBritishDishBase
  id: WFFoodDeepFriedMarsBar
  components:
  - type: Sprite
    state: deep_fried_mars_bar
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
    - chocolate
    - WFToffee
    - batter
  # The fat clears from the blood slowly. One now and then never hurts; three in a few minutes strain the heart.
  # The fat skips the stomach, so its share of the filling is in the nutriment.
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 4
        - ReagentId: CocoaPowder
          Quantity: 1
        - ReagentId: Theobromine
          Quantity: 3
        - ReagentId: WFSaturatedFat
          Quantity: 4
        - ReagentId: Flavorol
          Quantity: 3
  - type: Tag
    tags:
    - FoodSnack

- type: entity
  parent: WFFoodBritishDishBase
  id: WFFoodCornishPasty
  components:
  - type: Sprite
    state: cornish_pasty
  - type: FlavorProfile
