# Grab-and-go food from Mrs. Luvvit's Pie & Mash. Each pack is eaten straight from its container or, used in hand,
# opened to take the food out; the food keeps the bites already taken and the empty container comes with it. Vendor
# food is junkier than the home-cooked dish: less nutritious, salted or sugared, and never chef-made. Hot food comes
# out of the vendor piping hot.

- type: entity
  parent: FoodBase
  id: WFFoodBritishPackBase
  abstract: true
  components:
  - type: Sprite
    sprite: _WF/BritishFood/packs.rsi
  - type: Item
    size: Small
  - type: Tag
    tags:
    - FoodSnack

- type: entity
  parent: WFFoodBritishPackBase
  id: WFFoodBritishPackHotBase
  abstract: true
  components:
  - type: WFPipingHot

- type: entity
  parent: WFFoodBritishPackHotBase
  id: WFFoodPackHuntersChicken
  components:
  - type: Sprite
    state: hunters_chicken
  - type: Food
    trash:
    - WFTrashPackHuntersChicken
  - type: WFUnwrapFood
    food: WFFoodHuntersChickenVendor
  - type: FlavorProfile
    flavors:
    - chicken
    - bacon
    - WFBarbecueSauce
    - cheesy
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 16
        reagents:
        - ReagentId: Protein
          Quantity: 5
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: BbqSauce
          Quantity: 3
        - ReagentId: TableSalt
          Quantity: 2
  - type: StaticPrice
    vendPrice: 450

