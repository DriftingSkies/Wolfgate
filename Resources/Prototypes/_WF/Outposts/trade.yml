# Outpost trade: the universal trade hub that the console's Trade tab drops orders onto, the listings it sells (cargo
# products in the WFOutpost group), the Planet Outpost Kit with its add-on crates, and the outfitter that sells them.
# Every listing and kit costs at least what it appraises at once delivered (OutpostTradeTest).

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostTradeHubPack
  name: trade hub pack
  description: A folded universal trade hub. Use it in hand facing your outpost's floor, near an LV cable, to set it up there.
  components:
  - type: Sprite
    sprite: _WF/Outposts/Colony/trade_hub.rsi
    layers:
    - state: packed
  - type: WFDeployable
    machine: WFOutpostTradeHub
    face: false
  - type: StaticPrice
    price: 400

- type: entity
  abstract: true
  id: WFBaseOutpostTradeHub
  name: universal trade hub
  description: A drop beacon for your outpost's Trade orders, which come down on it by parachute, a flare marking the spot. It needs power and open sky.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _WF/Outposts/Colony/trade_hub.rsi
    drawdepth: FloorObjects
    layers:
    - state: base
    - state: lights
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Clickable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: ExtensionCableReceiver
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: WFUniversalTradeHub
  - type: StaticPrice
    price: 400

# A delivery on its way down: the client draws the product under a canopy over its shadow, and it lands as the product.
- type: entity
  id: WFTradeDropDescent
  name: supply drop
  description: A delivery coming down under its canopy.
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    noRot: true
    drawdepth: Effects
  - type: WFTradeDrop
  - type: Tag
    tags:
    - HideContextMenu

# Lit on the drop tile as a delivery starts down, and burns out a little after it lands.
- type: entity
  id: WFTradeDropFlare
  name: drop flare
  description: A flare marking where a delivery is about to come down. Stand clear.
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    drawdepth: FloorObjects
    layers:
    - state: flare_base
    - state: flare_unlit
      color: "#FF0000"
    - state: flare_burn
      shader: unshaded
    - sprite: Effects/chemsmoke.rsi
      state: chemsmoke
      color: "#D0605070"
      scale: 0.45, 0.45
      offset: 0, 0.55
  - type: PointLight
    color: "#FF5040"
    radius: 3.5
    energy: 4
    netsync: false
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      interpolate: Nearest
      minDuration: 0.05
      maxDuration: 0.15
      startValue: 3
      endValue: 5
      property: Energy
      isLooped: true
      enabled: true
  - type: AmbientSound
    range: 6
    volume: -8
    sound:
      path: /Audio/Items/Flare/flare_burn.ogg
  - type: TimedDespawn
    lifetime: 13

- type: entity
  parent: WFBaseOutpostTradeHub
  id: WFOutpostTradeHub
  components:
  - type: WFRepackable
    pack: WFOutpostTradeHubPack

# The kit and its add-ons. A crate appraises at what it holds, so each one's vend price sits just above that.

- type: entity
  parent: CrateGenericSteel
  id: WFCratePlanetOutpostKit
  name: Planet Outpost Kit
  description: Everything to start a planet outpost and live off it - console, trade hub, fabricator, wind and sun power, a battery, the makings of an APC, cable, plates and roofing.
  components:
  - type: StorageFill
    contents:
    - id: WFOutpostConsoleKit
    - id: WFOutpostTradeHubPack
    - id: WFOutpostFabricatorPack
    - id: WFOutpostWindTurbinePack
    - id: WFOutpostSolarStringPack
    - id: WFOutpostBatterySmallPack
    - id: APCElectronics
    - id: SheetSteel10
    - id: CableMVStack
    - id: CableApcStack
    - id: WFOutpostFoundationPlate10
    - id: WFOutpostRoofPanel10
  - type: StaticPrice
    vendPrice: 9500

- type: entity
  parent: CrateGenericSteel
  id: WFCrateOutpostShell
  name: outpost shell crate
  description: Prefab walls, windows and a door, enough to close in a small room.
  components:
  - type: StorageFill
    contents:
    - id: WFPrefabWallPanel
      amount: 8
    - id: WFPrefabWindowKit
      amount: 2
    - id: WFPrefabDoorKit
  - type: StaticPrice
    vendPrice: 500

- type: entity
  parent: CrateGenericSteel
  id: WFCrateOutpostFoundation
  name: outpost foundation crate
  description: Foundation plates and roof panels, ten of each, to grow an outpost and roof it over.
  components:
  - type: StorageFill
    contents:
    - id: WFOutpostFoundationPlate10
    - id: WFOutpostRoofPanel10
  - type: StaticPrice
    vendPrice: 600

- type: entity
  parent: CrateGenericSteel
  id: WFCrateOutpostPower
  name: outpost power crate
  description: A wind turbine, two solar strings, a small battery and MV and LV cable, for an outpost that runs on the weather.
  components:
  - type: StorageFill
    contents:
    - id: WFOutpostWindTurbinePack
    - id: WFOutpostSolarStringPack
      amount: 2
    - id: WFOutpostBatterySmallPack
    - id: CableMVStack
    - id: CableApcStack
  - type: StaticPrice
    vendPrice: 2300

