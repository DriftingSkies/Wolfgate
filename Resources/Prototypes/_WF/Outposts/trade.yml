# A Tradepost's hub (F6.2): it takes the drops of every outpost on its world whose own hub can't.
- type: entity
  parent: WFBaseOutpostTradeHub
  id: WFPoiPublicTradeHub
  name: public trade hub
  description: A drop beacon any outpost on this world may have its Trade orders sent to while its own hub can't take them.
  components:
  - type: ApcPowerReceiver
    needsPower: false
  - type: WFUniversalTradeHub
    public: true
