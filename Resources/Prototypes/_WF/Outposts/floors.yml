# Colony floors, printed as tiles at the outpost fabricator. Art from NovaSector's colony fabricator.

- type: latheRecipe
  abstract: true
  parent: BaseTileRecipe
  id: WFBaseOutpostFloorRecipe
  categories:
  - WFOutpostBuilding

- type: latheRecipePack
  id: WFOutpostFloorsStatic
  recipes:
  - WFFloorTileItemColonyGrey
  - WFFloorTileItemColonyGreyTexture
  - WFFloorTileItemColonyGreyBolts
  - WFFloorTileItemColonyWhite
  - WFFloorTileItemColonyWhiteTexture
  - WFFloorTileItemColonyWhiteBolts

- type: tile
  id: WFFloorColonyGrey
  name: tiles-wf-colony-grey
  sprite: /Textures/_WF/Outposts/Colony/floors.rsi/colony_grey.png
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor
  itemDrop: WFFloorTileItemColonyGrey
  heatCapacity: 10000

- type: stack
  id: WFFloorTileColonyGrey
  name: grey colony floor
  spawn: WFFloorTileItemColonyGrey
  maxCount: 30

- type: entity
  parent: FloorTileItemBase
  id: WFFloorTileItemColonyGrey
  name: grey colony floor tile
  components:
  - type: Sprite
    sprite: _WF/Outposts/Colony/floor_tiles.rsi
    state: colony_grey
  - type: Item
    heldPrefix: steel
  - type: FloorTile
    outputs:
    - Plating
    - WFFloorColonyGrey
  - type: Stack
    stackType: WFFloorTileColonyGrey
  - type: StackPrice
    price: 2

- type: latheRecipe
  parent: WFBaseOutpostFloorRecipe
  id: WFFloorTileItemColonyGrey
  result: WFFloorTileItemColonyGrey

