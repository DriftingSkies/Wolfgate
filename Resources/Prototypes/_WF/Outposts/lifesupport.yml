# Rations printer

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostRationsPrinterPack
  name: rations printer pack
  description: A packed rations printer. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#C9A66B"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostRationsPrinter
    delay: 3
  - type: StaticPrice
    price: 400

- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostRationsPrinter
  name: rations printer
  description: Presses biomass into ration bricks. Feed it biomass from a biogenerator.
  components:
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
      color: "#E8D3A8"
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - WFOutpostRationsStatic
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  - type: WFRepackable
    pack: WFOutpostRationsPrinterPack
    delay: 3
  - type: StaticPrice
    price: 400

- type: latheCategory
  id: WFOutpostRations
  name: wf-lathe-category-outpost-rations

- type: latheRecipePack
  id: WFOutpostRationsStatic
  recipes:
  - WFOutpostRationNutribrick
  - WFOutpostRationBrownie

- type: latheRecipe
  id: WFOutpostRationNutribrick
  result: FoodSnackNutribrick
  categories:
  - WFOutpostRations
  completetime: 4
  materials:
    Biomass: 10

- type: latheRecipe
  id: WFOutpostRationBrownie
  result: FoodSnackMREBrownie
  categories:
  - WFOutpostRations
  completetime: 4
  materials:
    Biomass: 8

# Cooking

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostGriddlePack
  name: griddle pack
  description: A packed griddle. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#B0B0B0"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostGriddle
    delay: 2
  - type: StaticPrice
    price: 300

- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostGriddle
  name: griddle
  description: A flat hot plate for steaks and eggs. Put the food on it and set the heat.
  components:
  - type: Sprite
    sprite: Structures/Machines/electric_grill.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    layers:
    - state: icon
    - map: ["enum.EntityHeaterVisuals.Setting"]
      shader: unshaded
      visible: false
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        layer:
        - HighImpassable
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: EntityHeater
    settingSound:
      path: /Audio/Weapons/click.ogg
      params:
        volume: -6
  - type: ItemPlacer
    maxEntities: 4
    whitelist:
      components:
      - Temperature
  - type: PlaceableSurface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: low }
          Medium: { visible: true, state: medium }
          High: { visible: true, state: high }
  - type: WFRepackable
    pack: WFOutpostGriddlePack
    delay: 2
  - type: StaticPrice
    price: 300

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostRangePack
  name: range pack
  description: A packed electric range. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#6E6E6E"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostRange
    delay: 3
  - type: StaticPrice
    price: 600

- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostRange
  name: range
  description: An oven with a hob on top, for an outpost kitchen.
  components:
  - type: Microwave
    capacity: 10
    canMicrowaveIdsSafely: false
    explosionChance: 0
    lightningChance: 0
    beginCookingSound: /Audio/_NF/Machines/egg-timer.ogg
    foodDoneSound: /Audio/Machines/ding.ogg
    loopingSound: /Audio/_NF/Effects/silence.ogg
    validRecipeTypes: Oven
    canHeat: true
    canIrradiate: false
    key: ElectricRangeKey
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: "off_no_door" }
          Broken: { state: "off_no_door" }
          Cooking: { state: "off_no_door" }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: "unlit" }
          Broken: { state: "unlit" }
          Cooking: { state: "cooking_unlit" }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: range_low }
          Medium: { visible: true, state: range_medium }
          High: { visible: true, state: range_high }
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.ElectricRangeKey
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.ElectricRangeKey:
        type: MicrowaveBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.30,-0.25,0.30,0.45"
        density: 600
        mask:
        - MachineMask
        layer:
        - MachineLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.30,0.15,0.30,0.45"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Sprite
    sprite: _NF/Structures/Machines/oven.rsi
    snapCardinals: true
    layers:
    - state: off_no_door
      map: ["enum.MicrowaveVisualizerLayers.Base"]
    - state: unlit
      shader: unshaded
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
    - state: oven_door
    - map: ["enum.EntityHeaterVisuals.Setting"]
      state: range_low
      shader: unshaded
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: ContainerContainer
    containers:
      microwave_entity_container: !type:Container
  - type: EntityHeater
    passivePower: 1000
  - type: PlaceableSurface
    isPlaceable: false
  - type: ItemPlacer
    maxEntities: 4
    whitelist:
      components:
      - Temperature
  - type: WFRepackable
    pack: WFOutpostRangePack
    delay: 3
  - type: StaticPrice
    price: 600

# Animal feeder: the enclosed floor round it is a pen, whose livestock outpost saves keep (Husbandry).

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostAnimalFeederPack
  name: animal feeder pack
  description: A packed animal feeder. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#A0784A"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostAnimalFeeder
    delay: 2
  - type: StaticPrice
    price: 120

- type: entity
  parent: BaseStructure
  id: WFOutpostAnimalFeeder
  name: animal feeder
  description: A trough to keep animal feed in.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Storage/orebox.rsi
    noRot: true
    layers:
    - state: orebox
      color: "#B08850"
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Storage
    grid:
    - 0,0,7,3
    maxItemSize: Normal
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: WFAnimalFeeder
  - type: WFRepackable
    pack: WFOutpostAnimalFeederPack
    delay: 2
  - type: StaticPrice
    price: 120
