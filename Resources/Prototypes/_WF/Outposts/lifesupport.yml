# Atmos and kitchen pack: what keeps an outpost's people breathing, warm and fed. Each gizmo is the stock machine's
# working parts on a frame with no board, set up from its pack and repacked into it.

- type: entity
  abstract: true
  parent: BaseMachinePowered
  id: WFBaseOutpostLifeGizmo
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# CO2 cracker

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostCo2CrackerPack
  name: CO2 cracker pack
  description: A packed CO2 cracker. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#8FD3FF"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostCo2Cracker
    delay: 3
  - type: StaticPrice
    price: 900

- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostCo2Cracker
  name: CO2 cracker
  description: Splits the carbon dioxide in the room back into oxygen, up to a mole a second, while it has power.
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/Portable/portable_scrubber.rsi
    noRot: true
    layers:
    - state: icon-running
      color: "#BFE6FF"
    - state: unlit
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: AtmosDevice
    joinSystem: true
  - type: WFCo2Cracker
  - type: WFRepackable
    pack: WFOutpostCo2CrackerPack
    delay: 3
  - type: StaticPrice
    price: 900

# Heating

- type: entity
  abstract: true
  parent: WFBaseOutpostLifeGizmo
  id: WFBaseOutpostHeater
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/Portable/portable_sheater.rsi
    noRot: true
    layers:
    - state: sheaterOff
      map: ["enum.SpaceHeaterVisualLayers.Main"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SpaceHeaterVisuals.State:
        SpaceHeaterVisualLayers.Main:
          Off: { state: sheaterOff }
          StandBy: { state: sheaterStandby }
          Heating: { state: sheaterHeat }
          Cooling: { state: sheaterCool }
  - type: AtmosDevice
    joinSystem: true
  - type: SpaceHeater
  - type: GasThermoMachine
    temperatureTolerance: 0.2
    atmospheric: true
  - type: EntityRadiusHeater
    radius: 2
    thermalEnergy: 12000
    limit: 311

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostTemperatureRegulatorPack
  name: temperature regulator pack
  description: A packed temperature regulator. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#FF9F5A"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostTemperatureRegulator
    delay: 3
  - type: StaticPrice
    price: 450

- type: entity
  parent: WFBaseOutpostHeater
  id: WFOutpostTemperatureRegulator
  name: temperature regulator
  description: Heats or cools the room to the temperature you set.
  components:
  - type: ApcPowerReceiver
    powerDisabled: true
  - type: UserInterface
    interfaces:
      enum.SpaceHeaterUiKey.Key:
        type: SpaceHeaterBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: false
    key: enum.SpaceHeaterUiKey.Key
  - type: WFRepackable
    pack: WFOutpostTemperatureRegulatorPack
    delay: 3
  - type: StaticPrice
    price: 450

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostWallHeaterPack
  name: wall heater pack
  description: A packed wall heater. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#E8603C"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostWallHeater
    delay: 2
  - type: StaticPrice
    price: 200

- type: entity
  parent: WFBaseOutpostHeater
  id: WFOutpostWallHeater
  name: wall heater
  description: A plain heater that stands against a wall and keeps the room at room temperature whenever it has power. No settings.
  components:
  - type: ApcPowerReceiver
    powerDisabled: false
  - type: SpaceHeater
    mode: Heat
    powerLevel: Low
  - type: GasThermoMachine
    temperatureTolerance: 0.2
    atmospheric: true
    targetTemperature: 293.15
  - type: WFRepackable
    pack: WFOutpostWallHeaterPack
    delay: 2
  - type: StaticPrice
    price: 200

