# What the outpost fabricator prints. Every Wolfgate product is priced at or above the materials it costs
# (OutpostFabricatorTest); the stock recipes it shares keep upstream's prices.

- type: latheCategory
  id: WFOutpostBuilding
  name: wf-lathe-category-outpost-building

- type: latheRecipePack
  id: WFOutpostConstructionStatic
  recipes:
  - WFOutpostFoundationPlate
  - WFOutpostRoofPanel
  - WFPrefabWallPanel
  - WFPrefabWindowKit
  - WFPrefabDoorKit
  - WFPrefabAirlockKit
  - WFPrefabShuttersKit
  - WFOutpostFabricatorPack

- type: latheRecipePack
  id: WFOutpostToolsStatic
  recipes:
  - PowerDrill
  - WFArcWelder

- type: latheRecipe
  abstract: true
  id: WFBaseOutpostBuildingRecipe
  categories:
  - WFOutpostBuilding
  completetime: 3

- type: latheRecipe
  parent: WFBaseOutpostBuildingRecipe
  id: WFOutpostFoundationPlate
  result: WFOutpostFoundationPlate
  materials:
    Steel: 400

- type: latheRecipe
  parent: WFBaseOutpostBuildingRecipe
  id: WFOutpostRoofPanel
  result: WFOutpostRoofPanel
  materials:
    Steel: 200
