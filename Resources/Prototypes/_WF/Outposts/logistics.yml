# Deposit terminal

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostDepositTerminalPack
  name: deposit terminal pack
  description: A packed bank deposit terminal. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#D4C25A"
    - state: icon-default
  - type: WFDeployable
