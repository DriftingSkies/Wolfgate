# Telecom relay

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostTelecomRelayPack
  name: telecom relay pack
  description: A packed telecom relay. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#7FD17F"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostTelecomRelay
    delay: 3
  - type: StaticPrice
    price: 1500

- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostTelecomRelay
  name: telecom relay
  description: Carries headset radio on this world while it has power, on the channels of the keys in it. Comes with the common and traffic keys.
  components:
  - type: Sprite
    sprite: Structures/Machines/telecomms.rsi
    snapCardinals: true
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg
  - type: ApcPowerReceiver
    powerLoad: 400
  - type: EncryptionKeyHolder
    keysExtractionMethod: Prying
    keySlots: 4
  - type: TelecomServer
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTraffic
  - type: WFRepackable
    pack: WFOutpostTelecomRelayPack
    delay: 3
  - type: StaticPrice
    price: 1500

# Intercom

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostIntercomPack
  name: outpost intercom pack
  description: A packed standing intercom. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#9FB7D9"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostIntercom
    delay: 2
  - type: StaticPrice
    price: 400

- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostIntercom
  name: outpost intercom
  description: A standing intercom on the common and traffic channels. It needs no telecom relay, only power.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/intercom.rsi
    noRot: true
    layers:
    - state: base
    - state: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
    - state: broadcasting
      map: ["enum.RadioDeviceVisualLayers.Broadcasting"]
      shader: unshaded
      visible: false
    - state: speaker
      map: ["enum.RadioDeviceVisualLayers.Speaker"]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Broadcasting:
        enum.RadioDeviceVisualLayers.Broadcasting:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Speaker:
        enum.RadioDeviceVisualLayers.Speaker:
          True: { visible: true }
          False: { visible: false }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 100
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: TelecomExempt
  - type: EncryptionKeyHolder
    keySlots: 3
    keysExtractionMethod: Prying
  - type: RadioMicrophone
    powerRequired: true
    unobstructedRequired: true
    listenRange: 2
    toggleOnInteract: false
  - type: RadioSpeaker
    toggleOnInteract: false
  - type: Intercom
  - type: Speech
    speechVerb: Robotic
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTraffic
  - type: ActivatableUIRequiresPower
  - type: ActivatableUI
    key: enum.IntercomUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
  - type: WFRepackable
    pack: WFOutpostIntercomPack
    delay: 2
  - type: StaticPrice
    price: 400

