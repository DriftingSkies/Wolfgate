# A bank ATM's cash slot and deposit, with the usual fee, on a frame with no board. It takes cash, never pays it out.
- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostDepositTerminal
  name: deposit terminal
  description: Banks the cash put in it to your account, less a 5% fee. It holds no cash to pay out.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/atm/atm.rsi
    noRot: true
    layers:
    - state: icon
    - state: unshaded
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: BankATM
    cashSlot:
      name: bank-ATM-cashSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - Cash
    taxAccounts:
      Frontier: 0.02
      Nfsd: 0.02
      Medical: 0.01
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      bank-ATM-cashSlot: !type:ContainerSlot
  - type: WFDepositOnly
  - type: ActivatableUI
    key: enum.BankATMMenuUiKey.ATM
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.BankATMMenuUiKey.ATM:
        type: WFDepositTerminalBoundUserInterface
  - type: WFRepackable
    pack: WFOutpostDepositTerminalPack
    delay: 3
  - type: StaticPrice
    price: 1000
