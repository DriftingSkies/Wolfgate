- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostOrganicsPrinter
  name: organics printer
  description: Turns produce into biomass and prints food, fertiliser, cloth and other organics from it.
  components:
  - type: Sprite
    sprite: Structures/Machines/biofabricator.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: MaterialStorage
  - type: ProduceMaterialExtractor
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - FitsInDispenser
  - type: ContainerContainer
    containers:
      beaker_slot: !type:ContainerSlot
  - type: Lathe
    reagentOutputSlotId: beaker_slot
    idleState: icon
    runningState: building
    staticPacks:
    - BioGenIngredientsStatic
    - BioGenMaterialsStatic
    - NFBioGenIngredientsStatic
    - NFBioGenMaterialsStatic
    - NFBioGenSoil
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
