  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  - type: WFRepackable
    pack: WFOutpostOrganicsPrinterPack
    delay: 3
  - type: StaticPrice
    price: 700

