# Comms and logistics pack: radio and announcements for an outpost, the time and weather console, light, charging,
# recycling and storage. Each gizmo is the stock machine's working parts on a frame with no board, set up from its pack
# and repacked into it.

# Time and weather console

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostWeatherConsolePack
  name: time and weather console pack
  description: A packed time and weather console. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#6AB0E0"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostWeatherConsole
    delay: 3
  - type: StaticPrice
    price: 600

- type: entity
  parent: WFBaseOutpostLifeGizmo
  id: WFOutpostWeatherConsole
  name: time and weather console
  description: The world's clock, the time to dusk or dawn, the storm now and the forecast from the survey satellites.
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    # The computer sprite has four directions, which a cardinal-snapped sprite can't have.
    snapCardinals: false
    layers:
    - state: computer
    - state: generic_keyboard
    - state: sensors
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: WFWeatherForecastConsole
  - type: ActivatableUI
    key: enum.WFWeatherForecastUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.WFWeatherForecastUiKey.Key:
        type: WFWeatherForecastBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#6ab0e0"
  - type: LitOnPowered
  - type: WFRepackable
    pack: WFOutpostWeatherConsolePack
    delay: 3
  - type: StaticPrice
    price: 600

