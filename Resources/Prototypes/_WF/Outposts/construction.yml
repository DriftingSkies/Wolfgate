# Prefab building for outposts, printed at the outpost fabricator. Each panel or kit deploys in hand onto the outpost
# floor tile in front of you. Prefab walls, doors and shutters pack up again as they are, until a wall is welded in
# place; prefab windows and airlocks are taken apart the usual way, as stock ones.

- type: entity
  parent: WFBaseOutpostPack
  id: WFPrefabWallPanel
  name: prefab wall panel
  description: A folded wall section. Use it in hand facing your outpost's floor to stand it up there.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _WF/Outposts/Colony/plastic_panels.rsi
    layers:
    - state: sheet
  - type: WFDeployable
    machine: WFPrefabWall
    delay: 2
    face: false
  - type: StaticPrice
    price: 20

- type: entity
  abstract: true
  parent: BaseWall
  id: WFBasePrefabWall
  name: prefab wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _WF/Outposts/Colony/prefab_wall.rsi
  - type: Icon
    sprite: _WF/Outposts/Colony/prefab_wall.rsi
  - type: IconSmooth
    key: walls
    base: prefab
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: WallDefense1
  - type: ReceiverXenoClaws
    maxHealth: 800
    hitsToDestroy: 14
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 20

- type: entity
  parent: WFBasePrefabWall
  id: WFPrefabWall
  description: A bolted-together wall section. It packs up again, or weld its seams to fix it in place.
  components:
  - type: WFRepackable
    pack: WFPrefabWallPanel
    delay: 2
  - type: WFWeldSwap
    into: WFPrefabWallFixed
    done: wf-prefab-wall-welded

# A welded prefab wall no longer packs up; welding its seams open again frees it.
- type: entity
  parent: WFBasePrefabWall
  id: WFPrefabWallFixed
  suffix: Welded
  description: A prefab wall section with its seams welded, fixed in place. Cut the welds to pack it up again.
  components:
  - type: WFWeldSwap
    into: WFPrefabWall
    done: wf-prefab-wall-cut

- type: entity
  parent: WFBaseOutpostPack
  id: WFPrefabWindowKit
  name: prefab window kit
  description: A glass pane in a bolt-on frame. Use it in hand facing your outpost's floor to set a window there.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#A8D8EA"
    - state: icon-default
  - type: WFDeployable
    machine: WFPrefabWindow
    delay: 2
    face: false
  - type: StaticPrice
    price: 30

- type: entity
  parent: Window
  id: WFPrefabWindow
  name: prefab window
  description: A glass pane in a bolt-on frame.
  components:
  - type: Sprite
    sprite: _WF/Outposts/Colony/prefab_window.rsi
  - type: Icon
    sprite: _WF/Outposts/Colony/prefab_window.rsi
  - type: IconSmooth
    key: walls
    base: prefab

- type: entity
  parent: WFBaseOutpostPack
  id: WFPrefabDoorKit
  name: prefab door kit
  description: A hinged door in its frame. Use it in hand facing your outpost's floor to hang it there.
  components:
  - type: Sprite
    sprite: _WF/Outposts/Colony/door.rsi
    layers:
    - state: packed
  - type: WFDeployable
    machine: WFPrefabDoor
    delay: 3
  - type: StaticPrice
    price: 30

- type: entity
  parent: BaseMaterialDoorNavMap
  id: WFPrefabDoor
  name: prefab door
  description: A plain door that opens by hand. Needs no power, and locks with the outpost.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _WF/Outposts/Colony/door.rsi
  - type: Door
    openSound:
      path: /Audio/_WF/Outposts/manual_door_open.ogg
    closeSound:
      path: /Audio/_WF/Outposts/manual_door_close.ogg
  - type: AccessReader
  - type: WFRepackable
    pack: WFPrefabDoorKit
    delay: 3
  - type: StaticPrice
    price: 30

- type: entity
  parent: WFBaseOutpostPack
  id: WFPrefabAirlockKit
  name: prefab airlock kit
  description: A packed airlock, its electronics wired in. Use it in hand facing your outpost's floor to set it up there.
  components:
  - type: Sprite
    sprite: _WF/Outposts/Colony/airlock.rsi
    layers:
    - state: packed
  - type: WFDeployable
    machine: WFPrefabAirlock
    delay: 4
  - type: StaticPrice
    price: 85

- type: entity
  parent: Airlock
  id: WFPrefabAirlock
  name: prefab airlock
  description: A colony-pattern airlock. It opens, it closes, and it was cheap.
  components:
  # Its lights, panel and welds sit on its own leaf and status screen, not the stock airlock's.
  - type: Sprite
    sprite: _WF/Outposts/Colony/airlock.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      sprite: _WF/Outposts/Colony/airlock.rsi
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - state: welded
      sprite: _WF/Outposts/Colony/airlock.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      sprite: _WF/Outposts/Colony/airlock.rsi
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      sprite: _WF/Outposts/Colony/airlock.rsi
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
    - state: panel_open
      sprite: _WF/Outposts/Colony/airlock.rsi
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]

- type: entity
  parent: WFBaseOutpostPack
  id: WFPrefabShuttersKit
  name: prefab shutters kit
  description: A rolled-up shutter. Use it in hand facing your outpost's floor to set it up there, then link it to a button.
  components:
  - type: Sprite
    sprite: _WF/Outposts/Colony/shutters.rsi
    layers:
    - state: packed
  - type: WFDeployable
    machine: WFPrefabShutters
    delay: 3
  - type: StaticPrice
    price: 35

- type: entity
  parent: BaseShutter
  id: WFPrefabShutters
  name: prefab shutters
  description: Bolt-on shutters, opened and closed from a linked button.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _WF/Outposts/Colony/shutters.rsi
  - type: Occluder
  - type: ContainerFill
    containers:
      board: []
  - type: WFRepackable
    pack: WFPrefabShuttersKit
    delay: 3
  - type: StaticPrice
    price: 35
