# The outpost power pack. Every gizmo here feeds the LV network straight from the cable under it, so a wire run powers
# an outpost's machines without an APC. Those modelled on a stock machine run at 0.6 of it (OutpostPowerTest):
# the compact RTG of the RTG, the A.W. fuel generator of the J.R.P.A.C.M.A.N., the large battery of the SMES and the
# small one of the substation. Wind turbines and solar strings answer to the sky instead (WFOutpostPowerSystem).

- type: entity
  abstract: true
  parent: BaseStructure
  id: WFBaseOutpostPowerGizmo
  components:
  - type: InteractionOutline
  - type: Sprite
    snapCardinals: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
  parent: WFBaseOutpostPowerGizmo
  id: WFBaseOutpostGenerator
  components:
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: Apc
  - type: PowerSupplier
    voltage: Apc
    supplyRate: 0
    supplyRampRate: 500
    supplyRampTolerance: 500
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: Structures/Power/Generation/rtg.rsi
    state: rtg

# Wind

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostWindTurbinePack
  name: wind turbine pack
  description: A folded wind turbine. Use it in hand facing your outpost's floor, over an LV cable, to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#9FED58"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostWindTurbine
  - type: StaticPrice
    price: 600

- type: entity
  parent: WFBaseOutpostGenerator
  id: WFOutpostWindTurbine
  name: wind turbine
  description: Turns whatever breeze blows over it into power for the LV cable underneath, the more in a storm. It must stand under open sky, and there must be air.
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/directionalfan.rsi
    state: icon
    snapCardinals: false
  - type: PowerMonitoringDevice
    sprite: Structures/Piping/Atmospherics/directionalfan.rsi
    state: icon
  - type: WFWindTurbine
  - type: WFRepackable
    pack: WFOutpostWindTurbinePack
  - type: StaticPrice
    price: 600

# Solar

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostSolarStringPack
  name: solar string pack
  description: A folded string of solar panels. Use it in hand facing your outpost's floor, over an LV cable, to lay it out there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#334E6D"
    - state: solar-assembly-part
  - type: WFDeployable
    machine: WFOutpostSolarString
  - type: StaticPrice
    price: 450

- type: entity
  parent: WFBaseOutpostGenerator
  id: WFOutpostSolarString
  name: solar string
  description: A string of panels feeding the LV cable underneath. Strongest at noon, idle at night and under a roof.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/solar_panel.rsi
    state: solar_panel_glass
    drawdepth: FloorObjects
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - LowImpassable
  - type: PowerMonitoringDevice
    sprite: Structures/Power/Generation/solar_panel.rsi
    state: solar_panel_glass
  - type: WFSolarString
  - type: WFRepackable
    pack: WFOutpostSolarStringPack
  - type: StaticPrice
    price: 450

# Generators

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostCompactRTGPack
  name: compact RTG pack
  description: A packed compact RTG. Use it in hand facing your outpost's floor, over an LV cable, to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#DE3A3A"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostCompactRTG
    delay: 4
  - type: StaticPrice
    price: 6000

- type: entity
  parent: WFBaseOutpostGenerator
  id: WFOutpostCompactRTG
  name: compact RTG
  description: A small radioisotope generator for outposts. Feeds the LV cable underneath, day and night, for as long as it stands.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/rtg.rsi
    layers:
    - state: rtg
    - state: rtg_glow
      shader: unshaded
  - type: PowerSupplier
    supplyRate: 24000
  - type: AmbientSound
    range: 5
    volume: -6
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
  - type: WFRepackable
    pack: WFOutpostCompactRTGPack
    delay: 4
  - type: StaticPrice
    price: 6000

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostFuelGeneratorPack
  name: A.W. fuel generator pack
  description: A packed welding-fuel generator. Use it in hand facing your outpost's floor, over an LV cable, to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#EFB341"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostFuelGenerator
    delay: 4
  - type: StaticPrice
    price: 300

- type: entity
  parent: WFBaseOutpostGenerator
  id: WFOutpostFuelGenerator
  name: A.W. fuel generator
  description: A bolted-down generator that burns welding fuel into the LV cable underneath. Fill its tank and start it up.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/portable_generator.rsi
    noRot: true
    layers:
    - state: portgen3
      map: [ "enum.GeneratorVisualLayers.Body" ]
    - state: portgen3on_unlit
      map: [ "enum.GeneratorVisualLayers.Unlit" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { state: portgen3on }
          False: { state: portgen3 }
        enum.GeneratorVisualLayers.Unlit:
          True: { visible: true }
          False: { visible: false }
  - type: AmbientSound
    range: 4
    volume: -8
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
    enabled: false
  - type: UserInterface
    interfaces:
      enum.GeneratorComponentUiKey.Key:
        type: PortableGeneratorBoundUserInterface
  - type: ActivatableUI
    key: enum.GeneratorComponentUiKey.Key
  - type: PortableGenerator
    startChance: 0.4
    startSoundEmpty: { collection: GeneratorTugEmpty }
    startSound: { collection: GeneratorTug }
  - type: FuelGenerator
    targetPower: 3600
    minTargetPower: 600
    optimalPower: 3600
    maxTargetPower: 12000
    optimalBurnRate: 0.11111111
    fuelEfficiencyConstant: 0.5
  - type: ChemicalFuelGeneratorAdapter
    solution: tank
    reagents:
      WeldingFuel: 1
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 180
  - type: RefillableSolution
    solution: tank
  - type: PowerSupplier
    supplyRampTolerance: 2000
    enabled: false
  - type: GeneratorExhaustGas
    gasType: CarbonDioxide
    moleRatio: 0.5
  - type: PowerMonitoringDevice
    sprite: Structures/Power/Generation/portable_generator.rsi
    state: portgen3
  - type: WFRepackable
    pack: WFOutpostFuelGeneratorPack
    delay: 4
  - type: StaticPrice
    price: 300

# Batteries

- type: entity
  abstract: true
  parent: WFBaseOutpostPowerGizmo
  id: WFBaseOutpostBattery
  components:
  - type: Sprite
    sprite: Structures/Power/smes.rsi
    layers:
    - state: smes
    - map: ["enum.SmesVisualLayers.Charge"]
      state: "smes-og1"
      shader: unshaded
      visible: false
    - map: ["enum.SmesVisualLayers.Input"]
      state: "smes-oc0"
      shader: unshaded
    - map: ["enum.SmesVisualLayers.Output"]
      state: "smes-op1"
      shader: unshaded
  - type: Appearance
  - type: Smes
  - type: Battery
    startingCharge: 0
  - type: ExaminableBattery
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: Apc
      output:
        !type:CableDeviceNode
        nodeGroupID: Apc
  - type: BatteryDischarger
    voltage: Apc
    node: output
  - type: BatteryCharger
    voltage: Apc
    node: input
  - type: PowerMonitoringDevice
    group: SMES
    sourceNode: input
    loadNode: output
    collectionName: smes
    sprite: Structures/Power/smes.rsi
    state: static
  - type: UserInterface
    interfaces:
      enum.BatteryUiKey.Key:
        type: BatteryBoundUserInterface
  - type: ActivatableUI
    key: enum.BatteryUiKey.Key

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostBatterySmallPack
  name: small battery pack
  description: A packed small stationary battery. Use it in hand facing your outpost's floor, over an LV cable, to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#52B4E9"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostBatterySmall
  - type: StaticPrice
    price: 400

- type: entity
  parent: WFBaseOutpostBattery
  id: WFOutpostBatterySmall
  name: small stationary battery
  description: Stores power from the LV cable underneath and gives it back when the outpost draws more than it makes.
  components:
  - type: Battery
    maxCharge: 1500000
  - type: PowerNetworkBattery
    maxSupply: 90000
    maxChargeRate: 3000
    supplyRampTolerance: 3000
    supplyRampRate: 600
  - type: BatteryInterface
    minChargeRate: 3000
    maxChargeRate: 90000
    minSupply: 3000
    maxSupply: 90000
  - type: WFRepackable
    pack: WFOutpostBatterySmallPack
  - type: StaticPrice
    price: 400

- type: entity
  parent: WFBaseOutpostPack
  id: WFOutpostBatteryLargePack
  name: large battery pack
  description: A packed large stationary battery. Use it in hand facing your outpost's floor, over an LV cable, to set it up there.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#334E6D"
    - state: icon-default
  - type: WFDeployable
    machine: WFOutpostBatteryLarge
    delay: 4
  - type: StaticPrice
    price: 900

- type: entity
  parent: WFBaseOutpostBattery
  id: WFOutpostBatteryLarge
  name: large stationary battery
  description: A big store of power for the LV cable underneath, enough to carry an outpost through the night.
  components:
  - type: Battery
    maxCharge: 4800000
  - type: PowerNetworkBattery
    maxSupply: 90000
    maxChargeRate: 3000
    supplyRampTolerance: 3000
    supplyRampRate: 600
  - type: BatteryInterface
    minChargeRate: 3000
    maxChargeRate: 90000
    minSupply: 3000
    maxSupply: 90000
  - type: WFRepackable
    pack: WFOutpostBatteryLargePack
    delay: 4
  - type: StaticPrice
    price: 900
