# Construction graphs and recipes. Barricades face the way the ghost is rotated; one per facing per tile.
- type: constructionGraph
  id: BarricadeMetalGraph
  start: start
  graph:
  - node: start
    edges:
    - to: nodeMetal
      completed:
      - !type:SnapToGrid
      steps:
      - material: Steel
        amount: 4
        doAfter: 2
  - node: nodeMetal
    entity: CMBarricadeMetal
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 3
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored
        anchored: false
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Prying
        doAfter: 2

