- type: construction
  name: metal barricade
  id: CMBarricadeMetal
  graph: BarricadeMetalGraph
  startNode: start
  targetNode: nodeMetal
  category: construction-category-structures
  description: A directional metal barricade. Wire it, weld it, or upgrade it with two more sheets of steel.
  icon:
    sprite: _WF/Barricades/Structures/metal_barricade_cracks.rsi
    state: DamageOverlay_0
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileBarricadeClear

