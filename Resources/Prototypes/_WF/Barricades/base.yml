# A directional barricade on the south edge of its tile; rotate it to face another way.
- type: entity
  abstract: true
  parent: BaseStructure
  id: CMBarricadeBase
  components:
  - type: Rotatable
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
  - type: RotationDrawDepth
  - type: Barricade
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBarricade
  - type: DirectionalAttackBlocker
  - type: InteractionOutline
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: metal_wire, visible: false }
          WiredClosed: { state: metal_wire, visible: true }
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUpgradeUiKey.Key:
        type: RMCConstructionUpgradeBui
  - type: DamageReceivedModifierWhenUnanchored
  - type: ExaminableDamage
    messages: RMCBarricadeMessages
