# Two metal barricades stacked into a wall; it spans the tile edge, so it has a mirrored version.
- type: entity
  parent: BaseStructure
  id: RMCBarricadeStacked
  name: metal barricades
  description: Two metal barricades stacked on top of each other to make a makeshift wall.
  components:
  - type: Rotatable
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: RotationDrawDepth
  - type: Barricade
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBarricade
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 4
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractionOutline
  - type: Sprite
    sprite: _WF/Barricades/Structures/stacked_barricade.rsi
    state: metal
    drawdepth: WallTops
    offset: -0.5, 0

- type: entity
  parent: RMCBarricadeStacked
  id: RMCBarricadeStackedFlipped
  components:
  - type: Sprite
    state: metal_f
    offset: 0.5, 0
