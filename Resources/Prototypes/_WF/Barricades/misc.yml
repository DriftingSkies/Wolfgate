# Wood, snow, sandbag and HESCO barricades, turnstiles, handrails and stacked barricades.
- type: entity
  parent: CMBarricadeBase
  id: RMCBarricadeWood
  name: wooden barricade
  description: A wall made out of wooden planks nailed together. Not very sturdy, but can provide some concealment.
  components:
  - type: VehicleSmashable
    minDestroyWeightClass: Light
    minContinueWeightClass: Medium
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    state: wooden
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: BarricadeWoodGraph
    node: nodeWood
  - type: Climbable

- type: entity
  parent: CMBarricadeBase
  id: RMCBarricadeSnow
  name: snow barricade
  description: A mound of snow shaped into a sloped wall. Statistically better than thin air as cover.
  components:
  - type: VehicleSmashable
    minDestroyWeightClass: Light
    minContinueWeightClass: Medium
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: snow
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/Footsteps/snowstep3.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Climbable

- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeSandbag
  name: sandbag barricade
  description: A makeshift barricade made out of the sand from the ground. Tough to beat but easy to pierce.
  components:
  - type: VehicleSmashable
    minDestroyWeightClass: Light
    minContinueWeightClass: Medium
  - type: BarricadeSandbag
  - type: Climbable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/Footsteps/snowstep1.ogg
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/sandbag_cracks.rsi
    - state: sandbag_wire
      map: [ "barbWired" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: sandbag_wire, visible: false }
          WiredClosed: { state: sandbag_wire, visible: true }
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMSandbag
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 28.125
    trackAllDamage: true
    overlay: false
    targetLayers:
    - enum.RMCDamageOverlayVisuals.DamageOverlay
    damageGroup: Brute
  - type: Barbed
    thornsDamage:
      types:
        Slash: 10

- type: entity
  parent: CMBarricadeSandbag
  id: RMCBarricadeSandbagSoro
  suffix: Brown
  components:
  - type: Sprite
    color: "#a98c7c"

- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeHesco
  name: HESCO barricade
  description: A sandbag wall. Provides better protection than a makeshift sandbag barricade, but requires specialized equipment to set up.
  components:
  - type: VehicleSmashable
    minDestroyWeightClass: Light
    minContinueWeightClass: Medium
  - type: BarricadeSandbag
  - type: Climbable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/Footsteps/snowstep1.ogg
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: hesco
      color: "#a98c7c"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMHescoBarricade
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeTurnstile
  name: turnstile
  description: A railing to keep a queue in line. It only lets people through from behind.
  components:
  - type: Anchorable
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    state: turnstile
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: BarricadeTurnstileGraph
    node: nodeTurnstile
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.24"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
      # Clears a mob's pass once it has left the tile.
      turnstileSensor:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: false
        layer:
        - TableLayer
  - type: BarricadeTurnstile
    processWhitelist:
      components:
      - MobState
      - Pullable

- type: entity
  parent: CMBarricadeTurnstile
  id: CMBarricadeTurnstileMed
  description: A railing to keep a queue in line. It only lets people through from behind. This one is meant for a medical bay.
  components:
  - type: Sprite
    state: turnstile_med

