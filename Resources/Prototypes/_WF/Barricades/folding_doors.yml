# Folding barricades: barricade doors that open and close; plasteel ones can be linked into a row with a crowbar.
- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeMetalDoor
  name: folding metal barricade
  description: A folding metal barricade weaker than the non-folding counterpart. Able to be opened and closed at a moment's notice. Repair with a welder.
  components:
  - type: Anchorable
  - type: Climbable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/Barricades/metalhit.ogg
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: folding_metal
      map: [ "enum.DoorVisualLayers.Base" ]
      visible: false
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/folding_metal_cracks.rsi
    - state: folding_metal_wire
      map: [ "barbWired" ]
      visible: false
  - type: Repairable
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: folding_metal_closed_wire, visible: false }
          WiredClosed: { state: folding_metal_wire, visible: true }
          WiredOpen: { state: folding_metal_closed_wire, visible: true }
      enum.DoorVisuals.State:
        enum.RMCDamageOverlayVisuals.DamageOverlay:
          Open: { sprite: _WF/Barricades/Structures/folding_metal_closed_cracks.rsi }
          Closed: { sprite: _WF/Barricades/Structures/folding_metal_cracks.rsi }
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 25
    trackAllDamage: true
    overlay: false
    targetLayers:
    - enum.RMCDamageOverlayVisuals.DamageOverlay
    damageGroup: Brute
  - type: Door
    openSpriteState: folding_metal_closed
    closedSpriteState: folding_metal
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    # Closes over people standing on it and over other barricades on the tile.
    performCollisionCheck: false
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Barbed
    thornsDamage:
      types:
        Slash: 10
  - type: Construction
    graph: BarricadeMetalDoorGraph
    node: nodeBarricadeMetalDoor
  - type: UseDelay
    delay: 0.3
  - type: RMCOpenOnlyWhenUnanchored
  - type: RMCFoldingBarricadeLinking
    linkable: false

- type: entity
  parent: CMBarricadeMetalDoor
  id: CMBarricadePlasteelDoor
  name: folding plasteel barricade
  description: A tough folding plasteel barricade stronger than its metal counterpart. Can be closed and opened at a moment's notice. Repair with a welder.
  components:
  - type: Sprite
    layers:
    - state: folding_plasteel
      map: [ "enum.DoorVisualLayers.Base" ]
      visible: false
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/folding_plasteel_cracks.rsi
    - state: folding_plasteel_connection_1
      map: [ "enum.RMCFoldingBarricadeLinkingVisualLayers.North" ]
      visible: false
    - state: folding_plasteel_connection_2
      map: [ "enum.RMCFoldingBarricadeLinkingVisualLayers.South" ]
      visible: false
    - state: folding_plasteel_connection_4
      map: [ "enum.RMCFoldingBarricadeLinkingVisualLayers.East" ]
      visible: false
    - state: folding_plasteel_connection_8
      map: [ "enum.RMCFoldingBarricadeLinkingVisualLayers.West" ]
      visible: false
    - state: folding_plasteel_wire
      map: [ "barbWired" ]
      visible: false
  - type: DamageVisuals
    damageDivisor: 50
  - type: RMCFoldingBarricadeLinking
    linkable: true
    connectionStates:
      North:
        Closed: folding_plasteel_connection_1
        Open: folding_plasteel_closed_connection_1
      South:
        Closed: folding_plasteel_connection_2
        Open: folding_plasteel_closed_connection_2
      East:
        Closed: folding_plasteel_connection_4
        Open: folding_plasteel_closed_connection_4
      West:
        Closed: folding_plasteel_connection_8
        Open: folding_plasteel_closed_connection_8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 4
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: folding_plasteel_closed_wire, visible: false }
          WiredClosed: { state: folding_plasteel_wire, visible: true }
          WiredOpen: { state: folding_plasteel_closed_wire, visible: true }
      enum.DoorVisuals.State:
        enum.RMCDamageOverlayVisuals.DamageOverlay:
          Open: { sprite: _WF/Barricades/Structures/folding_plasteel_closed_cracks.rsi }
          Closed: { sprite: _WF/Barricades/Structures/folding_plasteel_cracks.rsi }
  - type: Door
    openSpriteState: folding_plasteel_closed
    closedSpriteState: folding_plasteel
  - type: Construction
    graph: BarricadePlasteelDoorGraph
    node: nodeBarricadePlasteelDoor
