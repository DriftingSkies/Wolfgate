# Metal barricade and its upgrades.
- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeMetal
  name: metal barricade
  description: A sturdy and easily assembled barricade made of metal plates, often used for quick fortifications. Use a welder to repair.
  components:
  - type: VehicleSmashable
    minDestroyWeightClass: Light
    minContinueWeightClass: Medium
  - type: Climbable
  - type: Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/Barricades/metalhit.ogg
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/metal_barricade_cracks.rsi
    - state: metal_wire
      map: [ "barbWired" ]
      visible: false
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: Repairable
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 28.125
    trackAllDamage: true
    overlay: false
    targetLayers:
    - enum.RMCDamageOverlayVisuals.DamageOverlay
    damageGroup: Brute
  - type: Barbed
    thornsDamage:
      types:
        Slash: 10
  - type: Construction
    graph: BarricadeMetalGraph
    node: nodeMetal
  - type: RMCConstructionUpgradeTarget
    upgrades: [ RMCExplosiveUpgrade, RMCBiohazardUpgrade, RMCBruteUpgrade ]
  - type: Tag
    tags:
    - RMCMetalBarricade

- type: entity
  parent: CMBarricadeMetal
  id: RMCBarricadeMetalAltDrawdepth
  suffix: Layers over Platforms
  components:
  - type: Sprite
    drawdepth: SmallObjects
  - type: RotationDrawDepth
    defaultDrawDepth: SmallObjects

- type: entity
  parent: CMBarricadeMetal
  id: CMBarricadeBurn
  suffix: Biohazard
  components:
  - type: Sprite
    layers:
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/metal_barricade_cracks.rsi
    - state: AdditionalDamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay" ]
      sprite: _WF/Barricades/Structures/burn_barricade_cracks.rsi
    - state: metal_wire
      map: [ "barbWired" ]
      visible: false
  - type: DamageVisuals
    targetLayers:
    - enum.RMCDamageOverlayVisuals.DamageOverlay
    - enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBurnBarricade
  - type: RMCConstructionUpgradeTarget
    upgrades: null
    downgrade: RMCBiohazardUpgrade

- type: entity
  parent: CMBarricadeMetal
  id: CMBarricadeBrute
  suffix: Reinforced
  components:
  - type: Sprite
    layers:
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/metal_barricade_cracks.rsi
    - state: AdditionalDamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay" ]
      sprite: _WF/Barricades/Structures/brute_barricade_cracks.rsi
    - state: metal_wire
      map: [ "barbWired" ]
      visible: false
  - type: DamageVisuals
    targetLayers:
    - enum.RMCDamageOverlayVisuals.DamageOverlay
    - enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBruteBarricade
  - type: RMCConstructionUpgradeTarget
    upgrades: null
    downgrade: RMCBruteUpgrade

- type: entity
  parent: CMBarricadeMetal
  id: CMBarricadeExplosive
  suffix: Composite
  components:
  - type: Sprite
    layers:
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/metal_barricade_cracks.rsi
    - state: AdditionalDamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay" ]
      sprite: _WF/Barricades/Structures/explosive_barricade_cracks.rsi
    - state: metal_wire
      map: [ "barbWired" ]
      visible: false
  - type: DamageVisuals
    targetLayers:
    - enum.RMCDamageOverlayVisuals.DamageOverlay
    - enum.RMCDamageOverlayVisuals.AdditionalDamageOverlay
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: RMCConstructionUpgradeTarget
    upgrades: null
    downgrade: RMCExplosiveUpgrade

# Upgrades, picked from the radial menu a steel or plasteel stack opens on the barricade.
- type: entity
  abstract: true
  id: RMCBarricadeUpgradeBase
  components:
  - type: Sprite
    sprite: _WF/Barricades/Interface/barricade_upgrades.rsi

- type: entity
  parent: RMCBarricadeUpgradeBase
  id: RMCExplosiveUpgrade
  name: composite upgrade (++Explosive, ++Projectile, ++Fire)
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-explosive
    upgradedEntity: CMBarricadeExplosive
    baseEntity: CMBarricadeMetal
  - type: Sprite
    state: explosive

- type: entity
  parent: RMCBarricadeUpgradeBase
  id: RMCBiohazardUpgrade
  name: biohazard upgrade (+Burn)
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-burn
    upgradedEntity: CMBarricadeBurn
    baseEntity: CMBarricadeMetal
  - type: Sprite
    state: burn

- type: entity
  parent: RMCBarricadeUpgradeBase
  id: RMCBruteUpgrade
  name: reinforced upgrade (+Brute)
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-brute
    upgradedEntity: CMBarricadeBrute
    baseEntity: CMBarricadeMetal
  - type: Sprite
    state: brute

- type: entity
  parent: RMCExplosiveUpgrade
  id: RMCExplosiveUpgradePlasteel
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-explosive
    upgradedEntity: RMCBarricadeExplosivePlasteel
    baseEntity: RMCBarricadePlasteel

- type: entity
  parent: RMCBiohazardUpgrade
  id: RMCBiohazardUpgradePlasteel
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-burn
    upgradedEntity: RMCBarricadeBurnPlasteel
    baseEntity: RMCBarricadePlasteel

- type: entity
  parent: RMCBruteUpgrade
  id: RMCBruteUpgradePlasteel
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCConstructionUpgrade
    upgradedPopup: rmc-construction-upgrade-brute
    upgradedEntity: RMCBarricadeBrutePlasteel
    baseEntity: RMCBarricadePlasteel
