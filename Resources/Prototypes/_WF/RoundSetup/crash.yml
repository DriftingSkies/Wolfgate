- type: entity
  id: WFCrashScenarioStation
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  categories: [ HideSpawnMenu ]
  # Round-scoped private stations are rebuilt each round and never saved with a map.
  save: false
  components:
  - type: WFCrashScenarioStation
  - type: StationJobs
    availableJobs:
      Contractor: [ -1, -1 ]
      Pilot: [ -1, -1 ]
      Mercenary: [ -1, -1 ]
      StationEngineer: [ -1, -1 ]
      MedicalDoctor: [ -1, -1 ]

# The hulls a Crashlanded crew wakes up aboard: civilian ships with enclosed crew spaces and deck for a full crew
# (CrashScenarioTest).
- type: wfCrashPool
  id: WFCrashCivilian
  vessels:
  - Guppy
  - Peregrine
  - Rosetta
  - Pillbox
  - Arribane
  - Noble
  - Sakuratsu
  - Shuilian
  - Spessbite
  - Takeaway
  - Tiger
  - Zhuangzi
