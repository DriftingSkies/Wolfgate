# Colonies: what works a colony's ledger, what each world gives it, the one industry only colonies run, the colony
# station's role and the neutral sector faction colony cells are held as. Player text is in Resources/Locale/en-US/_WF/Colonies/colonies.ftl.

# Buildings. Rates are crates an hour at full workforce; a holder counts at most `most` of each kind on a world. An
# animal counts only alive and fed. A `worksMaterials` kind makes its output out of its industry's raw materials in its
# own storage. A `climate` kind grows by the weather: its rate follows the outside temperature. What an animal or a
# tray actually yields, wool, milk, eggs and crops, is sold at the exchange chute (wfColonyProduce, below).

- type: wfColonyBuilding
  id: WFColonyBuildingHydroponics
  components: [ PlantHolder ]
  industry: WFTradeIndustryFood
  rate: 0.25
  most: 12
  climate: true

- type: wfColonyBuilding
  id: WFColonyBuildingLivestock
  components: [ WFLivestock ]
  industry: WFTradeIndustryAgriculture
  rate: 0.25
  most: 12
  climate: true

- type: wfColonyBuilding
  id: WFColonyBuildingOreSilo
  components: [ OreSilo ]
  industry: WFTradeIndustryRefining
  rate: 0.5
  most: 2
  worksMaterials: true

- type: wfColonyBuilding
  id: WFColonyBuildingPartsPress
  components: [ WFPartsPress ]
  industry: WFTradeIndustryFabrication
  rate: 0.5
  most: 4
  powered: true

- type: wfColonyBuilding
  id: WFColonyBuildingFissionExtractor
  components: [ WFColonyExtractor ]
  industry: WFTradeIndustryExtraction
  rate: 0.4
  most: 4
  powered: true
  deposit: Uranium

- type: wfColonyBuilding
  id: WFColonyBuildingVolatileExtractor
  components: [ WFColonyExtractor ]
  industry: WFTradeIndustryChemicals
  rate: 0.5
  most: 4
  powered: true
  deposit: Volatile

# Carcinoma's flesh, drawn off a seep and rendered down, is the base of the sector's medicine.
- type: wfColonyBuilding
  id: WFColonyBuildingBiomassExtractor
  components: [ WFColonyExtractor ]
  industry: WFTradeIndustryPharmaceuticals
  rate: 0.4
  most: 4
  powered: true
  deposit: Biomass

# Produce the exchange chute buys for the shelf, at what it is worth: an item of it, or the reagent out of a bucket.

- type: wfColonyProduce
  id: WFColonyProduceCrops
  good: TradeGoodSupplies
  components: [ Produce ]
  value: 10

- type: wfColonyProduce
  id: WFColonyProduceEggs
  good: TradeGoodSupplies
  tags: [ Egg ]
  value: 8

- type: wfColonyProduce
  id: WFColonyProduceMilk
  good: TradeGoodSupplies
  reagents: [ Milk, MilkGoat ]
  reagentValue: 2

- type: wfColonyProduce
  id: WFColonyProduceWool
  good: TradeGoodFabric
  reagents: [ Fiber ]
  reagentValue: 2

- type: wfColonyProduce
  id: WFColonyProduceHides
  good: TradeGoodFabric
  prototypes: [ WFMaterialHide ]

# What each world gives a colony: the deposits placed on it every round, within its bounds, what its ground and air do
# to each kind of building, and the tier it never reads below.

# Asclepiu is settled already, with Crocus standing on it, and the sector's best farmland.
- type: wfColonyWorld
  id: WFColonyWorldAsclepiu
  surface: WFSurfaceAsclepiu
  baseTier: Settled
  rates:
    WFColonyBuildingHydroponics: 1.4
    WFColonyBuildingLivestock: 1.4

# Merak's ore is rich: its silos smelt more from the same load.
- type: wfColonyWorld
  id: WFColonyWorldMerak
  surface: WFSurfaceMerak
  rates:
    WFColonyBuildingOreSilo: 1.5

- type: wfColonyWorld
  id: WFColonyWorldFervidus
  surface: WFSurfaceFervidus
  deposits:
  - deposit: WFColonyDepositVolatile
    count: 4

- type: wfColonyWorld
  id: WFColonyWorldThrascias
  surface: WFSurfaceThrascias
  deposits:
  - deposit: WFColonyDepositUranium
    count: 3

- type: wfColonyWorld
  id: WFColonyWorldAerumna
  surface: WFSurfaceAerumna
  deposits:
  - deposit: WFColonyDepositUranium
    count: 3

- type: wfColonyWorld
  id: WFColonyWorldCarcinoma
  surface: WFSurfaceCarcinoma
  deposits:
  - deposit: WFColonyDepositBiomass
    count: 4

# Extraction: Fission Fuel straight from the ground. Only colony extractors run it, so it has no station.
- type: wfTradeIndustry
  id: WFTradeIndustryExtraction
  name: wf-trade-industry-extraction
  outputs: [ TradeGoodFissionFuel ]
  rate: 4
  colony: true

# The ledger role of every colony station, made at runtime on a Colony world's body; no POI or map takes it.
- type: wfTradeStation
  id: WFTradeStationColony
  stations: []
  uses: [ TradeGoodSupplies, TradeGoodMedicalSupplies ]

# The neutral pattern a Colony-tier world's cell shows; a Charter world shows its governor's colours instead.
- type: wfSectorFaction
  id: WFSectorFactionColonies
  name: wf-sector-faction-colonies
  color: "#8FBF7F"
  blockades: false

# A supply run: the freighter that brings a colony what the sector owes it. It holds over the world, outside its gravity
# well, and sends the crates down a pod at a time (WFColonySystem.Supply), so stopping it on the way stops the imports.
- type: wfEncounter
  id: WFEncounterColonySupply
  name: wf-encounter-name-colony-supply
  start: Manual
  category: Traffic
  duration: 2400
  ships:
  - key: freighter
    navigation: WFCrewNavigationFreight
    vessels: [ Plutomkii, Twilight, Piva, Hermes ]
    side: freight
    profile: WFCrewProfileHauler
    deckhands: 1
    guards: 0
    captain: false
    boarding: Warn
    docking: Warn
    disengage: Deter
