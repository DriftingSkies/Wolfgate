# Blueprint catalogue shelves: decorations and floor decals listed straight from the game's prototypes. Each entry of
# a shelf is a brush under the shelf's heading, named as its prototype is. To add a decoration, add its id to a shelf.
# `under` shelves share a tile with whatever else stands there: rugs, and what hangs on a wall.

