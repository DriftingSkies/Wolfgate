# Outpost modules, after Escape from Tarkov's hideout. Each level costs money, materials (stacks: sheets and cable, by
# stack type) and parts (by prototype), all taken from what lies on the outpost, crates and lockers included. A full
# personal outpost is about 17 million thalers, the company wing 12 million more. Build times only run while the outpost
# stands in a round. Founding an outpost takes only its kit, bought with credits.

# A home's upkeep in place of the outpost load markup, and the fee for moving its home world.
- type: wfHideoutRules
  id: WFHideoutRules
  homeMarkup: 0.1
  moveFee: 250000
  # Founding from the registry at Central costs credits only; riding its drop down to your outpost costs a fee.
  foundPrice: 15000
  rideFee: 2500

- type: wfHideoutModule
  id: WFHideoutGroundworks
  name: wf-hideout-module-groundworks
  description: wf-hideout-module-groundworks-desc
  order: 0
  levels:
  - price: 25000
    buildTime: 60
    summary: wf-hideout-level-groundworks-1
    stacks: { Steel: 50 }
  - price: 150000
    buildTime: 300
    summary: wf-hideout-level-groundworks-2
    stacks: { Steel: 200, Plasteel: 50, CableHV: 30 }
    tiles: 1000
    entities: 250
    span: 32
    grants: [ WFOutpostFoundationPlate, WFOutpostFoundationPlate ]
  - price: 600000
    buildTime: 900
    summary: wf-hideout-level-groundworks-3
    stacks: { Steel: 400, Plasteel: 150, ReinforcedGlass: 100 }
    parts: { APCElectronics: 4 }
    tiles: 2000
    entities: 500
    span: 32
    grants: [ WFOutpostFoundationPlate, WFOutpostFoundationPlate, WFOutpostFoundationPlate ]
  - price: 2000000
    buildTime: 1800
    summary: wf-hideout-level-groundworks-4
    stacks: { Steel: 800, Plasteel: 400, Gold: 20, Silver: 20 }
    parts: { SMESMachineCircuitboard: 2 }
    tiles: 4000
    entities: 1000
    span: 64
    grants: [ WFOutpostFoundationPlate, WFOutpostFoundationPlate, WFOutpostFoundationPlate, WFOutpostFoundationPlate ]

