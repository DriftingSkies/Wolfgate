# The bay's console, pad and cranes, laid by the Shipwright bay prefab.
- type: entity
  parent: WFComputerDrydock
  id: WFHideoutShipwrightConsole
  name: shipwright console
  description: Builds frames on the bay, and fits guns and systems to its owner's ship within its refit points.
  components:
  - type: WFDrydockConsole
    minFee: 0
    feeFraction: 0
    maxDuration: 480
    maxRefitDuration: 480
  - type: WFShipwrightConsole
  - type: ActivatableUI
    key: enum.WFShipwrightConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.WFShipwrightConsoleUiKey.Key:
        type: WFShipwrightConsoleBoundUserInterface
      enum.WFDrydockConsoleUiKey.Key:
        type: WFDrydockConsoleBoundUserInterface

# The faction hangar's refit console: guns on a stock ship's own hardpoints and strongboxes, within its stock firepower.
- type: entity
  parent: WFHideoutShipwrightConsole
  id: WFHideoutHangarConsole
  name: hangar refit console
  description: Swaps the guns on your faction ship's own hardpoints, within its stock firepower, and fits strongboxes.
  components:
  - type: WFShipwrightConsole
    faction: true

- type: entity
  parent: WFHideoutHangarPad
  id: WFHideoutShipwrightPad
  name: shipwright bay beacon
  description: Guides ships with access to this outpost down onto the shipwright bay and back up. The owner's shipwright ship is saved every time it lands here, if it passes its points.
  components:
  - type: WFLandingPad
    size: 17
    widest: 17
  - type: WFShipwrightBay

# The bay's cranes run off the outpost's own supply, like its beacon.
- type: entity
  parent: WFDrydockCrane
  id: WFHideoutShipwrightCrane
  name: shipwright crane
  components:
  - type: PowerConsumer
    voltage: High
    drawRate: 0
  - type: WFDrydockCrane
    maxArm: 27
    berthGap: 1
    sections: 4
    sectionLength: 5
    extension: 5
    idleLoad: 0
    workingLoad: 0

- type: entity
  parent: WFDrydockCraneMirrored
  id: WFHideoutShipwrightCraneMirrored
  name: shipwright crane
  components:
  - type: PowerConsumer
    voltage: High
    drawRate: 0
  - type: WFDrydockCrane
    mirrored: true
    maxArm: 27
    berthGap: 1
    sections: 4
    sectionLength: 5
    extension: 5
    idleLoad: 0
    workingLoad: 0

# A ship's strongbox: the one store aboard a hangar ship that is saved with it, when it lands in its hangar. It keeps
# out what a safety deposit box keeps out, and what an outpost already keeps.
- type: entity
  parent: [ BaseStructure, BaseBagOpenClose ]
  id: WFShipStrongbox
  name: ship strongbox
  description: A bolted-down strongbox. What it holds stays with the ship whenever it lands in its hangar; the rest of the cargo doesn't.
  components:
  - type: Sprite
    sprite: _WF/SafetyDepositBox/Objects/Economy/depositboxlarge.rsi
    state: icon
    noRot: true
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Appearance
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,7,5
    blacklist:
      components:
      - IdCard
      - Currency
      - Store
      - EncryptionKey
      - Headset
      - SubdermalImplant
      - Storage
      - SafetyDepositBox
      - ShipyardVoucher
      - SecretStash
      - Implanter
      - OverwatchConsole
      - GhostRoleMobSpawner
      - DoorRemote
      - SolutionContainerManager
      - NukeDisk
      - Contraband
      - ThiefUndeterminedBackpack
      - AccessOverrider
      - Pda
      - Pill
      - MachineBoard
      - Flatpack
      - WFSaveOrigin # Saved with an outpost, so it comes back with the outpost
      tags:
      - Unstashable
      - SafetyDepositBlacklist
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: WFShipStash
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 300
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 20000
