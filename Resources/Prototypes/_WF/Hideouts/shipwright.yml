# The shipwright bay: custom ships on a refit point budget. See Docs/_WF/Hideouts/DESIGN.md, Shipwright.

- type: wfShipwrightRules
  id: WFShipwrightRules
  weaponPoints:
    Superlight: 1
    Light: 2
    Medium: 4
    Heavy: 8
    Superheavy: 16
  # A hardpoint takes points of its own on top of its gun; a frame's own hardpoints are free.
  mountPoints:
    Superlight: 1
    Light: 1
    Medium: 2
    Heavy: 3
    Superheavy: 6
  mountPrices:
    Superlight: 1500
    Light: 2500
    Medium: 5000
    Heavy: 10000
    Superheavy: 25000
  baseMounts: 2
  tilesPerMount: 12
  weaponMarkup: 1.5
  labour: 250
  certifyPrice: 750
  customPoints: 8
  tilesPerPoint: 10
  sizePointsCap: 30
  # The Tanuki's floor, the largest frame's: no bigger hull built by hand registers.
  customMaxTiles: 346
  frameWorkScale: 0.5
  customWorkScale: 1.5

# Frames: stock hulls the cranes build without their guns and systems. A frame costs about 60% of the stock ship and
