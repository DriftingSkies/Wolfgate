# Module themes: the materials a survey stake lays its module in. A theme swaps the prefab's walls, windows, doors and
# its floors (main, accent, clean and the porch) as they are laid, for its price on top of the module. Alt-click a stake
# to pick one. The prefabs themselves are drawn in the colony materials (Tools/_WF/Hideouts/build_prefabs.py).

- type: wfHideoutTheme
  id: WFHideoutThemeColony
  name: wf-hideout-theme-colony
  order: 0
  price: 0

# After the planetary hospital: brick walls, wood and parquet floors, timber doors.
- type: wfHideoutTheme
  id: WFHideoutThemeBrick
  name: wf-hideout-theme-brick
  order: 1
  price: 20000
  entities:
    WFPrefabWallFixed: WallBrick
    WFPrefabWindow: Window
    WFPrefabDoor: WoodDoor
  tiles:
    WFFloorColonyGrey: FloorWood
    WFFloorColonyGreyTexture: FloorWoodParquetDark
    WFFloorColonyWhite: FloorWhiteMono
    WFFloorColonyWhiteBolts: FloorGrayConcreteSmooth

