# The ammunition crates of the vehicle guns: each is a bullet box of its own prototype id, and the gun that takes it names
# that id in RefillableByBulletBox. The two flame tanks are at the end.

- type: entity
  abstract: true
  parent: BaseItem
  id: VehicleAmmoBoxBase
  categories: [ WFVehicles ]
  name: vehicle ammunition crate
  description: A bulky ammunition container for vehicle weapons.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _WF/Vehicles/ammo/vehicles.rsi
    layers:
    - state: frontal_0
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: frontal_1, visible: true }
          Low: { state: frontal_1, visible: true }
          Medium: { state: frontal_0, visible: true }
          High: { state: frontal_0, visible: true }
          Full: { state: frontal_0, visible: true }
  - type: Appearance
  - type: BulletBox
    amount: 500
    max: 500
    bulletType: VehicleAmmoBoxFrontal
    usedIn: APC frontal cannon

