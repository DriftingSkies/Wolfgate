# Interior pieces of the SPP tank. VehicleSPPTankSmallLockerAlt and its base live in Van/spp_van_interiors.yml because the
# SPP logistics van places one. Hatches are clickable and do not let clicks through (InteractionTransparency).

- type: entity
  abstract: true
  id: VehicleSPPTankInteriorBase
  categories: [ WFVehicles ]
  name: SPP tank interior piece
  description: A decorative interior piece for an SPP tank.
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
  - type: InteractionTransparency

- type: entity
  abstract: true
  id: VehicleSPPTankChassisBase
  categories: [ WFVehicles ]
  name: SPP tank interior chassis
  description: A chassis segment for an SPP tank interior.
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/spptank_chassis.rsi
    drawdepth: FloorTiles
  - type: InteractionTransparency

- type: entity
  parent: VehicleSPPTankChassisBase
  id: VehicleSPPTankChassis
  components:
  - type: Sprite
    state: spptank_chassis

- type: entity
  parent: VehicleSPPTankChassisBase
  id: VehicleSPPTankChassisAlt
  components:
  - type: Sprite
    state: spptank_chassis1

- type: entity
  abstract: true
  parent: VehicleSPPTankInteriorBase
  id: VehicleSPPTankWallBase
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Occluder
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable

- type: entity
  abstract: true
  parent: VehicleSPPTankWallBase
  id: VehicleSPPTankDoorBase
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: InteractionTransparency
    enabled: false

- type: entity
  parent: VehicleSPPTankDoorBase
  id: VehicleSPPTankHatch
  components:
  - type: Sprite
    state: hatch

# The way out: a hatch without the wall's body, as in the tank.
- type: entity
  parent: VehicleSPPTankInteriorBase
  id: VehicleSPPTankExitHatch
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    state: hatch
  - type: Clickable
  - type: InteractionOutline
  - type: InteractionTransparency
    enabled: false
  - type: VehicleExit
  - type: Tag
    tags: []

- type: entity
  parent: VehicleSPPTankInteriorBase
  id: VehicleSPPTankProp0
  components:
  - type: Sprite
    state: prop0

- type: entity
  abstract: true
  parent: ClosetBase
  id: VehicleSPPTankLockerBase
  categories: [ WFVehicles ]
  name: SPP tank locker
  description: A storage locker for SPP tank interiors.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: locker
      map: ["enum.StorageVisualLayers.Base"]
    - state: locker
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      sprite: Structures/Storage/closet.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: locker
    stateBaseOpen: locker_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankLockerBase
  id: VehicleSPPTankLocker
  name: SPP tank locker

- type: entity
  abstract: true
  parent: ClosetBase
  id: VehicleSPPTankSmallLockerBase
  categories: [ WFVehicles ]
  name: SPP tank small locker
  description: A small storage locker for SPP tank interiors.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: small_locker
      map: ["enum.StorageVisualLayers.Base"]
    - state: small_locker
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      sprite: Structures/Storage/closet.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: small_locker
    stateBaseOpen: small_locker_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankSmallLockerBase
  id: VehicleSPPTankSmallLocker
  name: SPP tank small locker

- type: entity
  abstract: true
  parent: ClosetBase
  id: VehicleSPPTankAmmoStorageBase
  categories: [ WFVehicles ]
  name: SPP tank ammunition storage
  description: Ammunition storage for SPP tank interiors.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: storage_ammo
      map: ["enum.StorageVisualLayers.Base"]
    - state: storage_ammo
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      sprite: Structures/Storage/closet.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: storage_ammo
    stateBaseOpen: storage_ammo_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankAmmoStorageBase
  id: VehicleSPPTankAmmoStorage
  name: SPP tank ammunition storage

- type: entity
  parent: VehicleInteriorWallMountedBase
  id: VehicleSPPTankAmmoLoader
  name: SPP tank ammo loader
  description: A loader for SPP tank hardpoint ammunition.
  components:
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _WF/Vehicles/Interiors/spptank.rsi
    state: weapons_loader
  - type: InteractionTransparency
    enabled: false
  - type: Tag
    tags: []
  - type: VehicleAmmoLoader
  - type: UserInterface
    interfaces:
      enum.VehicleAmmoLoaderUiKey.Key:
        type: VehicleAmmoLoaderBoundUserInterface
