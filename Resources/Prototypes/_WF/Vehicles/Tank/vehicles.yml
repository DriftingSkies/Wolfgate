# The tank family. The treads and the turret are fitted at spawn; the tank's turret starts with no gun, so its cannon and
# launcher slots are empty (Tank/armed.yml has the armed twin), and the SPP tank's turret starts with its rotary cannon and
# cupola.

- type: entity
  parent: RMCVehicleBase
  id: VehicleTankBase
  abstract: true
  name: tank
  description: A heavy armored tank built for battlefield dominance.
  components:
  - type: WarpPoint
    follow: true
    location: Tank
  - type: GridVehicleMover
    plowRamMinSpeed: 3.5
    maxRotationSpeedDegrees: 60
    rotationAccelerationDegrees: 120
    rotationDecelerationDegrees: 180
    alignmentAssistDegrees: 8
    maxSpeed: 7
    acceleration: 2.5
    deceleration: 9
    maxReverseSpeed: 3.5
    reverseAcceleration: 2
    turnDelay: 1
    turnInPlace: true
    turnInPlaceMaxSpeed: 1
    canPushVehicles: true
    weightClass: Medium
  - type: VehicleOvercharge
    speedMultiplier: 1.3
    duration: 3
    cooldown: 20
    overchargeSound: /Audio/_WF/Vehicles/overdrive_activate.ogg
  - type: VehicleSpotlight
    radius: 8
    energy: 3
    softness: 2
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -1.2,-1.6,1.2,1.6
        density: 1500
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -1.2,-1.6,1.2,1.6
        density: 1500
        mask:
        - MidImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: VehicleFrameTank # tank damage modifier
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Vehicles/tank.rsi
    layers:
    - map: [ base ]
      state: tank_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ armor ]
      state: ARMOR
      visible: false
    - map: [ primary ]
      state: tank_turret_0
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: PointLight
    enabled: false
    radius: 12
    energy: 3
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: VehicleHardpointVisuals
  - type: ItemSlots
    slots:
      armor:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      primary:
        startingItem: VehicleTankTurret
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      secondary:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      support:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      wheel-1:
        startingItem: VehicleTankTreads
        disableEject: true
        whitelist:
          components:
          - VehicleWheelItem
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyTank
    slots:
    - id: armor
      hardpointType: HardpointTypeArmor
      slotType: HardpointSlotTypeArmor
      visualLayer: armor
      insertDelay: 2.5
      required: false
    - id: primary
      hardpointType: HardpointTypeTurret
      slotType: HardpointSlotTypeTurret
      visualLayer: primary
      insertDelay: 3.0
      required: false
    - id: secondary
      hardpointType: HardpointTypeSecondary
      visualLayer: secondary
      insertDelay: 2.5
      required: false
    - id: support
      hardpointType: HardpointTypeSupport
      slotType: HardpointSlotTypeSupportAttachment
      visualLayer: support
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeTreads
      insertDelay: 2.0
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/tank_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 4
    entryPoints:
    - offset: 0,2
      radius: 1
      interiorCoords: 0.5,-1
  - type: StaticPrice
    price: 80000 # placeholder

- type: entity
  parent: VehicleTankBase
  id: VehicleTank
  suffix: Drivable, Tank, Base, Tracked
  components:
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/tank_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 3
    entryPoints:
    - offset: 0,2
      radius: 1
      interiorCoords: 0.5,-1

## SPP

- type: entity
  parent: VehicleTankBase
  id: VehicleSPPTank
  name: SPP tank
  description: A heavy SPP battle tank.
  suffix: Drivable, Tank, SPP
  components:
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/spp_tank_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 4
    entryPoints:
    - offset: 0,2
      radius: 1
      interiorCoords: 0.5,0.5
  - type: Sprite
    sprite: _WF/Vehicles/spptank.rsi
    layers:
    - map: [ base ]
      state: tank_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ armor ]
      state: ARMOR
      visible: false
    - map: [ primary ]
      state: tank_turret_0
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: ItemSlots
    slots:
      armor:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      primary:
        startingItem: VehicleSPPTankTurret
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      secondary:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      support:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      wheel-1:
        startingItem: VehicleTankTreads
        disableEject: true
        whitelist:
          components:
          - VehicleWheelItem
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyTank
    slots:
    - id: armor
      hardpointType: HardpointTypeArmor
      slotType: HardpointSlotTypeArmor
      compatibilityId: HardpointCompatibilitySPPTank
      visualLayer: armor
      insertDelay: 2.5
      required: false
    - id: primary
      hardpointType: HardpointTypeTurret
      slotType: HardpointSlotTypeTurret
      compatibilityId: HardpointCompatibilitySPPTank
      visualLayer: primary
      insertDelay: 3.0
      required: false
    - id: secondary
      hardpointType: HardpointTypeSecondary
      compatibilityId: HardpointCompatibilitySPPTank
      visualLayer: secondary
      insertDelay: 2.5
      required: false
    - id: support
      hardpointType: HardpointTypeSupport
      slotType: HardpointSlotTypeSupportAttachment
      compatibilityId: HardpointCompatibilitySPPTank
      visualLayer: support
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeTreads
      insertDelay: 2.0

- type: entity
  parent: VehicleSPPTank
  id: VehicleSPPTankCommand
  name: SPP command tank
  description: A heavy SPP command tank.
  suffix: Drivable, Tank, SPP, Command Interior
  components:
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/spp_tank_command_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 4
    entryPoints:
    - offset: 0,2
      radius: 1
      interiorCoords: 0.5,0.5
