  - type: Sprite
    sprite: _WF/Vehicles/CMU/hybrisa/ambulance.rsi
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/cmu_ambulance.yml
    # Each doorway lands beside its own exit marker (CMU lands all three at -1.3,1). The front doors land clear of the
    # operating table, which stands against the west wall.
    entryPoints:
    - offset: 1,-0.25
      radius: 0.6
      interiorCoords: -0.42,1.6
    - offset: -1,-0.25
      radius: 0.6
      interiorCoords: -0.53,0.84
    - offset: 0,2
      radius: 0.75
      interiorCoords: -2.6,0.5
