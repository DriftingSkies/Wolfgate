# CMU's civilian vehicles, as thin children of the van and box van bases: each lists only what differs (name, sprite,
# interior, doorways, seats, price). Handling is the van family's. The ids are CMU's, typos included.
#
# Doorways. The van base has a side door on each side and the back door at 1,-1 / -1,-1 / 0,2, the box van base at
# 1,-0.25 / -1,-0.25 / 0,2. CMU's two trucks on the van base had one doorway at the vehicle's centre and another twice, and
# its seven small trucks on the box van base had the back door as a second left-side door; each has a right, a left and a back
# door here. A truck's second door lands on the passenger seat, beside the marker it leaves by (CMU put all three on the driver's).
# The police car has two doorways because its interior only has exits for two.
#
# Prices are placeholders.

## Vans and trucks on the van base
- type: entity
  parent: VehicleVanBase
  id: AU14VehicleCivVan
  name: Civilian van
  description: An old military van. This one seems to be working for civilians
  suffix: Drivable, Van, CMU, Civilian
  components:
  - type: Damageable
    damageModifierSet: VehicleFrameCLFVan
  - type: Sprite
    sprite: _WF/Vehicles/CMU/hybrisa/van.rsi
  - type: VehicleSound
    collisionSoundCooldown: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/cmu_van_interior.yml
    maxPassengers: 10
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.25,0
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.25,-1
    - offset: 0,2
      radius: 0.75
      interiorCoords: 0.25,-1
  - type: StaticPrice
    price: 12000

- type: entity
  parent: VehicleVanBase
  id: AU14VehicleCivTruck
  name: Civilian truck
  description: An old military truck. This one seems to be working for civilians
  suffix: Drivable, Van, CMU, Civilian
  components:
  - type: Damageable
    damageModifierSet: VehicleFrameCLFVan
  - type: Sprite
    sprite: _WF/Vehicles/CMU/hybrisa/van.rsi
    layers:
    - map: [ base ]
      state: truck_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleSound
    collisionSoundCooldown: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/cmu_truck_interior.yml
    maxPassengers: 4
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.5,-0.5
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.5,-1.5
    - offset: 0,2
      radius: 0.75
      interiorCoords: 3.5,-0.5
  - type: StaticPrice
    price: 12000

