# Interior pieces of the SPP van. Roofs fade out when someone stands under them (SpriteFade) and let clicks through
# (InteractionTransparency); doors and viewports are clickable and do neither.

- type: entity
  abstract: true
  id: VehicleSPPVanRoofBase
  categories: [ WFVehicles ]
  name: SPP van interior roof
  description: Side door
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/sppvan.rsi
    drawdepth: Overdoors
    layers:
    - state: interior_door
      map: [ "roof" ]
  - type: InteractionTransparency
  - type: SpriteFade
  - type: VehicleInteriorRoof
  - type: Clickable

- type: entity
  abstract: true
  id: VehicleSPPVanInteriorBase
  categories: [ WFVehicles ]
  name: SPP van interior piece
  description: A decorative interior piece for an SPP van.
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/sppvan.rsi
    drawdepth: Overdoors
  - type: InteractionTransparency

- type: entity
  abstract: true
  id: VehicleSPPVanChassisBase
  categories: [ WFVehicles ]
  name: SPP van interior chassis
  description: A chassis segment for an SPP van interior.
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/sppvan_chassis.rsi
    drawdepth: FloorTiles
  - type: InteractionTransparency

- type: entity
  parent: VehicleSPPVanChassisBase
  id: VehicleSPPVanChassis
  components:
  - type: Sprite
    state: sppvan_chassis

- type: entity
  parent: VehicleSPPVanChassisBase
  id: VehicleSPPVanChassisArmed
  components:
  - type: Sprite
    state: sppvant_chassis

- type: entity
  parent: VehicleSPPVanChassisBase
  id: VehicleSPPVanChassisLogistics
  components:
  - type: Sprite
    state: sppvan_logistics_chassis

- type: entity
  abstract: true
  parent: VehicleSPPVanInteriorBase
  id: VehicleSPPVanWallBase
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Occluder
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable

- type: entity
  abstract: true
  parent: VehicleSPPVanWallBase
  id: VehicleSPPVanDoorBase
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: InteractionTransparency
    enabled: false

- type: entity
  parent: VehicleSPPVanWallBase
  id: VehicleSPPVanBack1
  components:
  - type: Sprite
    state: back_1

- type: entity
  parent: VehicleSPPVanWallBase
  id: VehicleSPPVanBack2
  components:
  - type: Sprite
    state: back_2

- type: entity
  parent: VehicleSPPVanInteriorBase
  id: VehicleSPPVanViewportBase
  placement:
    mode: PlaceFree
  components:
  - type: WallMount
    arc: 360
  - type: Clickable
  - type: InteractionOutline
  - type: VehicleViewport
  - type: InteractionTransparency
    enabled: false
  - type: Tag
    tags: []

- type: entity
  parent: VehicleSPPVanViewportBase
  id: VehicleSPPVanViewportSimple
  components:
  - type: Sprite
    drawdepth: BelowMobs
    state: viewport_simple
  - type: Occluder
    enabled: false

- type: entity
  parent: VehicleSPPVanViewportBase
  id: VehicleSPPVanViewportSimpleFront
  components:
  - type: Sprite
    drawdepth: BelowMobs
    state: viewport_simple_front
  - type: Occluder
    enabled: false

- type: entity
  parent: VehicleSPPVanRoofBase
  id: VehicleSPPVanInteriorDoor
  components:
  - type: Sprite
    drawdepth: BelowMobs
    layers:
    - state: interior_door
      map: [ "roof" ]
  - type: Clickable
  - type: InteractionOutline
  - type: InteractionTransparency
    enabled: false

- type: entity
  parent: VehicleSPPVanInteriorDoor
  id: VehicleSPPVanInteriorDoorRoof
  name: SPP van interior roof door
  components:
  - type: Sprite
    drawdepth: BelowMobs

- type: entity
  parent: VehicleSPPVanInteriorBase
  id: VehicleSPPVanExteriorDoorUnique
  components:
  - type: Sprite
    drawdepth: Walls
    state: exterior_door_unique
  - type: SpriteFade
  - type: Clickable
  - type: InteractionOutline
  - type: InteractionTransparency
    enabled: false

- type: entity
  abstract: true
  parent: ClosetBase
  id: VehicleSPPVanStorageBase
  categories: [ WFVehicles ]
  name: SPP van storage
  description: A small storage locker for an SPP van interior.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/sppvan.rsi
    drawdepth: Overdoors
    layers:
    - state: small_storage
      map: ["enum.StorageVisualLayers.Base"]
    - state: small_storage
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      sprite: Structures/Storage/closet.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: small_storage
    stateBaseOpen: small_storage_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPVanStorageBase
  id: VehicleSPPVanSmallStorage
  name: SPP van small storage

- type: entity
  parent: VehicleInteriorWallMountedBase
  id: VehicleSPPVanAmmoLoader
  name: SPP van ammo loader
  description: A loader for SPP vehicle hardpoint ammunition.
  components:
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/sppvan.rsi
    state: weapons_loader
  - type: Tag
    tags: []
  - type: VehicleAmmoLoader
  - type: UserInterface
    interfaces:
      enum.VehicleAmmoLoaderUiKey.Key:
        type: VehicleAmmoLoaderBoundUserInterface

# Defined here because the SPP logistics van places it; the SPP tank package uses it as it is.
- type: entity
  abstract: true
  parent: ClosetBase
  id: VehicleSPPTankSmallLockerAltBase
  categories: [ WFVehicles ]
  name: SPP tank small locker (alt)
  description: An alternate small storage locker for SPP tank interiors.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _WF/Vehicles/Interiors/spptank.rsi
    drawdepth: Walls
    layers:
    - state: small_locker1
      map: ["enum.StorageVisualLayers.Base"]
    - state: small_locker1
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      sprite: Structures/Storage/closet.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: small_locker1
    stateBaseOpen: small_locker1_open
    stateDoorClosed:
    stateDoorOpen:

- type: entity
  parent: VehicleSPPTankSmallLockerAltBase
  id: VehicleSPPTankSmallLockerAlt
  name: SPP tank small locker (alt)
