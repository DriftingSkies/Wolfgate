# The SPP weapons: the APC's minigun, autocannon, launcher and flare launcher, the tank's rotary cannon, railgun, launcher,
# cupola, smoke launcher and flare module, and the van's roof turret and cannon. Each is a child of the matching tank,
# APC or humvee gun with an SPP compatibility id.

- type: entity
  parent: RMCAPCDualCannon
  id: VehicleSPPAPCMinigun
  name: SPP APC minigun
  description: A minigun fitted to an SPP APC turret.
  components:
  - type: Sprite
    sprite: _WF/Vehicles/hardpoints/sppapc.rsi
    state: apc_minigun
  - type: HardpointItem
    hardpointType: HardpointTypeCannon
    vehicleFamily: HardpointVehicleFamilyAPC
    slotType: HardpointSlotTypeCannon
    compatibilityId: HardpointCompatibilitySPPAPCTurret
    damageMultiplier: 0.2
    repairRate: 0.01
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    showOverlay: true
    offsetRotatesWithTurret: true
    useDirectionalOffsets: true
    overlayRsi: _WF/Vehicles/sppapc.rsi
    overlayState: apc_minigun_0
    overlayDamagedState: apc_minigun_1
    fireWhileRotatingGraceDegrees: 180
    useBarrelDirectionForShots: true
    maxShotCurvatureDegrees: 10
  - type: GunMuzzleOffset
    useDirectionalOffsets: true
    rotateDirectionalOffsets: true
    offsetNorth: "0,-1.2"
    offsetEast: "0,-1.2"
    offsetSouth: "0,-1.2"
    offsetWest: "0,-1.2"
    muzzleOffset: "0,0"
    useAimDirection: true
  - type: HardpointVisual
    vehicleState: apc_minigun_0
    damagedVehicleState: apc_minigun_1

- type: entity
  parent: RMCAPCFrontCannon
  id: VehicleSPPAPCAutocannon
  name: SPP APC autocannon
  description: A frontal autocannon hardpoint for an SPP APC.
