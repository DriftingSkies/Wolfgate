- type: entity
  parent: BaseItem
  id: VehicleSPPVanTurret
  categories: [ WFVehicles ]
  name: SPP van turret
  description: A roof-mounted turret fitted to an SPP van.
  components:
  - type: Sprite
    sprite: _WF/Vehicles/sppvan.rsi
    state: van_turret_0
  - type: Item
    size: Large
  - type: HardpointItem
    hardpointType: HardpointTypeSecondary
    vehicleFamily: HardpointVehicleFamilyVan
    slotType: HardpointSlotTypeLauncher
    compatibilityId: HardpointCompatibilitySPPVan
    damageMultiplier: 0.15
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 100
  - type: VehicleTurret
    rotateToCursor: true
    stabilizedRotation: false
    rotationSpeed: 180
    useDirectionalOffsets: true
    showOverlay: true
    overlayRsi: _WF/Vehicles/sppvan.rsi
    overlayState: van_turret_0
    overlayDamagedState: van_turret_1
    pixelOffsetNorth: "0,4"
    pixelOffsetEast: "-6,16"
    pixelOffsetSouth: "0,15"
    pixelOffsetWest: "6,16"
  - type: ContainerContainer
    containers:
      turret-cannon: !type:ContainerSlot
  - type: HardpointState
  - type: ItemSlots
    slots:
      turret-cannon:
        startingItem: VehicleSPPVanCannon
        disableEject: true
        whitelist:
          components:
          - HardpointItem
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyVan
    slots:
    - id: turret-cannon
      hardpointType: HardpointTypeCannon
      slotType: HardpointSlotTypeCannon
      compatibilityId: HardpointCompatibilitySPPVan
      required: false
      insertDelay: 2.0

- type: entity
  parent: VehicleHumveeCannon
  id: VehicleSPPVanCannon
  name: SPP van cannon
  description: A turret-mounted cannon for an SPP van.
  components:
  - type: Sprite
    sprite: _WF/Vehicles/sppvan.rsi
    state: t60p3m_0
  - type: HardpointItem
    hardpointType: HardpointTypeCannon
    vehicleFamily: HardpointVehicleFamilyVan
    slotType: HardpointSlotTypeCannon
    compatibilityId: HardpointCompatibilitySPPVan
    damageMultiplier: 0.0
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 350
  - type: VehicleTurret
    showOverlay: true
    overlayRsi: _WF/Vehicles/sppvan.rsi
    overlayState: t60p3m_0
    overlayDamagedState: t60p3m_1
    fireWhileRotatingGraceDegrees: 180
    useBarrelDirectionForShots: true
    maxShotCurvatureDegrees: 10
  - type: Gun
    projectileSpeed: 53
    recoil: 0
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_WF/Vehicles/guns/gun_ml66a_2.ogg
    cameraRecoilScalar: 0
  - type: BallisticAmmoProvider
    cycleable: false
    proto: VehicleCartridgeSentry10x50mm
    capacity: 500
  - type: VehicleHardpointAmmo
    magazineSize: 500
    maxStoredMagazines: 1
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxCupola
  - type: GunMuzzleOffset
    offset: "0,0"
    muzzleOffset: "0,-0.5"
    useAimDirection: true
    useContainerOwner: false
  - type: HardpointVisual
    vehicleState: t60p3m_0
    damagedVehicleState: t60p3m_1
