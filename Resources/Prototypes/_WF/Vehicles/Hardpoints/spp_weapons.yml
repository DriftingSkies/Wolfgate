    offsetSouth: "0.5,-1.7"
    offsetWest: "0.5,-1.7"
    muzzleOffset: "0,0"
    useAimDirection: true
  - type: HardpointVisual
    vehicleState: apc_autocannon_0
    damagedVehicleState: apc_autocannon_1

