# Operation call-ins on the faction static uplinks, one per operation at its stake. Written by
# Tools/_WF/Operations/listings.py from operations.yml; edit the operation and rerun it.

- type: storeCategory
  id: WFUplinkSecurityOperations
  name: wf-store-category-operations
  priority: 10

- type: storeCategory
  id: WFUplinkPdvOperations
  name: wf-store-category-operations
  priority: 10

- type: listing
  id: WFUplinkOperationDeadDropTsf
  name: wf-operation-name-dead-drop
  description: wf-operation-desc-dead-drop
  icon:
    sprite: Objects/Devices/communication.rsi
    state: beacon
  cost:
    FederationMilitaryCredit: 15
  categories:
  - WFUplinkSecurityOperations
  productEvent: !type:WFCallOperationEvent
    operation: WFOperationDeadDropTsf
  raiseProductEventOnUser: true
  disableRefund: true
  conditions:
  - !type:StoreWhitelistCondition
    whitelist:
      tags:
      - FactionStaticUplinkTsf
  - !type:WFOperationReadyCondition
    operation: WFOperationDeadDropTsf

