# Operations each faction calls in from its static uplink (listings.yml). Read by WFOperationSystem.
# PvP: Vault Transfer and Dynasty Arms Drop hold payloads that pay whichever faction turns them in at home.
# PvE: the rest are guarded by NPCs; clearing them pays the caller its stake plus the reward.
#
# Risk ladder, a gamble beside the steady 8-30 credits a crew earns a faction contract. Higher rungs return more for
# each credit staked, refund less on failure and tell the whole sector more precisely where the site is.
#   Rung        Stake    Returned on clear   Refund   Spoils crate                       Who is told
#   Routine     15-20    x2 (case or reward)  1/2      none                               caller's faction
#   Hazard      30       x2.5                 1/2      5 sheets                           sector, 500 m
#   Assault     50-60    x3-3.5               1/4      10 sheets, 1 ship crate            sector, 500 m
#   High-value  80       x3.5                 none     15 sheets, 2 ship crates, uranium  sector, 100 m
#   Extreme     100      x4                   none     15 sheets, 2 ship crates, uranium  sector, 100 m
#
# Planetside: planetChance rolls the site onto fresh ground on a random built world (never Carcinoma), clear of every
# point of interest; a roll that finds no world falls back to space. planetChance 1 runs only planetside. A planetside
# site gets planetExtraTime more warning and stay for the hop down, and is announced to the nearest 50 m on its world.

- type: wfOperation
  abstract: true
  id: WFOperationBase
  name: wf-operation-name-vault-transfer
  company: TSF
  grids: []
  addComponents:
  - type: Gravity
    enabled: true
    inherent: true
  - type: IFF
    color: "#E10F9B"
  - type: ProtectedGrid
    preventArtifactTriggers: true
  - type: PreventPilot
  - type: ForceAnchor

# PvP: the payload pays whoever brings it home, so the caller risks its stake to the rival.

- type: wfOperation
  parent: WFOperationBase
  id: WFOperationVaultTransfer
  name: wf-operation-name-vault-transfer
  company: TSF
  jobs: [ Sheriff, Bailiff ]
  grids:
  - /Maps/_NF/Bluespace/vault.yml
  stake: 100
  cooldown: 3600
  replace:
    DataChitStorageServer: WFOperationVaultServer

- type: wfOperation
  parent: WFOperationBase
