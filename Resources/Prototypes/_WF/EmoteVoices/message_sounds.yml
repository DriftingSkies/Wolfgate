# Message sounds a character can pick in the creator: the chatter played when they speak. Every speechSounds set a
# species uses is here, plus HardLight's (Moth, Wawa, Gorilla, Sheleg).

- type: speechSounds
  id: WFMoth
  saySound:
    path: /Audio/_WF/EmoteVoices/Talk/moth.ogg
  askSound:
    path: /Audio/_WF/EmoteVoices/Talk/moth_ask.ogg
  exclaimSound:
    path: /Audio/_WF/EmoteVoices/Talk/moth_exclaim.ogg

- type: speechSounds
  id: WFWawa
  saySound:
    path: /Audio/_WF/EmoteVoices/Talk/wawa_statement.ogg
  askSound:
    path: /Audio/_WF/EmoteVoices/Talk/wawa_question.ogg
  exclaimSound:
    path: /Audio/_WF/EmoteVoices/Talk/wawa_exclaim.ogg

- type: speechSounds
  id: WFGorilla
  saySound:
    path: /Audio/_WF/EmoteVoices/Talk/gorilla.ogg
  askSound:
    path: /Audio/_WF/EmoteVoices/Talk/gorilla.ogg
  exclaimSound:
    path: /Audio/_WF/EmoteVoices/Talk/gorilla.ogg

- type: speechSounds
  id: WFSheleg
  saySound:
    path: /Audio/_WF/EmoteVoices/Talk/sheleg.ogg
  askSound:
    path: /Audio/_WF/EmoteVoices/Talk/sheleg_ask.ogg
  exclaimSound:
    path: /Audio/_WF/EmoteVoices/Talk/sheleg_exclaim.ogg

