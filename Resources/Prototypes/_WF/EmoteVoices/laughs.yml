# Laughs a character can pick in the creator. The first group is every laugh a Wolfgate species already uses,
# the second is Nova Sector's selector. A voice without params plays with a variation of 0.125.

- type: emoteVoice
  id: WFLaughNone
  emote: Laugh
  name: emote-voice-name-silent

# Wolfgate species

- type: emoteVoice
  id: WFLaughHuman
  emote: Laugh
  name: emote-voice-name-human
  sound:
    collection: MaleLaugh
  sexSounds:
    Female:
      collection: FemaleLaugh

