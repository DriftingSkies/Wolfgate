# Screams a character can pick in the creator. The first group is every scream a Wolfgate species already uses,
# the second is Nova Sector's selector. A voice without params plays with a variation of 0.125.

- type: emoteVoice
  id: WFScreamNone
  emote: Scream
  name: emote-voice-name-silent

# Wolfgate species

