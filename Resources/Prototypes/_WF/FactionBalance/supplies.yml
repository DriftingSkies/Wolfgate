# Supplies: field rations, survival gear, tools and field medicine on both faction uplinks, the same price on each,
# for crews that live out of their ship or on a world for an operation. Also the TSF's missing grenades, breaching
# charges, tools and combat medicine, and the PDV infiltration kit that replaces its five loose chameleon listings.
# Listing names and descriptions come from the product entity; the two new entities' are in uplink.ftl.

- type: storeCategory
  id: WFUplinkSecuritySupplies
  name: wf-store-category-supplies
  priority: 9

- type: storeCategory
  id: WFUplinkPdvSupplies
  name: wf-store-category-supplies
  priority: 9

- type: entity
  parent: NFPouchFirstAid
  id: WFFieldDressingPouch
  components:
  - type: StorageFill
    contents:
    - id: Gauze
    - id: Brutepack
    - id: Ointment
    - id: WFWolfmedSplint
    - id: Tourniquet

- type: entity
  parent: ClothingBackpackChameleon
  id: WFPdvInfiltrationKit
  components:
  - type: StorageFill
    contents:
    - id: ContractorIDCard
    - id: ChameleonPDA
    - id: ClothingHeadsetChameleon
    - id: ClothingMaskGasVoiceChameleon

