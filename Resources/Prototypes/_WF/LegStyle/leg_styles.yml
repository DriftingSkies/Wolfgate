# Legs a species can pick instead of its own, from the Digitigrade legs toggle in the character editor.
# A species listed under a style stands the other way by default, unless the style is marked default: then it
# only fits clothing to legs the species draws itself. displacementSlots are the clothing slots
# the legs reshape: they use the style's maps (or none) instead of the species' own, and a female body uses
# femaleDisplacements where it has the slot. The art and the maps under _WF/LegStyle are made by
# Tools/_WF/LegStyle/port.py: a shoe map and a suit map (jumpsuits and outer clothing) per paw shape.

# Digitigrade legs. Vulpkanin and Canine stand on them by default; for the others they are the option. The
# furred ones wear Starlight's Vulpkanin legs, which fit
# the shoe map Reptilians use and Starlight's outer clothing map; the rest wear Meridian Rift's.

- type: wfLegStyle
  id: WFLegsHumanDigitigrade
  species: [ Human, Dwarf, Felinid, Oni ]
  stance: Digitigrade
  sprites:
    LLeg: WFMobHumanLLegDigi
    RLeg: WFMobHumanRLegDigi
    LFoot: WFMobHumanLFootDigi
    RFoot: WFMobHumanRFootDigi
  displacementSlots: [ jumpsuit, outerClothing, shoes ]
  displacements:
    jumpsuit: &humanSuit
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: suit_human
    outerClothing: *humanSuit
    shoes: &humanShoes
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: shoes_human
  femaleDisplacements:
    # The human chest fit above the hip.
    jumpsuit: &humanSuitFemale
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: jumpsuit_female_human

- type: wfLegStyle
  id: WFLegsVulpkaninDigitigrade
  species: [ Vulpkanin, WFCanine ]
  stance: Digitigrade
  default: true # the species draws these legs itself (Resources/Prototypes/_WF/Species/vulpkanin.yml)
  displacementSlots: [ jumpsuit, outerClothing, shoes ]
  fittedMarkings:
  - _Starlight/Mobs/Customization/vulpkanin # drawn for these legs; the rest of the vulpkanin markings were drawn for DeltaV's
  displacements:
    jumpsuit: &starlightSuit
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: suit_starlight
    outerClothing: &starlightOuter
      sizeMaps:
        32:
          sprite: _WF/LegStyle/displacement.rsi
          state: outerclothing_starlight
    shoes: &starlightShoes
      sizeMaps:
        32:
          sprite: _White/Mobs/Species/displacement.rsi
          state: shoes

