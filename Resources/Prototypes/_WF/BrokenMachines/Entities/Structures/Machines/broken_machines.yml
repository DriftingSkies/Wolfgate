# Non-working stand-ins that keep the upstream IDs, so mapped and saved copies load as broken props.

- type: entity
  id: WFBrokenLaserDrillBase
  parent: BaseMachine
  abstract: true
  components:
  - type: Sprite
    offset: 0,0.5
    noRot: true
    sprite: _WF/BrokenMachines/Structures/Machines/laserdrill.rsi
    state: broken
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.40,0.40,0.40"
        density: 750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: LaserDrill
  parent: WFBrokenLaserDrillBase
  name: broken automated laser drill
  description: A large automated drill with a burnt-out emitter and fused power couplings. It no longer draws power or digs anything up.

- type: entity
  id: StationLaserDrill
  parent: WFBrokenLaserDrillBase
  name: broken advanced automated laser drill
  description: A large bluespace automated drill whose core has cracked. It no longer draws power or digs anything up. You can just make out a scratched off logo starting with an embossed 'N' on the side.
  components:
  - type: Anchorable
    flags: None

- type: entity
  id: CentrifugeLathe
  parent: [BaseStructureDisableToolUse, BaseMachine]
  name: broken industrial uranium processing centrifuge
  description: A large sized industrial gas centrifuge, built for bulk processing isotopes. Its rotor has seized and its control board is fried; it no longer processes anything.
  components:
  - type: Sprite
    snapCardinals: false
    offset: 0.5, 0.5
    noRot: false
    sprite: _Mono/Structures/Machines/2x2centrifuge.rsi
    state: icon
  - type: Transform
    anchored: true
    noRot: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,1.2,1.5"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
