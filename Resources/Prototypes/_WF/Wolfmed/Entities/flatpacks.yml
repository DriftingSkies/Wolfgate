# Playtest 5, ITEMS: the two Wolfmed structures as flatpacks, so a crew without a medical lathe can buy them. They
# wear the medical_lathe box like Frontier's other medical flatpacks (StasisBedFlatpack, CryoPodFlatpack). A flatpack
# only needs its target to have fixtures, so the wheeled IV drip unpacks onto the tile like the janicart does.
- type: entity
  parent: BaseNFFlatpack
  id: WFMachineAutodocFlatpack
  name: autodoc flatpack
  description: A flatpack used for constructing an autodoc.
  components:
  - type: Flatpack
    entity: WFMachineAutodoc
  - type: Sprite
    layers:
    - state: medical_lathe
  # Sells above what the unpacked pod appraises at (its 2500 plus the board, parts and tools, under 4,000),
  # so selling the pod never pays. Buying one from John Wolfgate or a vendor costs what skipping tier 3 research is worth.
  - type: StaticPrice
    price: 4500
    vendPrice: 150000

- type: entity
  parent: BaseNFFlatpack
  id: WFWolfmedIvDripFlatpack
  name: IV drip flatpack
  description: A flatpack used for constructing an IV drip.
  components:
  - type: Flatpack
    entity: WFWolfmedIvDrip
  - type: Sprite
    layers:
    - state: medical_lathe

- type: entity
  parent: BaseNFFlatpack
  id: WFWolfmedVentilatorFlatpack
  name: ventilator flatpack
  description: A flatpack used for constructing a ventilator.
  components:
  - type: Flatpack
    entity: WFWolfmedVentilator
  - type: Sprite
    layers:
    - state: medical_lathe
