# M4 (plan §9.1, §9.3, OD16): the deliberate differences round-start species have from the reference profile. The id
# is the species id. WolfmedSpeciesConformanceTest runs every check on every round-start species, once per biotype, and
# fails on any failure not excused here and on any excuse no longer needed. The ladder (organic or machine) is the
# biotype: IPC and Synth are synthetic by default (SpeciesPrototype.biotype). Excuses apply to a species' own biotype
# only. Only the differences plan §9.3 lists belong in this file.

- type: wolfmedSpeciesException
  id: Diona
  excuses: [ Heart ]
  reason: >-
    Plan 9.3, OD16: no heart. Circulatory collapse instead of heart arrest: the same state from blood or oxygen, never
    from a heart.

- type: wolfmedSpeciesException
  id: SlimePerson
  excuses: [ Heart ]
  reason: >-
    Plan 9.3, OD16: no heart, so circulatory collapse instead of heart arrest. Survives decapitation: its core, the
    brain, is in the torso.
