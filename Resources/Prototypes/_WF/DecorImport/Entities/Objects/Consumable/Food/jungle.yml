# Yogstation

- type: entity
  parent: FoodInjectableBase
  id: YogFoodBiancoBerry
  components:
  - type: FlavorProfile
    flavors:
    - berry
  - type: Sprite
    sprite: _WF/DecorImport/Objects/Consumable/Food/jungle_fruit_yogstation.rsi
    state: bianco_fruit
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 1
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Fruit

- type: entity
  parent: YogFoodBiancoBerry
  id: YogFoodBonjiBerry
  components:
  - type: Sprite
    state: bonji_fruit
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 3
        reagents:
        - ReagentId: Nutriment
          Quantity: 3

- type: entity
  parent: YogFoodBiancoBerry
  id: YogFoodKukuBerry
  components:
  - type: Sprite
    state: kuku_fruit
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 2
        reagents:
        - ReagentId: Nutriment
          Quantity: 2

- type: entity
  parent: FoodInjectableBase
  id: YogFoodLiberalHat
  components:
