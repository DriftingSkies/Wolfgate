  - type: Extractable
    grindableSolutionName: food

- type: entityLootTable
  id: YogBiancoBushGather
  entries:
  - id: YogFoodBiancoBerry
    amount: 1
    maxAmount: 1

- type: entityLootTable
  id: YogBonjiBushGather
  entries:
  - id: YogFoodBonjiBerry
    amount: 1
    maxAmount: 1

- type: entityLootTable
  id: YogKukuBushGather
