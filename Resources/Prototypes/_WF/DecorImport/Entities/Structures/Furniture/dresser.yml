- type: entity
  parent: Dresser
  id: DarkPackDresser
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/dresser.rsi
    state: dresser_darkpack
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: StaticPrice
    price: 100
  - type: Construction
    graph: DecorBuildDarkPackDresser
    node: built

