- type: entity
  parent: TableBase
  id: DarkPackTableCountertopBubway
  suffix: bubway
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/Tables/countertop_bubway.rsi
    snapCardinals: false
  - type: Icon
    sprite: _WF/DecorImport/Structures/Furniture/Tables/countertop_bubway.rsi
    state: full
  - type: IconSmooth
    key: DarkPackTableCountertopBubway
    base: state_
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

