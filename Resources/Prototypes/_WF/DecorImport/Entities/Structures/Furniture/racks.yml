- type: entity
  parent: Dresser
  id: BayTableRack
  suffix: table
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/racks.rsi
    state: rack_table
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: StaticPrice
    price: 30.0
  - type: Construction
    graph: DecorBuildBayTableRack
    node: built

