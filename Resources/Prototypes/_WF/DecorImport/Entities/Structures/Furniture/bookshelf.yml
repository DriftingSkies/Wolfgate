- type: entity
  parent: Dresser
  id: BayBookcase
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/bookshelf.rsi
    state: book-0_baystation
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: StaticPrice
    price: 50
  - type: Construction
    graph: DecorBuildBayBookcase
    node: built

