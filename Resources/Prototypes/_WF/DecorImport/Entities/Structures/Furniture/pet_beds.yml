- type: entity
  parent: Bed
  id: GoonStoolPetBed
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/pet_beds_goonstation.rsi
    noRot: false
    state: petbed
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Construction
    graph: DecorBuildGoonStoolPetBed
    node: built

