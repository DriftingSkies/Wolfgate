# Beestation

- type: entity
  id: BeeFloorCarpetGrimy
  parent: CarpetBase
  suffix: Grimy
  components:
  - type: Clickable
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/Carpets/carpet_grimy.rsi
  - type: Icon
    sprite: _WF/DecorImport/Structures/Furniture/Carpets/carpet_grimy.rsi
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              FloorCarpetItemBeeFloorCarpetGrimy:
                min: 1
                max: 1

