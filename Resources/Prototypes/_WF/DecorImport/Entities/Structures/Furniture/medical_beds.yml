- type: entity
  parent: Bed
  id: TgBedMedical
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/medical_beds.rsi
    state: med_down
    snapCardinals: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Construction
    graph: DecorBuildTgBedMedical
    node: built

