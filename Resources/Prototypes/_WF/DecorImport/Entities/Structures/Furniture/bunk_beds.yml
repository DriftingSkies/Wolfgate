- type: entity
  parent: Bed
  id: AuroraBunkBed
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/bunk_beds.rsi
    state: zbunkbed
    snapCardinals: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Construction
    graph: DecorBuildAuroraBunkBed
    node: built

