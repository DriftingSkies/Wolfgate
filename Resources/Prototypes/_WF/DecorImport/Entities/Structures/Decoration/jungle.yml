- type: entity
  parent: BaseStructure
  id: DarkPackTotemGlassWalkers
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/totem_darkpack.rsi
    noRot: true
    drawdepth: Mobs
    offset: "0,0.5"
    layers:
    - state: glassw
    - state: glassw_overlay
      shader: unshaded
      color: "#35b0ff"
  - type: PointLight
    radius: 3
    energy: 0.5
    color: "#35b0ff"
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          DarkPackTotemGlassWalkersBroken:
            min: 1
            max: 1
        offset: 0
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: DarkPackTotemGlassWalkers
  id: DarkPackTotemGlassWalkersBroken
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: glassw_broken
    - state: glassw_broken_overlay
      shader: unshaded
      color: "#35b0ff"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

