- type: entity
  parent: BaseStructure
  id: AuroraBedNest
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/gore_structures_aurora.rsi
    state: nest
    noRot: true
  - type: Strap
    position: Down
    rotation: -90
  - type: Damageable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/DecorImport/aurora/attackblob.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: AuroraGoreTendrils
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/gore_structures_aurora.rsi
    state: tendril_dir0
    drawdepth: FloorObjects
  - type: Icon
    sprite: _WF/DecorImport/Structures/Decoration/gore_structures_aurora.rsi
    state: tendril_dir0
  - type: IconSmooth
    key: gore_tendrils
    base: tendril_dir
    mode: CardinalFlags
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Damageable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/DecorImport/aurora/attackblob.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

