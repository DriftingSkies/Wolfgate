- type: entity
  parent: BaseStructure
  id: GoonTombstone
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/Memorials/gravestones_goonstation.rsi
    state: tombstone
    noRot: true
    enableOverrideDir: true
    overrideDir: South
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Damageable
    damageModifierSet: Rock

