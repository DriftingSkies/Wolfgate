# TerraGov-Marine-Corps

- type: entity
  parent: BaseRock
  id: TGMCVolcanicRock
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/rocks_tgmc.rsi
    layers:
    - state: basalt_1
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        basalt_1: ""
        basalt_2: ""
        basalt_3: ""
        basalt_4: ""
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_WF/Xenonids/Effects/meteorimpact.ogg

- type: entity
  parent: TGMCVolcanicRock
  id: TGMCVolcanicRockPale
  components:
  - type: Sprite
    color: "#c7bdbd"
    layers:
    - state: basalt_5
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        basalt_5: ""
        basalt_6: ""
        basalt_7: ""
        basalt_8: ""
        basalt_9: ""
        basalt_10: ""
        basalt_11: ""
        basalt_12: ""
        basalt_13: ""
        basalt_14: ""

