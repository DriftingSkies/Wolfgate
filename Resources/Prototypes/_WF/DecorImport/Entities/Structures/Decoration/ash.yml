# Aurora

- type: entity
  parent: BaseItem
  id: AuroraCandlePile
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Objects/Decoration/candle_pile_aurora.rsi
    state: candle1_lit
  - type: Item
    size: Small
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_WF/DecorImport/aurora/gloves_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_WF/DecorImport/aurora/gloves_drop.ogg
  - type: PointLight
    radius: 2
    energy: 1
    color: "#E09D37"

- type: entity
  parent: BaseStructure
  id: AuroraArcticGeyser
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/geyser_aurora.rsi
    drawdepth: FloorObjects
    offset: "0,1"
    layers:
    - state: geyser_dormant
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        geyser_dormant: ""
        geyser_plume: ""
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        mask:
        - MachineMask
        layer:
        - MidImpassable

