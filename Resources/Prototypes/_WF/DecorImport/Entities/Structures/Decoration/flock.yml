# Paradise

- type: entity
  parent: Grille
  id: ParaGrilleFlock
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/flock_grille_paradise.rsi
    layers:
    - state: barricade-0
    - state: electrified
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _WF/DecorImport/Structures/Decoration/flock_grille_paradise.rsi
    state: barricade-0
  - type: IconSmooth
    mode: NoSprite

- type: entity
  parent: GrilleBroken
  id: ParaGrilleFlockBroken
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/flock_grille_paradise.rsi
    state: barricade-cut
  - type: Icon
    sprite: _WF/DecorImport/Structures/Decoration/flock_grille_paradise.rsi
    state: barricade-cut

- type: entity
  parent: TableBase
  id: ParaTableFlock
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/Tables/flock_paradise.rsi
    state: flock_table-0
  - type: Icon
    sprite: _WF/DecorImport/Structures/Furniture/Tables/flock_paradise.rsi
    state: flock_table-0
  - type: IconSmooth
    key: flocktable
    base: flock_table-
    mode: Bitmask
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
