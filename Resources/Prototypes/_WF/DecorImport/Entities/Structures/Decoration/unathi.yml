- type: entity
  parent: BaseStructure
  id: AuroraUnathiSarcophagus
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/unathi_ruins_aurora.rsi
    layers:
    - state: wc_sarcophagus
      map: [ "enum.StorageVisualLayers.Base" ]
  - type: Icon
    sprite: _WF/DecorImport/Structures/Decoration/unathi_ruins_aurora.rsi
    state: wc_sarcophagus
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: EntityStorage
    isCollidableWhenOpen: true
    closeSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
    openSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: wc_sarcophagus
    stateBaseOpen: wc_sarcophagus_open

- type: entity
  parent: AuroraUnathiSarcophagus
  id: AuroraUnathiSarcophagusMador
  components:
  - type: Sprite
    layers:
    - state: mador_sarcophagus
      map: [ "enum.StorageVisualLayers.Base" ]
  - type: Icon
    state: mador_sarcophagus
  - type: EntityStorageVisuals
    stateBaseClosed: mador_sarcophagus
    stateBaseOpen: mador_sarcophagus_open

