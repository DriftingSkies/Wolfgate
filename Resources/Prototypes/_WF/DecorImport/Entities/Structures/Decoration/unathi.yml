# Aurora

- type: entity
  parent: BaseStructure
  id: AuroraUnathiPillar
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/unathi_ruins_aurora.rsi
    state: pillar
    noRot: true
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: AuroraUnathiPillar
  id: AuroraUnathiPillarMador
  components:
  - type: Sprite
    state: mador_pillar

- type: entity
  parent: AuroraUnathiPillar
  id: AuroraUnathiStatue
  components:
  - type: Sprite
    state: statue

