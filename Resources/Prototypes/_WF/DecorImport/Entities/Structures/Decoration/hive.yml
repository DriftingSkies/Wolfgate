- type: entity
  abstract: true
  id: DecorImportAlienWeedsBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Sprite
    drawdepth: FloorObjects
  - type: Damageable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: XenoResinBreak
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
  parent: BaseStructure
  id: DecorImportAlienNestBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Strap
    position: Down
    rotation: -90
  - type: Damageable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: XenoResinBreak
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: XenoResinBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# tgstation

- type: entity
  parent: BaseWall
  id: TgAlienResinMembrane
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/resin_membrane_tgstation.rsi
    state: resin_membrane0
  - type: Icon
    sprite: _WF/DecorImport/Structures/Decoration/resin_membrane_tgstation.rsi
    state: resin_membrane0
  - type: IconSmooth
    key: walls
    base: resin_membrane
    mode: CardinalFlags
  - type: Occluder
    enabled: false
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/DecorImport/tgstation/attackblob.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 160
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: XenoResinBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

