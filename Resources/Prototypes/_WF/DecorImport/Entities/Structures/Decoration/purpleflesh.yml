- type: entity
  abstract: true
  parent: BaseStructure
  id: BayCultGrowthBase
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/cult_growths_baystation.rsi
    noRot: true
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.45,0.35,0.35"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

