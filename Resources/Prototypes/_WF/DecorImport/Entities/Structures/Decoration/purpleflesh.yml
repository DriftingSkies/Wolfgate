- type: entity
  parent: BaseStructure
  id: GoonDecalAliencomputer
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/aliencomputer_goon.rsi
    state: display-scroll
    noRot: true
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.45,0.35,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

