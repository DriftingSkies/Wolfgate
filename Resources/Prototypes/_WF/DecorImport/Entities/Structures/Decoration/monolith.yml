# NovaSector

- type: entity
  parent: BaseStructure
  id: NovaStatueObelisk
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/statuelarge_nova.rsi
    state: obelisk_base
    offset: "0,0.5"
    noRot: true
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: NovaStatueObelisk
  id: NovaStatueObeliskDark
  components:
  - type: Sprite
    state: obelisk_base_dark

- type: entity
  parent: NovaStatueObelisk
  id: NovaStatueTwins
  components:
  - type: Sprite
    layers:
    - state: twins
    - state: twins-emissive
      shader: unshaded

- type: entity
  parent: NovaStatueTwins
  id: NovaStatueTwinsLight
  components:
  - type: Sprite
    layers:
    - state: twins_light
    - state: twins_light-emissive
      shader: unshaded

- type: entity
  parent: NovaStatueObelisk
  id: NovaStatueTelekinesis
  components:
  - type: Sprite
    layers:
    - state: telekenesis
    - state: telekenesis-emissive
      shader: unshaded

- type: entity
  parent: NovaStatueObelisk
  id: NovaStatueHonour
  components:
  - type: Sprite
    layers:
    - state: honour
    - state: honour-emissive
      shader: unshaded

- type: entity
  parent: NovaStatueHonour
  id: NovaStatueHonourLight
  components:
  - type: Sprite
    layers:
    - state: honour_light
    - state: honour_light-emissive
      shader: unshaded

- type: entity
  parent: NovaStatueObelisk
  id: NovaStatueLight
  components:
  - type: Sprite
    layers:
    - state: light_statue
    - state: light_statue-emissive
      shader: unshaded

- type: entity
  parent: NovaStatueObelisk
  id: NovaStatueOrder
  components:
  - type: Sprite
    layers:
    - state: order
    - state: order-emissive
      shader: unshaded

- type: entity
  parent: NovaStatueObelisk
  id: NovaStatueLove
  components:
  - type: Sprite
    layers:
    - state: statue_love
    - state: statue_love-emissive
      shader: unshaded

- type: entity
