  components:
  - type: Sprite
    layers:
    - state: curiosity
    - state: curiosity-emissive
      shader: unshaded

# Aurora

- type: entity
  parent: BaseStructure
  id: AuroraMonolith
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/monolith_aurora.rsi
    offset: "0,0.5"
    noRot: true
    layers:
    - state: jaggy1
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        jaggy1: AuroraMonolithRock
    - base:
        jaggy2: AuroraMonolithRock
    - base:
        jaggy3: AuroraMonolithRock
    - base:
        jaggy4: AuroraMonolithRock
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: AuroraMonolith
  id: AuroraMonolithActive
  components:
  - type: Sprite
    layers:
    - state: jaggy1
      map: [ "base" ]
    - state: jaggy1decor
      map: [ "decor" ]
      shader: unshaded
  - type: RandomSprite
    available:
    - base:
        jaggy1: AuroraMonolithRock
      decor:
        jaggy1decor: AuroraMonolithGlow
    - base:
        jaggy2: AuroraMonolithRock
      decor:
        jaggy2decor: AuroraMonolithGlow
    - base:
        jaggy3: AuroraMonolithRock
      decor:
        jaggy3decor: AuroraMonolithGlow
    - base:
        jaggy4: AuroraMonolithRock
      decor:
        jaggy4decor: AuroraMonolithGlow

# Baystation

- type: entity
  parent: DecorImportCrystalBase
  id: BayPylon
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/pylon_baystation.rsi
    state: pylon
    offset: "0,0.25"
  - type: PointLight
    radius: 5
    energy: 1
    color: "#c81414"
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/DecorImport/baystation/Glasshit.ogg

