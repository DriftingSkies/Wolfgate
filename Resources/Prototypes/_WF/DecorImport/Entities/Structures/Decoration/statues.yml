# CM-SS13

- type: entity
  parent: BaseStructure
  id: CMStatueAncient
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/ancientsmallstatue_cm.rsi
    state: statue_ancient
    noRot: true
    drawdepth: Mobs
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: CMStatueAncient
  id: CMStatueGrey
  components:
  - type: Sprite
    state: statue_grey

- type: entity
  parent: CMStatueAncient
  id: CMStatueSandstone
  components:
  - type: Sprite
    state: statue_sandstone

- type: entity
  parent: CMStatueAncient
  id: CMStatueAncientKneeling
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/ancientstatue_cm.rsi
    state: ancient_statue
    offset: "0,1.25"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.2,-0.45,1.2,0.45"
        density: 200
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - HighImpassable

- type: entity
  parent: CMStatueAncient
  id: CMHunterArmorProp
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/32x32_hunter_props_cm.rsi
    state: hunter_armor_prop
  - type: Damageable
    damageModifierSet: Metallic

- type: entity
  parent: CMHunterArmorProp
  id: CMHunterArmorProp2
  components:
  - type: Sprite
    state: hunter_armor_prop_2

- type: entity
  parent: CMHunterArmorProp
  id: CMHunterArmorProp3
  components:
  - type: Sprite
    state: hunter_armor_prop_3

- type: entity
  parent: CMHunterArmorProp
