- type: entity
  abstract: true
  parent: BaseStructure
  id: DecorImportCrystalBase
  components:
  - type: Sprite
    noRot: true
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: DecorImportCrystalBase
  id: PolarisCrystal
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/crystals_polaris.rsi
    state: crystal
  - type: PointLight
    radius: 3
    energy: 3
    color: "#33CC33"

