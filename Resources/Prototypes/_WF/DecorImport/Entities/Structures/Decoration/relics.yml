- type: entity
  parent: BaseStructure
  id: NovaArtifactConsole
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/artifacts_nova.rsi
    state: artifact_8_active
    noRot: true
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: NovaArtifactConsole
  id: NovaArtifactEye
  components:
  - type: Sprite
    state: artifact_10_active

- type: entity
  parent: NovaArtifactConsole
  id: NovaArtifactGemGreen
  components:
  - type: Sprite
    state: artifact_11_active

- type: entity
  parent: NovaArtifactConsole
  id: NovaArtifactGemPink
  components:
  - type: Sprite
    state: artifact_12_active

- type: entity
  parent: NovaArtifactConsole
  id: NovaArtifactGemBlue
  components:
  - type: Sprite
    state: artifact_13_active

- type: entity
  parent: NovaArtifactConsole
  id: NovaMysteriousPod
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/mysterious_pod_nova.rsi
    state: autocloner_process
    noRot: false
    offset: "0,0.5"
  - type: PointLight
    radius: 2
    energy: 1
    color: "#00FFFF"

- type: entity
  parent: DecorImportCrystalBase
  id: NebulaXenoCrystal
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/xeno_crystal_nebula.rsi
    layers:
    - state: green
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        green: ""
    - base:
        purple: ""
  - type: PointLight
    radius: 3
    energy: 3

- type: entity
  parent: NovaArtifactConsole
  id: PolarisAlienTank
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/alien_tank_polaris.rsi
    state: tank_larva
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PolarisAlienTankBroken:
            min: 1
            max: 1
        offset: 0
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: NovaArtifactConsole
  id: PolarisAlienTankBroken
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/alien_tank_polaris.rsi
    state: tank_broken

- type: entity
  parent: ClosetBase
  id: VoreDropPod
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/droppod_vore.rsi
    noRot: false
    offset: "0,0.28"
    layers:
    - state: pod
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateDoorOpen: pod_open
    stateDoorClosed: pod
  - type: EntityStorage
    openSound:
      path: /Audio/_WF/DecorImport/vorestation/magnetclamp.ogg

- type: entity
  parent: VoreDropPod
  id: RMCDropPod
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/drop_pod.rsi
    offset: "0,0.5"
    layers:
    - state: techpod_closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateDoorOpen: techpod_open
    stateDoorClosed: techpod_closed
  - type: EntityStorage
    openSound:
      path: /Audio/Effects/closetopen.ogg

- type: entity
  parent: BaseStructure
