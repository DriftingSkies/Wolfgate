- type: entity
  parent: BaseStructure
  id: TgStatueBoneRib
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/bones.rsi
    state: rib
    noRot: true
    enableOverrideDir: true
    overrideDir: South
    drawdepth: Mobs
    offset: "0.0,0.500"
    snapCardinals: false
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Damageable
    damageModifierSet: Metallic
  - type: Construction
    graph: DecorBuildTgStatueBoneRib
    node: built

