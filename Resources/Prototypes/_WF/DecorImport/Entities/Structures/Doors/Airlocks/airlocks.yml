- type: entity
  parent: Airlock
  id: CMAirlockAlmayerdoorWhite
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Doors/Airlocks/Standard/almayerdoor_white.rsi
    layers:
    - state: closed
      map: [ enum.DoorVisualLayers.Base ]
    - state: blank
      map: [ enum.DoorVisualLayers.BaseUnlit ]
    - state: blank
      map: [ enum.DoorVisualLayers.BaseBolted ]
    - state: blank
      map: [ enum.DoorVisualLayers.BaseEmergencyAccess ]
    - state: blank
      map: [ enum.WiresVisualLayers.MaintenancePanel ]
    - state: welded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects.rsi
      map: [ enum.WeldableLayers.BaseWelded ]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: [ enum.ElectrifiedLayers.HUD ]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: [ enum.ElectrifiedLayers.Sparks ]
  - type: Door
    openingAnimationTime: 0.6
    closingAnimationTime: 0.6
    openTimeOne: 0.4
    openTimeTwo: 0.2
    closeTimeOne: 0.2
    closeTimeTwo: 0.4
    emaggingSpriteState: blank
  - type: Airlock
    openUnlitVisible: false
    openingSpriteState: blank
    closingSpriteState: blank
    openSpriteState: blank
    closedSpriteState: blank
    denySpriteState: blank
    openPanelSpriteState: blank
    animatePanel: false

