- type: constructionGraph
  id: DecorBuildAlwaysPoweredFloorLight
  start: start
  graph:
  - node: start
    edges:
    - to: built
      steps:
      - material: Steel
        amount: 2
        doAfter: 2.0
  - node: built
    entity: AlwaysPoweredFloorLight
    edges:
    - to: start
      conditions:
      - !type:ContainerEmpty
        container: light_bulb
      steps:
      - tool: Screwing
        doAfter: 2.0
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity {}

