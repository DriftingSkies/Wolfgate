# Faction standing: who is at war with whom. War is mutual, so each pair is listed once. A faction's patrols warn
# off and fire on ships of the companies it is at war with, and leave everyone else alone.
# The Federation and the Dynasty are under a ceasefire. They are at war only once it has been declared (declaredWar):
# until then their patrols warn each other's ships off and fire only when fired on.

- type: wfStanding
  id: TSF
  atWar: [ RedSailCorsairs ]
  declaredWar: [ PDV, PDVCivilian, PDVHighComm ]

- type: wfStanding
  id: TSFCivilian
  atWar: [ RedSailCorsairs ]
  declaredWar: [ PDV, PDVHighComm ]

- type: wfStanding
  id: TSFHighComm
  atWar: [ RedSailCorsairs ]
  declaredWar: [ PDV, PDVCivilian, PDVHighComm ]

# The encounter pirates: at war with both navies and their civilians. They fire through whatever is in the way.
- type: wfStanding
  id: WFAshfallReavers
  atWar: [ TSF, TSFCivilian, TSFHighComm, PDV, PDVCivilian, PDVHighComm ]
  recklessFire: true
  # Paid on the spot for each Reaver or pirate a player kills, wherever it happens.
  killBounty: 1500
  # Each one downed drops this many thalers per threat tier step, from 600 at tier 0 to 3600 at tier 5.
  cashDrop: 600
