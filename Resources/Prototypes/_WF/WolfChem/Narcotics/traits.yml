# Start the round already dependent on a drug family, with a first fix in hand. Drawbacks, so they refund points.
# Pick one per family; they stack. A neuroware host gets the family's program on a dealer copy instead of the drug.

- type: trait
  id: WFDependentStimulant
  name: trait-wf-dependent-stimulant-name
  description: trait-wf-dependent-stimulant-desc
  category: Physical
  cost: -3
  components:
  - type: WFDependentStimulant
    gear: WFBaggieCocaineCut
    hostGear: WFNeurowareStickWhitelineCopy

- type: trait
  id: WFDependentOpioid
  name: trait-wf-dependent-opioid-name
  description: trait-wf-dependent-opioid-desc
  category: Physical
  cost: -3
  components:
  - type: WFDependentOpioid
    gear: WFBaggieHeroinCut
    hostGear: WFNeurowareStickNullLoopCopy

- type: trait
  id: WFDependentEmpathogen
  name: trait-wf-dependent-empathogen-name
  description: trait-wf-dependent-empathogen-desc
  category: Physical
  cost: -2
  components:
  - type: WFDependentEmpathogen
    gear: WFVialHaloCut
    hostGear: WFNeurowareStickHaloCopy

# Cannabis withdrawal stops at cravings, like nicotine.
- type: trait
  id: WFDependentCannabinoid
  name: trait-wf-dependent-cannabinoid-name
  description: trait-wf-dependent-cannabinoid-desc
  category: Physical
  cost: -1
  components:
  - type: WFDependentCannabinoid
    gear: Joint
    hostGear: WFNeurowareStickIdleCopy

# No program runs nicotine, so a synthetic has nothing to be hooked on.
- type: trait
  id: WFDependentNicotine
  name: trait-wf-dependent-nicotine-name
  description: trait-wf-dependent-nicotine-desc
  category: Physical
  cost: -1
  traitGear: CigPackGreen
  biotypeBlacklist:
  - Synthetic
  components:
  - type: WFDependentNicotine
