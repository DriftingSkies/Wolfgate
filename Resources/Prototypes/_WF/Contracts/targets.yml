# Bounty contract targets: encounters the contract board starts when a bounty is accepted. Never scheduled, no warrant
# (the contract pays), and they outlast the contract's clock. Tiers 1-2 can be taken by a lightly armed civilian hull,
# 3 wants a real gunboat or a pair of ships, 4-5 a crewed warship.

# Tier 1: a bail jumper alone in an unarmed shuttle. Runs, never fights.
- type: wfEncounter
  id: WFContractTargetSkip
  name: wf-contract-target-skip
  start: Manual
  category: Threat
  icon: Skull
  cost: 0
  weight: 0
  duration: 4200
  ships:
  - key: target
    navigation: WFCrewNavigationFreight
    vessels: [ Piva, Twilight ]
    side: target
    profile: WFCrewProfileFugitive
    roles: [ WFCrewCaptain, WFCrewPilot ]
    deckhands: 0
    skill: Green
    distress: false
    evades: false
    flees: 1000
    disengage: Deter
    disengageRange: 700
    wander: 8
    wanderRadius: 1500
    wanderPause: 25
    objectives:
    - kind: Hold

