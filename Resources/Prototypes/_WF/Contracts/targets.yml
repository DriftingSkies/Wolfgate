# Escort runs: a freighter waits at the rendezvous until a player comes within startRadius, then flies to the one stop
# the contract names and away. Raiders lie hidden until then, hold off a few minutes, and go for the freighter.

# Tier 1: a nervous trader with nobody after it. Shepherd it there.
- type: wfEncounter
  id: WFContractEscortQuiet
  name: wf-contract-escort-quiet
  start: Manual
  category: Traffic
  cost: 0
  weight: 0
  duration: 4800
  startRadius: 600
  route:
    minStops: 1
    maxStops: 1
  ships:
  - key: freighter
    navigation: WFCrewNavigationFreight
    vessels: [ Piva, Twilight, Hermes ]
    side: freight
    profile: WFCrewProfileHauler
    deckhands: 1
    captain: true
    flyRoute: true
    boarding: Warn
    docking: Warn
    disengage: Deter

