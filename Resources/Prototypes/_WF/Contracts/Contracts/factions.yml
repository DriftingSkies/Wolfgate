  deposit: 1000
  minutes: 60
  weight: 1.2
  credits: 15
  creditEntity: FederationMilitaryCredit1
  objective: !type:WFContractEscort
    encounters: [ WFContractEscortLight ]
    destinations: [ WFContractorStellarBlessing, WFContractorCaelPort ]
    perKilometre: 1250

- type: wfContract
  id: WFContractTSFFactionRecorder
  contractor: WFContractorTSFRequisitions
  category: Salvage
  tier: 2
  title: wf-contract-tsf-faction-recorder
  briefing: wf-contract-tsf-faction-recorder-brief
  reward: 17500, 22500
  minutes: 55
  weight: 1
  credits: 8
  creditEntity: FederationMilitaryCredit1
