# Faction board work: for members of the faction only, paid in thalers and the faction's own credits, and costing standing
# with the rival faction. It rewards the playstyle each faction wants: TSF holds the lanes and supplies the Corps, the
# USSP keeps its freeport alive, the PDV raids and builds up Helios.

# --- TSF Naval Requisitions (Halcyon) ---

- type: wfContract
  id: WFContractTSFFactionPatrol
  contractor: WFContractorTSFRequisitions
  category: Bounty
  tier: 2
  title: wf-contract-tsf-faction-patrol
  briefing: wf-contract-tsf-faction-patrol-brief
  reward: 27500, 35000
  deposit: 1000
  minutes: 55
  weight: 2
  credits: 15
  creditEntity: FederationMilitaryCredit1
  objective: !type:WFContractBounty
    encounters: [ WFContractTargetSmuggler, WFContractTargetClaimJumper ]
    minDistance: 3500
    maxDistance: 5500

- type: wfContract
  id: WFContractTSFFactionSweep
  contractor: WFContractorTSFRequisitions
