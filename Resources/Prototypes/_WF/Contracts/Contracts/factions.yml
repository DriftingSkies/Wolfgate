      count: 3, 6

- type: wfContract
  id: WFContractTSFFactionColonyRun
  contractor: WFContractorTSFRequisitions
  category: Hauling
  tier: 2
  title: wf-contract-tsf-faction-colony-run
  briefing: wf-contract-tsf-faction-colony-run-brief
  reward: 13750, 17500
  minutes: 50
  weight: 1.5
  credits: 10
  creditEntity: FederationMilitaryCredit1
  objective: !type:WFContractCourier
    package: WFContractFreightSupplies
    count: 2, 4
    from: Contractor
    to: Other
    destinations: [ WFContractorStellarBlessing ]
    perPackage: 2250
    perKilometre: 1625

- type: wfContract
  id: WFContractTSFFactionConvoy
  contractor: WFContractorTSFRequisitions
  category: Escort
  tier: 2
