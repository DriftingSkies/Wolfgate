    encounters: [ WFContractTargetRaiderPair ]
    minDistance: 4000
    maxDistance: 6500

- type: wfContract
  id: WFContractTSFFactionMateriel
  contractor: WFContractorTSFRequisitions
  category: Supply
  tier: 2
  title: wf-contract-tsf-faction-materiel
  briefing: wf-contract-tsf-faction-materiel-brief
  reward: 12500, 17500
  minutes: 55
  weight: 1.5
  credits: 10
  creditEntity: FederationMilitaryCredit1
  harms:
    WFContractorUSSPCommissariat: 1
    WFContractorPDVQuartermaster: 2
  objective: !type:WFContractSupply
    pick: 2
    premium: 1.5
    goods:
    - stack: Plasteel
      count: 20, 40
    - stack: Steel
      count: 60, 100
    - stack: Uranium
      count: 10, 20
