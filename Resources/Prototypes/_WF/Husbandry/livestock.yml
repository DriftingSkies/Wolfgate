# Native livestock: one tameable species a world, in its quieter fauna tables. Each is a farm animal adapted to its
# world: it doesn't breathe the air, takes the world's heat or cold, and gives a hide as well as meat. Names and
# descriptions are in Resources/Locale/en-US/_WF/Husbandry/livestock.ftl.

- type: entity
  parent: MaterialBase
  id: WFMaterialHide
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    state: corgihide
    color: "#a07850"
  - type: Item
    heldPrefix: corgihide
  - type: StaticPrice
    price: 40

- type: entity
  abstract: true
  id: WFNativeLivestock
  components:
  - type: BreathingImmunity
  - type: WFTameable

# Asclepiu: a ridgeback goat, for milk and wool.
- type: entity
  parent: [MobGoat, WFNativeLivestock]
  id: WFMobLivestockAsclepiu
  components:
  - type: Sprite
    color: "#c8a878"
  - type: Reproductive
    offspring:
    - id: WFMobLivestockAsclepiu
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 4
    - id: WFMaterialHide
  - type: Temperature
    heatDamageThreshold: 330
    coldDamageThreshold: 230
    currentTemperature: 300

