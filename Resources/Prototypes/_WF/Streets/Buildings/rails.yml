  components:
  - type: Sprite
    state: plasticroadbarrierblue

- type: entity
  parent: RMCBarricadeHybrisaPlasticRoadBarrier
  id: RMCBarricadeHybrisaPlasticRoadBarrierBlack
  suffix: Black
  components:
  - type: Sprite
    state: plasticroadbarrierblack

# Colonial Marines Universe's concrete barrier, without its barbed wire and damage overlays.
- type: entity
  parent: WFStreetsRailBase
  id: AU14JerseyBarricade
  name: concrete barrier
  description: A slab of cast concrete. It stops cars, and most other things.
  components:
  - type: Sprite
    sprite: _WF/Streets/CMU/Structures/concretebarrier.rsi
    state: concrete
  - type: VehicleSmashable
    minDestroyWeightClass: Heavy
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
