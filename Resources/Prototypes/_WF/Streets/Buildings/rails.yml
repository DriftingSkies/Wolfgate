# Hand-written: RMC's handrails and road barriers hang off its barricade base, which is all xeno combat rules. Here they
# are railings on upstream's pattern (a thin fixture on the edge they face, climbable), with RMC's ids and sprites.

- type: entity
  abstract: true
  parent: BaseStructure
  id: WFStreetsRailBase
  categories: [ WFStreets ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _WF/Streets/Structures/Walls/Barricades/barricade.rsi
  - type: Physics
    bodyType: Static
  - type: Rotatable
  - type: InteractionOutline
  - type: Repairable
  - type: Climbable
  - type: VehicleSmashable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - MidImpassable
        layer:
        - TableLayer

# Handrails

- type: entity
  parent: WFStreetsRailBase
