# Road barriers

- type: entity
  parent: WFStreetsRailBase
  id: RMCBarricadeHybrisaCenterRoad
  name: road barrier
  description: A steel barrier down the middle of the road.
  components:
  - type: Sprite
    state: centerroadbarrier2

- type: entity
  parent: RMCBarricadeHybrisaCenterRoad
  id: RMCBarricadeHybrisaCenterRoadDouble
  suffix: Double
  components:
  - type: Sprite
    state: centerroadbarrier1
    offset: 0,-0.15

- type: entity
  parent: WFStreetsRailBase
  id: RMCBarricadeHybrisaPlasticRoadBarrier
  name: plastic road barrier
  description: A water-filled plastic barrier. It keeps cars off the pavement, mostly.
  suffix: Red
  components:
