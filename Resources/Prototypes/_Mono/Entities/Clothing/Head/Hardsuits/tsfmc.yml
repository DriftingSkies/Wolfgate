- type: entity
  parent: NFClothingHeadHardsuitWithLightBaseNfsd
  id: ClothingHeadHelmetHardsuitM82
  name: M82 helmet
  description: The interchangeable helmet system for the majority of M82 hardsuits. Outfitted with a basic NVG system.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/m82.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/m82.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: NightVision # Gen 1 dualtube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 2
    viewCircleSpacing: 280
    phosphorColor: "#00AACC"
    lightingColor: "#FFFFFF32"
  - type: Armor
    coverage: [Head] # WOLFGATE(Wolfmed): P6, P3-D6: locational armour coverage
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): helmet tier rule, T2 0.9 and T3 0.85.
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

