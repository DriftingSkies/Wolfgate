- type: entity
  # WOLFGATE(Modsuits): MODsuit parts use the native module system.
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestplateUSSPVaryag
  name: Panzerkorps Varyag
  description: Thick plating fused with internal atmosphere control.
  categories: [ HideSpawnMenu ]
  components:
  # WOLFGATE(ArmorSpecialization): bone plating.
  - type: WFWoundWard
    examine: wf-armor-spec-bone-plating-examine
    hardens:
      InternalBleedingWound: 2
      WFWolfmedCrushInjuryWound: 2
      WFWolfmedDislocationWound: 2
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Modsuits/ussp-varyag.rsi
  # WOLFGATE(Modsuits) START: heavy MODsuit chestplates add at most 5% on top of the control unit's 5%
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  # WOLFGATE END
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: StaminaDamageResistance
    coefficient: 0.4
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.4 # Modsuits are pain to use. Needs some kind of benefit.
        Heat: 0.75
        Radiation: 0.5
        Caustic: 0.5
  - type: FireProtection
    reduction: 0.7

