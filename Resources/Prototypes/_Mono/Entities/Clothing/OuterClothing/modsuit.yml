# Volta

- type: entity
  # WOLFGATE(Modsuits): MODsuit parts use the native module system.
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestplateVolta
  name: Volta Modsuit Chestplate
  description: Reinforced military modification of Sapper Modsuit, featuring better bullet resistance.
  categories: [ HideSpawnMenu ]
  components:
  # WOLFGATE(ArmorSpecialization): insulation.
  - type: WFWoundWard
    examine: wf-armor-spec-insulation-examine
    blocks:
    - WFWolfmedInternalBurnWound
    - WFWolfmedShortCircuitWound
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Modsuits/tsfmc-volta.rsi
  # WOLFGATE(Modsuits) START: light MODsuit chestplates add no slowdown; the control unit supplies the 5% cap
  # - type: ClothingSpeedModifier
  #   walkModifier: 0.95
  #   sprintModifier: 0.95
  # WOLFGATE END
  # WOLFGATE(Modsuits) START: the native module system sets its own sealed appearance
  # - type: SealableClothingVisuals
  #   spriteLayer: sealed
  #   clothingVisuals:
  #     outerClothing:
  #     - state: equipped-OUTERCLOTHING-sealed
  #     outerClothing-vox:
  #     - state: equipped-OUTERCLOTHING-sealed-vox
  #     outerClothing-resomi:
  #     - state: equipped-OUTERCLOTHING-sealed-resomi
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
  # WOLFGATE END
  # WOLFGATE(Modsuits) START: the rsi has no resomi state, so sealed Resomi drew an error sprite
  # outerClothing-resomi:
  # - state: equipped-OUTERCLOTHING-sealed-resomi
  # WOLFGATE END
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.8
        Piercing: 0.65
        Heat: 0.5
        Shock: 0.9
        Radiation: 0.1
  - type: StaminaDamageResistance
    coefficient: 0.9
  - type: FireProtection
    reduction: 0.0

