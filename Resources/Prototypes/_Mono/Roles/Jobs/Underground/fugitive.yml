- type: job
  id: Fugitive
  name: job-name-fugitive
  description: job-description-fugitive
  playTimeTracker: JobFugitive
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 10800 # 3 hours # mono
  startingGear: FugitiveGear
  icon: JobIconFugitive
  supervisors: job-supervisors-nobody
  # WOLFGATE(ReaverCampaign): Underground crew fly the neutral WFUnderground company, so the Reavers leave them alone
  assignedCompany: WFUnderground
  displayWeight: 100
  accessGroups:
  - GeneralAccess
  access:
  - Underground
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  - !type:AddComponentSpecial
    components:
    # WOLFGATE(ReaverCampaign) START: Underground people are allied with the Reaver campaign's crews
    - type: NpcFactionMember
      factions:
      - NanoTrasen
      - WFUnderground
    # WOLFGATE END
    - type: Contraband
      hideValues: true
      turnInValues:
        FederationMilitaryCredit: 150 # bounty on your head
    - type: RadioOnCryosleep
      radioChannel: Syndicate # Syndicate = Underground
  - !type:AddImplantSpecial
    implants: [ DeathRattleImplant, RadioImplant ]

- type: startingGear
  id: FugitiveGear
  storage:
    back:
    - Telecrystal25
    - ContractorIDCard
