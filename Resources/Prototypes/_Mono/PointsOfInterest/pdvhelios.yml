- type: pointOfInterest
  id: HeliosFortress
  parent: [BasePOI, BaseRepairablePOI]
  name: 'PDV Helios Fortress'
  minimumDistance: 22000
  maximumDistance: 27000 # somewhere in far reaches 1 or 2
  # WOLFGATE(ReaverCampaign): the Contested Sector game mode spawns the same sector as Standard
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, WGContestedSector, MonoRogueTSF, MonoRogueUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce, MonoChimeraPdv ]
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/pdvhelios.yml
  addComponents:
  # WOLFGATE(Ordnance) START: the faction's ordnance terminal
  - type: WGOrdnanceStation
    terminal: WGOrdnanceTerminalPDV
  # WOLFGATE END
  - type: IFF
    color: "#DE9E59"
    readOnly: true # mono
    flags:
    - HideLabelAlways # hidden
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # drones no droning
    - maxDistance: 5000
      prob: 0.0
    - maxDistance: 6500
      prob: 0.3

- type: gameMap
  id: HeliosFortress
  mapName: 'PDV Helios Fortress'
  mapPath: /Maps/_Mono/POI/pdvhelios.yml
  minPlayers: 0
  stations:
    HeliosFortress:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
      - type: VesselInfo
        description: "An oppressive imperial aura lurks here. Glory to the Sultan."
      - type: JamDeathrattles
        exclusions:
        - FreelanceTrackingImplant
      - type: JamOverwatch
        excludedFactions:
        - PDV
      - type: DeleteNearbyDrones
        distance: 5000
      - type: ApplyIFFFlagsToDockedShips
        flags:
        - HideLabelAlways # hide all docked ships
      components:
        - type: StationNameSetup
          mapNameTemplate: 'PDV Helio Fortress'
        - type: ExtraStationInformation
          icon: /Textures/_NF/Interface/Pirate/piratelogo.png
          stationSubtext: 'frontier-lobby-pirate-subtext'
          stationDescription: 'frontier-lobby-pirate-description'
        - type: StationJobs
          availableJobs:
            # PdvCivilian: [ -1, -1 ]
            PirateCaptain: [ 1, 1 ]
            # WOLFGATE(FactionBalance) START: more leader and specialist slots for a 130-player population
            # PirateFirstMate: [ 1, 1 ]
            # PDVDenasvar: [ 3, 3 ]
            PirateFirstMate: [ 2, 2 ]
            PDVDenasvar: [ 6, 6 ]
            # WOLFGATE END
            WGPdvJarrah: [ 5, 5 ] # WOLFGATE(PdvMedic): PDV field medic slots, 2 -> 5 for a 130-player population
            WGPdvArtificer: [ 4, 4 ] # WOLFGATE(PdvArtificer): PDV engineer slots
            # PDVInfiltrator: [ 2, 2 ]
            Pirate: [ -1, -1 ]
            PdvBorg: [ 3, 3 ] # WOLFGATE(FactionBalance): 2 -> 3 for a 130-player population
          tags:
          - GrandVizier
        - type: StationDeadDropReporting
          messageSet: Pirate
        - type: StationDeadDropHintExempt

