- type: entity
  id: OrganMothStomach
  parent: OrganAnimalStomach
  categories: [ HideSpawnMenu ]
  name: moth stomach
  components:
  - type: Stomach
    specialDigestible:
      components:
      - MothFood
      tags:
      - ClothMade
      - Paper
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Moth ]
    removeEmpty: true
    groups:
    - id: Food
    - id: Drink
    - id: Medicine
    - id: Cryogenic
    - id: Poison
    - id: Narcotic
    - id: Alcohol
      rateModifier: 0.1 # WOLFGATE(WolfChem): at full rate the stomach cleared ethanol before it could make a moth drunk
