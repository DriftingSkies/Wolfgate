#Tank greebles
- type: entity
  parent: BaseGreeble
  id: WGGreebleSmallSphereTank
  name: external tank
  suffix: Small
  description: A spherical tank with a significant internal volume when under pressure.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 0,1
    sprite: _WG/Decorations/Greebles/32x32.rsi
    layers:
    - state: tanksmall

- type: entity
  parent: BaseGreeble
  id: WGGreebleSphereTank
  name: external tank
  description: A large, spherical tank with a vast internal volume when under pressure.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 0.5,1.5
    sprite: _WG/Decorations/Greebles/64x64.rsi
    layers:
    - state: tank

- type: entity
  parent: WGGreebleSphereTank
  id: WGGreebleSphereTankOx
  name: external tank
  suffix: Blue Oxy
  description: A large, spherical tank with a vast internal volume when under pressure. The blue stripes indicate it holds oxygen.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - state: tank-ox

- type: entity
  parent: WGGreebleSphereTank
  id: WGGreebleSphereTankNit
  name: external tank
  suffix: Red Nit
  description: A large, spherical tank with a vast internal volume when under pressure. The red stripes indicate it holds nitrogen. Or something very flammable. It's a 50/50 chance.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - state: tank-nit

# Radiator greebles

- type: entity
  parent: BaseGreeble
  id: WGGreebleRadiator
  name: radiator
  suffix: 3
  description: A large, glowing-hot radiator for radiating excess heat from a spacecraft so the crew inside don't start frying.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 0,2
    sprite: _WG/Decorations/Greebles/32x96.rsi
    layers:
    - state: radiator1
  - type: PointLight
    enabled: true
    offset: 0,1.5
    radius: 3
    color: "#e3655c" # light red

