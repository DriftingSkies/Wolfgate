# Operation call-ins on the faction static uplinks, one per operation at its stake. Written by
# Tools/_WG/Operations/listings.py from operations.yml; edit the operation and rerun it.

- type: storeCategory
  id: WGUplinkSecurityOperations
  name: wg-store-category-operations
  priority: 10

- type: storeCategory
  id: WGUplinkPdvOperations
  name: wg-store-category-operations
  priority: 10

- type: listing
  id: WGUplinkOperationDeadDropTsf
  name: wg-operation-name-dead-drop
  description: wg-operation-desc-dead-drop
  icon:
    sprite: Objects/Devices/communication.rsi
    state: beacon
  cost:
    FederationMilitaryCredit: 15
  categories:
  - WGUplinkSecurityOperations
  productEvent: !type:WGCallOperationEvent
    operation: WGOperationDeadDropTsf
  raiseProductEventOnUser: true
  disableRefund: true
  conditions:
  - !type:StoreWhitelistCondition
    whitelist:
      tags:
      - FactionStaticUplinkTsf
  - !type:WGOperationReadyCondition
    operation: WGOperationDeadDropTsf

