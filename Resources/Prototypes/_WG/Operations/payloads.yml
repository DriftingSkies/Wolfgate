# Operation payloads: contraband that pays whichever faction turns it in at home.

- type: entity
  parent: BaseMachine
  id: WGOperationVaultServer
  name: solarian vault server
  description: A Solarian data vault's core, packed with confiscated records. The TSF wants it home at the Halcyon; the Phaethon Dynasty would pay as much to have it at Helios.
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/server.rsi
    snapCardinals: true
    layers:
    - state: server
    - state: variant-tsf
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    delay: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Transform
    anchored: true
  - type: Pullable
  - type: StaticPrice
    price: 20000
  - type: Contraband
    severity: MonolithContrabandT3
    turnInValues:
      FederationMilitaryCredit: 250
      Doubloon: 250
  - type: RadarBlip
    radarColor: "#D2B48C"
    scale: 3
    shape: hexagon
    visibleFromOtherGrids: true

- type: entity
  parent: [ CrateSyndicate, BaseMonolithContrabandT3 ]
  id: WGOperationArmsCrate
  name: dynasty arms crate
  description: Phaethon weapons smuggled in for the Vanguard. Helios pays for every one that arrives; the TSF pays as much to seize them at the Halcyon.
  components:
  - type: Contraband
    severity: MonolithContrabandT3
    turnInValues:
      FederationMilitaryCredit: 80
      Doubloon: 80
  - type: StorageFill
    contents:
    - id: WeaponRifleAk
    - id: WeaponSubMachineGunMla73
    - id: WeaponShotgunSultanPulsar
  - type: RadarBlip
    radarColor: "#E10F9B"
    scale: 2
    shape: hexagon
    visibleFromOtherGrids: true

- type: entity
  parent: [ BriefcaseSyndie, BaseMonolithContrabandT2 ]
  id: WGOperationDeadDropCase
  name: dead drop case
  description: A locked courier case left for a faction agent. Either base pays for it, no questions asked.
  components:
  - type: Contraband
    severity: MonolithContrabandT2
    turnInValues:
      FederationMilitaryCredit: 35
      Doubloon: 35

# Spoils dropped on a cleared PvE site, locked to the caller's faction, sized to the operation's rung: its ship voucher
# material (a T2 voucher is 8 sheets), ship parts for T3 and capitals from Assault up, and fissile uranium from the
# heavy crates.

- type: entity
  parent: CrateSecure
  id: WGOperationSpoilsSmallTsf
  name: federation supply crate
  description: Materials recovered by a TSF operation, sealed to Federation access.
  components:
  - type: AccessReader
    access: [ [ "Tsfmc" ] ]
  - type: StorageFill
    contents:
    - id: WGSheetPlastitanium5

- type: entity
  parent: CrateSecure
  id: WGOperationSpoilsSmallPdv
  name: dynasty supply crate
  description: Materials recovered by a PDV operation, sealed to Vanguard access.
  components:
  - type: AccessReader
    access: [ [ "PDV" ] ]
  - type: StorageFill
    contents:
    - id: SheetPdvComposite5

- type: entity
  parent: CrateSecure
  id: WGOperationSpoilsTsf
  name: federation spoils crate
  description: Materials recovered by a TSF operation, sealed to Federation access.
  components:
  - type: AccessReader
    access: [ [ "Tsfmc" ] ]
  - type: StorageFill
    contents:
    - id: SheetPlastitanium10
    - id: TradeGoodShipComponents

- type: entity
  parent: WGOperationSpoilsTsf
  id: WGOperationSpoilsHeavyTsf
  name: federation heavy spoils crate
  components:
  - type: StorageFill
    contents:
    - id: SheetPlastitanium
    - id: TradeGoodShipComponents
      amount: 2
    - id: SheetUraniumFissile3

- type: entity
  parent: CrateSecure
  id: WGOperationSpoilsPdv
  name: dynasty spoils crate
  description: Materials recovered by a PDV operation, sealed to Vanguard access.
  components:
  - type: AccessReader
    access: [ [ "PDV" ] ]
  - type: StorageFill
    contents:
    - id: SheetPdvComposite10
    - id: TradeGoodShipComponents

- type: entity
  parent: WGOperationSpoilsPdv
  id: WGOperationSpoilsHeavyPdv
  name: dynasty heavy spoils crate
  components:
  - type: StorageFill
    contents:
    - id: SheetPdvComposite15
    - id: TradeGoodShipComponents
      amount: 2
    - id: SheetUraniumFissile3
