# Crew posts for a commanded ship's roster (ShipCommand). Unlike NpcCrew's spawn points nothing spawns here on its
# own: the ship's WGShipRoster staffs each post when the ship spawns, and restaffs it when its crewman is lost.

- type: entity
  abstract: true
  parent: MarkerBase
  id: WGShipCrewPostBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green

- type: entity
  parent: WGShipCrewPostBase
  id: WGShipCrewPostPilot
  name: command crew post (pilot)
  description: A commanded ship's roster post. The roster staffs it; nothing spawns here on its own.
  components:
  - type: WGShipCrewPost
    role: WGCrewPilot

