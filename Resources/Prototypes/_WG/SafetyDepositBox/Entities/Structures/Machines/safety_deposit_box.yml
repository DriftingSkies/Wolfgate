# Safety Deposit Box Entities

# Base parent for all safety deposit boxes
- type: entity
  id: SafetyDepositBoxBase
  abstract: true
  parent: BaseStorageItem
  components:
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Storage
    blacklist:
      components:
      - IdCard # Fuckery, abusable
      - Store # Balance
      - EncryptionKey # Balance
      - SubdermalImplant # Prevent recursion
      - SafetyDepositBox # Prevent recursion
      - ShipyardVoucher # Mfw 6 T4 vouchers in one box
      - SecretStash # WL bypass
      - Implanter # WL bypass
      - OverwatchConsole # Requested by staff
      - GhostRoleMobSpawner # Reinforcement radios
      - DoorRemote # Requested by staff
      - NukeDisk # Might be abusable in some way, who knows.
      - ThiefUndeterminedBackpack # no stashing an entire fucking judge/overseer modsuit or spasaka/TARKHAN/MARSOC kit
      - AccessOverrider # Access configs can bypass the ID card storage.
      - Pda # See above
      - MachineBoard # lets you lockbox TSF servers and shit :face_holding_back_tears:
      - Flatpack # ditto
      - MobState # anything alive; a mouse can be a player
      - MindContainer # brains and other things that can hold a player
      - PlantAnalyzer # its gene bank would carry plant genes between rounds
      - Seed # so would mutated seeds
      - ComputerBoard # machine parts in raw form: computer boards
      - BaseElectronics # door, APC, firelock and law boards
      - ReactorPart # fuel and control rods
      - UpgradeKit # lathe upgrade kits
      - MechEquipment # mech weapons and tools
      - MechAssembly # mech harnesses
      - HardpointItem # vehicle hardpoints
      - BorgModule # cyborg modules
      - BodyPart # limbs, augments and cybernetic limbs
      - Organ # organs and cybernetic implants
      - Emag # emags and access breakers
      tags:
      - Unstashable
      - SafetyDepositBlacklist
  # Bags, boxes, guns and anything else with slots go in, but everything inside them, however deep, is held to the same
  # rules: what the box refuses is handed back on deposit.
  - type: SafetyDepositAllowList
    restricted:
      components:
      - Currency # Balance; thalers are allowed below, faction scrip (FMC, doubloons, LPCs, TC) is not
      - Contraband # items exchangeable for FMC or DC; faction gear only comes in through the allowances below
      - MachinePart # stock parts and economy capacitors; tier 1 and 2 stock parts and power cells are let back in below
    # Food and drink go in freely; medicine past what an item spawns with up to the limit across the box; any other
    # reagent only up to what the item spawns with, so nobody stores 6ku of letoferol in a bottle.
    reagentGroups:
    - Foods
    - Drinks
    reagentLimits:
      Medicine: 300
    # The storage takes Ginormous on the bigger boxes so bags that hold Huge items fit; nothing bigger than this goes in.
    maxItemSize: Huge
    stacks:
    - Credit # thalers
    prototypes:
    # Tier 1 faction suits and armour: what each faction's first equipment research prints.
    - ClothingOuterHardsuitM82b # TSF
    - ClothingOuterHardsuitM82c # TSF
    - ClothingOuterHardsuitUsspL10 # USSP
    - ClothingOuterHardsuitUsspL10A # USSP
    - ClothingOuterHardsuitPirateScaf # PDV
    - ClothingOuterVestWeb # PDV
    - ClothingOuterVestWebElite # PDV
    allowances:
    # Faction guns, melee, shields and ammunition up to tier 3. Loot and black market gear stays out, and so does what
    # the refusals below name.
    - name: safety-deposit-allowed-faction-weapons
      whitelist:
        components:
        - Gun
        - MeleeWeapon
        - Blocking
        - CartridgeAmmo
        - BallisticAmmoProvider
      blacklist:
        components:
        - Magboots # advanced tactical magboots have a melee attack
      severities:
      - FactionGear1
      - FactionGear2
      - OtherFactionGear1
      - OtherFactionGear2
      - FactionGear3
      - OtherFactionGear3
      - Class1 # DEW cartridges
      - Class2 # Basilisk, Calico and Smilodon
      - Class3Pirate # Sultan's Pulsar, PDV tier 1
    # Tier 1 faction gear: magboots, gas masks, visors, jaws of life. Emags are blacklisted.
    - name: safety-deposit-allowed-faction-gear
      whitelist:
        components:
        - Item
      severities:
      - FactionGear0
      - FactionGear1
      - OtherFactionGear0
      - OtherFactionGear1
    # Faction suits, vests and helmets up to tier 2; tier 1 ones that aren't contraband are listed by prototype above.
    - name: safety-deposit-allowed-faction-armour
      whitelist:
        components:
        - Armor
      severities:
      - FactionGear0
      - FactionGear1
      - FactionGear2
      - OtherFactionGear0
      - OtherFactionGear1
      - OtherFactionGear2
    - name: safety-deposit-allowed-power-cells
      whitelist:
        components:
        - PowerCell
    # Stock parts by exact prototype, so higher tiers that inherit from these stay out. Industrial capacitors are trade
    # goods and stay out too.
    - name: safety-deposit-allowed-tier1-parts
      prototypes:
      - CapacitorStockPart
      - MicroManipulatorStockPart
      - MatterBinStockPart
    - name: safety-deposit-allowed-tier2-parts
      prototypes:
      - AdvancedCapacitorStockPart
      - NanoManipulatorStockPart
      - AdvancedMatterBinStockPart
      limit: 10
    # Refused even where nothing marks them contraband. Each entry covers its variants too.
    refused:
    - name: safety-deposit-refused-launchers
      prototypes:
      - BaseWeaponLauncher # rocket and grenade launchers, Anubis included
      - WeaponLauncherPanzero
      - WeaponLauncherMyoko
      - GunAttachmentQLG20 # under-barrel grenade launchers
    - name: safety-deposit-refused-bluespace-storage
      prototypes:
      - ClothingBackpackHolding # the messenger variant included
      - ClothingBackpackDuffelHolding
      - ClothingBackpackSatchelHolding
      - OreBagOfHolding
      - PlantBagOfHolding
      - ConstructionBagOfHolding
    - name: safety-deposit-refused-built-in-weapons
      prototypes:
      - WeaponCyborgEnergyGun
      - WeaponRifleAsakimAutopulserADM
      - WeaponBorgPulseRifle
      - WeaponLaserCannonXenoborg
      - WeaponGuidedMissileLauncherXenoborg
      - WeaponRocketLauncherXenoborg
      - WeaponRangeFinderXenoborg
      - WeaponNaniteGun
      - WeaponOilGun
      - WeaponTileGun
      - WGAugmentArmLaserGun
      - WGMimeFingerGun
      - ArmBlade
      - MantisBlade
      - ModsuitDeviceResinMister
      - ModsuitDeviceTether
      - VehicleAPCM56FPWPortGunBase
    - name: safety-deposit-refused-mech-parts
      prototypes:
      - BaseMechPart # mech chassis, limbs and harnesses
    - name: safety-deposit-refused-magic-and-admin
      prototypes:
      - WeaponWandBase
      - WeaponStaffBase
      - AnimationStaff
      - Mjollnir
      - SingularityHammer
      - CrossbowBloodCult
      - CrossbowBloodCultHand
      - ClothingNeckAmuletBloodCult
      - EldritchBlade
      - UnholyHalberd
      - RitualDagger
      - EnergyKatana
      - Throngler
      - WeaponPistolDebug
      - WeaponOmnigun
      - WeaponImprovisedPneumaticCannonAdmeme
      - explosivelasergun
      - MeleeDebug100
      - MeleeDebug200
      - MeleeDebugBurner
      - MeleeDebugBurner200
      - MeleeDebugGib
      - MeleeDebugSever
      - MeleeDebugSever100
      - MeleeDebugSever200
      - ToolDebug
      - ClothingBackpackDebug
      - ClothingBackpackDebug2
      - ClothingBackpackDebug3
      - ClothingBackpackDebug4
      - OmnizineChemistryBottle
      - WGWolfmedDebugBottleIbuprofen
      - WGWolfmedDebugBottleKetorolac
      - WGWolfmedDebugBottleOsteogen
      - WGWolfmedDebugBottleOxycodone
      - WGWolfmedDebugBottleTramadol
  - type: SafetyDepositBox
  - type: Appearance
  - type: Tag
    tags:
    - SafetyDepositBox

- type: entity
  id: SafetyDepositBoxSmall
  name: safety deposit box (small)
  description: A small secure box for storing valuables. Holds a 4x3 grid of items up to normal size.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WG/SafetyDepositBox/Objects/Economy/depositboxsmall.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SafetyDepositBox
    cost: 2000000
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,2

- type: entity
  id: SafetyDepositBoxMedium
  name: safety deposit box (medium)
  description: A medium secure box for storing valuables. Holds a 6x4 grid, room for one suit, armour vest or backpack.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WG/SafetyDepositBox/Objects/Economy/depositboxmedium.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: SafetyDepositBox
    cost: 3500000
  - type: Storage
    maxItemSize: Ginormous # bags that hold Huge items fit; the allow list keeps out anything bigger than Huge
    grid:
    - 0,0,5,3

- type: entity
  id: SafetyDepositBoxLarge
  name: safety deposit box (large)
  description: A large secure box for storing valuables. Holds a 9x4 grid, room for two suits, armour vests or backpacks.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WG/SafetyDepositBox/Objects/Economy/depositboxlarge.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: SafetyDepositBox
    cost: 5000000
  - type: Storage
    maxItemSize: Ginormous # bags that hold Huge items fit; the allow list keeps out anything bigger than Huge
    grid:
    - 0,0,8,3

- type: entity
  id: SafetyDepositConsole
  name: safety deposit box console
  description: "A console for purchasing and managing safety deposit boxes."
  parent: BaseStructure
  components:
  - type: Sprite
    netsync: false
    noRot: true
    sprite: _WG/SafetyDepositBox/Structures/Machines/atm/depositatm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: SafetyDepositConsole
    smallBoxProto: SafetyDepositBoxSmall
    mediumBoxProto: SafetyDepositBoxMedium
    largeBoxProto: SafetyDepositBoxLarge
    boxSlot:
      name: safety-deposit-console-boxSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        tags:
        - SafetyDepositBox
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      safety-deposit-console-boxSlot: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.SafetyDepositConsoleUiKey.Key
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.SafetyDepositConsoleUiKey.Key:
        type: SafetyDepositConsoleBoundUserInterface
  - type: Anchorable
  - type: Pullable
