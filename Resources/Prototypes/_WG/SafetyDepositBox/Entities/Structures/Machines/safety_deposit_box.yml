# Safety Deposit Box Entities

# Base parent for all safety deposit boxes
- type: entity
  id: SafetyDepositBoxBase
  abstract: true
  parent: BaseStorageItem
  components:
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Storage
    blacklist:
      components:
      - IdCard # Fuckery, abusable
      - Store # Balance
      - EncryptionKey # Balance
      - Headset # Ditto
      - SubdermalImplant # Prevent recursion
      - SafetyDepositBox # Prevent recursion
      - ShipyardVoucher # Mfw 6 T4 vouchers in one box
      - SecretStash # WL bypass
      - Implanter # WL bypass
      - OverwatchConsole # Requested by staff
      - GhostRoleMobSpawner # Reinforcement radios
      - DoorRemote # Requested by staff
      - NukeDisk # Might be abusable in some way, who knows.
      - ThiefUndeterminedBackpack # no stashing an entire fucking judge/overseer modsuit or spasaka/TARKHAN/MARSOC kit
      - AccessOverrider # Access configs can bypass the ID card storage.
      - Pda # See above
      - Pill # Bypasses reagent storage
      - MachineBoard # lets you lockbox TSF servers and shit :face_holding_back_tears:
      - Flatpack # ditto
      tags:
      - Unstashable
      - SafetyDepositBlacklist
  # Refused like the blacklist, unless named below. Allowed items are stored bare: their contents are handed back on
  # deposit, all but a hardsuit's own helmet.
  - type: SafetyDepositAllowList
    restricted:
      components:
      - Currency # Balance; thalers are allowed below, faction scrip (FMC, doubloons, LPCs, TC) is not
      - Storage # Prevent recursion
      - Contraband # items exchangeable for FMC or DC. this also includes a large portion of faction gear which shouldn't be persistent for balance reasons
      - ContainerContainer # WL bypass.
      - SolutionContainerManager # Requested by staff + lets you do crazy crazy shit that shouldn't be allowed gameplay wise (such as storing 6ku of letoferol)
    stacks:
    - Credit # thalers
    prototypes:
    # Tier 1 faction suits and armour: what each faction's first equipment research prints.
    - ClothingOuterHardsuitM82b # TSF
    - ClothingOuterHardsuitM82c # TSF
    - ClothingOuterHardsuitUsspL10 # USSP
    - ClothingOuterHardsuitUsspL10A # USSP
    - ClothingOuterHardsuitPirateScaf # PDV
    - ClothingOuterVestWeb # PDV
    - ClothingOuterVestWebElite # PDV
  - type: SafetyDepositBox
  - type: Appearance
  - type: Tag
    tags:
    - SafetyDepositBox

- type: entity
  id: SafetyDepositBoxSmall
  name: safety deposit box (small)
  description: A small secure box for storing valuables. Holds a 4x3 grid of items up to normal size.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WG/SafetyDepositBox/Objects/Economy/depositboxsmall.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SafetyDepositBox
    cost: 2000000
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,2

- type: entity
  id: SafetyDepositBoxMedium
  name: safety deposit box (medium)
  description: A medium secure box for storing valuables. Holds a 6x4 grid, room for one suit or armour vest.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WG/SafetyDepositBox/Objects/Economy/depositboxmedium.rsi
    state: icon
  - type: Item
    size: Huge
  - type: SafetyDepositBox
    cost: 3500000
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,5,3

- type: entity
  id: SafetyDepositBoxLarge
  name: safety deposit box (large)
  description: A large secure box for storing valuables. Holds a 9x4 grid, room for two suits or armour vests.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WG/SafetyDepositBox/Objects/Economy/depositboxlarge.rsi
    state: icon
  - type: Item
    size: Huge
  - type: SafetyDepositBox
    cost: 5000000
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,8,3

- type: entity
  id: SafetyDepositConsole
  name: safety deposit box console
  description: "A console for purchasing and managing safety deposit boxes."
  parent: BaseStructure
  components:
  - type: Sprite
    netsync: false
    noRot: true
    sprite: _WG/SafetyDepositBox/Structures/Machines/atm/depositatm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: SafetyDepositConsole
    smallBoxProto: SafetyDepositBoxSmall
    mediumBoxProto: SafetyDepositBoxMedium
    largeBoxProto: SafetyDepositBoxLarge
    boxSlot:
      name: safety-deposit-console-boxSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        tags:
        - SafetyDepositBox
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      safety-deposit-console-boxSlot: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.SafetyDepositConsoleUiKey.Key
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.SafetyDepositConsoleUiKey.Key:
        type: SafetyDepositConsoleBoundUserInterface
  - type: Anchorable
  - type: Pullable
