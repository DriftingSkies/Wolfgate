# ears slot, so none carries a headset. Weapons sit in the belt and back slots, which need no jumpsuit, never in a bag:
# the crew draws from slots.

- type: startingGear
  id: WGCrewAdsUnit
  equipment:
    belt: WeaponLaserGun

- type: startingGear
  id: WGCrewAdsOfficer
  equipment:
    belt: WeaponLaserGun

- type: startingGear
  id: WGCrewAdsSentry
