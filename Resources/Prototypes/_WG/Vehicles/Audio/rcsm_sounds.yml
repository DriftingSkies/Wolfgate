# The LTB shell with RCSM blast sounds: same damage numbers as RMCLTBCannon.
- type: explosion
  id: WGRcsmTankShell
  damagePerIntensity:
    types:
      Blunt: 20
      Heat: 20
      Structural: 400
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 8, 20]
  tileBreakRerollReduction: 20
  sound:
    collection: WGRcsmShellBlast
    params:
      volume: 4
  smallSound:
    collection: WGRcsmShellBlast
    params:
      volume: 2
  soundFar:
    collection: WGRcsmShellBlastFar
    params:
      volume: 4
  smallSoundFar:
    collection: WGRcsmShellBlastFar
    params:
      volume: 2

- type: entity
  parent: RMCProjectileLTBCannon
  id: WGRcsmProjectileLTBCannon
  categories: [ HideSpawnMenu, WGVehicles ]
  components:
  - type: Explosive
    explosionType: WGRcsmTankShell
  # Forced, so the hit is a shell strike rather than the target's own small-arms clink. Plays even where a safe zone
  # stops the blast.
  - type: Projectile
    soundHit:
      collection: WGRcsmShellImpact
      params:
        volume: 4
        maxDistance: 24
    forceSound: true

- type: entity
  parent: VehicleCartridgeLTBCannon
  id: WGRcsmCartridgeLTBCannon
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: WGRcsmProjectileLTBCannon

# The PMC armed loadout's guns with RCSM sounds.
- type: entity
  parent: VehicleTankLTBCannon
  id: WGVehicleTankLTBCannonRcsm
  categories: [ HideSpawnMenu, WGVehicles ]
  components:
  - type: Gun
    soundGunshot:
      path: /Audio/_WG/Vehicles/RCSM/weapons/tank_fire_122mm.ogg
      params:
        volume: 2
        maxDistance: 28
  - type: BallisticAmmoProvider
    proto: WGRcsmCartridgeLTBCannon
  - type: WGGunExtraSounds
    distantSound:
      collection: WGRcsmHeavyCannonFar
    # A manual loader's cycle, fitted to the cannon's 20 s between shots: breech opens and drops the case stub, the
    # ammo door opens, the round comes out of the rack, gets rammed, and the breech closes as the gun comes ready.
    loadingSequence:
    # Recoil and breech clatter right behind the bang.
    - delay: 0.05
      sound:
        collection: WGRcsmCannonMech
        params:
          maxDistance: 12
    - delay: 0.8
      sound:
        collection: WGRcsmBreechOpen
        params:
          maxDistance: 10
    - delay: 1.4
      sound:
        collection: WGRcsmStubDrop
        params:
          volume: -3
          maxDistance: 8
    - delay: 4.5
      sound:
        collection: WGRcsmAmmoDoor
        params:
          maxDistance: 10
    - delay: 7
      sound:
        collection: WGRcsmRoundHandle
        params:
          maxDistance: 8
    - delay: 11
      sound:
        collection: WGRcsmAmmoDoor
        params:
          volume: -2
          maxDistance: 10
    - delay: 14.5
      sound:
        collection: WGRcsmRam
        params:
          maxDistance: 10
    - delay: 17.5
      sound:
        collection: WGRcsmCannonReload
        params:
          maxDistance: 10

- type: entity
  parent: VehicleTankRERE700
  id: WGVehicleTankRERE700Rcsm
  categories: [ HideSpawnMenu, WGVehicles ]
  components:
  - type: Gun
