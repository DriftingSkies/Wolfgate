# Hemophage cuisine, ported from Meridian Rift: blood dishes a hemophage's tumor keeps down, the Bloodshot cocktail,
# and Taste Suppressor, which stops the tumor rejecting ordinary food for a while.

- type: entity
  parent: FoodInjectableBase
  id: WGFoodHemophageBase
  abstract: true
  components:
  - type: Sprite
    sprite: _WG/MeridianTraits/hemophage_food.rsi
  - type: Item
    size: Small
  - type: Tag
    tags:
    - WGBloodyFood
    - Meat

- type: entity
  parent: WGFoodHemophageBase
  id: WGFoodBloodRiceRaw
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/bowl.rsi
    state: rice
    color: "#810000"
  - type: FlavorProfile
    flavors:
    - rice
    - metallic
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Blood
          Quantity: 10

- type: entity
  parent: WGFoodHemophageBase
  id: WGFoodBloodRicePearl
  components:
  - type: Sprite
    state: blood_rice_pearl
  - type: FlavorProfile
    flavors:
    - rice
    - metallic
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Blood
          Quantity: 10
        - ReagentId: Flavorol
          Quantity: 4

- type: entity
  parent: WGFoodHemophageBase
  id: WGFoodBloodNoodles
  components:
  - type: Sprite
    state: bloodles
  - type: FlavorProfile
    flavors:
    - metallic
    - pasta
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Blood
          Quantity: 20
        - ReagentId: Flavorol
          Quantity: 4

- type: entity
  parent: WGFoodHemophageBase
  id: WGFoodBoatNoodles
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
    state: meatball
    color: "#d10000"
  - type: FlavorProfile
    flavors:
    - metallic
    - WGCongealedBlood
    - pasta
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 80
        reagents:
        - ReagentId: Protein
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 10
        - ReagentId: Blood
          Quantity: 50
        - ReagentId: Flavorol
          Quantity: 10

- type: entity
  parent: WGFoodHemophageBase
  id: WGFoodBloodCurd
  components:
  - type: Sprite
    state: blood_curd
  - type: FlavorProfile
    flavors:
    - WGCongealedBlood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Protein
          Quantity: 5
        - ReagentId: Blood
          Quantity: 15

- type: entity
  parent: WGFoodHemophageBase
  id: WGFoodBloodCake
  components:
  - type: Sprite
    state: blood_cake
  - type: FlavorProfile
    flavors:
    - metallic
    - rice
    - nutty
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: Blood
          Quantity: 25
        - ReagentId: Flavorol
          Quantity: 8

- type: entity
  parent: FoodBowlBase
  id: WGFoodBloodSoup
  components:
  - type: Sprite
    sprite: _WG/MeridianTraits/hemophage_food.rsi
    layers:
    - state: blood_soup
  - type: FlavorProfile
    flavors:
    - metallic
    - WGCongealedBlood
    - spicy
    - sour
    - garlic
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 90
        reagents:
        - ReagentId: Protein
          Quantity: 10
        - ReagentId: Blood
          Quantity: 60
        - ReagentId: Flavorol
          Quantity: 12
  - type: Tag
    tags:
    - WGBloodyFood
    - Soup

- type: flavor
  id: WGCongealedBlood
  flavorType: Complex
  description: wg-flavor-complex-congealed-blood

- type: flavor
  id: WGBloodshot
  flavorType: Complex
  description: wg-flavor-complex-bloodshot

- type: flavor
  id: WGBloodshotBase
  flavorType: Complex
  description: wg-flavor-complex-bloodshot-base

# Reagents

- type: reagent
  id: WGBloodshotBase
  name: reagent-name-wg-bloodshot-base
  parent: BaseAlcohol
  desc: reagent-desc-wg-bloodshot-base
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: WGBloodshotBase
  color: "#c29ca1"
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.07

- type: reagent
  id: WGBloodshot
  name: reagent-name-wg-bloodshot
  parent: BaseAlcohol
  desc: reagent-desc-wg-bloodshot
  physicalDesc: reagent-physical-desc-ferrous
  flavor: WGBloodshot
  color: "#a30000"
  metamorphicSprite:
    sprite: _WG/MeridianTraits/bloodshot_glass.rsi
    state: icon
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.06
      - !type:ModifyBloodLevel
        amount: 1.8

- type: reagent
  id: WGTasteSuppressor
  name: reagent-name-wg-taste-suppressor
  group: Medicine
  desc: reagent-desc-wg-taste-suppressor
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#c8c8c8"
  metabolisms:
    Medicine:
      metabolismRate: 0.25
      effects:
      - !type:WGSuppressTaste

# Reactions

- type: reaction
  id: WGBloodshotBase
  requiredMixerCategories:
  - Stir
  reactants:
    BloodyMary:
      amount: 1
    Sugar:
      amount: 1
  products:
    WGBloodshotBase: 2

- type: reaction
  id: WGBloodshot
  requiredMixerCategories:
  - Stir
  reactants:
    Blood:
      amount: 3
    WGBloodshotBase:
      amount: 2
  products:
    WGBloodshot: 5

- type: reaction
  id: WGTasteSuppressor
  reactants:
    Sodium:
      amount: 1
    Sulfur:
      amount: 1
    Water:
      amount: 1
  products:
    WGTasteSuppressor: 3

- type: reaction
  id: WGTasteSuppressorSalt
  minTemp: 300
  reactants:
    Sulfur:
      amount: 1
    TableSalt:
      amount: 1
  products:
    WGTasteSuppressor: 3
    Chlorine: 1

- type: reaction
  id: WGUncookedBloodRice
  impact: Low
  quantized: true
  conserveEnergy: false
  reactants:
    Rice:
      amount: 10
    Blood:
      amount: 20
  effects:
  - !type:CreateEntityReactionEffect
    entity: WGFoodBloodRiceRaw

# Recipes

- type: microwaveMealRecipe
  id: WGRecipeBloodRicePearl
  name: wg-recipe-blood-rice-pearl
  result: WGFoodBloodRicePearl
  time: 5
  group: Savory
  solids:
    WGFoodBloodRiceRaw: 1
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WGRecipeBloodCurd
  name: wg-recipe-blood-curd
  result: WGFoodBloodCurd
  time: 5
  group: Savory
  reagents:
    Blood: 20
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WGRecipeBloodNoodles
  name: wg-recipe-blood-noodles
  result: WGFoodBloodNoodles
  time: 5
  group: Pasta
  solids:
    FoodNoodlesBoiled: 1
  reagents:
    Blood: 20
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WGRecipeBoatNoodles
  name: wg-recipe-boat-noodles
  result: WGFoodBoatNoodles
  time: 10
  group: Pasta
  solids:
    WGFoodBloodNoodles: 1
    WGFoodBloodCurd: 1
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WGRecipeBloodCake
  name: wg-recipe-blood-cake
  result: WGFoodBloodCake
  time: 10
  group: Dessert
  solids:
    FoodRiceBoiled: 1
  reagents:
    Blood: 20
    Sugar: 5
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WGRecipeBloodSoup
  name: wg-recipe-blood-soup
  result: WGFoodBloodSoup
  time: 15
  group: Soup
  solids:
    FoodBowlBig: 1
    WGFoodBloodCurd: 1
    FoodChiliPepper: 1
    FoodGarlic: 1
  reagents:
    Blood: 20
    Vinegar: 10
  recipeType:
  - Oven
  - Microwave
