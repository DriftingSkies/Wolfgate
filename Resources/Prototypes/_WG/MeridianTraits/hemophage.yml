    state: blood0
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood1
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood2
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood3
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood4
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood5
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood6
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood7
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood8
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: blood9
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
