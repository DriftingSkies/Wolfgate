- type: alert
  id: WGHemophageSatiated
  icons:
  - sprite: /Textures/Interface/Alerts/bleed.rsi
    state: bleed10
  name: wg-alert-hemophage-satiated-name
  description: wg-alert-hemophage-satiated-desc

- type: alert
  id: WGHemophageRegen
  icons:
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: hemokinetic_regen
  name: wg-alert-hemophage-regen-name
  description: wg-alert-hemophage-regen-desc

- type: alert
  id: WGHemophageMaster
  icons:
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: master_of_the_house
  name: wg-alert-hemophage-master-name
  description: wg-alert-hemophage-master-desc

- type: alert
  id: WGHemophageSlave
  icons:
  - sprite: /Textures/_WG/MeridianTraits/hemophage_alerts.rsi
    state: slave_to_the_tumor
  name: wg-alert-hemophage-slave-name
  description: wg-alert-hemophage-slave-desc

# Mail goodie: Meridian sends a hemophage a blood bag now and then. Four packs are about one Meridian bag of blood.
- type: entity
  parent: Bloodpack
  id: WGBloodpack4
  suffix: 4
  components:
  - type: Stack
    count: 4

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseMail
  id: WGMailHemophageBlood
  suffix: hemophage blood
  components:
  - type: Mail
    contents:
    - id: WGBloodpack4
