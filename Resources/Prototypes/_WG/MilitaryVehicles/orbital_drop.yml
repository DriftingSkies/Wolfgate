# Orbital drop beacons (WGOrbitalDropSystem): set off on a planet's open ground, outdoors, and twenty seconds later the
# chassis drops from orbit onto the spot, with its key handed to whoever set it off. An unused beacon resells for 75% of
# the lower of the vehicle's value and the beacon's listing.

# The station counter's drops and the military repair kit (capture.yml), handed over the counter. Each drop costs more
# than its chassis appraises for, parts included (OrbitalDropTest), so none sells at a profit.
- type: wgVehicleCatalog
  id: WGMilitaryCatalogDrops
  vehicles:
  - vehicle: WGOrbitalDropBeaconAPC
    price: 65000
    licence: true
  - vehicle: WGOrbitalDropBeaconAev
    price: 100000
    licence: true
  - vehicle: WGOrbitalDropBeaconTank
    price: 140000
    licence: true
  - vehicle: WGMilitaryRepairKit
    price: 9000

- type: entity
  parent: WGVehicleBeaconBase
  id: WGOrbitalDropBeaconBase
  abstract: true
  name: orbital drop beacon
  description: Calls a vehicle down from orbit. Set it off on open ground under the sky and stand well back.
  components:
  - type: Sprite
    sprite: Objects/Tools/thief_beacon.rsi
    noRot: true
    color: "#ffb36b"
    layers:
    - state: folded_extraction
      map: [ "beacon" ]
    - state: extraction_point_light
      map: [ "light" ]
      shader: unshaded
      visible: false

- type: entity
  parent: WGOrbitalDropBeaconBase
  id: WGOrbitalDropBeaconAPC
  name: orbital drop beacon (APC)
  components:
  - type: WGOrbitalDropBeacon
    vehicle: VehicleAPC
    catalog: WGMilitaryCatalogDrops

- type: entity
  parent: WGOrbitalDropBeaconBase
  id: WGOrbitalDropBeaconTank
  name: orbital drop beacon (tank)
  components:
  - type: WGOrbitalDropBeacon
    vehicle: WGMilitaryChassisTank
    catalog: WGMilitaryCatalogDrops

- type: entity
  parent: WGOrbitalDropBeaconBase
  id: WGOrbitalDropBeaconAev
  name: orbital drop beacon (AEV)
  components:
  - type: WGOrbitalDropBeacon
    vehicle: VehicleAev
    catalog: WGMilitaryCatalogDrops
