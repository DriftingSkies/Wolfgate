- type: wgCrewProfile
  id: WGCrewProfilePirate
  firstNames: WGNamesPirateFirst
  lastNames: WGNamesPirateLast
  # Pirates never fly durasteel: any durasteel plating is swapped for plain plastitanium when they crew a hull.
  hullSwaps:
    WGWallDurasteel: WallPlastitanium
    WGWallDurasteelDiagonal: WallPlastitaniumDiagonal
    WGWallDurasteelCapital: WallPlastitaniumCapital
    WGWallDurasteelDiagonalCapital: WallPlastitaniumDiagonalCapital
  components:
  - type: PirateAccent
  # Reavers cut organs out of the downed instead of killing, and steal till hit when they board.
  - type: WGNpcIntent
    set: WGIntentsReaver
    boarder: true
  - type: WGCrewSuitUp
  - type: PressureImmunity
  - type: BreathingImmunity
  bodies:
  - WGMobCrewBodyHuman
  - WGMobCrewBodyHuman
  - WGMobCrewBodyReptilian
  - WGMobCrewBodyReptilian
  - WGMobCrewBodyDwarf
  - WGMobCrewBodyVulpkanin
  - WGMobCrewBodyTajaran
  - WGMobCrewBodyRodentia
  - WGMobCrewBodyArachnid
  - WGMobCrewBodyMoth
  skills: [ Green, Regular, Regular, Veteran ]
  loadouts:
    WGCrewDeckhand: [ WGCrewPirateHand, WGCrewPirateHand, WGCrewPirateBruiser, WGCrewPirateRifle ]
    WGCrewEngineer: [ WGCrewPirateHand ]
    WGCrewMarine: [ WGCrewPirateRifle, WGCrewPirateBruiser ]
    WGCrewPilot: [ WGCrewPirateOfficer ]
    WGCrewRadioOperator: [ WGCrewPirateOfficer ]
    WGCrewCaptain: [ WGCrewPirateOfficer ]
    WGCrewGunner: [ WGCrewPirateOfficer, WGCrewPirateHand ]
  # Hands are the crew's least seasoned, officers its most (WGCrewSkills).
  skillOffsets:
    WGCrewPirateHand: -1
    WGCrewPirateOfficer: 1

