  duty: Guard
  engagement: WhenAttacked
  title: wg-crew-role-engineer
  order: 35
  components:
  - type: WGCrewEngineer

# Mops up puddles and washes dirt off the floors across the ship, back at his post when it's clean.
- type: wgCrewRole
  id: WGCrewJanitor
  kit: WGCrewKitJanitor
  mob: WGMobCrewJanitor
  duty: Janitor
