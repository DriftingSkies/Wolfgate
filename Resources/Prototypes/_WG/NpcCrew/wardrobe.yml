# Some wear their colours: a pride pin on the collar. (Not the surgeon, whose stethoscope hangs there.)
- type: wgCrewWardrobe
  id: WGCrewWardrobePins
  roles: [ WGCrewDeckhand, WGCrewEngineer, WGCrewMarine, WGCrewPilot, WGCrewRadioOperator, WGCrewGunner, WGCrewCaptain,
           WGCrewJanitor, WGCrewParamedic, WGCrewChef, WGCrewBartender ]
  slots:
    neck:
      chance: 0.12
      items:
      - ClothingNeckLGBTPin
      - ClothingNeckGayPin
      - ClothingNeckLesbianPin
      - ClothingNeckBisexualPin
      - ClothingNeckTransPin
      - ClothingNeckPansexualPin
      - ClothingNeckAsexualPin
      - ClothingNeckAromanticPin
      - ClothingNeckNonBinaryPin
      - ClothingNeckIntersexPin
