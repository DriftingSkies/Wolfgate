# Canvases are painted pixel by pixel with a crayon or a paint palette held, then finished under a title.
- type: entity
  abstract: true
  parent: BaseItem
  id: WGBaseCanvas
  name: canvas
  description: A blank canvas. Hold a crayon or a paint palette and use it on the canvas to paint.
  components:
  - type: Item
    size: Small
  - type: ActivatableUI
    key: enum.WGCanvasUiKey.Key
  - type: UserInterface
    interfaces:
      enum.WGCanvasUiKey.Key:
        type: WGCanvasBoundUserInterface
  - type: StaticPrice
    price: 5
    vendPrice: 40

- type: entity
  parent: WGBaseCanvas
  id: WGCanvas11x11
  suffix: 11x11
  components:
  - type: Sprite
    sprite: _WG/Paintings/canvas.rsi
    layers:
    - state: 11x11
      map: ["enum.WGPaintingVisualLayers.Canvas"]
    - state: 11x11
      map: ["enum.WGPaintingVisualLayers.Art"]
      visible: false
    - state: 11x11-wip
      map: ["enum.WGPaintingVisualLayers.Wip"]
      visible: false
  - type: WGCanvas
    width: 11
    height: 11

