- type: entity
  parent: BaseItem
  id: WGPaintPalette
  name: paint palette
  description: Paints any colour on a canvas. Colours can be saved on it, and it remembers the ones used last.
  components:
  - type: Sprite
    sprite: _WG/Paintings/palette.rsi
    state: palette
  - type: Item
    size: Small
  - type: WGPaintPalette
    swatches:
    - "#000000"
    - "#3F3F46"
    - "#9CA3AF"
    - "#FFFFFF"
    - "#7F1D1D"
    - "#DC2626"
    - "#F97316"
    - "#FACC15"
    - "#14532D"
    - "#22C55E"
    - "#0D9488"
    - "#3B82F6"
    - "#1E3A8A"
    - "#7E22CE"
    - "#78350F"
    - "#F5C9A0"
  - type: StaticPrice
    price: 20
    vendPrice: 150
