    children:
    - id: WGNeurowareStick
      weight: 6
    - !type:GroupSelector
      weight: 3
      children:
      - id: WGNeurowareStickWhitelineCopy
      - id: WGNeurowareStickNullLoopCopy
      - id: WGNeurowareStickBurstCopy
      - id: WGNeurowareStickIdleCopy
    - !type:GroupSelector
      weight: 1
      children:
      - id: WGNeurowareStickWhiteline
      - id: WGNeurowareStickNullLoop
      - id: WGNeurowareStickBurst
      - id: WGNeurowareStickRedline
      - id: WGNeurowareStickDamper
      - id: WGNeurowareStickChoir
      - id: WGNeurowareStickHalo
      - id: WGNeurowareStickIdle
