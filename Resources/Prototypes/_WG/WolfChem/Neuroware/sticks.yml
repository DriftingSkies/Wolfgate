# Neuroware sticks. A blank takes copies or reads a drug in; the named ones are pristine builds. Copying leaves the
# source's loads alone and costs it a tenth of its integrity, and the copy is 15% worse than the source was. A blank
# prints at the autolathe (lathe.yml) and is priced under its materials, and a stick's price doesn't follow what is
# written onto it, so neither printing nor copying prints money. A written blank becomes a narcotic at the market
# like the program base (WGNarcoticMarks), unless the program's drug is legal (Idle).

- type: entity
  parent: BaseItem
  id: WGNeurowareStick
  components:
  - type: Sprite
    sprite: _WG/WolfChem/Neuroware/Objects/stick.rsi
    layers:
    - state: body
      color: "#8c8c90"
    - state: plug
    - state: tape
      map: [ "tape" ]
      visible: false
    - state: led
      shader: unshaded
      map: [ "led" ]
      visible: false
  # A blank that takes a copy gets a strip of tape and lights up.
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WGNeurowareStickVisuals.Copied:
        tape:
          True: { visible: true }
          False: { visible: false }
        led:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Tiny
  - type: WGNeurowareStick
    loads: 0
  - type: StaticPrice
    price: 15

# A stick with a program on it.
- type: entity
  abstract: true
  parent: WGNeurowareStick
  id: WGNeurowareStickProgramLegalBase
  components:
  - type: WGNeurowareStick
    loads: 3
  - type: StaticPrice
    price: 2200

