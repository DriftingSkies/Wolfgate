  announcementSender: wg-encounter-sender-traffic
  start: Scheduled
  category: Traffic
  icon: Coins
  cost: 1
  weight: 0.5
  cooldown: 3600
  duration: 3600
  minDistance: 2000
  maxDistance: 3500
  ships:
