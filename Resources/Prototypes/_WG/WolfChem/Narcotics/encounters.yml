    navigation: WGCrewNavigationFreight
    vessel: Scallywag
    retrofit: WGPirateRetrofitGrime
    side: trader
    company: WGAshfallReavers
    profile: WGCrewProfilePirate
    captain: false
    deckhands: 0
    guards: 3
    roles: [ WGCrewPilot, WGCrewGunner, WGCrewDeckhand ]
    passengers: [ WGReaverDealer ]
    skill: Veteran
    wander: 4
    wanderRadius: 2500
    wanderPause: 300
