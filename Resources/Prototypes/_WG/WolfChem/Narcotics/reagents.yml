# Street drugs. Each one's high lives in its wgDrugProfile (profiles.yml); the reagent only doses it, so the
# neuroware twin and the reagent stay identical. Effects that need reagent args, such as sedation, stay here.
# The high follows the units left in the blood, so metabolismRate sets how long it lasts. At
# 0.01 a 2.5 u line stays about 4 minutes; crack and the combat drugs clear at 0.02.
# pricePerUnit is street value at full grade; pricing scales it by the grade.

- type: reagent
  id: WGCocaAlkaloid
  name: wg-reagent-name-coca-alkaloid
  group: Narcotics
  desc: wg-reagent-desc-coca-alkaloid
  physicalDesc: reagent-physical-desc-pungent
  flavor: bitter
  color: "#7a8f4a"
  pricePerUnit: 8
  metabolisms:
    Narcotic:
      effects:
      - !type:WGDose
        profile: WGCocaine
        perUnit: 0.2

- type: reagent
  id: WGCocaine
  name: wg-reagent-name-cocaine
