# Drug chemistry. Recipes are invented for the game. Each wgReactionPurity entry shares its reaction's ID and sets the
# temperature that gives full grade; the product's grade falls off linearly to the floor outside the tolerance.

- type: reaction
  id: WGCocaine
  minTemp: 310
  reactants:
    WGCocaAlkaloid:
      amount: 3
    SodiumCarbonate:
      amount: 1
    Acetone:
      amount: 1
  products:
    WGCocaine: 3

- type: wgReactionPurity
  id: WGCocaine
  optimalTemp: 330
  tolerance: 40
  drift: 8

# Cooked cocaine sets into rocks, one per 5 u.
- type: reaction
  id: WGCrackRock
  minTemp: 370
  reactants:
    WGCocaine:
      amount: 5
    SodiumCarbonate:
      amount: 1
    Water:
      amount: 1
  effects:
  - !type:WGCreateGradedEntity
    entity: WGCrackRock

- type: wgReactionPurity
  id: WGCrackRock
  optimalTemp: 385
  tolerance: 30
  drift: 8

- type: reaction
  id: WGHeroin
  minTemp: 330
  reactants:
    WGOpium:
      amount: 2
    Vinegar:
      amount: 1
    Ammonia:
      amount: 1
  products:
    WGHeroin: 2

- type: wgReactionPurity
  id: WGHeroin
  optimalTemp: 350
  tolerance: 30
  drift: 8

# Chilled opium sets into resin, one lump per 5 u, once water touches it. The water is a catalyst, so it can go in
# last at the right temperature and doesn't count towards the grade.
- type: reaction
  id: WGOpiumResin
  maxTemp: 270
  reactants:
    WGOpium:
      amount: 5
    Water:
      amount: 1
      catalyst: true
  effects:
  - !type:WGCreateGradedEntity
    entity: WGOpiumResin

- type: wgReactionPurity
  id: WGOpiumResin
  optimalTemp: 250
  tolerance: 30
  drift: 8

# Chilled Desoxyephedrine sets into crystal shards, one per 5 u, once acetone touches it. The acetone is a catalyst,
# like the water for resin.
- type: reaction
  id: WGCrystalShard
  maxTemp: 240
  reactants:
    Desoxyephedrine:
      amount: 5
    Acetone:
      amount: 1
      catalyst: true
  effects:
  - !type:WGCreateGradedEntity
    entity: WGCrystalShard

- type: wgReactionPurity
  id: WGCrystalShard
  optimalTemp: 220
  tolerance: 25
  drift: 8

