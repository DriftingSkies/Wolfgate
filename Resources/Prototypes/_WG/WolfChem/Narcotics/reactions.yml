# Cutting: flour stretches a powder a unit for a unit, and the grade drops to match, so the batch holds the same drug
# in more doses. Only a tester, an analyzer or the buyer's nose tells.
- type: reaction
  id: WGCutCocaine
  reactants:
    WGCocaine:
      amount: 1
    Flour:
      amount: 1
  products:
    WGCocaine: 2

- type: wgReactionPurity
  id: WGCutCocaine
  fillers: [ Flour ]

- type: reaction
  id: WGCutHeroin
  reactants:
    WGHeroin:
      amount: 1
    Flour:
      amount: 1
  products:
    WGHeroin: 2

- type: wgReactionPurity
  id: WGCutHeroin
  fillers: [ Flour ]
