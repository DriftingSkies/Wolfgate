- type: explosion
  id: WGNuclear
  damagePerIntensity:
    types:
      Heat: 8
      Blunt: 5
      Piercing: 3
      Radiation: 4
      Structural: 25
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 8, 25]
  tileBreakRerollReduction: 15
  lightColor: Orange
  fireColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  temperature: 3000

- type: shader
  id: WGNuclearBlast
  kind: source
  path: "/Textures/_WG/Warheads/Shaders/nuclear_blast.swsl"

- type: shader
  id: WGFalloutHaze
  kind: source
  path: "/Textures/_WG/Warheads/Shaders/fallout_haze.swsl"

- type: entity
  id: WGNuclearPromptRadiation
  name: radiation burst
  categories: [ HideSpawnMenu ]
  components:
  - type: RadiationSource
    intensity: 100
    slope: 0.05
  - type: TimedDespawn
    lifetime: 5

- type: entity
  id: WGNuclearFallout
  name: nuclear fallout
  description: Settled radioactive dust. Don't breathe it.
  categories: [ HideSpawnMenu ]
  components:
  # Dust in open space stays put: ships flying through don't pick it up.
  - type: Transform
    gridTraversal: false
  - type: RadiationSource
    intensity: 5
    slope: 0.15
  - type: WGFallout

- type: sinkPort
  id: WGWarheadDetonate
  name: wg-signal-port-name-warhead-detonate
  description: wg-signal-port-description-warhead-detonate

- type: sourcePort
  id: WGDeadManReleased
  name: wg-signal-port-name-deadman-released
  description: wg-signal-port-description-deadman-released
  defaultLinks: [ WGWarheadDetonate ]
