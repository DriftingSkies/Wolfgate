- type: entity
  abstract: true
  parent: BaseStructure
  id: WGBaseWarhead
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 255
        mask:
        - MachineMask
        layer:
        - HalfWallLayer
  - type: Appearance
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.WGWarheadUiKey.Key
  - type: UserInterface
    interfaces:
      enum.WGWarheadUiKey.Key:
        type: WGWarheadBoundUserInterface
      enum.WiresUiKey.Key:
        type: WGNuclearWiresBoundUserInterface
  # Disarmed only by its fuze wires: unscrew the panel, cut one of two. A multitool no longer stops it.
  - type: WiresPanel
  - type: Wires
    boardName: wg-warhead-wires-board
    layoutId: WGWarheadFuze
    alwaysRandomize: true
  - type: Anchorable
    delay: 5
  - type: Pullable
  - type: AccessReader
    access: [["SyndicateAgent"], ["NuclearOperative"]]
    breakOnAccessBreaker: false
  - type: StaticPrice
    price: 50000
  - type: CargoSellBlacklist
  - type: ArrivalsBlacklist
  - type: FTLSmashImmune
  - type: WarpPoint
    follow: true
    location: nuclear warhead
  - type: ShipyardSellCondition
    blockSale: true
    reason: shipyard-console-dangerous-materials
    allowedShipyardTypes:
    - Syndicate
    - BlackMarket

- type: entity
  parent: WGBaseWarhead
  id: WGWarheadTactical
  name: tactical demolition warhead
  description: A compact sub-kiloton device on a hand cart. Set the timer, flip the switch, walk away briskly.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Sprite
    sprite: Objects/Devices/nuke.rsi
    noRot: true
    layers:
    - state: nuclearbomb_base
    - state: nuclearbomb_deployed_unlit
      map: ["enum.WGWarheadVisuals.State"]
      shader: unshaded
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.WGWarheadVisuals.State:
        enum.WGWarheadVisuals.State:
          Safe: { visible: false }
          Armed: { visible: true, state: nuclearbomb_deployed_unlit }
          Countdown: { visible: true, state: nuclearbomb_timing }
          Final: { visible: true, state: nuclearbomb_exploding }
  - type: WGWarhead
    payload: WGPayloadTactical
    yieldClass: wg-warhead-class-tactical
    timer: 60
  - type: WGTimerFuze
    options: [ 10, 30, 60, 120, 300 ]
  - type: WGRemoteFuze
  - type: DeviceLinkSink
    ports:
    - WGWarheadDetonate

- type: entity
  parent: WGBaseWarhead
  id: WGWarheadField
  name: field nuclear warhead
  description: A wheeled multi-kiloton warhead. Two keyholders have to turn their keys together.
  components:
  - type: Sprite
    sprite: _WG/Warheads/field.rsi
    noRot: true
    layers:
    - state: nuclearbomb_base
      map: ["base"]
    - state: lights-safety
      map: ["lights"]
      shader: unshaded
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.WGWarheadVisuals.State:
        base:
          Safe: { state: nuclearbomb_base }
          Armed: { state: nuclearbomb_safetyoff }
          Countdown: { state: nuclearbomb_timing }
          Final: { state: nuclearbomb_exploding }
        lights:
          Safe: { visible: false }
          Armed: { visible: true, state: lights-safety }
          Countdown: { visible: true, state: lights-timing }
          Final: { visible: true, state: lights-exploding }
  - type: WGWarhead
    payload: WGPayloadField
    timer: 180
    yieldClass: wg-warhead-class-field
  - type: WGTimerFuze
    options: [ 60, 120, 180, 300, 600 ]
  - type: WGTwoPersonArming

- type: entity
  parent: WGBaseWarhead
  id: WGWarheadStrategic
  name: strategic nuclear device
  description: A megaton-class device on a launch cradle. It does not damage a station so much as remove it.
  components:
  - type: Sprite
    sprite: _WG/Warheads/strategic.rsi
    noRot: true
    offset: 0, 0.5
    layers:
    - state: nuke
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.95,-0.45,0.95,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - HalfWallLayer
  - type: WGWarhead
    payload: WGPayloadStrategic
    yieldClass: wg-warhead-class-strategic
    timer: 300
  - type: WGTwoPersonArming
    window: 5

- type: entity
  parent: WGBaseWarhead
  id: WGWarheadScuttleTerminal
  name: scuttling warhead terminal
  description: A ship self-destruct charge. Arm it with two keys, or take the safety off and wire it to a detonator.
  components:
  - type: Anchorable
    flags: Unanchorable
    delay: 10
  - type: Sprite
    sprite: _WG/Warheads/terminal.rsi
    noRot: true
    layers:
    - state: nuclearbomb_base
      map: ["base"]
    - state: lights-safety
      map: ["lights"]
      shader: unshaded
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.WGWarheadVisuals.State:
        base:
          Safe: { state: nuclearbomb_base }
          Armed: { state: nuclearbomb_safetyoff }
          Countdown: { state: nuclearbomb_timing }
          Final: { state: nuclearbomb_exploding }
        lights:
          Safe: { visible: false }
          Armed: { visible: true, state: lights-safety }
          Countdown: { visible: true, state: lights-timing }
          Final: { visible: true, state: lights-exploding }
  - type: WGWarhead
    payload: WGPayloadField
    timer: 120
    yieldClass: wg-warhead-class-scuttle
  - type: WGTwoPersonArming
  - type: WGRemoteFuze
    signalTimer: 30
  - type: DeviceLinkSink
    ports:
    - WGWarheadDetonate

- type: entity
  parent: BaseItem
  id: WGDeadManSwitch
  name: dead-man switch
  description: A grip trigger. Once squeezed, letting go for any reason sets off whatever it is linked to.
  components:
  - type: Sprite
    sprite: Objects/Devices/signaltrigger.rsi
    state: signaltrigger
  - type: Item
    size: Small
  - type: WGDeadManTrigger
  - type: DeviceLinkSource
    ports:
    - WGDeadManReleased
  - type: StaticPrice
    price: 500

# A warhead's fuze wires: one makes it safe, the other sets it off. Colours are random per warhead.
- type: wireLayout
  id: WGWarheadFuze
  wires:
  - !type:WGWarheadDisarmWireAction
  - !type:WGWarheadDetonateWireAction
