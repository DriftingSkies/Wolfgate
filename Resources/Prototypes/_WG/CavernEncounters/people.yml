# The people met in the caverns (WGCavernEncounterSystem lays them out). Names and descriptions are in
# Locale/en-US/_WG/CavernEncounters/encounters.ftl; they are dressed for the cavern's air by PlanetNpcGear.

- type: entity
  abstract: true
  parent: BaseMobHuman
  id: WGCavernPersonBase
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: WGCavernWalkerCompound
    blackboard:
      FollowCloseRange: !type:Single
        1.5
      FollowRange: !type:Single
        3
      IdleRange: !type:Single
        2

# Tunnel raiders: a weak gang of scavengers with shivs and pipe shotguns. They run once badly hurt.
- type: entity
  abstract: true
  parent: WGCavernPersonBase
  id: WGMobTunnelRaiderBase
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: WGCavernRaiderCompound
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: WGNpcIntent
    set: WGIntentsTunnelRaider
    holds: true
  - type: WGCavernRaider
    loot:
    - ScrapSteel
    - PartRodMetal1
  - type: WGCavernTelegraph
    sound:
      collection: WGCavernEncounterRaiderChatter
    minInterval: 15
    maxInterval: 35

- type: entity
  parent: WGMobTunnelRaiderBase
  id: WGMobTunnelRaider
  components:
  - type: Loadout
    prototypes: [ WGCavernGearRaiderShiv ]

- type: entity
  parent: WGMobTunnelRaiderBase
  id: WGMobTunnelRaiderGunner
  components:
  - type: WGNpcIntent
    set: WGIntentsBandit
    holds: true
  - type: Loadout
    prototypes: [ WGCavernGearRaiderGunner ]

- type: startingGear
  id: WGCavernGearRaiderShiv
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBrown
    mask: ClothingMaskBandBlack
    gloves: ClothingHandsGlovesFingerless
    shoes: ClothingShoesBootsWork
  inhand:
  - Shiv

- type: startingGear
  id: WGCavernGearRaiderGunner
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    head: ClothingHeadBandBlack
    outerClothing: ClothingOuterCoatJensen
    shoes: ClothingShoesBootsWork
  inhand:
  - WeaponShotgunImprovisedLoaded

# A surveyor who lost his way: wounded, he follows whoever offers to lead him out and pays them on the surface.
- type: entity
  parent: WGCavernPersonBase
  id: WGMobLostSurveyor
  components:
  - type: WGCavernSurveyor
  - type: Loadout
    prototypes: [ WGCavernGearSurveyor ]

- type: startingGear
  id: WGCavernGearSurveyor
  equipment:
    jumpsuit: ClothingUniformJumpsuitSalvageSpecialist
    head: ClothingHeadHatHardhatOrange
    outerClothing: ClothingOuterVestHazard
    shoes: ClothingShoesBootsWork

# A miner walled in by a rock fall; dig him out and he pays and walks off.
- type: entity
  parent: WGCavernPersonBase
  id: WGMobTrappedMiner
  components:
  - type: WGTrappedMiner
  - type: Loadout
    prototypes: [ WGCavernGearTrappedMiner ]

- type: startingGear
  id: WGCavernGearTrappedMiner
  equipment:
    jumpsuit: ClothingUniformJumpsuitSalvageSpecialist
    head: ClothingHeadHatHardhatYellow
    shoes: ClothingShoesBootsWork
