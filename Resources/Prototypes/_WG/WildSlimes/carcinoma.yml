# Carcinoma's wild slimes: small patches of see-through jelly on the surface, each over a slime grotto in the Gut that
# shows through it. A sparse zone noise picks where they may be and a blob noise lays the patches. The surface layers
# (from WGBiomeCarcinoma) and the cavern layers (from WGCavernBiomeCarcinoma) share both noises: the cavern's seed is
# the surface's plus 7949, so each cavern noise seed is the surface one less 7949, and lower thresholds make each grotto
# a little wider than its patch.

- type: wgWildSlimeHabitat
  id: WGWildSlimesCarcinoma
  surface: WGSurfaceCarcinoma
  breed: WGCarcinomaMutation
  babyPrototype: WGMobSlimeTranslucentBaby
  adultPrototype: WGMobSlimeTranslucentAdult
  adultChance: 0.3
  patchTemplate: WGCarcinomaSlimeZone
  patchTile: WGFloorFleshJelly
  grottoTile: WGCavernFloorFleshJelly
  minPatchTiles: 24
  surfaceSlimes: 3
  grottoSlimes: 2
  respawnDelay: 600

# The ids say "flesh" so the planet map colours the jelly as flesh.
- type: tile
  id: WGFloorFleshJelly
  parent: WGFloorFlesh
  name: tiles-wg-flesh-jelly
  sprite: /Textures/_WG/WildSlimes/Tiles/flesh_jelly.png
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true
  transparent: true
  footstepSounds:
    collection: FootstepBlood

# The grotto floor: the same jelly, solid, since nothing lies below the Gut.
- type: tile
  id: WGCavernFloorFleshJelly
  parent: WGFloorFleshJelly
  sprite: /Textures/_WG/WildSlimes/Tiles/flesh_jelly_cavern.png
  transparent: false
  indestructible: true
  deconstructTools: []
  baseTurf: ""

- type: biomeTemplate
  id: WGCarcinomaSlimeZone
  layers:
  - !type:BiomeMetaLayer
    template: WGCarcinomaSlimePatch
    threshold: 0.86
    noise: { seed: 131, noiseType: OpenSimplex2, frequency: 0.03 }

- type: biomeTemplate
  id: WGCavernSlimeZoneCarcinoma
  layers:
  - !type:BiomeMetaLayer
    template: WGCavernSlimeGrottoCarcinoma
    threshold: 0.83
    noise: { seed: -7818, noiseType: OpenSimplex2, frequency: 0.03 }

- type: biomeTemplate
  id: WGCarcinomaSlimePatch
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorFleshJelly
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFleshJelly]
    entities: [WGCarcinomaJellyMound, WGCarcinomaJellyMoundSmall]
    threshold: 0.88
    noise: { seed: 133, noiseType: OpenSimplex2, frequency: 1 }

- type: biomeTemplate
  id: WGCavernSlimeGrottoCarcinoma
  layers:
  - !type:BiomeTileLayer
    tile: WGCavernFloorFleshJelly
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WGCavernFloorFleshJelly]
    entities: [WGCavernNerveCluster]
    threshold: 0.96
    noise: { seed: 135, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGCavernFloorFleshJelly]
    entities: [WGCarcinomaJellyMound, WGCarcinomaJellyMoundSmall]
    threshold: 0.88
    noise: { seed: 134, noiseType: OpenSimplex2, frequency: 1 }

- type: entity
  id: WGCarcinomaJellyMound
  name: jelly mound
  description: A quivering heap of see-through jelly. Something small moves inside it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: _WG/WildSlimes/jelly_mound.rsi
    state: mound
    drawdepth: FloorObjects
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.7
    sprintSpeedModifier: 0.7
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/Fluids/splat.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: WGCarcinomaJellyMound
  id: WGCarcinomaJellyMoundSmall
  name: jelly blob
  description: A small wobbling lump of jelly.
  components:
  - type: Sprite
    state: blob
