# Fervidus's wild slimes: the cinder slime and the obsidian slime bred from it. They need no air, shrug off heat and fire,
# and steam and burn in water. They live in patches of see-through obsidian glass on the surface, each over a vault of the
# Cinder Vaults lit red by a magma pool. A sparse zone noise picks where they may be and a blob noise lays the patches.
# The surface layers (from WGBiomeFervidus) and the cavern layers (from WGCavernBiomeFervidus) share both noises: the
# cavern's seed is the surface's plus 7919, so each cavern noise seed is the surface one less 7919, and lower thresholds
# make each vault a little wider than its patch.

# ---- Breeds ------------------------------------------------------------------------------------------------------

- type: breed
  breedName: cinder slime
  id: WGCinderMutation
  producedExtract: WGCinderSlimeExtract
  components:
  - type: Slime
    breed: WGCinderMutation
    slimeColor: "#ff7a2a"
    defaultSlimeProto: WGMobSlimeTranslucentBaby
    maxOffspring: 4
    mutationChance: 0.1
    potentialMutations:
    - WGObsidianMutation
  # Grows and splits only in Fervidus's heat.
  - type: WGSlimeClimate
    minTemperature: 340
    maxTemperature: 480
  - type: Damageable
    damageModifierSet: WGCinderSlime
    damageContainer: Biological
  - type: BreathingImmunity
  - type: Temperature
    currentTemperature: 373.15
    heatDamageThreshold: 5000
    coldDamageThreshold: 200
    specificHeat: 42
    coldDamage:
      types:
        Cold: 1
  - type: PointLight
    radius: 2
    energy: 1.2
    color: "#ff7a2a"
    castShadows: false
  - type: Reactive
    groups:
      Flammable:
      - Touch
      Extinguish:
      - Touch
    reactions:
    - reagents:
      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPieReaction {}
    - reagents:
      - Water
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 12
      - !type:XenobioSmoke
        smokePrototype: Smoke
        duration: 3
        spreadAmount: 3
        sound:
          path: /Audio/Effects/extinguish.ogg
        probability: 0.5
      - !type:PopupMessage
        type: Local
        messages:
        - wg-cinder-slime-steam-popup
        probability: 0.25

# Bred only from cinder slimes; it breeds back to them.
- type: breed
  breedName: obsidian slime
  id: WGObsidianMutation
  producedExtract: WGObsidianSlimeExtract
  components:
  - type: Slime
    breed: WGObsidianMutation
    slimeColor: "#2a2030"
    shouldHaveShader: true
    shader: XenoMetallic
    defaultSlimeProto: WGMobSlimeTranslucentBaby
    maxOffspring: 3
    mutationChance: 0.3
    potentialMutations:
    - WGCinderMutation
  # Grows and splits only in Fervidus's heat.
  - type: WGSlimeClimate
    minTemperature: 340
    maxTemperature: 480
  - type: Damageable
    damageModifierSet: WGCinderSlime
    damageContainer: Biological
  - type: BreathingImmunity
  - type: Temperature
    currentTemperature: 373.15
    heatDamageThreshold: 5000
    coldDamageThreshold: 200
    specificHeat: 42
    coldDamage:
      types:
        Cold: 1
  - type: Reactive
    groups:
      Flammable:
      - Touch
      Extinguish:
      - Touch
    reactions:
    - reagents:
      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPieReaction {}
    - reagents:
      - Water
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 12
      - !type:XenobioSmoke
        smokePrototype: Smoke
        duration: 3
        spreadAmount: 3
        sound:
          path: /Audio/Effects/extinguish.ogg
        probability: 0.5
      - !type:PopupMessage
        type: Local
        messages:
        - wg-cinder-slime-steam-popup
        probability: 0.25

# The base slime's resistances, but heat and fire don't hurt. Water's harm ignores resistances.
- type: damageModifierSet
  id: WGCinderSlime
  coefficients:
    Blunt: 0.6
    Slash: 1.2
    Piercing: 1.2
    Heat: 0
    Cold: 1.5
    Poison: 0.8
    Cellular: 0.2

# ---- Slimes ------------------------------------------------------------------------------------------------------

# Admin and mapper spawners; neither is sold or bred from anything else.
- type: entity
  parent: MobSlimeXenobioBabyPending
  id: WGMobSlimeBabyCinder
  name: cinder slime
  components:
  - type: PendingSlimeSpawn
    basePrototype: WGMobSlimeTranslucentBaby
    breed: WGCinderMutation

- type: entity
  parent: MobSlimeXenobioBabyPending
  id: WGMobSlimeBabyObsidian
  name: obsidian slime
  components:
  - type: PendingSlimeSpawn
    basePrototype: WGMobSlimeTranslucentBaby
    breed: WGObsidianMutation

# ---- Extracts ----------------------------------------------------------------------------------------------------

# Plasma grows welding fuel and a burn salve, blood grows ore, and water bursts into flame.
- type: entity
  id: WGCinderSlimeExtract
  parent: BaseSlimeExtract
  name: cinder slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _WG/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#ff7a2a"
  - type: Reactive
    reactions:
    - reagents:
      - Plasma
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractReagent
        effects:
        - !type:XenobioAdjustSolution
          reagent: WeldingFuel
          amount: 15
        - !type:XenobioAdjustSolution
          reagent: Dermaline
          amount: 10
    - reagents:
      - Blood
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractReaction
        effects:
        - !type:XenobioSpawnEntity
          entity: SteelOre1
          number: 3
        - !type:XenobioSpawnEntity
          entity: Coal1
          number: 2
    - reagents:
      - Water
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractEvil
        effects:
        - !type:Jitter
          time: 3
          frequency: 20
        - !type:XenobioRelayNearby
          compName: Flammable
          range: 3
          effect: !type:XenobioReaction
            base: Ignite5
            once: false
  - type: Tag
    tags:
    - WGXenobiologyCinderExtract

# Plasma grows sharp obsidian, blood grows richer ore, and water bursts into a wider fire.
- type: entity
  id: WGObsidianSlimeExtract
  parent: BaseSlimeExtract
  name: obsidian slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _WG/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#2a2030"
  - type: Reactive
    reactions:
    - reagents:
      - Plasma
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractReaction
        effects:
        - !type:XenobioSpawnEntity
          entity: WGShardObsidian
          number: 4
    - reagents:
      - Blood
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractReaction
        effects:
        - !type:XenobioSpawnEntity
          entity: GoldOre1
          number: 2
        - !type:XenobioSpawnEntity
          entity: SilverOre1
          number: 2
    - reagents:
      - Water
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractEvil
        effects:
        - !type:Jitter
          time: 3
          frequency: 20
        - !type:XenobioRelayNearby
          compName: Flammable
          range: 5
          effect: !type:XenobioReaction
            base: Ignite5
            once: false
  - type: Tag
    tags:
    - WGXenobiologyObsidianExtract

# A shard of black volcanic glass, sharper than window glass; weld it into a glass sheet.
- type: entity
  parent: ShardGlass
  id: WGShardObsidian
  name: obsidian shard
  description: A wicked sliver of black volcanic glass.
  components:
  - type: Sprite
    color: "#3a2c44"
  - type: DamageUserOnTrigger
    damage:
      types:
        Piercing: 6
  - type: MeleeWeapon
    damage:
      types:
        Slash: 6

- type: Tag
  id: WGXenobiologyCinderExtract

- type: Tag
  id: WGXenobiologyObsidianExtract

- type: xenobiologyBounty
  id: WGBountyCinderExtract
  pointsAwarded: 15000
  entries:
  - name: bounty-item-wg-cinder-extract
    amount: 1
    whitelist:
      tags:
      - WGXenobiologyCinderExtract

- type: xenobiologyBounty
  id: WGBountyObsidianExtract
  pointsAwarded: 40000
  entries:
  - name: bounty-item-wg-obsidian-extract
    amount: 1
    whitelist:
      tags:
      - WGXenobiologyObsidianExtract

# ---- Habitat -----------------------------------------------------------------------------------------------------

- type: wgWildSlimeHabitat
  id: WGWildSlimesFervidus
  surface: WGSurfaceFervidus
  breed: WGCinderMutation
  babyPrototype: WGMobSlimeTranslucentBaby
  adultPrototype: WGMobSlimeTranslucentAdult
  adultChance: 0.3
  patchTemplate: WGFervidusSlimeZone
  patchTile: WGFloorFervidusObsidianGlass
  grottoTile: WGCavernFloorFervidusObsidianGlass
  minPatchTiles: 24
  surfaceSlimes: 3
  grottoSlimes: 2
  respawnDelay: 600

# The ids name no colouring word, so the planet map reads the glass as rock like the ash crust round it.
- type: tile
  id: WGFloorFervidusObsidianGlass
  parent: WGFloorFervidusAshRock
  name: tiles-wg-fervidus-obsidian-glass
  sprite: /Textures/_WG/WildSlimes/Fervidus/obsidian_glass.png
  variants: 8
  placementVariants: [1, 1, 1, 1, 1, 1, 1, 1]
  weather: true
  transparent: true

# The vault floor: the same glass, solid, since nothing lies below the Cinder Vaults.
- type: tile
  id: WGCavernFloorFervidusObsidianGlass
  parent: WGFloorFervidusObsidianGlass
  sprite: /Textures/_WG/WildSlimes/Fervidus/obsidian_glass_cavern.png
  transparent: false
  indestructible: true
  deconstructTools: []
  baseTurf: ""

- type: biomeTemplate
  id: WGFervidusSlimeZone
  layers:
  - !type:BiomeMetaLayer
    template: WGFervidusSlimePatch
    threshold: 0.86
    noise: { seed: 231, noiseType: OpenSimplex2, frequency: 0.03 }

- type: biomeTemplate
  id: WGCavernSlimeZoneFervidus
  layers:
  - !type:BiomeMetaLayer
    template: WGCavernSlimeGrottoFervidus
    threshold: 0.83
    noise: { seed: -7688, noiseType: OpenSimplex2, frequency: 0.03 }

# Glass with obsidian rubble, ember lichen and the odd orange crystal on it.
- type: biomeTemplate
  id: WGFervidusSlimePatch
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorFervidusObsidianGlass
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusObsidianGlass]
    entities: [TGMCObsidian]
    threshold: 0.9
    noise: { seed: 233, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusObsidianGlass]
    entities: [WGCavernEmberLichen]
    threshold: 0.94
    noise: { seed: 234, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusObsidianGlass]
    entities: [CrystalOrange]
    threshold: 0.97
    noise: { seed: 235, noiseType: OpenSimplex2, frequency: 1 }

# The vault: glass round a magma pool that lights it red, with ember lichen and rubble.
- type: biomeTemplate
  id: WGCavernSlimeGrottoFervidus
  layers:
  - !type:BiomeTileLayer
    tile: WGCavernFloorFervidusObsidianGlass
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WGCavernFloorFervidusObsidianGlass]
    entities: [TGMCObsidian]
    threshold: 0.92
    noise: { seed: 236, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGCavernFloorFervidusObsidianGlass]
    entities: [WGCavernEmberLichen]
    threshold: 0.9
    noise: { seed: 237, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGCavernFloorFervidusObsidianGlass]
    entities: [FloorLavaEntity]
    threshold: 0.6
    noise: { seed: 238, noiseType: OpenSimplex2, frequency: 0.12 }
