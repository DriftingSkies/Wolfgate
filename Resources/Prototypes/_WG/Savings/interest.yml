# Savings interest, paid at round end to each account that played at least minimumTime and ended the round alive
# (in its body or gone to cryo). One payout per account, on at most balanceCap of its savings.
- type: wgSavingsInterest
  id: Default
  rate: 0.02
  balanceCap: 10000000 # 200,000 a round at most
  minimumTime: 30m
