  - type: WGPlanetFaunaSpawner
    table: WGFaunaAerumnaHive

# The planet-wide mix wrecks use; the biome places the per-region spawners in Life/thrascias.yml.
- type: entityTable
  id: WGFaunaThrascias
  table: !type:GroupSelector
    children:
    - id: MobArgocyteSlurva
      weight: 4
    - id: WGMobThrasciasPenguin
      weight: 3
    - id: WGMobThrasciasSnowFox
      weight: 2
    - id: MobArgocyteBarrier
      weight: 2
    - id: WGMobThrasciasFrostBear
      weight: 1

- type: entity
  id: WGFaunaThrascias
  parent: MarkerBase
  name: thrascias wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WGPlanetFaunaSpawner
    table: WGFaunaThrascias



# Heat-adapted native; retains normal combat damage and AI.
- type: entity
  id: WGMobArgocyteSlurvaBasalt
  parent: MobArgocyteSlurva
  suffix: Fervidus
  components:
  - type: Temperature
    heatDamageThreshold: 500
    coldDamageThreshold: 0
    currentTemperature: 373.15

