# The hive's own: nothing but xenos, thick on the hive ground.
- type: entityTable
  id: WGFaunaAerumnaHive
  table: !type:GroupSelector
    children:
    - id: MobXenoRunner
      weight: 5
    - id: MobXenoDrone
      weight: 4
    - id: MobXenoSpitter
      weight: 1

- type: entity
