# Sparse ambient wildlife.
# Table spawners produce mobile animals; placing mobs directly in a biome layer would anchor them.

- type: entityTable
  id: WGFaunaAsclepiu
  table: !type:GroupSelector
    children:
    - id: MobFox
      weight: 4
    - id: MobLizard
      weight: 3
    - id: MobCrab
      weight: 2
    - id: MobSnake
      weight: 1

- type: entity
  id: WGFaunaAsclepiu
  parent: MarkerBase
  name: asclepiu wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WGPlanetFaunaSpawner
    table: WGFaunaAsclepiu

- type: entityTable
  id: WGFaunaFervidus
  table: !type:GroupSelector
    children:
    # A bird flock (_WG/Birds); the leader spawns the rest.
    - id: WGMobBirdAshHawk
      weight: 2
    - id: WGMobArgocyteSlurvaBasalt
      weight: 6
    - id: WGMobArgocyteCrawlerBasalt
      weight: 3
    - id: WGMobArgocyteSwiperBasalt
      weight: 1

- type: entity
  id: WGFaunaFervidus
  parent: MarkerBase
  name: fervidus wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WGPlanetFaunaSpawner
    table: WGFaunaFervidus

# The table is in Life/aerumna.yml, with the other regions'.
- type: entity
  id: WGFaunaAerumna
  parent: MarkerBase
