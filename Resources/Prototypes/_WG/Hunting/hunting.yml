# Butchery, cooking and preserving.

- type: wgChopRecipe
  id: WGChopGameMeat
  tags: [ WGGameMeat ]
  result: WGFoodMeatMince
  count: 2

- type: wgCookRecipe
  id: WGCookGameSteakFry
  method: Fry
  tags: [ WGGameMeat ]
  result: WGFoodGameSteak
  seconds: 25

# Tough meat fried fast comes out chewy; roast it or stew it instead.
- type: wgCookRecipe
  id: WGCookToughFry
  method: Fry
  tags: [ WGMeatTough ]
  result: WGFoodChewySteak
  seconds: 25
  priority: 10

- type: wgCookRecipe
  id: WGCookPrimeFry
  method: Fry
  tags: [ WGPrizedCut ]
  result: WGFoodPrimeSteak
  seconds: 30
  priority: 20

- type: wgCookRecipe
  id: WGCookPrimeBake
  method: Bake
  tags: [ WGPrizedCut ]
  result: WGFoodPrimeSteak
  seconds: 50
  priority: 20

# Rendering fat into tallow.
- type: wgCookRecipe
  id: WGCookRenderFat
  method: Bake
  inputs: [ WGFat ]
  result: WGTallow
  seconds: 30

# Offal stews: liver and onion, and the hunter's heart stew.
- type: reagent
  id: WGSoupLiverOnion
  name: reagent-name-wg-soup-liveronion
  desc: reagent-desc-wg-soup-liveronion
  group: Foods
  physicalDesc: reagent-physical-desc-wg-soup
  flavor: savory
  color: "#6A3A28"
  metabolisms:
    Food:
      effects:
      - !type:SatiateHunger
        factor: 2
      - !type:WGMealBuff
        traits: [ Hearty, Fortifying ]
        strength: 1.25
        minutes: 15
      - !type:WGMendOrgans
        amount: 0.12
        favours: [ liver ]
  pricePerUnit: 4

- type: reagent
  id: WGSoupHuntersHeart
  name: reagent-name-wg-soup-huntersheart
  desc: reagent-desc-wg-soup-huntersheart
  group: Foods
  physicalDesc: reagent-physical-desc-wg-soup
  flavor: savory
  color: "#7A2A20"
  metabolisms:
    Food:
      effects:
      - !type:SatiateHunger
        factor: 2
      - !type:WGMealBuff
        traits: [ Hearty, Brawny, Warming ]
        strength: 1.25
        minutes: 15
      - !type:WGMendOrgans
        amount: 0.12
        favours: [ heart ]
  pricePerUnit: 4

- type: wgStewRecipe
  id: WGStewLiverOnion
  combine:
  - ids: [ WGOffalLiver ]
    count: 1
  - ids: [ WGFoodOnionSliced ]
    count: 1
  soup: WGSoupLiverOnion
  seconds: 80

- type: wgStewRecipe
  id: WGStewHuntersHeart
  combine:
  - ids: [ WGOffalHeart ]
    count: 1
  - ids: [ WGFoodPotatoSliced ]
    count: 1
  soup: WGSoupHuntersHeart
  seconds: 90

- type: wgCookRecipe
  id: WGCookGameSteakBake
  method: Bake
  tags: [ WGGameMeat ]
  result: WGFoodGameSteak
  seconds: 40

- type: wgProcessRecipe
  id: WGSmokeJerky
  machine: SmokingRack
  tags: [ WGGameMeat ]
  inputs: [ FoodMeat, FoodMeatBear ]
  minutes: 8
  keepQuality: false
  outputs:
  - id: WGFoodJerky
    count: 2

- type: wgProcessRecipe
  id: WGSmokeFish
  machine: SmokingRack
  inputs: [ WGFoodFishFillet ]
  minutes: 6
  keepQuality: false
  outputs:
  - id: WGFoodDriedFish

- type: wgProcessRecipe
  id: WGTanLeather
  machine: TanningRack
  tags: [ WGPelt ]
  minutes: 12
  keepQuality: false
  outputs:
  - id: WGLeather
    count: 2

- type: wgProcessRecipe
  id: WGMixBoneMeal
  machine: NutrientMixer
  inputs: [ WGBone ]
  minutes: 5
  keepQuality: false
  outputs:
  - id: WGFertilizerQuality

- type: entity
  parent: WGProcessorBase
  id: WGHuntSmokingRack
  name: smoking rack
  description: Smokes meat into jerky and fish into dried fish that keep for a long trip. No power needed.
  components:
  - type: Construction
    graph: WGHuntSmokingRackGraph
    node: built
  - type: Sprite
    sprite: _WG/Hunting/props.rsi
    layers:
    - state: smoking_rack
    - state: smoking_rack_working
      map: [ "drying" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WGProcessorVisuals.Working:
        drying:
          True: { visible: true }
          False: { visible: false }
  - type: WGProcessor
    machine: SmokingRack
  - type: StaticPrice
    price: 60
  - type: GuideHelp
    guides:
    - WGHunting

