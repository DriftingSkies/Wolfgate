# The Remade in the open sector: a Scion to find, the Choir who guard it, and a freighter already lost to it.

# The Choir are friends of the Remade and hostile to everyone else. The Remade's own faction lists them back.
- type: npcFaction
  id: WGChoir
  defaultHostile: true
  friendly:
  - WGRemade

- type: entity
  abstract: true
  parent:
  - MobNonHumanHostileBase
  - MobHumanoidHostileAISimpleMelee
  id: WGMobChoirBase
  components:
  - type: NpcFactionMember
    factions:
    - WGChoir
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Critical
      100: Dead
  - type: DamageStateVisuals
    rotate: true
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 3.5

# A chorister left on a hulk to mind the Scion. It does not argue.
- type: entity
  parent: WGMobChoirBase
  id: WGMobChoirist
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - sprite: _NF/Mobs/Species/Templates/human.rsi
      state: human
    - sprite: Clothing/Uniforms/Jumpsuit/color.rsi
      state: equipped-INNERCLOTHING
      color: "#2b2b2b"
    - sprite: Clothing/OuterClothing/Misc/cultrobes.rsi
      state: equipped-OUTERCLOTHING
    - sprite: Clothing/Head/Hoods/cult.rsi
      state: equipped-HELMET
    - sprite: Objects/Weapons/Melee/cleaver.rsi
      state: inhand-right
  - type: MeleeWeapon
    attackRate: 1.0
    altDisarm: false
    animation: WeaponArcPunch
    angle: 0
    damage:
      types:
        Slash: 9
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

# What the Choir wear on a ship: robes over a black jumpsuit, and a sidearm.
- type: startingGear
  id: WGCrewChoirHand
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    outerClothing: ClothingOuterRobesCult
    head: ClothingHeadHatHoodCulthood
    shoes: ClothingShoesColorBlack
    gloves: ClothingHandsGlovesColorBlack
    belt: WeaponPistolMk58
    pocket1: Magazine45_ACPPistolFMJ
    pocket2: Magazine45_ACPPistolFMJ
    ears: WGCrewHeadset
    id: PassengerIDCard

- type: startingGear
  id: WGCrewChoirLeader
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    outerClothing: ClothingOuterRobesCult
    shoes: ClothingShoesColorBlack
    gloves: ClothingHandsGlovesColorBlack
    belt: WeaponPistolMk58
    pocket1: Magazine45_ACPPistolFMJ
    pocket2: Magazine45_ACPPistolFMJ
    ears: WGCrewHeadset
    id: PassengerIDCard

- type: wgCrewProfile
  id: WGCrewProfileChoir
  components:
  - type: WGCrewSuitUp
  - type: PressureImmunity
  - type: BreathingImmunity
  bodies:
  - WGMobCrewBodyHuman
  - WGMobCrewBodyHuman
  - WGMobCrewBodyReptilian
  - WGMobCrewBodyDwarf
  - WGMobCrewBodyVulpkanin
  - WGMobCrewBodyTajaran
  - WGMobCrewBodyMoth
  skills: [ Green, Regular ]
  titles:
    WGCrewCaptain: wg-remade-choir-title-leader
    WGCrewPilot: wg-remade-choir-title-leader
    WGCrewRadioOperator: wg-remade-choir-title
    WGCrewGunner: wg-remade-choir-title
    WGCrewDeckhand: wg-remade-choir-title
    WGCrewEngineer: wg-remade-choir-title
    WGCrewMarine: wg-remade-choir-title
  loadouts:
    WGCrewDeckhand: [ WGCrewChoirHand ]
    WGCrewEngineer: [ WGCrewChoirHand ]
    WGCrewMarine: [ WGCrewChoirHand ]
    WGCrewGunner: [ WGCrewChoirHand ]
    WGCrewRadioOperator: [ WGCrewChoirLeader ]
    WGCrewPilot: [ WGCrewChoirLeader ]
    WGCrewCaptain: [ WGCrewChoirLeader ]

# A dark hull far out, unlabelled on every scope, with a Scion wrenched to its deck and squatters minding it. Nothing says
# where it is but a garbled line on the radio. It ends on its clock and the hull goes with whatever is still aboard.
- type: wgEncounter
  id: WGEncounterRemadeHulk
  name: wg-remade-encounter-hulk-name
  start: Manual
  category: Distress
  icon: Ghost
  cost: 1
  # A marker on the sector map, so crews can find it; its Scion stays dark on radar until disturbed.
  hidden: false
  duration: 5400
  # In the Deep only, measured from the sector's centre.
  minDistance: 68000
  maxDistance: 76000
  latticeBand: 4
  stationClearance: 3000
  ships:
  - key: hulk
    vessels: [ Piva, Plutomkii, Twilight ]
    side: hulk
    distress: false
    stealth: true
    derelict:
      dwellers: 3
      dwellerPool: [ WGMobDweller, WGMobDweller, WGMobDwellerHooded ]
      debris: 30
      debrisPool: [ RandomSpawner, RandomSpawner, SalvageSpawnerScrapCommon, ShardGlass, PartRodMetal1, Cobweb1 ]
      resale: 0.25

# The same hulk with the Choir in attendance: choristers aboard and a ship holding off, which hails visitors and fires on
# them. Whoever takes the Scion off the hulk is hunted by that ship.
- type: wgEncounter
  id: WGEncounterRemadeGuarded
  name: wg-remade-encounter-hulk-name
  start: Manual
  category: Distress
  icon: Ghost
  cost: 2
  # A marker on the sector map, so crews can find it; its Scion stays dark on radar until disturbed.
  hidden: false
  duration: 5400
  # In the Deep only, measured from the sector's centre.
  minDistance: 68000
  maxDistance: 76000
  latticeBand: 4
  stationClearance: 3000
  ships:
  - key: hulk
    vessels: [ Piva, Plutomkii, Twilight ]
    side: choir
    distress: false
    stealth: true
    derelict:
      dwellers: 3
      dwellerPool: [ WGMobChoirist ]
      debris: 20
      debrisPool: [ RandomSpawner, RandomSpawner, SalvageSpawnerScrapCommon, ShardGlass, PartRodMetal1, Cobweb1 ]
      resale: 0.25
  - key: choir
    navigation: WGCrewNavigationRaider
    vessels: [ Hazel, Metis, Mudskipper ]
    offset: 350, 250
    side: choir
    faction: WGChoir
    profile: WGCrewProfileChoir
    roles: [ WGCrewPilot, WGCrewGunner, WGCrewDeckhand ]
    captain: false
    deckhands: 1
    guards: 1
    skill: Regular
    stealth: true
    warnRange: 900
    attackRange: 450
    zoneLines: wg-remade-choir-zone
    zoneTargets: Everyone
    evades: false
    distress: false
    boarding: Hostile
    docking: Hostile
    disengage: Deter
    disengageRange: 1200
    objectives:
    - kind: Hold

# A freighter dead in space, a hand or two still alive aboard, a Scion already deep into the hull. It calls for help and
# pays nothing; the Scion is what makes anyone want to go aboard, and the trap.
- type: wgEncounter
  id: WGEncounterRemadeAdrift
  name: wg-remade-encounter-adrift-name
  announcement: wg-remade-encounter-adrift-announce
  announceOnRadio: true
  announcer: adrift
  start: Scheduled
  category: Distress
  icon: Cross
  cost: 2
  weight: 0.3
  minPlayers: 3
  cooldown: 5400
  duration: 3600
  # In the Deep only, measured from the sector's centre.
  minDistance: 68000
  maxDistance: 76000
  latticeBand: 4
  stationClearance: 3000
  manifests: [ WGManifestGeneral, WGManifestMedical, WGManifestSalvage ]
  ships:
  - key: adrift
    navigation: WGCrewNavigationFreight
    vessels: [ Plutomkii, Piva, Twilight ]
    side: freight
    profile: WGCrewProfileHauler
    deckhands: 2
    guards: 0
    captain: false
    cargo: 4
    stranded: Fuel
    boarding: Ignore
    docking: Ignore
    disengage: Deter
    deed: null
    distress: true

- type: wgRemadeSite
  id: WGRemadeSiteHulk
  encounter: WGEncounterRemadeHulk
  ship: hulk
  kind: Discovery
  weight: 3
  resonance: 1

- type: wgRemadeSite
  id: WGRemadeSiteGuarded
  encounter: WGEncounterRemadeGuarded
  ship: hulk
  choir: choir
  kind: Discovery
  weight: 2
  resonance: 1

- type: wgRemadeSite
  id: WGRemadeSiteAdrift
  encounter: WGEncounterRemadeAdrift
  ship: adrift
  kind: Adrift
  resonance: 60

# While this rule runs a dormant Scion is now and then placed in the sector. The Contested Sector and Escalation presets carry it.
- type: entity
  id: WGRemadeDiscoveryRule
  parent: BaseGameRule
  components:
  - type: WGRemadeDiscoveryRule
