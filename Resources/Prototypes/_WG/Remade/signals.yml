# Signals: dead players a Monolith holds as unseen eyes. They fly near the stone, play tricks on the living and drive its Remade.

- type: entity
  parent: Incorporeal
  id: WGSignal
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#a8301f99"
    layers:
    - state: animated
      shader: unshaded
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
    drawLight: false
  - type: Input
    context: "ghost"
  - type: Examiner
    skipChecks: true
  - type: Actions
  - type: WGSignal

# The ghost role a Monolith offers. It is paused while the stone is full or can't take Signals.
- type: entity
  id: WGSignalGate
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: wg-signal-role-name
    description: wg-signal-role-description
    rules: wg-signal-role-rules
    makeSentient: true
    allowSpeech: false
    allowMovement: true
  - type: GhostRoleMobSpawner
    prototype: WGSignal
    deleteOnSpawn: false
    availableTakeovers: 1000000
  - type: WGSignalGate

# Tricks: point at a thing. The cooldown comes from WGSignalMath.

- type: entity
  id: WGSignalActionFlicker
  components:
  - type: EntityTargetAction
    icon: { sprite: _WG/Remade/Interface/signal_actions.rsi, state: flicker }
    event: !type:WGSignalTrickEvent
      trick: Flicker
    canTargetSelf: false
    range: 14
    raiseOnUser: true
    checkCanAccess: false
    checkCanInteract: false
    checkConsciousness: false

