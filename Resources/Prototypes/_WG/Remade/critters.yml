# Critters: what the small Remade do between fights. Hoppers hide under tables and leapers stand against walls.
# Dead animals rising as Remade is data on the hopper and lurker in roster.yml (animalWeight and the mass range).

# A hopper with no prey in sight goes to a table, climbs under it and waits. Its sight shrinks while it is there, so it lets the
# prey come close, and any better plan (prey in reach, a hunt order) brings it out.
- type: htnCompound
  id: WGRemadeHideCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WGPickCoverOperator
        targetKey: WGRemadeCover
        coordinatesKey: WGRemadeCoverCoordinates
        rangeKey: WGRemadeCoverRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        targetKey: WGRemadeCoverCoordinates
        rangeKey: WGRemadeCoverRange
    - !type:HTNPrimitiveTask
      operator: !type:WGHideOperator
        targetKey: WGRemadeCover

- type: htnCompound
  id: WGRemadeHopperCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WGRemadeHunt
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        targetKey: WGRemadeHunt
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNCompoundTask
      task: WGRemadeHideCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

# A leaper with no prey in sight goes to the nearest wall and stands against it.
- type: htnCompound
  id: WGRemadeWallCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WGPickWallOperator
        coordinatesKey: WGRemadeWallCoordinates
        rangeKey: WGRemadeWallRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        targetKey: WGRemadeWallCoordinates
        rangeKey: WGRemadeWallRange
    - !type:HTNPrimitiveTask
      operator: !type:WGHoldOperator

- type: htnCompound
  id: WGRemadeLeaperCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WGRemadeHunt
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        targetKey: WGRemadeHunt
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNCompoundTask
      task: WGRemadeWallCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
