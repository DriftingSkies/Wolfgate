- type: entity
  parent: WGEnvDecorBase
  id: WGEnvOoze
  components:
  - type: Sprite
    drawdepth: Puddles
    layers:
    - state: mucus

# Ooze dripping from above, slowly.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvDrip
  components:
  - type: Sprite
    drawdepth: Effects
    layers:
    - state: drip

# Veins over a door, vent or machine.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvWeb
  components:
  - type: Sprite
    drawdepth: Overdoors
    layers:
    - state: web1

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvWebB
  components:
  - type: Sprite
    drawdepth: Overdoors
    layers:
    - state: web2

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvWebC
  components:
  - type: Sprite
    drawdepth: Overdoors
    layers:
    - state: web3

# A console face writing the Monolith's glyphs.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvScreen
  components:
  - type: Sprite
    drawdepth: Overdoors
    layers:
    - state: screen1
      shader: unshaded
  - type: PointLight
    radius: 1.8
    energy: 0.6
    color: "#b02a2a"
  - type: WGEnvDecor
    sparks: true

- type: entity
  parent: WGEnvScreen
  id: WGEnvScreenB
  components:
  - type: Sprite
    layers:
    - state: screen2
      shader: unshaded

# Mist at Rapture and up.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvHaze
  components:
  - type: Sprite
    drawdepth: Effects
    layers:
    - state: haze1

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvHazeB
  components:
  - type: Sprite
    drawdepth: Effects
    layers:
    - state: haze2

# Remains fused into a wall.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvCocoon
  components:
  - type: Sprite
    sprite: _WG/Remade/Environment/cocoon.rsi
    drawdepth: WallMountedItems
    offset: 0,0.25
    layers:
    - state: cocoon1

- type: entity
  parent: WGEnvCocoon
  id: WGEnvCocoonB
  components:
  - type: Sprite
    layers:
    - state: cocoon2
