# Ambient horror: flesh, gore, glyph screens and mist that WGEnvDecorSystem seeds over corruption as a Monolith climbs. Every piece is a
# plain sprite with no tick of its own, parented to the corruption tile it sits on so it goes when the tile does. Art in
# Textures/_WG/Remade/Environment (Tools/_WG/Remade/port_environment.py).

- type: soundCollection
  id: WGEnvSquelch
  files:
  - /Audio/_WG/DecorImport/vorestation/squish_01.ogg
  - /Audio/_WG/DecorImport/vorestation/squish_02.ogg
  - /Audio/_WG/DecorImport/vorestation/squish_03.ogg
  - /Audio/_WG/DecorImport/vorestation/squish_04.ogg

- type: soundCollection
  id: WGEnvCreak
  files:
  - /Audio/_Mono/Effects/Ambience/creak1.ogg
  - /Audio/_Mono/Effects/Ambience/creak2.ogg
  - /Audio/_Mono/Effects/Ambience/creak3.ogg

# Something knocking from inside a morgue tray.
- type: soundCollection
  id: WGEnvKnock
  files:
  - /Audio/Effects/metal_slam1.ogg
  - /Audio/Effects/metal_slam2.ogg

# A vent or tray giving way.
- type: soundCollection
  id: WGEnvBurst
  files:
  - /Audio/Effects/metal_slam3.ogg
  - /Audio/Effects/metal_slam4.ogg
  - /Audio/Effects/metal_slam5.ogg

- type: entity
  abstract: true
  id: WGEnvDecorBase
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: true
    sprite: _WG/Remade/Environment/decor.rsi
    drawdepth: SmallObjects
  - type: WGEnvDecor

# Soft growths on the floor.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvSac
  components:
  - type: Sprite
    layers:
    - state: sac1

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvSacBig
  components:
  - type: Sprite
    layers:
    - state: sac3

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvSacSmall
  components:
  - type: Sprite
    layers:
    - state: sac2

# A sac with a slow heartbeat in it, heard from a few steps off.
- type: entity
  parent: WGEnvSacBig
  id: WGEnvSacBeating
  components:
  - type: AmbientSound
    enabled: true
    range: 7
    volume: -12
    sound:
      path: /Audio/_WG/Wolfmed/heartbeat_loop.ogg

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvOrgans
  components:
  - type: Sprite
    layers:
    - state: organs1

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvOrgansB
  components:
  - type: Sprite
    layers:
    - state: organs2

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvOrgansC
  components:
  - type: Sprite
    layers:
    - state: organs3

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvSpur
  components:
  - type: Sprite
    layers:
    - state: spur1

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvSpurTall
  components:
  - type: Sprite
    layers:
    - state: spur2

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvSpurLow
  components:
  - type: Sprite
    layers:
    - state: spur3

# Roots sprawling over the floor, DS13's own small growths.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvTendril
  components:
  - type: Sprite
    sprite: _WG/Remade/Structures/growths.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: minigrowth1

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvTendrilB
  components:
  - type: Sprite
    sprite: _WG/Remade/Structures/growths.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: minigrowth2

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvTendrilC
  components:
  - type: Sprite
    sprite: _WG/Remade/Structures/growths.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: minigrowth3

# Gore, building up on the floor.
- type: entity
  parent: WGEnvDecorBase
  id: WGEnvGore
  components:
  - type: Sprite
    drawdepth: Puddles
    layers:
    - state: gore8

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvGoreSmear
  components:
  - type: Sprite
    drawdepth: Puddles
    layers:
    - state: gore1

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvGoreSpray
  components:
  - type: Sprite
    drawdepth: Puddles
    layers:
    - state: gore9

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvGoreScraps
  components:
  - type: Sprite
    drawdepth: Puddles
    layers:
    - state: gore5

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvGoreTrail
  components:
  - type: Sprite
    drawdepth: Puddles
    layers:
    - state: gore7

- type: entity
  parent: WGEnvDecorBase
  id: WGEnvRemains
  components:
  - type: Sprite
    drawdepth: Puddles
    layers:
