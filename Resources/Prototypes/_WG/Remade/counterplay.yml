# What the crew has against the Remade: necrotoxin, the plasma cutter, the Prime's armour and what a fallen Monolith leaves.

# The Prime's armour. WGPrimeSystem cancels all damage to it anyway: only a nuclear detonation close by destroys it.
- type: damageModifierSet
  id: WGPrimeArmour
  coefficients:
    Blunt: 0.4
    Slash: 0.5
    Piercing: 0.3
    Heat: 0.6
    Shock: 0.2
    Structural: 0.8
  flatReductions:
    Blunt: 12
    Slash: 8
    Piercing: 15
    Heat: 4

- type: reagent
  id: WGNecrotoxin
  name: reagent-name-wg-necrotoxin
  group: Toxins
  desc: reagent-desc-wg-necrotoxin
  flavor: bitter
  color: "#4c3b34"
  physicalDesc: reagent-physical-desc-wg-necrotoxin
  # Spray, splash or a grenade burns the Remade where the stuff lands.
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          types:
            Poison: 2
        conditions:
        - !type:HasTag
          tag: WGRemade
  # Crew take a little. The Remade take theirs from WGNecrotoxinSystem, which reads their blood.
  metabolisms:
    Poison:
      metabolismRate: 0.25
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.2

- type: reaction
  id: WGNecrotoxin
  reactants:
    Mercury:
      amount: 1
    Sulfur:
      amount: 1
    Ammonia:
      amount: 1
  products:
    WGNecrotoxin: 3

- type: entity
  parent: ChemicalMedipen
  id: WGNecrotoxinPen
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: WGNecrotoxin
          Quantity: 15

# A hitscan arc cut short. Slash and heat take limbs off, and the Structural cuts plating and stone.
- type: entity
  parent: BaseWeaponBatterySmall
  id: WGRemadeCutter
  components:
  - type: Sprite
    sprite: _WG/Remade/Objects/cutter.rsi
    state: icon
  - type: Item
    sprite: _WG/Remade/Objects/cutter.rsi
  - type: Clothing
    sprite: _WG/Remade/Objects/cutter.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 2.5
    soundGunshot:
      path: /Audio/_WG/Remade/cutter/plasma_cutter.ogg
  - type: HitscanBatteryAmmoProvider
    proto: WGRemadeCutterArc
    fireCost: 25
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: StaticPrice
    price: 900

- type: entity
  parent: BasicHitscan
  id: WGRemadeCutterArc
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _WG/Remade/Effects/cutter.rsi
      state: muzzle
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_omni
    impactFlash:
      sprite: _WG/Remade/Effects/cutter.rsi
      state: impact
  - type: HitscanBasicRaycast
    maxDistance: 7
  - type: HitscanBasicDamage
    damage:
      types:
        Slash: 6
        Heat: 3
        Structural: 14

- type: entity
  parent: BaseFlatpack
  id: WGFlatpackMonolithTap
  components:
  - type: Flatpack
    entity: WGMonolithTap
  - type: StaticPrice
    price: 1500

- type: latheRecipePack
  id: WGRemadeStatic
  recipes:
  - WGRemadeCutter
  - WGFlatpackMonolithTap

- type: latheRecipe
  id: WGRemadeCutter
  result: WGRemadeCutter
  categories:
  - Weapons
  completetime: 6
  materials:
    Steel: 800
    Glass: 300
    Plasma: 200
    Plastic: 100

- type: latheRecipe
  id: WGFlatpackMonolithTap
  result: WGFlatpackMonolithTap
  categories:
  - Tools
  completetime: 8
  materials:
    Steel: 1000
    Glass: 500
    Gold: 100

# What a destroyed Monolith leaves behind.
- type: entity
  id: WGMonolithHusk
  components:
  - type: Transform
    noRot: true
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: _WG/Remade/Structures/scion.rsi
    state: marker_normal_dormant
    offset: 0,0.5
    color: "#3a3636"
  - type: TimedDespawn
    lifetime: 900

- type: entity
  id: WGMonolithPrimeHusk
  components:
  - type: Transform
    noRot: true
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: _WG/Remade/Structures/prime.rsi
    state: marker_giant_dormant
    offset: 0,2.56
    color: "#3a3636"
  - type: TimedDespawn
    lifetime: 1800

