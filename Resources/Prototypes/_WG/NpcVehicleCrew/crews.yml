# Ashfall Reavers driving the roads of every world in an old APC (a POI table's `roadPatrols`): they leave people be
# unless shot at, and barely stop on their way up and down the road.
- type: wgVehicleCrew
  id: WGVehicleCrewReaverRoadPatrol
  name: wg-vehicle-crew-name-reaver-road-patrol
  vehicle: WGVehicleAPCArmed
  driver: WGVehicleDriver
  gunner: WGVehicleGunner
  troopers: [ WGVehicleTrooper, WGVehicleTrooper ]
  profile: WGVehicleCrewProfilePirate
  faction: PirateNF
  behaviour: Patrol
  engagement: WhenAttacked
  engageRange: 16
  standoff: 8
  fireOnTheMove: true
  skill: Green
  patrolPauseMin: 0
  patrolPauseMax: 2
