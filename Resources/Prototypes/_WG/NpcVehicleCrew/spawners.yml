# Markers that spawn a crewed ground vehicle when the map loads, for mappers and planet sites. Each names its wgVehicleCrew.

- type: entity
  parent: MarkerBase
  id: WGVehicleCrewSpawnerPirateHumvee
  name: pirate humvee crew spawner
  description: A pirate humvee with its crew aboard.
  categories: [ WGVehicles ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _WG/Vehicles/humvee.rsi
      state: humvee_base
      scale: 0.25, 0.25
  - type: WGVehicleCrewSpawner
    crew: WGVehicleCrewPirateHumvee

