# Crew profiles for vehicle crews. NpcCrew profiles cannot be extended from another file, so each copies the matching
# one (bodies, names, components, skills) and keys its loadouts by the vehicle roles, reusing the NpcCrew gear.

- type: wgCrewProfile
  id: WGVehicleCrewProfilePirate
  firstNames: WGNamesPirateFirst
  lastNames: WGNamesPirateLast
  # Pirates never fly durasteel, as with NpcCrew's own pirate profile.
  hullSwaps:
    WGWallDurasteel: WallPlastitanium
    WGWallDurasteelDiagonal: WallPlastitaniumDiagonal
    WGWallDurasteelCapital: WallPlastitaniumCapital
    WGWallDurasteelDiagonalCapital: WallPlastitaniumDiagonalCapital
  components:
  - type: PirateAccent
  - type: WGCrewSuitUp
  - type: PressureImmunity
  - type: BreathingImmunity
  bodies:
  - WGMobCrewBodyHuman
  - WGMobCrewBodyHuman
  - WGMobCrewBodyReptilian
  - WGMobCrewBodyReptilian
  - WGMobCrewBodyDwarf
  - WGMobCrewBodyVulpkanin
  - WGMobCrewBodyTajaran
  - WGMobCrewBodyRodentia
  - WGMobCrewBodyArachnid
  - WGMobCrewBodyMoth
  skills: [ Green, Regular, Regular, Veteran ]
  loadouts:
    # Every profile must kit a deckhand: NpcCrew's own posts may draw on it.
    WGCrewDeckhand: [ WGCrewPirateHand ]
    WGVehicleDriver: [ WGCrewPirateOfficer, WGCrewPirateHand ]
    WGVehicleGunner: [ WGCrewPirateOfficer, WGCrewPirateHand ]
    WGVehicleTrooper: [ WGCrewPirateRifle, WGCrewPirateBruiser, WGCrewPirateHand ]

