# The Lupercal's player jobs. Each starts closed (0 slots in the gameMap): the owner opens them (the command console,
# or wg_shipjobs), and a player who takes one relieves the NPC at the matching post (WGShipJobs on the vessel). They
# are the Lupercal's own ids, so no other station's join path offers them, and they stay out of character preferences.
# The station AI goes into the core in the admin machines room and cyborgs come aboard in Robotics, both under the
# WGLupercalLawset. Written by gen_jobs.py (job prototypes can't inherit).

- type: job
  id: WGLupercalPilot
  name: wg-lupercal-job-pilot
  description: wg-lupercal-job-pilot-desc
  playTimeTracker: JobWGLupercalPilot
  supervisors: wg-lupercal-job-supervisors
  icon: JobIconPilot
  setPreference: false
  canBeAntag: false
  weight: 1
  displayWeight: 5
  startingGear: WGLupercalPilotGear
  accessGroups:
  - GeneralAccess

