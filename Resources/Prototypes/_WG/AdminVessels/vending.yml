# The Lupercal's extra vending lines: WGShipFitting.vendingExtras on the vessel adds each pack here to every machine
# aboard that carries the pack it is keyed by, and unlimitedVending makes every line unlimited, so the amounts only
# matter on a ship without it. Each pack first brings the machine level with what the sector's stations sell from the
# same kind of machine (Docs/_WG/AdminVessels/vending-survey.md), then adds a few lines past that.

# Cola and Dr. Gibb machines: every can and bottle the station soda machines sell (Space-Up, PWR Game, Boda, Smite).
- type: vendingMachineInventory
  id: WGLupercalSodaExtras
  startingInventory:
    # Parity
    DrinkColaCan: 4
    DrinkDrGibbCan: 4
    DrinkSpaceUpCan: 3
    DrinkSpaceMountainWindCan: 3
    DrinkPwrGameCan: 4
    DrinkEnergyDrinkCan: 4
    DrinkSodaWaterCan: 10
