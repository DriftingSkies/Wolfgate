    DrinkStarkistCan: 3
    DrinkShamblersJuiceCan: 3
    DrinkColaBottleFull: 2
    DrinkSpaceUpBottleFull: 2
    DrinkSpaceMountainWindBottleFull: 2
    DrinkSodaWaterBottleFull: 2
    DrinkWaterBottleFull: 6

