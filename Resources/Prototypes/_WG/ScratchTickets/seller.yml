# Scratches-to-Win, who sells scratch tickets in the Caelestinus Central bar lounge.

- type: humanoidProfile
  id: WGScratchTicketSellerProfile
  profile:
    name: Scratches-to-Win
    species: Reptilian
    age: 41
    sex: Male
    gender: Male
    appearance:
      eyeColor: "#E8B923"
      skinColor: "#2E8B57"
      markings:
      - markingId: LizardSnoutRound
        markingColor: [ "#2E8B57" ]
      - markingId: LizardHornsCurled
        markingColor: [ "#E6DCC0", "#E6DCC0" ]
      - markingId: LizardFrillsShort
        markingColor: [ "#D9B54A" ]
      - markingId: LizardTailSmooth
        markingColor: [ "#2E8B57", "#D9B54A", "#2E8B57", "#D9B54A" ]

- type: startingGear
  id: WGScratchTicketSellerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitHawaiRed
    outerClothing: ClothingOuterVest
    neck: ClothingNeckBling
    shoes: ClothingShoesColorBlack

- type: traderDialogue
  id: WGScratchTicketSellerDialogue
  greeting: wg-scratch-seller-greeting
  farewell: wg-scratch-seller-farewell
  options:
  - prompt: wg-scratch-seller-prompt-shop
    response: wg-scratch-seller-response-shop
    action: OpenShop
  - prompt: wg-scratch-seller-prompt-how
    response: wg-scratch-seller-response-how
  - prompt: wg-scratch-seller-prompt-who
    response: wg-scratch-seller-response-who

- type: entity
  id: WGScratchTicketSeller
  parent: WGBaseTrader
  name: Scratches-to-Win
  description: A lizard in a loud shirt with a roll of lottery tickets and one worn-down claw.
  suffix: Trader, Scratch Tickets
  components:
  - type: HumanoidAppearance
    species: Reptilian
    initial: WGScratchTicketSellerProfile
    hideLayersOnEquip:
    - Snout
    - HeadSide
  # Reptilian parts over the human trader base, as in BaseMobReptilian.
  - type: Body
    prototype: Reptilian
    requiredLegs: 2
  - type: Inventory
    speciesId: reptilian
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
  - type: Vocal
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian
  - type: LizardAccent
  - type: TypingIndicator
    proto: lizard
  - type: Loadout
    prototypes: [ WGScratchTicketSellerGear ]
  - type: Trader
    dialogue: WGScratchTicketSellerDialogue
  - type: TraderShop
    vendors: [ WGScratchTicketStock ]

- type: vendingMachineInventory
  id: WGScratchTicketInventory
  startingInventory:
    WGScratchTicket: 50
    WGScratchTicket10: 20
    WGScratchTicket20: 20
    WGScratchTicketFoundry: 50
    WGScratchTicketFoundry10: 20
    WGScratchTicketFoundry20: 20
    WGScratchTicketTycoon: 50
    WGScratchTicketTycoon10: 20
    WGScratchTicketTycoon20: 20

# Carries the seller's stock list and is never placed. A ticket's vendPrice is what it costs.
- type: entity
  id: WGScratchTicketStock
  parent: VendingMachineAmmo
  categories: [ HideSpawnMenu ]
  components:
  - type: VendingMachine
    pack: WGScratchTicketInventory
    requiresCash: true
