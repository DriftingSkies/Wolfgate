# Hourly wages of station roles. The ID is the job's ID. Jobs left out earn nothing: free agents with no assigned
# work (Contractor, TsfCivilian, WGAsfColonist, Fugitive, Godfather) and borgs, which have no bank.
# Wages are paid in full and draw on no sector account (a role may still name one with `account`, and a short account
# then pays everyone on it a share); the sector accounts are left to their leaders.

