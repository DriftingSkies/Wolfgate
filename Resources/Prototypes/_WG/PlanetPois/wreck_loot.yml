# What a crashed ship sometimes still has in its hold (a wreck theme's `loot`, WGPlanetPoiSystem.Wrecks): a crate of
# salvaged armament, one ship gun flatpack with the hardpoint it mounts on, or a crate of gunnery co-processor chips.
# The flatpacks are the exotic traders' (_WG/Traders/exotic_flatpacks.yml); the big guns turn up rarest.

- type: entityTable
  id: WGWreckLoot
  table: !type:GroupSelector
    children:
    - id: WGWreckShipgunCrate
      weight: 3
    - id: WGWreckGunneryChipCrate
      weight: 2

- type: entity
  parent: CrateGenericSteel
  id: WGWreckShipgunCrate
  name: salvaged armament crate
  description: A battered crate from a wrecked ship's hold. Something heavy and dangerous is packed inside.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/weapon.rsi
  - type: Icon
    sprite: Structures/Storage/Crates/weapon.rsi
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: WGWreckShipgunBundles

- type: entity
  parent: CrateGenericSteel
  id: WGWreckGunneryChipCrate
  name: salvaged electronics crate
  description: A crate of carefully packed electronics, somehow intact after the crash.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: WGWreckGunneryChips

- type: entityTable
  id: WGWreckGunneryChips
  table: !type:GroupSelector
    rolls: !type:RangeNumberSelector
      range: 1, 2
    children:
    - id: WGGunneryChipBasic
      weight: 6
    - id: WGGunneryChipAdvanced
      weight: 3
    - id: WGGunneryChipMilitary
      weight: 1

