# What's left of a crashed ship's crew (a wreck theme's `crew`): spacers dressed for the world they came down on, risen
# as inert zombies (WGZombifyOnSpawn: bite only, no infection, no rising dead) and hostile to anyone who comes poking
# through the hull.

- type: entity
  abstract: true
  parent: BaseMobHuman
  id: WGWreckZombieBase
  name: wrecked crewmember
  description: Whatever crashed here, they didn't walk away from it. Not properly, anyway.
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: WGZombifyOnSpawn
  # Zombies from any other source are friends, so the crew never goes for one.
  - type: NpcFactionMember
    addFriendlyFactions: [ Zombie ]
  - type: InputMover
  - type: MobMover
  - type: WGVehicleBoarder

- type: entity
  parent: WGWreckZombieBase
  id: WGWreckZombieVerda
  components:
  - type: Loadout
    prototypes: [ WGWreckCrewGearVerdaFarmer, WGWreckCrewGearVerdaHauler ]

- type: entity
  parent: WGWreckZombieBase
