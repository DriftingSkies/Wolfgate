- type: traderDialogue
  id: WGPoiFuelDialogue
  greeting: wg-poi-fuel-greeting
  farewell: wg-poi-trader-farewell
  options:
  - prompt: wg-poi-fuel-shop
    response: wg-poi-fuel-stock
    action: OpenShop

- type: entity
  id: WGPoiFuelTrader
  parent: WGBaseTrader
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WGTraderFuelTechnicianProfile
  - type: Loadout
    prototypes: [ WGTraderFuelTechnicianGear ]
  - type: Trader
    dialogue: WGPoiFuelDialogue
  - type: TraderShop
    vendors: [ VendingMachineFuelVend, VendingMachineYouToolPOI ]

# The roadside mechanic (mechanic_shop.yml): fixes a vehicle parked out front for a price set by its damage and
# value, and sells delivery beacons and repair boxes. Killable and unarmed: hurt, he runs.
- type: humanoidProfile
  id: WGPoiMechanicProfile
  profile:
    name: Hollis Brandt
    species: Human
    age: 52
    sex: Male
    gender: Male
    appearance:
      hair: HumanHairBalding
      hairColor: "#3B3026"
      facialHair: HumanFacialHairFullbeard
      facialHairColor: "#3B3026"
      eyeColor: "#5B6F7A"
      skinColor: "#C79C7A"

- type: startingGear
  id: WGPoiMechanicGear
  equipment:
    jumpsuit: ClothingUniformOveralls
    shoes: ClothingShoesBootsWork
    gloves: ClothingHandsGlovesColorBlack
    belt: ClothingBeltUtility

- type: traderDialogue
  id: WGPoiMechanicDialogue
  greeting: wg-poi-mechanic-greeting
  farewell: wg-poi-mechanic-farewell
  options:
  - prompt: wg-poi-mechanic-prompt-repair
    response: wg-poi-mechanic-response-repair
    action: RepairVehicle
  - prompt: wg-poi-mechanic-prompt-shop
    response: wg-poi-mechanic-response-shop
    action: OpenShop
  - prompt: wg-poi-mechanic-prompt-beacon
    response: wg-poi-mechanic-response-beacon

- type: entity
  id: WGPoiMechanic
  parent: WGBaseTrader
  suffix: Trader, Mechanic
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WGPoiMechanicProfile
  - type: Loadout
    prototypes: [ WGPoiMechanicGear ]
  # No weapon and no fighting: the brain only stands about, and runs when TraderFleeSystem names somewhere to run to.
  - type: HTN
    rootTask:
      task: WGTraderCompound
    blackboard:
      NavInteract: !type:Bool
        true
  - type: Trader
    dialogue: WGPoiMechanicDialogue
    killable: true
  - type: WGCowardice
  - type: TraderShop
    vendors: [ WGTraderStockMechanic ]
  - type: TraderVehicleRepair

- type: vendingMachineInventory
  id: WGTraderMechanicInventory
  startingInventory:
    WGVehicleBeaconATV: 4
    WGVehicleBeaconCivTruck1: 2
    WGVehicleBeaconCivTruck: 2
    WGVehicleBeaconCivVan: 2
    WGVehicleBeaconVan: 1
    WGVehicleRepairKit: 6
    JugWeldingFuel: 4
    WelderIndustrial: 2
    Wrench: 3
    Crowbar: 3

# A beacon costs its catalogue listing (its vend price); the tools cost three times what they appraise for.
- type: entity
  id: WGTraderStockMechanic
  parent: VendingMachineAmmo
  categories: [ HideSpawnMenu ]
  components:
  - type: VendingMachine
    pack: WGTraderMechanicInventory
    requiresCash: true
  - type: MarketModifier
    mod: 3

# The roadside innkeeper (roadside_inn.yml): a warm welcome, food, drink and a bed. He would sooner be paid in organs,
# at half what they appraise for, and sells a few. Anyone left dead or dying in his inn he eats, and he gives them back
# up when he dies. Killable and unarmed: hurt, he runs.
- type: humanoidProfile
  id: WGPoiInnkeeperProfile
  profile:
    name: Amos Fennick
    species: Human
    age: 61
    sex: Male
    gender: Male
    appearance:
      hair: HumanHairCombover
      hairColor: "#8A8580"
      facialHair: HumanFacialHairSelleck
      facialHairColor: "#8A8580"
      eyeColor: "#6B4E2E"
      skinColor: "#D9B39A"

- type: startingGear
  id: WGPoiInnkeeperGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitBartender
    outerClothing: ClothingOuterApronChef
    shoes: ClothingShoesColorBrown
    neck: ClothingNeckTieRed

- type: traderDialogue
  id: WGPoiInnkeeperDialogue
  greeting: wg-poi-innkeeper-greeting
  farewell: wg-poi-innkeeper-farewell
  options:
  - prompt: wg-poi-innkeeper-prompt-shop
    response: wg-poi-innkeeper-response-shop
    action: OpenShop
  - prompt: wg-poi-innkeeper-prompt-pay
    response: wg-poi-innkeeper-response-pay
  - prompt: wg-poi-innkeeper-prompt-room
    response: wg-poi-innkeeper-response-room
  - prompt: wg-poi-innkeeper-prompt-stew
    response: wg-poi-innkeeper-response-stew

- type: entity
  id: WGPoiInnkeeper
  parent: WGBaseTrader
  suffix: Trader, Innkeeper
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WGPoiInnkeeperProfile
  - type: Loadout
    prototypes: [ WGPoiInnkeeperGear ]
  - type: HTN
    rootTask:
      task: WGTraderDevourCompound
    blackboard:
      NavInteract: !type:Bool
        true
  - type: Trader
    dialogue: WGPoiInnkeeperDialogue
    killable: true
  - type: WGCowardice
    cowardice: 0.4
  - type: TraderShop
    vendors: [ WGTraderStockInn ]
  # Organs, never a brain (it carries a mind).
  - type: TraderGoodsPayment
    whitelist:
      components:
      - Organ
    blacklist:
      components:
      - MindContainer
    rate: 0.5
  - type: Devourer
    foodPreference: Humanoid
    whitelist:
      components:
      - HumanoidAppearance
  - type: TraderDevour

- type: vendingMachineInventory
  id: WGTraderInnInventory
  startingInventory:
    FoodSoupStew: 10
    FoodPieMeat: 4
    FoodBreadMeat: 4
    FoodBurgerHuman: 2
    DrinkBeerBottleFull: 10
    DrinkAleBottleFull: 6
    DrinkWineBottleFull: 3
    DrinkWaterBottleFull: 10
    OrganHumanHeart: 1
    OrganHumanLiver: 2
    OrganHumanKidneys: 2
    OrganHumanLungs: 1
    OrganHumanEyes: 2
    OrganHumanStomach: 1

# Twice what anything appraises for, organs included, so none of it resells at a profit.
- type: entity
  id: WGTraderStockInn
  parent: VendingMachineAmmo
  categories: [ HideSpawnMenu ]
  components:
  - type: VendingMachine
    pack: WGTraderInnInventory
    requiresCash: true
  - type: MarketModifier
    mod: 2
