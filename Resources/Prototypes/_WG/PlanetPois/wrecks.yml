# How each world reclaims the ships that crashed on it (WGPlanetPoiSystem.Wrecks): its ground creeping over the deck,
# what grows or settles there, the wildlife that moved in and the crew that never left (wreck_crew.yml),
# and sometimes salvage still in the hold (wreck_loot.yml).

- type: wgWreckTheme
  id: WGWreckThemeVerda
  floorTile: FloorPlanetGrass
  floorChance: 0.25
  overgrowth: [ FloraTree ]
  overgrowthChance: 0.04
  fauna: !type:NestedSelector
    tableId: WGFaunaAsclepiu
  crew: !type:EntSelector
    id: WGWreckZombieVerda
  loot: !type:NestedSelector
    tableId: WGWreckLoot

- type: wgWreckTheme
  id: WGWreckThemeMerak
  floorTile: FloorDesert
  floorChance: 0.35
  overgrowth: [ FloraRockSolidPlanet ]
  overgrowthChance: 0.03
  fauna: !type:NestedSelector
    tableId: MonoPlanetmapFaunaDesert
  crew: !type:EntSelector
    id: WGWreckZombieMerak
  loot: !type:NestedSelector
    tableId: WGWreckLoot

