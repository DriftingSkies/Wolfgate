# Wall-hung pride flags, beside the rainbow LGBTQFlag. The sprites are drawn by Tools/_WG/PrideFlags/pride_flags.py.
- type: entity
  abstract: true
  parent: BaseFlag
  id: WGPrideFlagBase
  components:
  - type: Sprite
    sprite: _WG/PrideFlags/flags.rsi

- type: entity
  parent: WGPrideFlagBase
  id: WGPrideFlagGay
