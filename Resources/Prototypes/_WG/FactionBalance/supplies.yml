# Supplies: field rations, survival gear, tools and field medicine on both faction uplinks, the same price on each,
# for crews that live out of their ship or on a world for an operation. Also the TSF's missing jetpack, C4, tools,
# defibrillator and injectors, and the PDV infiltration kit that replaces its five loose chameleon listings.
# The TSF's grenades, breaching charges and combat medkit are already in _NF/Catalog/security_uplink_catalog.yml.
# Listing names and descriptions come from the product entity; the two new entities' are in uplink.ftl.

- type: storeCategory
  id: WGUplinkSecuritySupplies
  name: wg-store-category-supplies
  priority: 9

- type: storeCategory
  id: WGUplinkPdvSupplies
  name: wg-store-category-supplies
  priority: 9

- type: entity
  parent: NFPouchFirstAid
  id: WGFieldDressingPouch
  components:
  # Room for its five items: the first aid pouch holds eight cells and these take ten.
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,1
  - type: StorageFill
    contents:
    - id: Gauze
    - id: Brutepack
    - id: Ointment
    - id: WGWolfmedSplint
    - id: Tourniquet

- type: entity
  parent: ClothingBackpackChameleon
  id: WGPdvInfiltrationKit
  components:
  - type: StorageFill
    contents:
    - id: ContractorIDCard
    - id: ChameleonPDA
    - id: ClothingHeadsetChameleon
    - id: ClothingMaskGasVoiceChameleon

