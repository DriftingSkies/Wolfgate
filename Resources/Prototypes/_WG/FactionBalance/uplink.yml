# The PDV's material crates, at the TSF's prices. The exotic crate holds composite where the TSF's holds plastitanium.
- type: entity
  parent: [ CratePDVEquippment, StorageFillMaterialsBasicTsf ]
  id: WGCrateMaterialsBasicFilledPdv
  suffix: Filled, Basic Materials (full)

- type: entity
  parent: [ CratePDVEquippment, StorageFillMaterialsIndustrial ]
  id: WGCrateMaterialsIndustrialFilledPdv
  suffix: Filled, Industrial Materials (full)

- type: entity
  parent: [ CratePDVEquippment, StorageFillMaterialsAdvanced ]
  id: WGCrateMaterialsAdvancedFilledPdv
  suffix: Filled, Advanced Materials (full)

- type: entity
  parent: CratePDVEquippment
  id: WGCrateMaterialsExoticFilledPdv
  suffix: Filled, Exotic Materials (full)
  components:
  - type: StorageFill
    contents:
    - id: SheetPdvComposite10
    - id: SheetUraniumDepleted
    - id: SheetUraniumFissile1
      amount: 2

