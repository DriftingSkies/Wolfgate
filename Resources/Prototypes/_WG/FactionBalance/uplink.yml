# Uplink additions so both factions can buy what the other can: the TSF's lathe weapons, plus
# plates, medkits and gunnery chips, and the PDV's material crates. Names and descriptions come from the product
# entity. The M82b, M82c, Lecter, Enforcer and Mateba are already in _NF/Catalog/security_uplink_catalog.yml.
# Hardsuits past the entry tier (M86, M92-X, CV-53, CV-82) are made at the faction lathe only.

