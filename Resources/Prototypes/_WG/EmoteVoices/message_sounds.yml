# Message sounds a character can pick in the creator: the chatter played when they speak. Every speechSounds set a
# species uses is here, plus HardLight's (Moth, Wawa, Gorilla, Sheleg).

- type: speechSounds
  id: WGMoth
  saySound:
    path: /Audio/_WG/EmoteVoices/Talk/moth.ogg
  askSound:
    path: /Audio/_WG/EmoteVoices/Talk/moth_ask.ogg
  exclaimSound:
    path: /Audio/_WG/EmoteVoices/Talk/moth_exclaim.ogg

- type: speechSounds
  id: WGWawa
  saySound:
    path: /Audio/_WG/EmoteVoices/Talk/wawa_statement.ogg
  askSound:
    path: /Audio/_WG/EmoteVoices/Talk/wawa_question.ogg
  exclaimSound:
    path: /Audio/_WG/EmoteVoices/Talk/wawa_exclaim.ogg

- type: speechSounds
  id: WGGorilla
  saySound:
    path: /Audio/_WG/EmoteVoices/Talk/gorilla.ogg
  askSound:
    path: /Audio/_WG/EmoteVoices/Talk/gorilla.ogg
  exclaimSound:
    path: /Audio/_WG/EmoteVoices/Talk/gorilla.ogg

- type: speechSounds
  id: WGSheleg
  saySound:
    path: /Audio/_WG/EmoteVoices/Talk/sheleg.ogg
  askSound:
    path: /Audio/_WG/EmoteVoices/Talk/sheleg_ask.ogg
  exclaimSound:
    path: /Audio/_WG/EmoteVoices/Talk/sheleg_exclaim.ogg

- type: wgMessageSound
