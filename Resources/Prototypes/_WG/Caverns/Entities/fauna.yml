# Cavern wildlife: one marker and one table per world, sharing an id. Markers sit on chamber floors and feed the
# planet population system, so the planet caps apply below ground too.

- type: entityTable
  id: WGCavernFaunaAsclepiu
  table: !type:GroupSelector
    children:
    - id: MobBat
      weight: 5
    - id: MobFrog
      weight: 3
    - id: MobMouse
      weight: 2
    - id: MobSnake
      weight: 2
    - id: MobGiantSpider
      weight: 1

- type: entity
  id: WGCavernFaunaAsclepiu
  parent: MarkerBase
  categories: [HideSpawnMenu]
  components:
  - type: WGPlanetFaunaSpawner
    table: WGCavernFaunaAsclepiu

- type: entityTable
