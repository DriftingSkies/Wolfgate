# Abductors: Ashfall Reaver ships that take people for ransom. Now and then one docks with a lightly crewed player ship.
# Its guards hold the port with stun batons, its hands stun, cuff and drag someone back to the chair in its cell, and it
# casts off to wait. Word goes out to the sector and the ransom goes on its warrant. Only hulls with a WGAbductCellChair
# work: AbductorHullsHaveACell fails any other. Before docking it stops the mark: an ion disruptor knocks out its engines
# and an ARACHNE harpoon drops its FTL and parks it.

- type: wgEncounter
  id: WGEncounterAbductorLight
  name: wg-encounter-name-abductor-light
  start: Scheduled
  lifetime: Persistent
  hidden: true
  category: Threat
  icon: Skull
  weight: 0.4
  minPlayers: 3
  cooldown: 3600
  minDistance: 3000
  maxDistance: 5000
  stationClearance: 3000
  bounty:
    ship: abductor
    target: Crew
    spesos: 15000
    title: wg-bounty-title-abductor-light
    description: wg-bounty-desc-abductor-light
  ships:
  - key: abductor
    stealth: true
    disablers: [ WGIonDisruptor, WGHackHarpoonGunRaider ]
    navigation: WGCrewNavigationHunter
    vessels: [ Hazel ]
    side: pirates
    faction: PirateNF
    distress: false
    company: WGAshfallReavers
    profile: WGCrewProfileAbductor
    captain: false
    deckhands: 2
    guards: 1
    skill: Green
    evades: false
    wander: 6
    wanderRadius: 4000
    wanderPause: 30
    abduct:
      ransom: 40000
      maxCrew: 1
      grabbers: 2

