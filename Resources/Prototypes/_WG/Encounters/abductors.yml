# The chair a prisoner is strapped to. Bolted down, so nobody carries off the cell.
- type: entity
  parent: Chair
  id: WGAbductCellChair
  name: prisoner chair
  description: A steel chair bolted to the deck, with worn straps. Someone has been kept here.
  components:
  - type: Transform
    anchored: true
  - type: WGAbductCell

# Their batons come out switched on, an NPC doesn't stop to thumb the switch, and do no harm. WGCrewGrabberSystem keeps them charged in crew hands.
- type: entity
  parent: Stunbaton
  id: WGCrewAbductorBaton
  suffix: NPC crew
  components:
  - type: ItemToggle
    activated: true
  - type: MeleeWeapon
    angle: 0
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 0
    animation: WeaponArcSlash

- type: startingGear
  id: WGCrewAbductorGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack
    ears: WGCrewHeadset
    outerClothing: ClothingOuterHardsuitSpatio
    head: ClothingHeadHelmetHardsuitSpatio
    mask: ClothingMaskBreath
    suitstorage: OxygenTankFilled
    belt: WGCrewAbductorBaton
    pocket1: Handcuffs
    pocket2: Handcuffs

# The Ashfall Reavers' pirate crew, armed to take people alive.
- type: wgCrewProfile
  id: WGCrewProfileAbductor
  firstNames: WGNamesPirateFirst
  lastNames: WGNamesPirateLast
  hullSwaps:
    WGWallDurasteel: WallPlastitanium
    WGWallDurasteelDiagonal: WallPlastitaniumDiagonal
    WGWallDurasteelCapital: WallPlastitaniumCapital
    WGWallDurasteelDiagonalCapital: WallPlastitaniumDiagonalCapital
  components:
  - type: WGCrewNonLethal
  - type: PirateAccent
  - type: WGCrewSuitUp
  - type: PressureImmunity
  - type: BreathingImmunity
  bodies:
  - WGMobCrewBodyHuman
  - WGMobCrewBodyHuman
  - WGMobCrewBodyReptilian
  - WGMobCrewBodyDwarf
  - WGMobCrewBodyVulpkanin
  skills: [ Green, Regular, Regular, Veteran ]
  loadouts:
    WGCrewCaptain: [ WGCrewAbductorGear ]
    WGCrewPilot: [ WGCrewAbductorGear ]
    WGCrewGunner: [ WGCrewAbductorGear ]
    WGCrewRadioOperator: [ WGCrewAbductorGear ]
    WGCrewMarine: [ WGCrewAbductorGear ]
    WGCrewEngineer: [ WGCrewAbductorGear ]
    WGCrewDeckhand: [ WGCrewAbductorGear ]
