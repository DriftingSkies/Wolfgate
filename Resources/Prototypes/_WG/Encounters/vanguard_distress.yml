# Peacetime distress calls for the Dynasty, under the Caelestinus Accord. Each copies the TSF call of the same size,
# with the Dynasty ship, crew and rewards of the wartime call, which keeps its Federation attackers for HOT rounds.

# A Dynasty gunboat has been jumped by Reaver raiders and calls for backup. The peacetime twin of the wartime call,
# where the attackers are Federation; it mirrors the TSF backup call.
- type: wgEncounter
  id: WGEncounterPdvBackupReavers
  leash: 2500
  name: wg-encounter-name-pdv-backup
  announcement: wg-encounter-announce-pdv-backup-reavers
  announceOnRadio: true
  announcer: patrol
  start: Scheduled
  category: Distress
  cost: 3
  weight: 2
  minPlayers: 3
  cooldown: 2700
  duration: 2700
  startRadius: 800
  minDistance: 2500
  maxDistance: 4000
  rewards:
  - side: pdv
    spesos: 48000
    credits: 30
    creditEntity: Doubloon1
    creditCompanies: [ PDV, PDVCivilian ]
    thanks: wg-encounter-reward-thanks-pdv
  ships:
  - key: patrol
    navigation: WGCrewNavigationWarship
    vessels: [ Kynda, Gadfly ]
    deckhands: 0
    captain: false
    roles: [ WGCrewPilot, WGCrewGunner ]
    side: pdv
    faction: WGPdvNavy
    company: PDV
    profile: WGCrewProfilePdv
    iffColor: "#ffae3d"
    objectives:
    - kind: Attack
      target: raider
  - key: raider
    navigation: WGCrewNavigationRaider
    vessels: [ Kalisto, Metis, Mudskipper, Scallywag ]
    offset: 0, 500
    side: pirates
    faction: PirateNF
    distress: false
    company: WGAshfallReavers
    profile: WGCrewProfilePirate
    deckhands: 3
    objectives:
    - kind: Attack
      target: patrol
  - key: wing
    navigation: WGCrewNavigationRaider
    vessels: [ Carrion, Horsefly, Tick, Hazel ]
    deckhands: 0
    captain: false
    roles: [ WGCrewPilot, WGCrewGunner ]
    offset: 180, 520
    side: pirates
    faction: PirateNF
    distress: false
    company: WGAshfallReavers
    profile: WGCrewProfilePirate
    objectives:
    - kind: Attack
      target: patrol

