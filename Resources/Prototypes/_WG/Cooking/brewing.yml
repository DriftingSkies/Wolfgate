# What brews them. Items steep a while; powders steep a little each second, a unit of powder to five of drink.

- type: wgBrewRecipe
  id: WGBrewBlackTea
  inputs: [ WGDriedTeaLeaves ]
  powder: TeaPowder
  drink: WGTeaBlack

- type: wgBrewRecipe
  id: WGBrewGreenTea
  inputs: [ LeavesTea ]
  powder: GreenTeaPowder
  drink: WGTeaGreen

- type: wgBrewRecipe
  id: WGBrewChamomileTea
  powder: ChamomileTeaPowder
  drink: WGTeaChamomile

- type: wgBrewRecipe
  id: WGBrewBerryTea
  inputs: [ FoodBerries, WGFoodRaspberry, WGFoodBlackberry, WGFoodStrawberry, WGVerdaDuskberries ]
  powder: BerryTeaPowder
  drink: WGTeaBerry
  priority: 10

- type: wgBrewRecipe
  id: WGBrewFruitTea
  inputs: [ FoodApple, WGFoodAppleSliced, FoodOrange, FoodLemon, WGFoodLemonWedge, FoodLime, WGFoodLimeWedge, WGFoodPear, WGFoodPlum, WGFoodTangerine ]
  powder: FruitTeaPowder
  drink: WGTeaFruit

- type: wgBrewRecipe
  id: WGBrewCoffee
  inputs: [ WGRoastedCoffee ]
  powder: CoffeeGrounds
  powderYield: 4
  drink: WGCoffeeFresh

- type: wgBrewRecipe
  id: WGBrewCocoa
  inputs: [ FoodCocoaBeans ]
  drink: WGCocoaHomemade

- type: wgBrewRecipe
  id: WGBrewPoppyTea
  inputs: [ FoodPoppy ]
  drink: WGTeaPoppy
  seconds: 20

- type: wgBrewRecipe
  id: WGBrewAloeTea
  inputs: [ FoodAloe ]
  drink: WGTeaAloe

- type: wgBrewRecipe
  id: WGBrewLingzhiTea
  inputs: [ FoodLingzhi ]
  drink: WGTeaLingzhi
  seconds: 20

- type: wgBrewRecipe
  id: WGBrewShoreSageTea
  inputs: [ WGVerdaShoreSage ]
  drink: WGTeaShoreSage

