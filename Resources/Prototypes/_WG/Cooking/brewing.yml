# Brewing: tea, coffee and the like steep in a kettle of boiling water on a hob (wgBrewRecipe), and only in a kettle.
# Each drink's buff takes the cup slot, beside any meal's, and every warm sip gives a little comfort. Mono's tea
# pouches brew here too; the reactions that made tea out of powder and hot water are commented out in their files.

# Prepared on the hearth before the kettle: coffee cherries roast in the pan, tea leaves dry in the oven.

- type: entity
  parent: FoodBase
  id: WGRoastedCoffee
  name: roasted coffee beans
  description: Coffee cherries roasted dark in the pan. Drop them in a boiling kettle for a pot of fresh coffee.
  components:
  - type: Sprite
    sprite: _WG/Cooking/brewing.rsi
    state: coffee_roasted
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 4
        reagents:
        - ReagentId: Nutriment
          Quantity: 1
  - type: StaticPrice
    price: 15

- type: entity
  parent: FoodBase
  id: WGDriedTeaLeaves
  name: dried tea leaves
  description: Tea leaves dried in the oven. In a boiling kettle they brew black tea; fresh leaves brew green.
  components:
  - type: Sprite
    sprite: _WG/Cooking/brewing.rsi
    state: tea_dried
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 4
        reagents:
        - ReagentId: Nutriment
          Quantity: 1
  - type: StaticPrice
    price: 10

- type: wgCookRecipe
  id: WGCookRoastCoffee
  method: Fry
  inputs: [ WGFoodCoffee ]
  result: WGRoastedCoffee
  seconds: 20

- type: wgCookRecipe
  id: WGCookDryTea
  method: Bake
  inputs: [ LeavesTea ]
  result: WGDriedTeaLeaves
  seconds: 20

# The drinks. Gentler and shorter than a meal's buff; hot cocoa gives the most comfort.

- type: reagent
  parent: BaseDrink
  id: WGTeaBlack
  name: reagent-name-wg-tea-black
  desc: reagent-desc-wg-tea-black
  physicalDesc: reagent-physical-desc-wg-soup
  flavor: tea
  color: "#6B3A1F"
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 3
      - !type:WGMealBuff
        cup: true
        traits: [ Steady ]
        strength: 0.8
        minutes: 6
        comfort: 0.4
  pricePerUnit: 4

