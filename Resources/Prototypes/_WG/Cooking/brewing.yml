# The barista vendor's leaflet, now telling the kettle way.

- type: entity
  parent: Paper
  id: WGPaperBrewingGuide
  name: brewing leaflet
  description: A folded leaflet on brewing a proper pot.
  components:
  - type: Paper
    content: wg-brew-leaflet

# Cargo: tea pouches and coffee grounds, for a galley without a garden.

- type: entity
  parent: CrateGenericSteel
  id: WGCrateTea
  name: tea crate
  description: Pouches of black, green, chamomile, berry and fruit tea, and coffee grounds, for brewing in a kettle.
  components:
  - type: StorageFill
    contents:
    - id: ReagentContainerBlackTeaPouch
      amount: 2
    - id: ReagentContainerGreenTeaPouch
      amount: 2
    - id: ReagentContainerChamomileTeaPouch
      amount: 2
    - id: ReagentContainerBerryTeaPouch
      amount: 2
    - id: ReagentContainerFruitTeaPouch
      amount: 2
    - id: ReagentContainerCoffeePouch
      amount: 2
    - id: WGPaperBrewingGuide

- type: cargoProduct
  id: WGTea
  icon:
    sprite: _WG/Cooking/brewing.rsi
    state: tea_dried
  product: WGCrateTea
  cost: 700
  category: cargoproduct-category-name-service
  group: market
