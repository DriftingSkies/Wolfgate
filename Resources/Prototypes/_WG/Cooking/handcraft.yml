# Cookware made by hand from the construction menu, so a kitchen can be kitted out anywhere.

- type: constructionGraph
  id: WGCookBowlGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      steps:
      - material: WoodPlank
        amount: 1
        doAfter: 1
  - node: built
    entity: WGCookBowl

- type: construction
  name: wooden bowl
  id: WGCookBowlRecipe
  graph: WGCookBowlGraph
  startNode: start
  targetNode: built
  category: construction-category-tools
  description: "A wooden bowl for soup and stew."
  icon:
    sprite: _WG/Cooking/cookware.rsi
    state: wgcookbowl
  objectType: Item

