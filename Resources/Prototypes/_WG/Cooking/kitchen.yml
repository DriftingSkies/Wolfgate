- type: entity
  parent: BaseStructure
  id: WGHearthStove
  name: hearth stove
  description: A brick oven with a hob on top that burns wood like a fireplace. Feed it planks or logs, light it with a flame, then set a pan or a pot on the hob and put dishes in the oven. Keep an eye on them so they don't burn.
  components:
  - type: Construction
    graph: WGHearthStoveGraph
    node: built
  - type: Sprite
    sprite: _WG/Cooking/hearth_stove.rsi
    layers:
    - state: oven
    - state: oven-lit
      map: [ "lit" ]
      shader: unshaded
      visible: false
    - state: hob-pan
      map: [ "hob" ]
      offset: 0,0.35
      scale: 0.7,0.7
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WGHobVisuals.Lit:
        lit:
          True: { visible: true }
          False: { visible: false }
      enum.WGHobVisuals.Cookware:
        hob:
          None: { visible: false }
          Pan: { visible: true, state: hob-pan }
          Pot: { visible: true, state: hob-pot }
  - type: WGBonfireFuel
    fuel: 0
    lit: false
  - type: PointLight
    enabled: false
    radius: 2
    energy: 1.5
    color: "#FF6F00"
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 4
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: Anchorable
  - type: WGHearth
  - type: UserInterface
    interfaces:
      enum.WGStirUiKey.Key:
        type: WGStirBoundUserInterface
  - type: ContainerContainer
    containers:
      wg-hob: !type:ContainerSlot
      wg-oven: !type:Container
  - type: StaticPrice
    price: 60
  - type: GuideHelp
    guides:
    - WGCooking
    - FoodRecipes

