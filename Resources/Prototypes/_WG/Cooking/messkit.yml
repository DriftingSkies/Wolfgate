# The mess kit: a folding camp stove and the cookware and utensils to cook a meal anywhere, offered in every job's
# loadout (see WGUniversalLoadoutSystem).

- type: entity
  parent: BaseItem
  id: WGCampStove
  name: folding camp stove
  description: A little fuel stove that folds flat. Set it on the ground and put a pan or a pot on it; it needs no power, but it has no oven.
  components:
  - type: Construction
    graph: WGCampStoveGraph
    node: built
  - type: Sprite
    sprite: _WG/Cooking/props.rsi
    layers:
    - state: camp_stove
      map: [ "stove" ]
  - type: GenericVisualizer
    visuals:
      enum.WGHobVisuals.Lit:
        stove:
          True: { state: camp_stove_lit }
          False: { state: camp_stove }
  - type: Item
    size: Normal
  - type: WGHearth
    ovenCapacity: 0
    heat: 0.75
    needsAnchor: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      wg-hob: !type:ContainerSlot
      wg-oven: !type:Container
  - type: UserInterface
    interfaces:
      enum.WGStirUiKey.Key:
        type: WGStirBoundUserInterface
  - type: StaticPrice
    price: 60

- type: entity
  parent: BaseItem
  id: WGCuttingBoard
  name: folding cutting board
  description: A small board that folds in half. Lay a few ingredients on it, then use it to chop them and put them together, the same as a prep board.
  components:
  - type: Construction
    graph: WGCuttingBoardGraph
    node: built
  - type: Sprite
    sprite: _WG/Cooking/props.rsi
    state: cutting_board
  - type: Item
    size: Normal
  - type: WGPrepBoard
    capacity: 4
  - type: ContainerContainer
    containers:
      wg-board: !type:Container
  - type: ActivatableUI
    key: enum.WGPrepBoardUiKey.Key
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.WGPrepBoardUiKey.Key:
        type: WGPrepBoardBoundUserInterface
  - type: StaticPrice
    price: 30

- type: entity
  parent: BoxCardboard
  id: WGMessKit
  name: mess kit
  description: A tin of cooking gear for meals away from a kitchen - a folding stove, a pan, a cutting board, a bowl, a spoon, a fork, a knife, and salt and pepper.
  components:
  - type: Item
    size: Large
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,6,3
  - type: StorageFill
    contents:
    - id: WGCampStove
    - id: WGCookPan
    - id: WGCuttingBoard
    - id: WGCookBowl
    - id: Spoon
    - id: Fork
    - id: KitchenKnife
    - id: FoodCondimentPacketSalt
      amount: 2
    - id: FoodCondimentPacketPepper
      amount: 2
  - type: Sprite
    sprite: _WG/Cooking/props.rsi
    state: messkit

- type: loadout
  id: WGMessKitLoadout
  storage:
    back:
    - WGMessKit

- type: loadoutGroup
  id: WGGroupMessKit
  name: loadout-group-wg-mess-kit
  minLimit: 0
  maxLimit: 1
  loadouts:
  - WGMessKitLoadout

- type: wgUniversalLoadoutGroup
  id: WGMessKit
  group: WGGroupMessKit
