# The Choir's mark over a member's head: a white C on red, seen by ghosts, admins and other members.
- type: factionIcon
  id: WGChoirFaction
  priority: 11
  visibleToGhosts: true
  showTo:
    components:
    - ShowAntagIcons
    - WGChoirMember
  icon:
    sprite: /Textures/_WG/Lattice/choir_icon.rsi
    state: choir

# Lists a Choir player as an antagonist in admin tools.
- type: antag
  id: WGChoirAntag
  name: wg-choir-antag-name
  antagonist: true
  setPreference: false
  objective: wg-choir-antag-objective

- type: entity
  parent: BaseMindRoleAntag
  id: WGMindRoleChoir
  name: Choir Role
  components:
  - type: MindRole
    antagPrototype: WGChoirAntag
    roleType: TeamAntagonist
  - type: WGChoirRole

# Cutting the song out of a Choir member: saw the skull, then excise it with a shard of exotic matter. Most wake free;
# some die on the table and rise Remade. Not in the Coda, where the song is too loud.
- type: entity
  parent: SurgeryBase
  id: WGSurgeryExciseSong
  name: Excise the Song
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - WGLatticeStepExciseSong
  - type: SurgeryPartCondition
    part: Head
  - type: WGSongExcisionCondition

- type: entity
  parent: SurgeryStepBase
  id: WGLatticeStepExciseSong
  name: Excise the song
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tool:
    - type: WGSongExcisionTool
    duration: 15
  - type: Sprite
    sprite: Nyanotrasen/Objects/Materials/materials.rsi
    state: bluespace
  - type: WGSongExcisionEffect
  - type: SurgeryStepEmoteEffect
