- type: entity
  id: WGDoomedScenarioStation
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  categories: [ HideSpawnMenu ]
  # Round-scoped private stations are rebuilt each round and never saved with a map.
  save: false
  components:
  - type: WGDoomedScenarioStation
  - type: StationJobs
    availableJobs:
      Contractor: [ -1, -1 ]
      Pilot: [ -1, -1 ]
      Mercenary: [ -1, -1 ]
      StationEngineer: [ -1, -1 ]
      MedicalDoctor: [ -1, -1 ]
      AtmosphericTechnician: [ -1, -1 ]
      MdMedic: [ -1, -1 ]
      Chemist: [ -1, -1 ]
      Paramedic: [ -1, -1 ]
      SalvageSpecialist: [ -1, -1 ]
      Scientist: [ -1, -1 ]
      CargoTechnician: [ -1, -1 ]
      Botanist: [ -1, -1 ]
      Chef: [ -1, -1 ]
      Bartender: [ -1, -1 ]
      Janitor: [ -1, -1 ]
      Borg: [ -1, -1 ]

# Down With Ye' Ship!: three tier 4-5 Reaver warships round the SY Reach, fighting to the last man.
# Spawned by WGDoomedScenarioSystem on the crew's first arrival, which orders each ship to attack the Reach.
- type: wgEncounter
  id: WGDoomedReaverAmbush
  name: wg-round-setup-doomed-ambush
  start: Manual
  lifetime: Transient
  category: Threat
  icon: Skull
  duration: 3600
  ships:
  - key: alpha
    navigation: WGCrewNavigationRaider
    side: reavers
    faction: WGAshfallReavers
    distress: false
    company: WGAshfallReavers
    profile: WGCrewProfilePirate
    vessels: [ Kalisto, Metis, Bastion, Garm ]
    tiers:
    - minTier: 4
      vessels: [ Kalisto, Metis, Bastion, Garm ]
      skills: [ Regular, Veteran ]
      retrofit: WGPirateRetrofitGrime
    - minTier: 5
      vessels: [ Kalisto, Metis, Bastion, Garm ]
      skills: [ Veteran ]
      retrofit: WGPirateRetrofitGrime
    offset: 0, 800
    deckhands: 2
    engineer: false
    evades: false
    warnRange: 1500
    attackRange: 1200
    zoneLines: wg-encounter-pirate-zone
    disengage: Destroy
