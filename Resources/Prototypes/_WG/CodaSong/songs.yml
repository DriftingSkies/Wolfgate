# The song the Coda sings in a drifting mind, and that a fragment's heart sings to anyone near it. Each piece is
# stems from its generator (make_hymn.py, kept outside the repo) --stems; WGCodaSongSystem mixes them live from the listener's Drift.

# A lullaby in three; the first thing a drifting mind hears.
- type: wgCodaSong
  id: WGCodaSongNocturne
  seconds: 75.0
  minDrift: 8
  maxDrift: 45
  stems:
    soprano: /Audio/_WG/CodaSong/nocturne/soprano.ogg
    alto: /Audio/_WG/CodaSong/nocturne/alto.ogg
    tenor: /Audio/_WG/CodaSong/nocturne/tenor.ogg
    bass: /Audio/_WG/CodaSong/nocturne/bass.ogg
    profondo: /Audio/_WG/CodaSong/nocturne/profondo.ogg
  turned:
    soprano: /Audio/_WG/CodaSong/nocturne/soprano_turned.ogg
    alto: /Audio/_WG/CodaSong/nocturne/alto_turned.ogg
    tenor: /Audio/_WG/CodaSong/nocturne/tenor_turned.ogg
    bass: /Audio/_WG/CodaSong/nocturne/bass_turned.ogg
    profondo: /Audio/_WG/CodaSong/nocturne/profondo_turned.ogg

