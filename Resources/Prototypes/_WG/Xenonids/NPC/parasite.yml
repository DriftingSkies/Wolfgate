# Admin facehugger AI: leap at a target in range, otherwise chase and bite it, otherwise idle.
- type: htnCompound
  id: WGParasiteHunterCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: WGParasiteLeapCompound
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

# The infecting hugger only leaps at hosts it can still infect.
- type: htnCompound
  id: WGParasiteInfectorCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: WGParasiteInfectLeapCompound
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: htnCompound
  id: WGParasiteLeapCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: WGParasiteLeapTargets
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: WGLeapRange
      - !type:TargetInLOSPrecondition
        targetKey: Target
        rangeKey: WGLeapRange
      operator: !type:WGLeapOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: IdleTime
        amount: 4
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: IdleTime
      operator: !type:WaitOperator
        key: IdleTime

- type: htnCompound
  id: WGParasiteInfectLeapCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: WGParasiteInfectTargets
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: WGLeapRange
      - !type:TargetInLOSPrecondition
        targetKey: Target
        rangeKey: WGLeapRange
      operator: !type:WGLeapOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: IdleTime
        amount: 4
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: IdleTime
      operator: !type:WaitOperator
        key: IdleTime

- type: utilityQuery
  id: WGParasiteLeapTargets
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve
  - !type:TargetInLOSOrCurrentCon
    curve: !type:BoolCurve

- type: utilityQuery
  id: WGParasiteInfectTargets
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:WGTargetInfectableCon
    curve: !type:BoolCurve
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve
  - !type:TargetInLOSOrCurrentCon
    curve: !type:BoolCurve
