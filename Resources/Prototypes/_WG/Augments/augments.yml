# Every piece of cyberware a character can carry between rounds, and the choices in the creator's Augments tab.
# A new cybernetic part, organ or upgrading autosurgeon belongs here too, or it is lost at the end of each round.

- type: wgAugment
  id: WGAugmentCyberLeftArm
  name: wg-augment-cyber-arm
  description: wg-augment-cyber-arm-desc
  slot: LeftArm
  kind: Limb
  part: WGAugmentLeftArm
  styled: true

- type: wgAugment
  id: WGAugmentCyberRightArm
  name: wg-augment-cyber-arm
  description: wg-augment-cyber-arm-desc
