# Traits that put their own limbs or organs in the body at spawn. A character with one can't take augments in these
# slots. Hands, feet and implants under a trait's limbs are put back after it runs (WGAugmentSystem.Traits.cs).

- type: wgAugmentTraitSlots
  id: PrybarProsthetics
  slots: [ LeftArm, RightArm ]

- type: wgAugmentTraitSlots
  id: BionicLegs
  slots: [ LeftLeg, RightLeg ]

# The tumor replaces the heart.
- type: wgAugmentTraitSlots
  id: WGHemophagia
  slots: [ Heart ]

- type: wgAugmentTraitSlots
  id: WGHemophagiaMasquerade
  slots: [ Heart ]

# The dwarf liver replaces the liver.
- type: wgAugmentTraitSlots
  id: LiquorLifeline
  slots: [ Liver ]
