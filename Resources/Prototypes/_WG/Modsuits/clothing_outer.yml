## Parent File to easily add more attributes, here it's used for plasmaman mostly
- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterModsuitBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/standard.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: ClothingModsuitChestplateBase
  components:
  - type: AllowSuitStorage
  - type: WGSuitTankStorage
  - type: Storage
    grid:
    - 0,0,1,1
    maxItemSize: Normal
    whitelist:
      components:
      - GasTank
    blacklist:
      components:
      - Jetpack
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
      storagebase: !type:Container
        ents: []

- type: entity
  parent: ClothingModsuitChestplateBase
  id: ClothingModsuitChestplateStandard
  name: standard modsuit chestplate
  description: A special modular suit spaceproof cover designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  # Armor specialization: cold seal.
  - type: WGWoundWard
    examine: wg-armor-spec-cold-sealed-examine
    blocks:
    - WGWolfmedFrostbiteWound
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/standard.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  - type: ModPart
    sealUpPopup: modsuit-part-seal-up-chestplate
    sealDownPopup: modsuit-part-seal-down-chestplate
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed-resomi
  - type: StaminaDamageResistance
    coefficient: 0.9
  - type: Armor
    coverage:
    - Torso
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.2
  - type: ModSealedComponents
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coolingCoefficient: 0.01
      heatingCoefficient: 0.01
  - type: FireProtection
    reduction: 0.5

- type: entity
  parent: ClothingModsuitChestplateBase
  id: ClothingModsuitChestplateSecurity
  name: soldat modsuit chestplate
  description: A robust modular suit cover with ceramic inserts for extra protection.
  categories: [ HideSpawnMenu ]
  components:
