# Wilhelmina Farrow, the clothier at Caelestinus Central.
- type: humanoidProfile
  id: WGTraderClothesProfile
  profile:
    name: Wilhelmina Farrow
    species: Human
    age: 52
    sex: Female
    gender: Female
    appearance:
      hair: HumanHairBun
      hairColor: "#C8C2B8"
      facialHair: FacialHairShaved
      facialHairColor: "#C8C2B8"
      eyeColor: "#5C7A6B"
      skinColor: "#D9A876"

- type: startingGear
  id: WGTraderClothesGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitLoungewear
    outerClothing: ClothingOuterVest
    head: ClothingHeadHatBowlerHat
    shoes: ClothingShoesBootsLaceup
    gloves: ClothingHandsGlovesColorWhite

- type: traderDialogue
  id: WGTraderClothesDialogue
  greeting: trader-clothes-greeting
  farewell: trader-clothes-farewell
  options:
  - prompt: trader-clothes-prompt-shop
    response: trader-clothes-response-shop
    action: OpenShop
  - prompt: trader-clothes-prompt-who
    response: trader-clothes-response-who
    action: None

- type: entity
  id: WGTraderClothes
  parent: WGBaseTrader
  name: Wilhelmina Farrow
  description: Runs the clothing stall; sturdy uniforms and work boots.
  suffix: Trader, Clothes
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WGTraderClothesProfile
  - type: Loadout
    prototypes: [ WGTraderClothesGear ]
  - type: Trader
    dialogue: WGTraderClothesDialogue
  - type: TraderShop
    vendors: [ VendingMachineClothing ]
