# A killable trader's brain. It has no weapon and never fights: it stands about, and runs for the tile that
# TraderFleeSystem writes to WGTraderFleeTarget while somebody who hurt it is near.
- type: htnCompound
  id: WGTraderCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WGTraderFleeTarget
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        targetKey: WGTraderFleeTarget
        rangeKey: MovementRange
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime

# The same, with a hunger: he walks to the body TraderDevourSystem writes to WGTraderMealTarget, unless he is running.
- type: htnCompound
  id: WGTraderDevourCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WGTraderFleeTarget
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        targetKey: WGTraderFleeTarget
        rangeKey: MovementRange
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WGTraderMealTarget
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        targetKey: WGTraderMealTarget
        rangeKey: MovementRange
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime
