# Otho Kessler, the EVA outfitter at Caelestinus Central.
- type: humanoidProfile
  id: WGTraderAstroProfile
  profile:
    name: Otho Kessler
    species: Human
    age: 58
    sex: Male
    gender: Male
    appearance:
      hair: HumanHairBalding
      hairColor: "#9C9990"
      facialHair: HumanFacialHairFullbeard
      facialHairColor: "#9C9990"
