# NPCs who play games for a stake (Content.Server/_WG/Minigames). Each PlayMinigame dialogue option names an offer of
# the WGMinigameHost component by index in its argument.

# A trader with the game window. UserInterface.interfaces is replaced wholesale by a child, so WGBaseTrader's entries
# are carried forward.
- type: entity
  id: WGBaseMinigameHost
  parent: WGBaseTrader
  abstract: true
  components:
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      # Shitmed
      enum.SurgeryUIKey.Key:
        type: SurgeryBui
      enum.TraderUiKey.Dialogue:
        type: TraderBoundUserInterface
        interactionRange: 3.5
      enum.TraderUiKey.Shop:
        type: TraderBoundUserInterface
        interactionRange: 3.5
      enum.TraderUiKey.UsedShips:
        type: TraderBoundUserInterface
        interactionRange: 3.5
      enum.WGMinigameUiKey.Key:
        type: MinigameBoundUserInterface
        interactionRange: 3.5

# Off the station: killable and unarmed, and runs when hurt (TraderFleeSystem).
- type: entity
  id: WGBaseMinigameHostWild
  parent: WGBaseMinigameHost
  abstract: true
  components:
  - type: WGCowardice
  - type: HTN
    rootTask:
      task: WGTraderCompound
    blackboard:
      NavInteract: !type:Bool
        true

# Vesna Kade, the card and dice dealer at Caelestinus Central.
- type: humanoidProfile
  id: WGMinigameDealerProfile
  profile:
    name: Vesna Kade
    species: Human
    age: 34
    sex: Female
    gender: Female
    appearance:
      hair: HumanHairBun
      hairColor: "#2B1B14"
      facialHair: FacialHairShaved
      facialHairColor: "#2B1B14"
      eyeColor: "#4A6B3A"
      skinColor: "#D8A982"

- type: startingGear
  id: WGMinigameDealerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitBartender
    outerClothing: ClothingOuterVest
    neck: ClothingNeckTieRed
    shoes: ClothingShoesColorBlack

- type: traderDialogue
  id: WGMinigameDealerDialogue
  greeting: wg-minigame-dealer-greeting
  farewell: wg-minigame-dealer-farewell
  options:
  - prompt: wg-minigame-dealer-prompt-cards
    response: wg-minigame-dealer-response-cards
    action: PlayMinigame
    argument: "0"
  - prompt: wg-minigame-dealer-prompt-dice
    response: wg-minigame-dealer-response-dice
    action: PlayMinigame
    argument: "1"
  - prompt: wg-minigame-dealer-prompt-lock
    response: wg-minigame-dealer-response-lock
    action: PlayMinigame
    argument: "2"
  - prompt: wg-minigame-prompt-rules
    response: wg-minigame-dealer-response-rules

- type: entity
  id: WGMinigameDealer
  parent: WGBaseMinigameHost
  name: Vesna Kade
  description: Deals cards, rolls dice and keeps a lockbox. Pay to play; the house pays big when it loses.
  suffix: Minigames, Dealer
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WGMinigameDealerProfile
  - type: Loadout
    prototypes: [ WGMinigameDealerGear ]
  - type: Trader
    dialogue: WGMinigameDealerDialogue
  - type: WGMinigameHost
    dailyCap: 40000
    offers:
    - game: HigherLower
      difficulty: Normal
      stake: 1000
    - game: LiarsDice
      difficulty: Normal
      stake: 2000
    - game: Lockbox
      difficulty: Normal
      stake: 2500

