# Debug content for the rope core, kept next to the real eye and coils; nothing here should be
# referenced by maps or cargo.
- type: stack
  id: WGRopeDebug
  name: rope-name-debug
  icon: { sprite: "/Textures/Objects/Tools/cable-coils.rsi", state: coillv-30 }
  spawn: WGRopeCoilDebug1
  maxCount: 30

- type: entity
  id: WGRopeAttachPointDebug
  name: tether eye
  suffix: Debug
  description: A ring bolted to the hull. Rope can be tied to it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Wallmounts/bell.rsi
    state: bell
  - type: RopeAttachPoint
    maxRopes: 2

- type: entity
  id: WGRopeCoilDebug
  parent: BaseItem
  name: rope coil
  suffix: Debug, Full
  description: A coil of plain rope. Use it on one tether eye, then on another.
  components:
  - type: Sprite
    sprite: Objects/Tools/cable-coils.rsi
    state: coillv-30
  - type: Item
    sprite: Objects/Tools/cable-coils.rsi
    heldPrefix: coillv
    size: Small
    storedRotation: -90
  - type: Stack
    stackType: WGRopeDebug
    count: 30
  - type: RopeCoil
    ropeType: WGRopeDebug
    metresPerUnit: 1
    slack: 1.15

- type: entity
  id: WGRopeCoilDebug1
  parent: WGRopeCoilDebug
  suffix: Debug, 1
  components:
  - type: Sprite
    state: coillv-10
  - type: Stack
    count: 1
