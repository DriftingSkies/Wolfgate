#Created by SylvaraWasTaken on github, Sylvaratayn on Discord
- type: vessel
  id: WGAsfSurveyor
  parent: BaseVessel
  name: 'ASF Surveyor'
  description: 'a ubiquitous ASF mining shuttle, seen all throughout their expanding territories, equipped with two M12 mining lasers and two side-mounted Flutter lasers. The Surveyor embodies ASF design principles: emphasizing crew safety, redundant systems, and defensive design, with wide turret arcs, powerful forward thrusters, and common use of shield generators. The generators are split apart on opposite sides of the ship, preventing any one critical hit from completely disabling the ship, and the cockpit is located dead-center with most critical systems, allowing the pilot to survive and escape even severe damage.  A relatively peaceful faction, the ASF have a severe lack of military shipyards, and so many of their most common hulls are refitted civilian ships. As such, the armor and defensive weaponry on the Surveyor is particularly light, relying more on shields and evasiveness to avoid combat and flee to safe locations.'
  price: 86000 # initialized appraisal at 85704
  category: Small # 189 tiles
  group: Custom
  shuttlePath: /SharedMaps/_WG/Asf/surveyor.yml
  guidebookPage: WGShipyardAsfSurveyor
  class:
  - Salvage
  engine:
  - Uranium

- type: gameMap
