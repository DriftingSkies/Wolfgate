# Astraeus Reward Grants (ARG): paid by the Lantern Post bounty console, spent at the ASF grant kiosk.

- type: currency
  id: WGAsfRewardGrant
  displayName: wg-asf-grant-currency
  cash:
    1: WGAsfRewardGrant1
  canWithdraw: true

- type: stack
  id: WGAsfRewardGrant
  name: wg-asf-grant-stack
  icon: { sprite: _WG/Asf/Objects/grant_ticket.rsi, state: ticket }
  spawn: WGAsfRewardGrant1

- type: entity
  parent: BaseItem
  id: WGAsfRewardGrant
  suffix: 100 ARG
  components:
  - type: Sprite
    sprite: _WG/Asf/Objects/grant_ticket.rsi
    state: ticket
  - type: Item
    sprite: _WG/Asf/Objects/grant_ticket.rsi
    size: Tiny
  - type: Stack
    count: 100
    stackType: WGAsfRewardGrant
  - type: StaticPrice
    price: 0
  - type: Currency
    price:
      WGAsfRewardGrant: 1

- type: entity
  parent: WGAsfRewardGrant
  id: WGAsfRewardGrant1
  suffix: 1 ARG
  components:
  - type: Stack
    count: 1

- type: entity
  parent: WGAsfRewardGrant
  id: WGAsfRewardGrant10
  suffix: 10 ARG
  components:
  - type: Stack
    count: 10

# Grant kiosk: the MMC requisition kiosk in ASF purple, for ASF crew only.
- type: entity
  parent: VendingMachine
  id: WGAsfGrantKiosk
  components:
  - type: VendingMachine
    offState: off
    brokenState: broken
    normalState: asf-unshaded
  - type: Advertise
    pack: FactionUplinkAds
  - type: Sprite
    sprite: _WG/Asf/Structures/grant_kiosk.rsi
    layers:
    - state: asf
      map: [ "enum.VendingMachineVisualLayers.Base" ]
    - state: asf-unshaded
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded" ]
      shader: unshaded
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: PointLight
    radius: 1.5
    energy: 1.3
    color: "#A66BE0"
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    name: wg-asf-grant-kiosk-store
    categories:
    - WGAsfGrantVouchers
    - WGAsfGrantArms
    - WGAsfGrantGear
    - WGAsfGrantResearch
    balance:
      WGAsfRewardGrant: 0
    currencyWhitelist:
    - WGAsfRewardGrant
  - type: AccessReader
    access: [["WGAsf"]]
  - type: CompanyAccessReader
    requiredCompanies:
    - WGAsf

- type: storeCategory
  id: WGAsfGrantVouchers
  name: wg-asf-grant-category-vouchers
  priority: 0

- type: storeCategory
  id: WGAsfGrantArms
  name: wg-asf-grant-category-arms
  priority: 1

- type: storeCategory
  id: WGAsfGrantGear
  name: wg-asf-grant-category-gear
  priority: 2

- type: storeCategory
  id: WGAsfGrantResearch
  name: wg-asf-grant-category-research
  priority: 3

