# Lantern Post bounties: monolithic crystals and alien artifacts, paid in ARG (WGAsfRewardGrant).
# A crystal pays about 1.25 ARG per 1,000 spesos of its sale price. Artifact bounties ask for an effect an artifact
# keeps for good once its node is reached, so the property is still there when it is shipped.

- type: Tag
  id: WGMonolithicCrystalSmall

- type: Tag
  id: WGMonolithicCrystalMedium

- type: Tag
  id: WGMonolithicCrystalLarge

# Crystals

- type: cargoBounty
  id: WGAsfBountyCrystalSmall
