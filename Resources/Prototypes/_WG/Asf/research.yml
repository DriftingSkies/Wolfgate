- type: entity
  id: WGAsfResearchServer
  parent: BaseRdServerFaction
  components:
  - type: TechnologyDatabase
    supportedDisciplines:
    - WGAsf
    - FactionUniversal
    - Industrial
    - Arsenal
    - Experimental
    - CivilianServices
    - MechaEngineering

- type: entity
  id: WGAsfLathe
  parent: [BaseLatheLube, BaseStructureDisableToolUse]
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - sprite: _WG/Asf/Structures/fabricator.rsi
      state: techfab-asf
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: ProtolatheMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg
    idleState: icon
    runningState: icon
    staticPacks:
    - RoundstartShipgunAmmo
    dynamicPacks:
    - WGAsfResearch
    # universal shipgun ammo, as on every faction lathe
    - UniversalRailgunAmmo
    - UniversalMissileAmmo
    - UniversalShellAmmo
    - UniversalOrdinance
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: RequireProjectileTarget
