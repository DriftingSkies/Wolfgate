  name: wg-asf-research-discipline
  color: "#A66BE0"
  icon:
    sprite: _WG/Asf/Interface/research_disciplines.rsi
    state: asf
  tierPrerequisites:
    1: 0
    2: 0.5
    3: 0.5
  uiName: ASF

