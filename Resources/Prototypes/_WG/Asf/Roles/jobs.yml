  - ContractorBoxSurvival
  - ContractorWallet
  - ContractorCartridge
  - ContractorImplanter
  - ContractorUtility
  - ContractorFun
  - ContractorTrinkets
  - ContractorBureaucracy
  - NFSpeciesSpecific

- type: jobIcon
  parent: JobIcon
  id: JobIconWGAsfEnvoy
  icon:
    sprite: /Textures/_WG/Asf/Interface/job_icons.rsi
    state: Envoy
  jobName: wg-asf-job-envoy
  allowSelection: false

- type: entity
  parent: IDCardStandard
  id: WGAsfEnvoyIDCard
  components:
  - type: Sprite
    sprite: _WG/Asf/Objects/Misc/id_cards.rsi
    layers:
    - state: asfbase
    - state: idasfenvoy
  - type: PresetIdCard
    job: WGAsfEnvoy

- type: entity
  parent: BasePDA
  id: WGAsfEnvoyPDA
  components:
  - type: Pda
    id: WGAsfEnvoyIDCard
  - type: Sprite
    sprite: _WG/Asf/Objects/Devices/pda.rsi
  - type: Icon
    sprite: _WG/Asf/Objects/Devices/pda.rsi
    state: pda-envoy
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-envoy
  - type: PdaBorderColor
    borderColor: "#7B52B8"
    accentVColor: "#EBC913"

- type: entity
  parent: SpawnPointJobBase
  id: WGAsfSpawnPointEnvoy
  components:
  - type: SpawnPoint
    job_id: WGAsfEnvoy
  - type: Sprite
    sprite: _WG/Asf/Structures/Banners/federation.rsi
    state: asf-federation-banner

