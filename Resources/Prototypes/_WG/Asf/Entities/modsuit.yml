# ASF field modsuit: the Minerva (RD) modsuit re-plated for field work. Armour matches the TSF M82c; the chestplate
# takes armour plates like every modsuit. The Aegis upgrade adds a built-in hardlight shield module on the control
# unit; it only runs while the suit is sealed, so alt-clicking the shield cannot unseal the chestplate.

# Field

- type: entity
  parent: [ ClothingModsuitBase, BaseFactionGearOtherFactionT2 ]
  id: WGAsfClothingModsuitField
  components:
  - type: Contraband
    allowedDepartments: [ WGAsf ]
  - type: Sprite
    sprite: _WG/Asf/Clothing/Back/modsuit.rsi
  # WOLFGATE(Modsuits): the native module system owns the suit parts
  - type: ModSuit
    theme: ModThemeResearch
    parts:
      head: WGAsfClothingModsuitHelmetField
      gloves: WGAsfClothingModsuitGauntletsField
      outerClothing: WGAsfClothingModsuitChestplateField
      shoes: WGAsfClothingModsuitBootsField
    inbuiltModules:
    - ModsuitModuleVoidBoots
  - type: StaticPrice
    price: 5000

- type: entity
  parent: WGAsfClothingModsuitField
  id: WGAsfClothingModsuitFieldPowerCell
  suffix: High-Capacity Battery
  components:
  - type: ModSuit
    startingModules:
    - ModsuitModuleStorageCompact
    - ModsuitModuleFlashlight
    - ModsuitModuleJetpack
    - ModsuitModulePepperShoulders
    - ModsuitModuleRestraintAssist
    - ModsuitModuleHeadProtector
    inbuiltModules:
    - ModsuitModuleBuiltinInsulation
    - ModsuitModuleVoidBoots
  # WOLFGATE(Modsuits): a MOD core replaces the power cell
  - type: ItemSlots
    slots:
      mod-core:
        name: modsuit-core-slot-name
        whitelistFailPopup: modsuit-core-slot-wrong-item
        lockedFailPopup: modsuit-core-slot-locked
        startingItem: ModsuitCoreStandardHighCapacity
        whitelist:
          components:
          - ModCore

- type: entity
  parent: ClothingModsuitHelmetResearchDirector
  id: WGAsfClothingModsuitHelmetField
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/Head/modsuit.rsi
  - type: NightVision # dual-tube, ASF lilac phosphor
    relayOverlay: true
    goggleEffect: true
    viewCircleRadius: 450
    viewCircleCount: 2
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#C99CF5"
    lightingColor: "#FFFFFF32"
  - type: Armor
    coverage: [Head]
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.9
        Radiation: 0.5

- type: entity
  parent: ClothingModsuitGauntletsResearchDirector
  id: WGAsfClothingModsuitGauntletsField
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/Hands/modsuit.rsi

- type: entity
  parent: ClothingModsuitChestplateResearchDirector
  id: WGAsfClothingModsuitChestplateField
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/OuterClothing/modsuit.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.6
        Heat: 0.65
        Shock: 0.85
        Radiation: 0.4 # kept from the Minerva's lab heritage
        Caustic: 0.7
  - type: StaminaDamageResistance
    coefficient: 0.3
  - type: HarpyHideWings # covers harpy and IPC wings, as hardsuits do

- type: entity
  parent: ClothingModsuitBootsResearchDirector
  id: WGAsfClothingModsuitBootsField
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/Shoes/modsuit.rsi

# Aegis: same armour, plus a hardlight personal shield in the control unit; grey armour so it reads apart

- type: entity
  parent: [ WGAsfClothingModsuitField, BaseFactionGearOtherFactionT3 ]
  id: WGAsfClothingModsuitAegis
  components:
  - type: Contraband
    severity: OtherFactionGear3
    allowedDepartments: [ WGAsf ]
    turnInValues:
      FederationMilitaryCredit: 45
      Doubloon: 45
  - type: Sprite
    sprite: _WG/Asf/Clothing/Back/modsuit_aegis.rsi
  # WOLFGATE(Modsuits): the native module system owns the suit parts
  - type: ModSuit
    theme: ModThemeResearch
    parts:
      head: WGAsfClothingModsuitHelmetAegis
      gloves: WGAsfClothingModsuitGauntletsAegis
      outerClothing: WGAsfClothingModsuitChestplateAegis
      shoes: WGAsfClothingModsuitBootsAegis
    inbuiltModules:
    - ModsuitModuleBuiltinAegisShield
    - ModsuitModuleVoidBoots
  - type: ExtendDescription
    descriptionList:
    - description: wg-asf-modsuit-aegis-shield-hint
      color: "#A66BE0"
      requireDetailRange: true
  - type: StaticPrice
    price: 9000

- type: entity
  parent: WGAsfClothingModsuitAegis
  id: WGAsfClothingModsuitAegisPowerCell
  suffix: High-Capacity Battery
  components:
  - type: ModSuit
    startingModules:
    - ModsuitModuleStorageCompact
    - ModsuitModuleFlashlight
    - ModsuitModuleJetpack
    - ModsuitModulePepperShoulders
    - ModsuitModuleRestraintAssist
    - ModsuitModuleHeadProtector
    inbuiltModules:
    - ModsuitModuleBuiltinInsulation
    - ModsuitModuleBuiltinAegisShield
    - ModsuitModuleVoidBoots
  # WOLFGATE(Modsuits): a MOD core replaces the power cell
  - type: ItemSlots
    slots:
      mod-core:
        name: modsuit-core-slot-name
        whitelistFailPopup: modsuit-core-slot-wrong-item
        lockedFailPopup: modsuit-core-slot-locked
        startingItem: ModsuitCoreStandardHighCapacity
        whitelist:
          components:
          - ModCore

- type: entity
  parent: WGAsfClothingModsuitHelmetField
  id: WGAsfClothingModsuitHelmetAegis
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/Head/modsuit_aegis.rsi

- type: entity
  parent: WGAsfClothingModsuitGauntletsField
  id: WGAsfClothingModsuitGauntletsAegis
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/Hands/modsuit_aegis.rsi

- type: entity
  parent: WGAsfClothingModsuitChestplateField
  id: WGAsfClothingModsuitChestplateAegis
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/OuterClothing/modsuit_aegis.rsi

- type: entity
  parent: WGAsfClothingModsuitBootsField
  id: WGAsfClothingModsuitBootsAegis
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WG/Asf/Clothing/Shoes/modsuit_aegis.rsi
