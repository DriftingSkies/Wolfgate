- type: entity
  parent: EncryptionKey
  id: WGAsfEncryptionKey
  components:
  - type: EncryptionKey
    channels:
    - WGAsf
    defaultChannel: WGAsf
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: com_label

- type: entity
  parent: ClothingHeadsetAlt
  id: WGAsfClothingHeadset
  components:
  - type: Sprite
    sprite: Clothing/Ears/Headsets/science.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/science.rsi
  - type: ContainerFill
    containers:
      key_slots:
      - WGAsfEncryptionKey # first key's default channel wins
      - EncryptionKeyCommon

- type: entity
  parent: DoorElectronics
  id: WGAsfDoorElectronics
  suffix: ASF, Locked
  components:
  - type: AccessReader
    access: [["WGAsf"]]

- type: entity
  parent: DoorElectronics
  id: WGAsfDoorElectronicsBridge
  suffix: ASF Bridge, Locked
  components:
  - type: AccessReader
    access: [["WGAsfBridge"]]

- type: entity
  parent: DoorElectronics
  id: WGAsfDoorElectronicsSecurity
  suffix: ASF Security, Locked
  components:
  - type: AccessReader
    access: [["WGAsfSecurity"]]

- type: entity
  parent: DoorElectronics
  id: WGAsfDoorElectronicsCommand
  suffix: ASF Command, Locked
  components:
  - type: AccessReader
    access: [["WGAsfCommand"]]

- type: entity
  parent: AirlockScience
  id: WGAsfAirlock
  suffix: ASF, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ WGAsfDoorElectronics ]

- type: entity
  parent: AirlockScienceGlass
  id: WGAsfAirlockGlass
  suffix: ASF, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ WGAsfDoorElectronics ]

- type: entity
  parent: AirlockScience
  id: WGAsfAirlockCommand
  suffix: ASF Command, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ WGAsfDoorElectronicsCommand ]

- type: entity
  parent: AirlockScience
  id: WGAsfAirlockBridge
  suffix: ASF Bridge, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ WGAsfDoorElectronicsBridge ]

- type: entity
  parent: AirlockScience
  id: WGAsfAirlockSecurity
  suffix: ASF Security, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ WGAsfDoorElectronicsSecurity ]

- type: entity
  parent: LockerSecurity
  id: WGAsfLockerSecurity
  components:
  - type: AccessReader
    access: [["WGAsfSecurity"]]

- type: entity
  parent: BaseCarrierComputer
  id: WGAsfComputerShipyard
  suffix: ASF
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _WG/Asf/Structures/shipyard_screen.rsi
      state: shipyard_asf
    - map: ["computerLayerKeys"]
      state: telesci_key
  - type: ShipyardListing
    shuttles:
    - WGAsfGleaner
    - WGAsfPorter
    - WGAsfLamplighter
    - WGAsfVigil
    - WGAsfBulwark
    - WGAsfGuardian
    - WGAsfLodestar
    - WGAsfRevelation
    - WGAsfSurveyor
  # Checked by company, not ID: a buyer's only ID card is in the console's slot while they buy.
  - type: CompanyAccessReader
    requiredCompanies:
    - WGAsf

- type: entity
  parent: Thruster
  id: WGAsfThruster
  suffix: ASF
  components:
  - type: Sprite
    sprite: _WG/Asf/Structures/thruster.rsi

- type: entity
  parent: ThrusterLarge
  id: WGAsfThrusterLarge
  suffix: ASF
  components:
  - type: Sprite
    sprite: _WG/Asf/Structures/thruster_large.rsi

- type: entity
  parent: ShieldGeneratorPOI
  id: WGAsfShieldGenerator
  suffix: POI ONLY
  components:
  - type: ShipShieldEmitter
    shieldColor: "#A66BE0"
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/fobshield.rsi
    snapCardinals: true
    layers:
    - state: fobshield
    - state: fobshield_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#A66BE0"
  - type: PointLight
    color: "#A66BE0"
