# Where the hacking harpoon and its darts come from: anyone can order them from cargo, and Viper Group researches and prints them.

- type: cargoProduct
  id: WGHackHarpoonGun
  icon:
    sprite: _WG/BoardingAction/hack_harpoon_gun.rsi
    state: icon
  product: WGHackHarpoonGunFlatpack
  cost: 15000
  category: cargoproduct-category-name-shuttle
  group: market

- type: cargoProduct
  id: WGHackDart
  icon:
    sprite: _WG/BoardingAction/hack_dart.rsi
    state: dart
  product: WGHackDart
  cost: 2000
  category: cargoproduct-category-name-shipammo
  group: market

- type: technology
  id: WGViperGroupHackHarpoon
  name: wg-boarding-tech-hack-harpoon
  entityIcon: WGHackHarpoonGun
  discipline: ViperGroup
  tier: 2
  cost: 40000
  recipeUnlocks:
  - WGHackHarpoonGunFlatpack
  - WGHackDart
  technologyPrerequisites:
  - UniversalMaterialResearchT2
  position: 6, -16

- type: latheRecipe
  id: WGHackHarpoonGunFlatpack
  result: WGHackHarpoonGunFlatpack
  completetime: 20
  materials:
    Steel: 5000
    Plasteel: 2500
    Glass: 1000
    Silver: 500

- type: latheRecipe
  id: WGHackDart
  result: WGHackDart
  completetime: 5
  materials:
    Steel: 500
    Plastic: 300
    Silver: 100
