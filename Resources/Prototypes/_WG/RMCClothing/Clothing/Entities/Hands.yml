- type: entity
  parent: ClothingHandsGlovesTacticalCombatBlack
  id: WGRMCGlovesBlack
  components:
  - type: Sprite
    sprite: _WG/RMCClothing/Clothing/Hands/gloves/black.rsi
    state: icon
    color: "#FFFFFF"
  - type: Clothing
    sprite: _WG/RMCClothing/Clothing/Hands/gloves/black.rsi
    clothingVisuals:
      gloves:
      - state: equipped-HAND
  - type: Item
    sprite: _Mono/Clothing/Hands/Gloves/tactical_combat_any.rsi # inhands; the RMC sheets have none
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#2F2F2F"
      right:
      - state: inhand-right
        color: "#2F2F2F"

