# ASF field research: science work for the Astraeus Solar Federation, posted on the Lantern Post's board and paid in
# thalers and Astraeus Reward Grants.

- type: wgContract
  id: WGContractAsfAnomalySurvey
  contractor: WGContractorAsfResearch
  category: Science
  tier: 1
  title: wg-contract-asf-anomaly-survey
  briefing: wg-contract-asf-anomaly-survey-brief
  reward: 11200, 15400
  minutes: 45
  crewBonus: 0.25
  weight: 1.5
  credits: 10
  creditEntity: WGAsfRewardGrant1
  objective: !type:WGContractSurvey
    count: 1, 2
    perAnomaly: 3500
    minDistance: 2500
    maxDistance: 4000
    stationClearance: 2000
    anomalies: [ AnomalyGravity, AnomalyElectricity, AnomalyIce, AnomalyFlora, AnomalyBluespace ]
