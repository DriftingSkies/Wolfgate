- type: wgContract
  id: WGContractCamelotPrizeHull
  contractor: WGContractorCamelot
  category: Salvage
  tier: 3
  title: wg-contract-camelot-prize-hull
  briefing: wg-contract-camelot-prize-hull-brief
  reward: 35000, 45000
  deposit: 2500
  minutes: 75
  minCrew: 2
  crewBonus: 0.25
  weight: 1
  requires:
  - tag: WGTowRope
    name: wg-contract-requires-rope
  - entity: WGTetherInstaller
    name: wg-contract-requires-tether-installer
  objective: !type:WGContractTow
    range: 150
    minDistance: 3500
    maxDistance: 5500
    infestation:
    - entity: MobFleshJaredSalvage
      count: 2, 4
    - entity: MobFleshGolemSalvage
      count: 1, 2
    wrecks:
    - /Maps/Salvage/medium-pirate.yml
    - /Maps/Salvage/security-chunk.yml
    - /Maps/Salvage/medium-vault-1.yml

