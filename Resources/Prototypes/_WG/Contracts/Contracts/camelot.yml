# Freeport Camelot: provisions, fuel, exports, smugglers. Far out, so hauling pays by distance.

- type: wgContract
  id: WGContractCamelotProvisions
  contractor: WGContractorCamelot
  category: Supply
  tier: 1
  title: wg-contract-camelot-provisions
  briefing: wg-contract-camelot-provisions-brief
  reward: 14900, 17500
  minutes: 55
  weight: 4
  objective: !type:WGContractSupply
    pick: 2
    premium: 1.5
    perKilometre: 375
    goods:
    - entity: FoodBreadPlain
      count: 6, 12
    - entity: FoodMeat
      count: 10, 20
    - entity: DrinkWaterBottleFull
      count: 10, 20
    - entity: MedkitFilled
      count: 1, 2
      value: 600

- type: wgContract
  id: WGContractCamelotFuel
  contractor: WGContractorCamelot
  category: Supply
  tier: 2
  title: wg-contract-camelot-fuel
  briefing: wg-contract-camelot-fuel-brief
  reward: 21900, 30600
  deposit: 1500
  minutes: 60
  weight: 3
  harms:
    WGContractorHalcyon: 1
  objective: !type:WGContractSupply
    pick: 2
    premium: 1.5
    perKilometre: 500
    goods:
    - stack: Plasma
      count: 20, 40
    - stack: Uranium
      count: 10, 20
    - stack: Coal
      count: 40, 60

