# Anomalous Lab: samples, instruments, cores, fragments, exotic ore.

- type: wgContract
  id: WGContractLabSamples
  contractor: WGContractorAnomalousLab
  category: Delivery
  tier: 1
  title: wg-contract-lab-samples
  briefing: wg-contract-lab-samples-brief
  reward: 5500, 7500
  minutes: 45
  weight: 2
  objective: !type:WGContractCourier
    package: WGContractSampleCase
    count: 1, 2
    from: Contractor
    to: Other
    destinations: [ WGContractorSevastopol, WGContractorHalcyon, WGContractorCaelPort, WGContractorMMC ]
    perPackage: 750
    perKilometre: 1250

