# Science: anomaly surveys aboard derelicts, scanned with an anomaly scanner before they collapse.

- type: wgContract
  id: WGContractLabSurvey
  contractor: WGContractorAnomalousLab
  category: Science
  tier: 1
  title: wg-contract-lab-survey
  briefing: wg-contract-lab-survey-brief
  reward: 8000, 11000
  minutes: 45
  crewBonus: 0.25
  weight: 2
  objective: !type:WGContractSurvey
    count: 1, 2
    perAnomaly: 2500
    minDistance: 2500
    maxDistance: 4000
    stationClearance: 2000
    anomalies: [ AnomalyGravity, AnomalyElectricity, AnomalyIce, AnomalyFlora, AnomalyBluespace ]
    wrecks:
    - /Maps/Salvage/small-1.yml
    - /Maps/Salvage/small-2.yml
    - /Maps/Salvage/small-3.yml
