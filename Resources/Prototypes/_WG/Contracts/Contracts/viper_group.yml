- type: wgContract
  id: WGContractVGPrizeHull
  contractor: WGContractorViperGroup
  category: Salvage
  tier: 3
  title: wg-contract-vg-prize-hull
  briefing: wg-contract-vg-prize-hull-brief
  reward: 40000, 50000
  deposit: 2500
  minutes: 75
  weight: 1.0
  minCrew: 2
  crewBonus: 0.25
  credits: 3
  creditEntity: TradeGoodShipComponents
  requires:
  - tag: WGTowRope
    name: wg-contract-requires-rope
  - entity: WGTetherInstaller
    name: wg-contract-requires-tether-installer
  objective: !type:WGContractTow
    minDistance: 3500
    maxDistance: 5500
    stationClearance: 2500
    infestation:
    - entity: MobSyndicateFootsoldier
      count: 1, 3
    wrecks:
    - /Maps/Salvage/medium-pirate.yml
    - /Maps/Salvage/small-syndicate.yml
    - /Maps/Salvage/hauling-shuttle.yml

