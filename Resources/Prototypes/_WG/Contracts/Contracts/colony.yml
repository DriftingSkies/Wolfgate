# Stellar Blessing Settlers' Council: colony work for TSF civilians, posted on the colony's own board.

- type: wgContract
  id: WGContractColonySeedDrive
  contractor: WGContractorColonyCouncil
  category: Supply
  tier: 1
  title: wg-contract-colony-seed-drive
  briefing: wg-contract-colony-seed-drive-brief
  reward: 10500, 14900
  minutes: 50
  weight: 3
  objective: !type:WGContractSupply
    premium: 1.5
    goods:
    - component: Seed
      name: wg-contract-goods-seeds
      count: 10, 15
      value: 30

