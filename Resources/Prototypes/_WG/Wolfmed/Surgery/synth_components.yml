# Chassis component repair: a synth's or IPC's eyes and pump fixed in place with engineering tools rather than flesh
# surgery. Unbolt the service panel, re-calibrate the part until it is whole, weld the panel shut.

- type: entity
  parent: SurgeryBase
  id: WGSurgeryRepairChassisEyes
  name: Repair Optics
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WGSurgeryStepOpenServicePanel
    - WGSurgeryStepRepairChassisEyes
    - WGSurgeryStepCloseServicePanel
  - type: SurgeryPartCondition
    part: Head
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: eyes
    mechanical: true
    validWhile:
    - type: WolfmedServicePanelOpen

- type: entity
  parent: SurgeryBase
  id: WGSurgeryRepairChassisPump
  name: Repair Pump
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WGSurgeryStepOpenServicePanel
    - WGSurgeryStepRepairChassisPump
    - WGSurgeryStepCloseServicePanel
  - type: SurgeryPartCondition
    part: Torso
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: pump
    mechanical: true
    validWhile:
    - type: WolfmedServicePanelOpen

# A synth keeps its pump in the heart slot.
- type: entity
  parent: SurgeryBase
  id: WGSurgeryRepairSynthPump
  name: Repair Pump
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WGSurgeryStepOpenServicePanel
    - WGSurgeryStepRepairSynthPump
    - WGSurgeryStepCloseServicePanel
  - type: SurgeryPartCondition
    part: Torso
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: heart
    mechanical: true
    validWhile:
    - type: WolfmedServicePanelOpen

- type: entity
  parent: SurgeryStepBase
  id: WGSurgeryStepOpenServicePanel
  name: Unbolt the service panel
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tool:
    - type: WolfmedHullPlate
    add:
    - type: WolfmedServicePanelOpen
    duration: 3
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    state: icon
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: WGSurgeryStepRepairChassisBase
  name: Re-calibrate the component
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tool:
    - type: WolfmedCoreProbe
    duration: 2
  - type: Sprite
    sprite: _NF/Objects/Tools/multitool.rsi
    state: icon
  - type: SurgeryRepeatableStep
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: WGSurgeryStepRepairChassisBase
  id: WGSurgeryStepRepairChassisEyes
  name: Re-calibrate the optics
  categories: [ HideSpawnMenu ]
  components:
  - type: WolfmedSurgeryOrganHealEffect
    slot: eyes
    amount: 5

- type: entity
  parent: WGSurgeryStepRepairChassisBase
  id: WGSurgeryStepRepairChassisPump
  name: Re-calibrate the pump
  categories: [ HideSpawnMenu ]
  components:
  - type: WolfmedSurgeryOrganHealEffect
    slot: pump
    amount: 5

- type: entity
  parent: WGSurgeryStepRepairChassisBase
  id: WGSurgeryStepRepairSynthPump
  name: Re-calibrate the pump
  categories: [ HideSpawnMenu ]
  components:
  - type: WolfmedSurgeryOrganHealEffect
    slot: heart
    amount: 5

- type: entity
  parent: SurgeryStepBase
  id: WGSurgeryStepCloseServicePanel
  name: Weld the service panel shut
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tool:
    - type: WolfmedHullWeld
    remove:
    - type: WolfmedServicePanelOpen
    duration: 3
  - type: Sprite
    sprite: Objects/Tools/welder.rsi
    state: icon
  - type: SurgeryStepEmoteEffect
