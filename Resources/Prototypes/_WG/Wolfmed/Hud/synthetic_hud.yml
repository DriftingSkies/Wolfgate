# M2 (OD10): a repaired positronic core carries no brain trauma; the readout says so for the trauma's length instead.
- type: syntheticHudLine
  id: WGSyntheticHudCoreRestored
  condition: CoreRestored
  line: wolfmed-synthetic-line-core-restored
  severity: Info
  advice: wolfmed-synthetic-advice-core-restored

# M4 (plan §3.11, §5.6): the chassis is heating toward thermal shutdown. Thermal shutdown itself is the cause banner.
- type: syntheticHudLine
  id: WGSyntheticHudCoreTempCritical
  condition: CoreTempCritical
  line: wolfmed-synthetic-line-core-temp-critical
  severity: Crit
  advice: wolfmed-synthetic-advice-core-temp

# Flash-burnt optics: a sheet of glass replaces the lenses, the eye surgery does it too.
- type: syntheticHudLine
  id: WGSyntheticHudOpticsDamaged
  condition: OpticsDamaged
  line: wolfmed-synthetic-line-optics
  severity: Warn
  advice: wolfmed-synthetic-advice-optics
