# Specialist racks at the Halcyon and Helios: one kit per player, from RMC's automated vendor. The sections share one
# pick, so a player takes one kit from any of them.

- type: entity
  parent: ColMarTechBase
  id: WGSpecialistVendorTSF
  components:
  - type: Sprite
    sprite: _Crescent/Structures/armoryPF.rsi
    layers:
    - state: off
    - state: normal-unshaded
      shader: unshaded
  - type: WGSpecialistVendor
    company: TSF
  - type: CMAutomatedVendor
    sections:
    - name: wg-specialist-vendor-section-infantry
      choices: { WGSpecialistKit: 1 }
      entries:
      - id: WGKitTsfAssaultman
      - id: WGKitTsfAntitank
      - id: WGKitTsfMachineGunner
      - id: WGKitTsfMortarman
      - id: WGKitTsfScoutSniper
      - id: WGKitTsfRecon
    - name: wg-specialist-vendor-section-combat-support
      choices: { WGSpecialistKit: 1 }
      entries:
      - id: WGKitTsfCombatEngineer
      - id: WGKitTsfCorpsman
      - id: WGKitTsfMasterAtArms
      - id: WGKitTsfLavCrewman
    - name: wg-specialist-vendor-section-support
      choices: { WGSpecialistKit: 1 }
      entries:
      - id: WGKitTsfCulinary
      - id: WGKitTsfMachinistMate
      - id: WGKitTsfLandingSupport

