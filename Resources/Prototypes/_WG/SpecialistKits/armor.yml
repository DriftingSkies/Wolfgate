# Plate-ready armor for the front-line kits: Breacher/Boarder, Combat Engineer/Artificer, Heavy Gunner/Heavy and
# Pyrotechnician/Burner. Each kit brings a plate for its role (kits.yml). Scouts, marksmen, medics and ship crew keep
# plain armor. Armor with no pockets takes Mono's 2x2 plate pocket; armor with pockets has them widened to fit a plate.

