# Replacement kits, bought on the faction uplink by a player who already drew that kit this round. The listing sells
# the same case the rack hands out. Each player may buy one replacement per kit per round: the cooldown, keyed by
# listing and player, outlasts any round and clears at round restart.

- type: listing
  id: WGUplinkKitReplacementTsfAssaultman
  productEntity: WGKitTsfAssaultman
  cost:
    FederationMilitaryCredit: 30
  categories:
  - UplinkSecurityUtility
  conditions:
  - !type:StoreWhitelistCondition
    whitelist:
      tags:
      - SecurityUplink
  - !type:WGKitHolderCondition
    kit: WGKitTsfAssaultman
  - !type:WGListingCooldownCondition
    key: WGUplinkKitReplacementTsfAssaultman
  productEvent: !type:WGListingCooldownEvent
    key: WGUplinkKitReplacementTsfAssaultman
    cooldown: 86400
  raiseProductEventOnUser: true

