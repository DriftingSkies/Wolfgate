# Specialist kits: one free per player per round from the faction's specialist rack (vendors.yml). Each kit is a case
# that hands out its gear but takes nothing back, and is deleted once empty. TSF kits are Marine and Navy jobs; PDV
# kits are the same roles under Ottoman names. Limits per faction per round: elite 1, plus 1 at 20 members online, up
# to 2; cavalry 1; line 1, plus 1 per 10 online, up to 3; job kits are held to their job; support kits are open.

- type: entity
  parent: BaseStorageItem
  id: WGKitCaseBase
  abstract: true
  components:
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,15,11
  - type: WGTakeOnlyStorage

