# Homestead Supply's structures come flatpacked: set one down where it should stand and use a wrench on it to
# unpack it. Each costs what the structure does.

- type: entity
  abstract: true
  parent: BaseFlatpack
  id: WGHomesteadFlatpackBase
  components:
  - type: Flatpack
    qualityNeeded: Anchoring
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#9FED58"
    - state: icon-default

- type: entity
  parent: WGHomesteadFlatpackBase
  id: WGHearthStoveFlatpack
  name: hearth stove flatpack
  description: A flatpacked hearth stove. Set it down where it should stand and use a wrench on it to unpack it.
  components:
  - type: Flatpack
    entity: WGHearthStove
  - type: StaticPrice
    price: 900

