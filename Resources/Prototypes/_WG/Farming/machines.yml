      map: [ "hive" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WGProcessorVisuals.Working:
        hive:
          True: { state: bee_hive }
          False: { state: bee_hive_empty }
  - type: WGProcessor
    machine: BeeHive
  - type: StaticPrice
    price: 60

- type: entity
