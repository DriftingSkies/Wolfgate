# WOLFGATE(Resprites) START: Port redesigned Gray, White, and Dark floor sprites.
#### STEEL / GRAY
- type: tile
  abstract: true
  id: BaseStationTile
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor
  heatCapacity: 10000
  weather: false
  baseTurf: Plating
  materialComposition:
    Steel: 100 # 0.5 for lattice, 0.25 for plating, 0.25 for tile

- type: tile
