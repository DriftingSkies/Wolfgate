- type: tile
  id: Plating
  name: tiles-plating
  sprite: /Textures/_WF/Resprites/Wizden/Tiles/plating.png #WOLFGATE(Resprites): Repathed
  baseTurf: Lattice
  isSubfloor: true
  deconstructTools: [ Axing ] # DeltaV - The return of fireaxe prying
  deconstructTimeMultiplier: 5 # Goobstation
  #footstepSounds: # Mono - Removed footstepsounds since it overrides clothing footsteps
  #  collection: FootstepPlating
  friction: 1.5
  heatCapacity: 10000
  # ES START
  flammability: 2
  # ES END

  # dont use this in game, for partial plating beacause SOMEONE didnt make them non-space proof - mono
- type: tile
  id: PlatingSpace
  name: tiles-plating-space
