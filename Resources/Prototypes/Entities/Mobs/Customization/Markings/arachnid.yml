# Appendages
- type: marking
  id: ArachnidAppendagesDefault
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Arachnid]
  # WOLFGATE(Genitals) START: the south frame draws behind the body, so the tail never covers anatomy
  layering:
    long_primary_BEHIND: TailBehind
    long_secondary_BEHIND: TailBehind
  # WOLFGATE END
  # WOLFGATE(Genitals) START: both halves of a tail share one colour
  colorLinks:
    long_primary_BEHIND: long_primary_FRONT
    long_secondary_BEHIND: long_secondary_FRONT
