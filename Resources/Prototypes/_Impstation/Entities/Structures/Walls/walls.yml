# WOLFGATE(DecorImport) START: ported from Impstation
- type: entity
  parent: BaseWall
  id: WallMiningInterior
  suffix: Interior
  components:
  - type: Construction
    graph: Girder
    node: wall
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: StaticPrice
    price: 295
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: _Impstation/Structures/Walls/mininginterior.rsi
  - type: Icon
    sprite: _Impstation/Structures/Walls/mininginterior.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: mining
  - type: RandomIconSmooth
    randomStates:
    - mining
    - miningB
  - type: Appearance

