# WOLFGATE(DecorImport) START: ported from Impstation
- type: entity
  id: TableUraniumGlass
  parent: TablePlasmaGlass
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Furniture/Tables/glass_uranium.rsi
  - type: Icon
    sprite: _Impstation/Structures/Furniture/Tables/glass_uranium.rsi
  - type: GlassTable
    climberDamage:
      types:
        Slash: 26
        Radiation: 8
    tableDamage:
      types:
        Blunt: 100
    tableMassLimit: 240
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: TableFrame
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 1
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: uraniumglasstable

- type: entity
  id: TableReaper
  parent: TableBase
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Furniture/Tables/reapertable.rsi
  - type: Icon
    sprite: _Impstation/Structures/Furniture/Tables/reapertable.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags: [ Wooden ]
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
# WOLFGATE END
