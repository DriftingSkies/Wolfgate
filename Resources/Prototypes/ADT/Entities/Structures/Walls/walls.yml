- type: entity
  parent: BaseWall
  id: ADTWallSolidWhite
  components:
  - type: Construction
    graph: Girder
    node: wall
  - type: Sprite
    sprite: ADT/Structures/Walls/white_solid.rsi
  - type: WallReplacementMarker
  - type: Icon
    sprite: ADT/Structures/Walls/white_solid.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: solid

- type: entity
  parent: ADTWallSolidWhite
  id: ADTWallSolidBlack
  components:
  - type: Sprite
    sprite: ADT/Structures/Walls/white_solid.rsi
    color: "#535353"
  - type: Icon
    sprite: ADT/Structures/Walls/white_solid.rsi
