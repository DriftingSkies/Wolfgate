# WOLFGATE(DecorImport) START: ported from ADT
- type: entity
  parent: BaseWall
  id: ADTwallmarble
  components:
    - type: RCDDeconstructable
      cost: 6
      delay: 8
      fx: EffectRCDDeconstruct8
    - type: Sprite
      sprite: ADT/Structures/Walls/marble_wall.rsi
    - type: Icon
      sprite: ADT/Structures/Walls/marble_wall.rsi
    - type: IconSmooth
      key: walls
      base: state
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 400
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                Girder:
                  min: 1
                  max: 1
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
# WOLFGATE END
