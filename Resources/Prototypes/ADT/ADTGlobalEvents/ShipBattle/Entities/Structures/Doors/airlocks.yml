# WOLFGATE(DecorImport) START: ported from ADT
- type: entity
  parent: AirlockGlass
  id: ADTAirlockKMTGlass
  suffix: Space Battleships, KMT
  components:
  - type: Sprite
    sprite: ADT/ADTGlobalEvents/ShipBattle/Structures/Doors/Airlocks/Glass/kmt.rsi
    snapCardinals: false
  - type: Wires
    layoutId: AirlockSecurity
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      # TODO this should go to the broken node first
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Tag
    tags:
      - ForceNoFixRotations
  - type: Door
    closeTimeTwo: 0.4
    openTimeTwo: 0.4
    crushDamage:
      types:
        Blunt: 15
    openSound:
      path: /Audio/Machines/airlock_open.ogg
    closeSound:
      path: /Audio/Machines/airlock_close.ogg
    denySound:
      path: /Audio/Machines/airlock_deny.ogg

- type: entity
  parent: ADTAirlockKMTGlass
  id: ADTAirlockTSFGlass
  suffix: Space Battleships, TSF
  components:
  - type: Sprite
    sprite: ADT/ADTGlobalEvents/ShipBattle/Structures/Doors/Airlocks/Glass/tsf.rsi
    snapCardinals: false
# WOLFGATE END
