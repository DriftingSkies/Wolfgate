# WOLFGATE(DecorImport) START: ported from ADT
- type: entity
  parent: BaseWall
  id: ADTWallLightArmorKMT
  suffix: Space Battleships, KMT
  components:
    - type: Construction
      graph: Girder
      node: wall
    - type: Sprite
      sprite: ADT/ADTGlobalEvents/ShipBattle/Structures/Walls/space_battleships_kmt_armor.rsi
    - type: Icon
      sprite: ADT/ADTGlobalEvents/ShipBattle/Structures/Walls/space_battleships_kmt_armor.rsi
    - type: IconSmooth
      key: walls
      base: state
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1500
          behaviors:
            # - !type:SpawnEntitiesBehavior
            #   spawn:
            #     Girder:
            #       min: 1
            #       max: 1
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: RCDDeconstructable
      cost: 6
      delay: 8
      fx: EffectRCDDeconstruct8

