    state: wings_FRONT
  - sprite: _WF/Genitals/Mobs/Customization/TailSplit/_FarHorizons/Mobs/Customization/proto-avali/led_shapes_body.rsi # WOLFGATE(Genitals): anatomy zone of the south frame on TailBehind
