- type: marking
  id: VoxTailAnimated
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [] # Intentional to keep it from showing in the customization menu
  forcedColoring: true
  # WOLFGATE(Genitals) START: the south frame draws behind the body, so the tail never covers anatomy
  layering:
    tail_animated_BEHIND: TailBehind
  # WOLFGATE END
  # WOLFGATE(Genitals) START: both halves of a tail share one colour
  colorLinks:
    tail_animated_BEHIND: tail_animated_FRONT
  # WOLFGATE END
  sprites:
  # WOLFGATE(Genitals) START: split art, south frame on TailBehind
  # - sprite: Mobs/Customization/vox_parts.rsi
  #   state: tail_animated
  - sprite: _WF/Genitals/Mobs/Customization/TailSplit/Mobs/Customization/vox_parts.rsi
    state: tail_animated_FRONT
  - sprite: _WF/Genitals/Mobs/Customization/TailSplit/Mobs/Customization/vox_parts.rsi
    state: tail_animated_BEHIND
  # WOLFGATE END

