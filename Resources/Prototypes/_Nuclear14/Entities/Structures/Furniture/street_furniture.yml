# WOLFGATE(DecorImport) START: ported from Nuclear 14
- type: entity
  parent: BaseStructure
  id: N14SignStreetBase
  abstract: true
  components:
  - type: Sprite
    snapCardinals: false
    noRot: true
    sprite: _Nuclear14/Structures/Furniture/Street_Furniture/streetsigns.rsi
    drawdepth: Overdoors
    enableOverrideDir: true
    overrideDir: South
  - type: SpriteFade
  - type: Physics
    canCollide: false
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Damageable
    damageModifierSet: Metallic

