# WOLFGATE(DecorImport) START: ported from Nuclear 14
- type: entity
  abstract: true
  parent: BaseStructure
  id: N14HalfWallBase
  suffix: half
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact
  - type: Tag
    tags:
    - Wall
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: windows
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - TableMask
        layer:
        - TableLayer
        density: 1000
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: Climbable
    range: 0.05

- type: entity
  parent: N14HalfWallBase
  id: N14WallBrickHalf
  suffix: half
  components:
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Sprite
    sprite: _Nuclear14/Structures/Walls/ms13/half/brick.rsi
  - type: Icon
    sprite: _Nuclear14/Structures/Walls/ms13/half/brick.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: FlimsyMetallic
  - type: IconSmooth
    key: windows
    base: brick

