# WOLFGATE(DecorImport) START: ported from Moffstation
- type: entity
  abstract: true
  parent: BaseWall
  id: WallMalignBase
  components:
  - type: Sprite
    sprite: _Moffstation/Structures/Walls/malign.rsi
  - type: Icon
    sprite: _Moffstation/Structures/Walls/malign.rsi
  - type: IconSmooth
    key: walls
    base: malign
  - type: RadiationBlocker
    resistance: 9

- type: entity
  parent: WallMalignBase
  id: WallMalign
  components:
  - type: Occluder
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
# WOLFGATE END
