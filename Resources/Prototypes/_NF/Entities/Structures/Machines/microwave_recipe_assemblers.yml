# The machines here are to separate out the recipes that different microwave-based machines can make.
- type: entity
  id: KitchenElectricRange
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: electric range
  description: A functional range with a range of functions.
  components:
  # WOLFGATE(Cooking) START: the range cooks hands-on as a hearth with a hob and an oven (Cooking module)
  # - type: Microwave
  #   capacity: 10
  #   canMicrowaveIdsSafely: false
  #   explosionChance: 0
  #   lightningChance: 0
  #   beginCookingSound: /Audio/_NF/Machines/egg-timer.ogg
  #   foodDoneSound: /Audio/Machines/ding.ogg
  #   loopingSound: /Audio/_NF/Effects/silence.ogg
  #   validRecipeTypes: Oven
  #   canHeat: true
  #   canIrradiate: false
  #   key: ElectricRangeKey
  - type: WGHearth
  # the stirring window opens on the range, since the pot inside it is out of the window's reach
  - type: UserInterface
    interfaces:
      enum.WGStirUiKey.Key:
        type: WGStirBoundUserInterface
  # WOLFGATE END
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: "off_no_door" }
          Broken: { state: "off_no_door" } # don't care, can't break
          Cooking: { state: "off_no_door" }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: "unlit" }
          Broken: { state: "unlit" } # don't care, can't break
          Cooking: { state: "cooking_unlit" }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: range_low }
          Medium: { visible: true, state: range_medium }
          High: { visible: true, state: range_high }
      # WOLFGATE(Cooking) START: show the pan or pot on the hob
      enum.WGHobVisuals.Cookware:
        wg-hob:
          None: { visible: false }
          Pan: { visible: true, state: hob-pan }
          Pot: { visible: true, state: hob-pot }
      # WOLFGATE END
  # WOLFGATE(Cooking) START: no microwave screen; it cooks by hand
  # - type: ActivatableUI
  #   key: enum.MicrowaveUiKey.ElectricRangeKey
  # WOLFGATE END
  - type: DeviceLinkSink
    ports:
    - On
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  # WOLFGATE(Cooking) START: no microwave screen; it cooks by hand
  # - type: UserInterface
  #   interfaces:
  #     enum.MicrowaveUiKey.ElectricRangeKey:
  #       type: MicrowaveBoundUserInterface
  # WOLFGATE END
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1: # The body of the oven
        shape:
          !type:PhysShapeAabb
          bounds: "-0.30,-0.25,0.30,0.45"
        density: 600
        mask:
        - MachineMask
        layer:
        - MachineLayer
      fix2: # The range
        shape:
          !type:PhysShapeAabb
          bounds: "-0.30,0.15,0.30,0.45"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Sprite
    sprite: _NF/Structures/Machines/oven.rsi
    snapCardinals: true
    layers:
    - state: off_no_door
      map: ["enum.MicrowaveVisualizerLayers.Base"]
    - state: unlit
      shader: unshaded
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
    - state: oven_door
    - map: ["enum.EntityHeaterVisuals.Setting"]
      state: range_low
      shader: unshaded
      visible: false
    # WOLFGATE(Cooking) START: the pan or pot on the hob
    - sprite: _WG/Cooking/hearth_stove.rsi
      state: hob-pan
      map: ["wg-hob"]
      offset: 0,0.3
      scale: 0.6,0.6
      visible: false
    # WOLFGATE END
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
    - trigger: # Mono - why the fuck was this indestructible?
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ApcPowerReceiver
    powerLoad: 1000 # Assume the range is off.
  - type: Machine
    board: ElectricRangeMachineCircuitboard
  - type: ContainerContainer
    containers:
      microwave_entity_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
      # WOLFGATE(Cooking): the hearth's hob and oven, declared so spawning doesn't add them
      wg-hob: !type:ContainerSlot
      wg-oven: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - microwave_entity_container
    # WOLFGATE(Cooking): taken apart, the range drops what was on its hob and in its oven
    - wg-hob
    - wg-oven
  - type: GuideHelp
    guides:
    - Chef
  - type: EntityHeater
    passivePower: 1000 # Base oven power.
  - type: PlaceableSurface
    isPlaceable: false # Prevent items hanging around for a few frames when clicked on the oven.
  - type: ItemPlacer
    maxEntities: 4
    whitelist:
      components:
      - Temperature

- type: entity
  id: SyndicateKitchenElectricRange
  parent: KitchenElectricRange
  name: donk co. electric range
  components:
  - type: Microwave
    cookTimeMultiplier: 0.5
  - type: Sprite
    sprite: _NF/Structures/Machines/oven_syndie.rsi
  - type: Machine
    board: SyndicateElectricRangeMachineCircuitboard
  - type: FoodRecipeProvider
    providedRecipes:
    - RecipeBaguetteSword
    - RecipeThrowingCroissant

- type: entity
  id: KitchenAssembler
  parent: KitchenMicrowave
  name: food-o-mat
  description: Assembles and prepares NT-approved meals. You don't know what it's doing in there.
  components:
  # WOLFGATE(Cooking) START: the food-o-mat only assembles; no oven from the microwave it is built on
  - type: WGHearth
    hob: false
    ovenCapacity: 0
  # WOLFGATE END
  - type: Microwave
    explosionChance: 0
    lightningChance: 0
    beginCookingSound: /Audio/Machines/machine_switch.ogg
    foodDoneSound: /Audio/Machines/ding.ogg
    loopingSound: /Audio/_NF/Machines/assembler.ogg
    validRecipeTypes: Assembler
    canHeat: false
    canIrradiate: false
    key: AssemblerKey
  - type: GenericVisualizer #TODO: needs work
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: "assembler" }
          Broken: { state: "assembler" }
          Cooking: { state: "assembler" }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: "assembler-on-unlit" }
          Broken: { state: "assembler-broken-unlit" }
          Cooking: { state: "assembler-running-unlit" }
        blinky:
          Idle: { state: "assembler-invisible" }
          Broken: { state: "assembler-invisible" }
          Cooking: { state: "assembler-blinky-unlit" }
        scan:
          Idle: { state: "assembler-invisible" }
          Broken: { state: "assembler-invisible" }
          Cooking: { state: "assembler-scan-unlit" }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
        blinky:
          True: { visible: true }
          False: { visible: false }
        scan:
          True: { visible: true }
          False: { visible: false }
  - type: Sprite
    sprite: _NF/Structures/Machines/assembler.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    layers:
    - state: assembler
      map: ["enum.MicrowaveVisualizerLayers.Base"]
    - state: assembler-on-unlit
      shader: unshaded
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
      visible: false
    - state: assembler-invisible
      shader: unshaded
      map: ["blinky"]
      visible: false
    - state: assembler-invisible
      shader: unshaded
      map: ["scan"]
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 400
  - type: Machine
    board: KitchenAssemblerMachineCircuitboard
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.AssemblerKey
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.AssemblerKey:
        type: AssemblerBoundUserInterface

