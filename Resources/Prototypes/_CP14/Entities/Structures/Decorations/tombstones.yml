# WOLFGATE(DecorImport) START: ported from CrystallEdge
- type: entity
  id: CP14BaseTombstone
  components:
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: _CP14/Structures/Decoration/tombstone.rsi
    drawdepth: Mobs
    offset: 0,0.3
    layers:
      - state: tomb
        map: ["random"]
  - type: RandomSprite
    available:
    - random:
        cross: ""
        cross2: ""
        tomb: ""
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 1000
        layer:
        - HalfWallLayer
        - Opaque
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            path: /Audio/Effects/break_stone.ogg
            params:
              volume: -4
  - type: Climbable
# WOLFGATE END
