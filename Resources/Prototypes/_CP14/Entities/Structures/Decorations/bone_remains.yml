# WOLFGATE(DecorImport) START: ported from CrystallEdge
- type: entity
  parent: BaseStructure
  id: CP14BaseBoneRemains
  components:
  - type: Sprite
    noRot: true
    sprite: _CP14/Structures/Decoration/bone_remains.rsi
    drawdepth: BelowFloor
    layers:
    - state: bone_remains_1
      map: [ random ]
  - type: RandomSprite
    available:
    - random:
        bone_remains_1: ""
        bone_remains_2: ""
        bone_remains_3: ""
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 50
        mask: [ SlipLayer ]
        layer: [ ItemMask ]
  - type: FootstepModifier
    footstepSoundCollection:
      collection: CP14StepBones
      params:
        volume: 4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
      - !type:PlaySoundBehavior
        sound:
          collection: CP14BoneCrack
  - type: Physics
    bodyType: Static
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Icon
    sprite: _CP14/Structures/Decoration/bone_remains.rsi
    state: bone_remains_1

- type: entity
