# WOLFGATE(DecorImport) START: ported from CrystallEdge
- type: entity
  id: CP14WallStone
  parent: CP14BaseWall
  components:
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe
      components:
      - MiningGatheringHard
      - MiningGatheringSoft
  - type: Sprite
    sprite: _CP14/Structures/Walls/Natural/cave_stone.rsi
  - type: Icon
    sprite: _CP14/Structures/Walls/Natural/cave_stone.rsi
  - type: IconSmooth
    base: wall
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: ["Destruction"]

