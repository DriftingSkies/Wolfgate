# WOLFGATE(DecorImport) START: ported from CrystallEdge
- type: entity
  id: CP14WallWooden
  parent:
  - CP14BaseWall
  - CP14BaseFlammableSpreading
  components:
  - type: StaticPrice
    price: 30
  - type: Construction
    graph: Barricade
    node: woodWall
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Sprite
    sprite: _CP14/Structures/Walls/wooden_wall.rsi
  - type: Icon
    sprite: _CP14/Structures/Walls/wooden_wall.rsi
  - type: IconSmooth
    base: wood
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

