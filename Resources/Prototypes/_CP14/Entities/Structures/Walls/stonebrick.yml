# WOLFGATE(DecorImport) START: ported from CrystallEdge
- type: entity
  id: CP14WallStonebrick
  parent: CP14BaseWall
  components:
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Sprite
    sprite: _CP14/Structures/Walls/bricks_stone_wall.rsi
  - type: Icon
    sprite: _CP14/Structures/Walls/bricks_stone_wall.rsi
  - type: IconSmooth
    base: stonebricks
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

