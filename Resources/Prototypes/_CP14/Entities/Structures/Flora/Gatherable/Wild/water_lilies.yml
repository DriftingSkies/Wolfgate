# WOLFGATE(DecorImport) START: ported from CrystallEdge
- type: entity
  id: CP14WaterLilies
  parent: BaseStructureDynamic
  placement:
    mode: PlaceFree
  components:
  - type: Sprite
    snapCardinals: true
    drawdepth: FloorTiles
    sprite: _CP14/Structures/Flora/water_lilies.rsi
    layers:
      - state: small1
        map: ["random"]
  - type: Transform
    anchored: false
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Damageable
    damageContainer: Biological
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: CP14GrassGathering
        params:
          variation: 0.03
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
        - !type:DoActsBehavior
          acts: [ Destruction ]
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - HalfWallLayer
        layer:
        - MidImpassable
        - LowImpassable
  - type: RandomSprite
    available:
    - random:
        small1: ""
        small2: ""
        small3: ""
        small4: ""
        small5: ""
        small6: ""
        small7: ""
        small8: ""
        big1: ""
        big2: ""
        big3: ""
        big4: ""
  - type: Icon
    sprite: _CP14/Structures/Flora/water_lilies.rsi
    state: small1

- type: entity
  id: CP14GatherableWaterAirLily
  parent: [ BaseStructure, BaseStructureDynamic ]
  suffix: Gatherable
  placement:
    mode: PlaceFree
  components:
  - type: Sprite
    sprite: _CP14/Structures/Flora/water_lilies.rsi
    layers:
    - state: small_flower1
      map: [ random ]
    snapCardinals: true
    drawdepth: FloorTiles
  - type: RandomSprite
    available:
    - random:
        small_flower1: ""
        small_flower2: ""
        small_flower3: ""
        small_flower4: ""
        big_flower1: ""
        big_flower2: ""
        big_flower3: ""
        big_flower4: ""
  - type: PlacementReplacement
    key: CP14Plant
  - type: Transform
    anchored: false
  - type: InteractionOutline
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask: [ HalfWallLayer ]
        layer: [ MidImpassable, LowImpassable ]
  - type: Appearance
  - type: Icon
    sprite: _CP14/Structures/Flora/water_lilies.rsi
    state: small_flower1

- type: entity
  id: CP14WaterReeds
  parent: CP14WaterLilies
  components:
  - type: Sprite
    snapCardinals: true
    drawdepth: Mobs
    sprite: _CP14/Structures/Flora/water_reeds.rsi
    layers:
      - state: small1
        map: ["random"]
  - type: RandomSprite
    available:
    - random:
        small1: ""
        small2: ""
        small3: ""
        small4: ""
        small5: ""
        small6: ""
        small7: ""
        small8: ""
        small9: ""
        small10: ""
        small11: ""
        big1: ""
        big2: ""
        big3: ""
        big4: ""
        big5: ""
        big6: ""
        big7: ""
        big8: ""
  - type: Icon
    sprite: _CP14/Structures/Flora/water_reeds.rsi
    state: small1
# WOLFGATE END
