# WOLFGATE(DecorImport) START: ported from CrystallEdge
- type: entity
  id: CP14RockSmall
  parent: PottedPlantBase
  suffix: Small
  placement:
    mode: SnapgridCenter
  components:
  - type: Climbable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 500
        layer: [ HalfWallLayer, Opaque ]
  - type: Sprite
    sprite: _CP14/Structures/Flora/Rocks/rocks_small.rsi
    offset: "0,0.2"
    layers:
    - state: rock0
      map: [ random ]
    drawdepth: Mobs
    snapCardinals: true
  - type: RandomSprite
    available:
    - random:
        rock0: ""
        rock1: ""
        rock2: ""
        rock3: ""
        rock4: ""
        rock5: ""
        rock7: ""
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: Icon
    sprite: _CP14/Structures/Flora/Rocks/rocks_small.rsi
    state: rock0

