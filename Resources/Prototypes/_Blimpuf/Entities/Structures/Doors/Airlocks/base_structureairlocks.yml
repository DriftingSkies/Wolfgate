# WOLFGATE(DecorImport) START: ported from Starlight
- type: entity
  id: PlastitaniumAirlockIndestructible
  parent: Airlock
  suffix: Indestructible
  components:
  - type: Sprite
    sprite: _Blimpuf/Structures/Doors/Airlocks/plastitanium.rsi
    snapCardinals: true
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: false
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      shader: unshaded
      visible: false
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
  - type: WiresPanelSecurity
    securityLevel: maxSecurity # Realistically you should never see this, but just in case...
  - type: Lock
    locked: true
    unlockOnClick: false
    breakOnAccessBreaker: false
  - type: LockedWiresPanel
  - type: Tag
    tags:
      - Airlock
      - AccessBreakerImmune
  - type: GuideHelp
    guides:
    - Airlocks
    - Networking
# WOLFGATE END
