# WOLFGATE(DecorImport) START: ported from Delta-V
- type: entity
  parent: BaseSign
  id: MeatWhisperers
  placement:
    mode: SnapgridBorder
  components:
  - type: Sprite
    sprite: _DV/Objects/Decoration/Flesh/bigmeat.rsi
    state: whisperers
    drawdepth: Overdoors
    snapCardinals: false
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          FoodMeat:
            min: 1
            max: 1

