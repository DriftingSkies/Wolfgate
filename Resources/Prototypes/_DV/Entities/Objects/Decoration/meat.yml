# WOLFGATE(DecorImport) START: ported from Delta-V
- type: entity
  parent: BaseRock
  id: FleshTeeth1
  components:
  - type: Sprite
    state: teeth1
    sprite: _DV/Objects/Decoration/Flesh/meat.rsi
    noRot: false
    snapCardinals: false
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Icon
    sprite: _DV/Objects/Decoration/Flesh/meat.rsi
    state: teeth1

