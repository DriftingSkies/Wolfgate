# WOLFGATE(DecorImport) START: ported from Delta-V
- type: entity
  parent: BaseWall
  id: WallCosmicCult
  components:
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: cultwalls
    base: cult

- type: entity
  id: WindowCosmicCult
  parent: [ ReinforcedPlasmaWindow, WindowRCDResistant ]
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow.rsi
    state: full
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    base: coswindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: RadiationBlocker
    resistance: 5

- type: entity
  id: WindowCosmicCultDark
  suffix: Tinted
  parent: WindowCosmicCult
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark.rsi
    state: full
  - type: IconSmooth
    base: cosDwindow

- type: entity
  parent: WallShuttleDiagonal
  id: WindowCosmicCultDiagonal
  suffix: Diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RCDDeconstructable
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_diagonal.rsi
    state: coswindow0
  - type: IconSmooth
    mode: Diagonal
    key: cultwindows
    base: coswindow
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_diagonal.rsi
    state: coswindow0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: WindowCosmicCultDiagonal
  id: WindowCosmicCultDiagonalDark
  suffix: Diagonal, Tinted
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark_diagonal.rsi
    state: cosDwindow0
  - type: IconSmooth
    mode: Diagonal
    key: cultwindows
    base: cosDwindow
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark_diagonal.rsi
    state: cosDwindow0
# WOLFGATE END
