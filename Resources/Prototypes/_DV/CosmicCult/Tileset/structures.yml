# WOLFGATE(DecorImport) START: ported from Delta-V
- type: entity
  id: CosmicChair
  parent: SeatBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicchair.rsi
    state: chair
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Anchorable
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicchair.rsi
    state: chair

- type: entity
  id: CosmicTable
  parent: CounterBase
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmictable.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmictable.rsi
    state: full
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: cosmictable
    base: state_

- type: entity
  parent: BaseStructure
  id: CosmicObelisk
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicpillar.rsi
    offset: 0, 0.5
    layers:
      - state: icon
    drawdepth: Mobs
    noRot: true
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.1,0.2,0.375"
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

- type: entity
  id: AltarCosmic
  parent: AltarNanotrasen
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/altar.rsi
    layers:
    - state: cosmic
    - state: cosmic_light
      shader: unshaded
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/altar.rsi
    state: cosmic
  - type: PointLight
    radius: 1.5
    energy: 2.5
    color: "#42a4ae"
# WOLFGATE END
