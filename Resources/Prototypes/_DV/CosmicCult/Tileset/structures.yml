# WOLFGATE(DecorImport) START: ported from Delta-V
- type: entity
  id: CosmicChair
  parent: SeatBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicchair.rsi
    state: chair
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Anchorable
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicchair.rsi
    state: chair

- type: entity
  id: CosmicTable
  parent: CounterBase
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmictable.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmictable.rsi
    state: full
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: cosmictable
    base: state_
# WOLFGATE END
