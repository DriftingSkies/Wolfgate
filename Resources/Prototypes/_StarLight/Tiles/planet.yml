# WOLFGATE(DecorImport) START: ported from Starlight
- type: decal
  id: AbyssBushOne
  snapCardinals: true
  defaultSnap: false
  sprite:
    sprite: /Textures/_Starlight/Decals/Abyss/bushes.rsi
    state: bush1

- type: decal
  id: AbyssBushTwo
  snapCardinals: true
  defaultSnap: false
  sprite:
    sprite: /Textures/_Starlight/Decals/Abyss/bushes.rsi
    state: bush2

- type: decal
  id: AbyssBushThree
  snapCardinals: true
  defaultSnap: false
  sprite:
    sprite: /Textures/_Starlight/Decals/Abyss/bushes.rsi
    state: bush3

- type: entity
  id: BaseObelisk
  abstract: true
  components:
  - type: SpriteFade
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: _Starlight/Objects/Decoration/Flora/Abyss/obelisk.rsi
    drawdepth: Overdoors
    offset: 0,0.9
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.4,0.35,0.4"
        density: 1000
        layer:
        - WallLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_Starlight/Effects/chisel.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Starlight/Effects/stones_falling.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseObelisk
  id: FloraObelisk01
  components:
  - type: Sprite
    state: obelisk01

- type: entity
  parent: BaseObelisk
  id: FloraObelisk02
  components:
  - type: Sprite
    state: obelisk02

- type: entity
  parent: BaseObelisk
  id: FloraObelisk03
  components:
  - type: Sprite
    state: obelisk03
# WOLFGATE END
