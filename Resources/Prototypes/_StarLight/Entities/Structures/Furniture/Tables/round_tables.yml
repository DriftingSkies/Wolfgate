# WOLFGATE(DecorImport) START: ported from Starlight
- type: entity
  id: RoundTableSteel
  parent: BaseStructure
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/Tables/roundtable.rsi
    state: round_generic
    snapCardinals: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
    - trigger:
        !type:DamageTrigger
        damage: 35
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Construction
    graph: DecorBuildRoundTableSteel
    node: built
  - type: Anchorable
  - type: Transform
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: [ TableMask ]
        layer: [ TableLayer ]
  - type: Climbable
  - type: Clickable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 3
  - type: StaticPrice
    price: 22
  - type: Icon
    sprite: _Starlight/Structures/Furniture/Tables/roundtable.rsi
    state: round_generic

