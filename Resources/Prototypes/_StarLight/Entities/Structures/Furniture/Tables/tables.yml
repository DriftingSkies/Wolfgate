# WOLFGATE(DecorImport) START: ported from Starlight
- type: entity
  id: TableCounterRetroWood
  parent: CounterBase
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/Tables/wood_counter.rsi
  - type: Icon
    sprite: _Starlight/Structures/Furniture/Tables/wood_counter.rsi
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: counterretrowood
    base: state_
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood

