# WOLFGATE(DecorImport) START: ported from Starlight
- type: entity
  suffix: Corner. White
  id: BenchComfyCorner
  parent: SeatBase
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/Benches/bench_corner.rsi
    granularLayersRendering: true
    enableOverrideDir: true
    overrideDir: South
    layers:
    - state: base
      color: "#767e82"
      renderingStrategy: Default
    - state: cover
      renderingStrategy: Default
  - type: Physics
    bodyType: Static
  - type: StaticPrice
    price: 35
  - type: Construction
    graph: DecorBuildBenchComfyCorner
    node: built
  - type: Icon
    sprite: _Starlight/Structures/Furniture/Benches/bench_corner.rsi
    state: base

