# WOLFGATE(DecorImport) START: ported from Starlight
- type: entity
  id: FloorLight
  suffix: Always Powered
  parent: BaseStructure
  components:
    - type: Sprite
      sprite: _Paradise/Structures/Lighting/floorlights.rsi
      snapCardinals: false
      drawdepth: FloorObjects
      noRot: true
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: base
        - map: ["enum.PoweredLightLayers.Glow"]
          state: glow
          shader: unshaded
      state: base
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.1
          density: 100
          mask:
            - None
          layer:
            - TabletopMachineLayer
    - type: PointLight
      radius: 10
      energy: 2.5
      softness: 0.9
      color: "#FFE4CE"
    - type: InteractionOutline
    - type: Damageable
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 1
                  max: 1
            - !type:EmptyAllContainersBehaviour
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
    - type: StaticPrice
      price: 75
    - type: RequireProjectileTarget
    - type: ESSparkOnHit
    - type: Icon
      sprite: _Paradise/Structures/Lighting/floorlights.rsi
      state: base

- type: entity
  id: StarlightPoweredFloorLightEmpty
  suffix: Empty
  parent: FloorLight
  components:
    - type: Sprite
      state: empty
    - type: PointLight
      enabled: false
    - type: PoweredLight
      bulb: Bulb
    - type: ContainerContainer
      containers:
        light_bulb: !type:ContainerSlot
    - type: ApcPowerReceiver
    - type: ExtensionCableReceiver
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SmartLight
    - type: WirelessNetworkConnection
      range: 200
    - type: DeviceLinkSink
      ports:
        - On
        - Off
        - Toggle
    - type: Construction
      graph: DecorBuildStarlightPoweredFloorLightEmpty
      node: built
    - type: Appearance
    - type: PoweredLightVisuals
      blinkingSound:
        path: "/Audio/Machines/light_tube_on.ogg"
      spriteStateMap:
        empty: empty
        off: base
        on: base
        broken: broken
        burned: burned
    - type: DamageOnInteract
      damage:
        types:
          Heat: 2
      popupText: powered-light-component-burn-hand
    - type: Icon
      sprite: _Paradise/Structures/Lighting/floorlights.rsi
      state: empty

- type: entity
  id: LightFloor
  suffix: ""
  parent: BaseStructure
  components:
  - type: Sprite
    layers:
    - map: [ enum.PoweredLightLayers.Base ]
      state: light_open_bulb
    - map: [ enum.PoweredLightLayers.Glow ]
      state: light_open_bulb_glow
      shader: unshaded
      visible: false
    - map: []
      state: light_off
    - map: []
      state: light_on
      shader: unshaded
      visible: false
    sprite: _Paradise/Tiles/light_floor.rsi
    snapCardinals: false
    drawdepth: FloorTiles
    noRot: true
    state: light_open
  - type: PointLight
    enabled: true
    radius: 10
    energy: 2.5
    softness: 0.9
    color: "#FFE4CE"
  - type: PoweredLight
    hasLampOnSpawn: LightBulb
    bulb: Bulb
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.1
        density: 100
        mask: [ None ]
        layer: [ TabletopMachineLayer ]
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
      - !type:EmptyAllContainersBehaviour {}
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: StaticPrice
    price: 75
  - type: RequireProjectileTarget
  - type: ESSparkOnHit
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SmartLight
  - type: WirelessNetworkConnection
    range: 200
  - type: Appearance
  - type: PoweredLightVisuals
    blinkingSound:
      path: /Audio/Machines/light_tube_on.ogg
    spriteStateMap:
      empty: light_open
      "off": light_open_bulb
      "on": light_open_bulb
      broken: light_open_bulb_broken
      burned: light_open_bulb_burned
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand
  - type: Physics
    canCollide: false
  - type: ContainerContainer
    containers:
      light_bulb: !type:ContainerSlot {}
  - type: DeviceLinkSink
    ports: [ "On", "Off", Toggle ]
  - type: Icon
    sprite: _Paradise/Tiles/light_floor.rsi
    state: light_open
# WOLFGATE END
