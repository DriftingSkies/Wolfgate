# WOLFGATE(DecorImport) START: ported from RMC-14
- type: examinableDamage
  id: RMCWallMessages
  messages:
    - rmc-wall-integrity-1
    - rmc-wall-integrity-2
    - rmc-wall-integrity-3
    - rmc-wall-integrity-4

# Standard
- type: entity
  parent: CMBaseWall
  id: CMWallMetal
  components:
  - type: Construction
    graph: Girder
    node: wall
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Sprite
    sprite: _RMC14/Structures/Walls/metal.rsi
  - type: Icon
    sprite: _RMC14/Structures/Walls/metal.rsi
  - type: Tag
    tags:
    - Wall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3125
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
        - !type:DoActsBehavior
          acts: ["Breakage"]
  - type: IconSmooth
    key: walls
    base: metal

