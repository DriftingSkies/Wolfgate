    sprite: _RMC14/Structures/Walls/rwall.rsi
  - type: Tag
    tags:
    - Wall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 9500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 9000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
