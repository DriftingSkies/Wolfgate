# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCShutterBaseIndestructible
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Shutters/Almayer/shutter.rsi
    drawdepth: BlastDoors
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: ContainerFill
    containers:
      board: [ DoorElectronics ]
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: Door
    openDrawDepth: Walls
    closedDrawDepth: BlastDoors
    bumpOpen: false
    clickOpen: false
    closeTimeOne: 0.4
    closeTimeTwo: 0.4
    openTimeOne: 0.4
    openTimeTwo: 0.4
    openingAnimationTime: 1.0
    closingAnimationTime: 1.0
    crushDamage:
      types:
        Blunt: 5
    openSound:
      path: /Audio/_RMC14/Machines/blastdoor.ogg
    closeSound:
      path: /Audio/_RMC14/Machines/blastdoor.ogg
    performCollisionCheck: false
    canCrush: false
    canPry: false
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Airtight
  - type: Occluder
  - type: WallMount
    arc: 360
  - type: ApcPowerReceiver

- type: entity
  parent: RMCShutterBaseIndestructible
  id: RMCShutterBase
  abstract: true
  components:
  - type: Door
    canPry: true

- type: entity
  parent: RMCShutterBase
  id: RMCShutterAlmayer
  components:
  - type: VehicleSmashable
    minContinueWeightClass: Heavy
    smashSound:
      path: /Audio/_WF/Vehicles/effects/metal_crash.ogg
  - type: Clickable
  - type: InteractionOutline

- type: entity
  parent: RMCShutterAlmayer
  id: RMCShutterHybrisa
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Shutters/Hybrisa/hybrisa_shutter.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  parent: RMCShutterAlmayer
  id: RMCShutterHybrisaWindow
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Shutters/Hybrisa/window_shutter.rsi
    drawdepth: BlastDoors
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    occludes: false
  - type: Occluder
    enabled: false
# WOLFGATE END
