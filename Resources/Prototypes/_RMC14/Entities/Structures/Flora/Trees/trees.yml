# WOLFGATE(DecorImport) START: ported from Einstein Engines
- type: entity
  parent: PottedPlantBase
  id: RMCAlienTree01
  suffix: RMCAlienTree01
  components:
  - type: Sprite
    state: treealien01
    noRot: true
    sprite: _RMC14/Objects/Flora/flora_treealien.rsi
    drawdepth: Overdoors
    offset: "0,0.7"
  - type: SpriteFade
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.3,0.1,0.3"
        density: 4000
        layer: [ WallLayer ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Icon
    sprite: _RMC14/Objects/Flora/flora_treealien.rsi
    state: treealien01

- type: entity
  parent: FloraTreeStump
  id: FloraAlienStump
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Flora/flora_treealien.rsi
    state: treestumpalien
    offset: 0,0.7
  - type: Icon
    sprite: _RMC14/Objects/Flora/flora_treealien.rsi
    state: treestumpalien
# WOLFGATE END

