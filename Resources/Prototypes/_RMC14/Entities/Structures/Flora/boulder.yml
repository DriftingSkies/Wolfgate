# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: PottedPlantBase
  id: RMCBoulderLargeDark3
  placement:
    mode: SnapgridBorder
  components:
  - type: Sprite
    state: dark3
    noRot: true
    sprite: _RMC14/Structures/Flora/large_boulder.rsi
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 1000
        layer: [ HalfWallLayer, Opaque ]
  - type: Climbable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: VehicleSmashable
    minDestroyWeightClass: Medium
  - type: Icon
    sprite: _RMC14/Structures/Flora/large_boulder.rsi
    state: dark3

