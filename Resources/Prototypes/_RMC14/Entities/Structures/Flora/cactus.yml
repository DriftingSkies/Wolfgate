# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: PottedPlantBase
  id: RMCCactus3
  components:
  - type: Sprite
    state: cactus_8
    noRot: true
    sprite: _RMC14/Structures/Flora/cactus.rsi
    drawdepth: FloorObjects
  - type: SpriteFade
  - type: Clickable
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Icon
    sprite: _RMC14/Structures/Flora/cactus.rsi
    state: cactus_8

