# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  id: RMCIcechunk
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-2.49,1.49,1.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/research_icechunk.rsi
    noRot: true
    state: icechunk
    offset: 0,-0.5
  - type: Clickable
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCIcechunk
  id: RMCIcechunkElsa
  suffix: Elsa
  components:
  - type: Sprite
    sprite: _RMC14/Structures/research_icechunk.rsi
    state: elsa
  - type: AmbientSound
    enabled: true
    sound:
      path: /Audio/Ambience/anomaly_scary.ogg
    range: 4
    volume: -1

- type: entity
  parent: RMCIcechunk
  id: RMCIcechunkDroLar
  suffix: Drone & Larva
  components:
  - type: Sprite
    sprite: _RMC14/Structures/research_icechunk.rsi
    state: drolar

- type: entity
  parent: RMCIcechunk
  id: RMCIcechunkPara
  suffix: Parasites
  components:
  - type: Sprite
    sprite: _RMC14/Structures/research_icechunk.rsi
    state: para

- type: entity
  parent: RMCIcechunk
  id: RMCIcechunkCaveman
  suffix: Caveman #NOTE: This is once off species of 0 importance, they're meant to be just another one of many extinct species, space is a big place after all
  components:
  - type: Sprite
    sprite: _RMC14/Structures/research_icechunk.rsi
    state: caveman
# WOLFGATE END
