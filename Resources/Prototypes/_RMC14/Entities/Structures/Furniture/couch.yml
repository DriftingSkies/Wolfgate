# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: SeatBase
  id: RMCCouchMidRed
  suffix: Mid
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Couches/red_couch.rsi
    state: couch_mid
    snapCardinals: false
  - type: VehicleSmashable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Couches/red_couch.rsi
    state: couch_mid

- type: entity
  parent: RMCCouchMidRed
  id: RMCCouchEndLowerRed
  suffix: End, Lower
  components:
  - type: Sprite
    state: couch_end_lower
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Couches/red_couch.rsi
    state: couch_end_lower

- type: entity
  parent: RMCCouchMidRed
  id: RMCCouchEndUpperRed
  suffix: End, Upper
  components:
  - type: Sprite
    state: couch_end_upper
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Couches/red_couch.rsi
    state: couch_end_upper

