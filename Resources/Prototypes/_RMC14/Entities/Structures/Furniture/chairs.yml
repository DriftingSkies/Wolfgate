# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: SeatBase
  id: CMChairAlt
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: chair_alt
    snapCardinals: false
  - type: Tag
    tags: []
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: Icon
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: chair_alt

