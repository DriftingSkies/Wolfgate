# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: Bed
  id: RMCBedPsych
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/bed.rsi
    noRot: false
    state: psychbed
    snapCardinals: false
  - type: VehicleSmashable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: HealOnBuckle
    damage: {}
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Icon
    sprite: _RMC14/Structures/Furniture/bed.rsi
    state: psychbed

