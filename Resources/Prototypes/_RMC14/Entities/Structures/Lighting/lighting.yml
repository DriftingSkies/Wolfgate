# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: AlwaysPoweredWallLight
  id: RMCLightFixture
  suffix: DO NOT MAP
  components:
  - type: Sprite
    state: tube1
    sprite: _RMC14/Structures/Wallmounts/Lighting/light_tube.rsi
    layers:
    - state: tube1
      map: [ enum.PoweredLightLayers.Base ]
    snapCardinals: false
  - type: PointLight
    enabled: true
    color: "#FFEFD2"
    energy: 1
    radius: 10
    softness: 1
    offset: "0, -0.5"
  - type: PoweredLight
    hasLampOnSpawn: LightTube
    unarmedHitShock: 0
    bulb: Tube
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -15
    range: 2
    sound:
      path: /Audio/Ambience/Objects/light_hum.ogg
  - type: DeviceLinkSink
    ports: [ "On", "Off", Toggle ]
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: PoweredLightVisuals
    spriteStateMap:
      Empty: tube-empty
      "Off": tube0
      "On": tube1
      Broken: tube-broken
      Burned: tube-burned
  - type: Destructible
    thresholds: []
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: Appearance
  - type: ContainerContainer
    containers:
      light_bulb: !type:ContainerSlot {}
  - type: Icon
    sprite: _RMC14/Structures/Wallmounts/Lighting/light_tube.rsi
    state: tube1

