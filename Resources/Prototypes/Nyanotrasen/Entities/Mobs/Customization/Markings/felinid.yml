# Felinid Tails
# Goobstation - Tajaran since they're fully compatible

- type: marking
  id: FelinidTailBasic
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Felinid, Tajaran, Human] # Goobstation - Tajaran
  # WOLFGATE(Genitals) START: the south frame draws behind the body, so the tail never covers anatomy
  layering:
    basic_tail_tip_BEHIND: TailBehind
  # WOLFGATE END
  # WOLFGATE(Genitals) START: both halves of a tail share one colour
  colorLinks:
    basic_tail_tip_BEHIND: basic_tail_tip_FRONT
  # WOLFGATE END
  sprites:
  # WOLFGATE(Genitals) START: split art
  - sprite: _WF/Genitals/Mobs/Customization/TailSplit/Nyanotrasen/Mobs/Customization/felinid_tails.rsi
    state: basic_tail_tip_FRONT
  # WOLFGATE END
  - sprite: Nyanotrasen/Mobs/Customization/felinid_tails.rsi
    state: basic_tail_stripes_even
  - sprite: Nyanotrasen/Mobs/Customization/felinid_tails.rsi
    state: basic_tail_stripes_odd
  # WOLFGATE(Genitals) START: south frame on TailBehind
  - sprite: _WF/Genitals/Mobs/Customization/TailSplit/Nyanotrasen/Mobs/Customization/felinid_tails.rsi
    state: basic_tail_tip_BEHIND
  # WOLFGATE END

