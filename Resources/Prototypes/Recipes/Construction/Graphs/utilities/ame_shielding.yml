- type: constructionGraph
  id: AmeShielding
  start: start
  graph:
    # WOLFGATE(Drydock): build cost the drydock prices the shielding's rebuild and salvage from; no recipe uses it
    - node: start
      edges:
        - to: ameShielding
          steps:
            - material: Plasteel
              amount: 10
            - material: Steel
              amount: 5
            - material: Plasma
              amount: 2
    - node: startBroken

    - node: ameShielding
      entity: AmeShielding
      edges:
        - to: start
          conditions:
            - !type:AmeShieldIntegrity
          completed:
            - !type:AdminLog  # I don't like logging it like this. The log should include the user, AMEShielding EntityID, and AMEPart EntityID, and there should also be a start of attempt log.
              message: "An AME shielding was deconstructed"
            - !type:SpawnPrototype
              prototype: AmePartFlatpack
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Welding
              doAfter: 3

        - to: startBroken
          conditions:
            - !type:AmeShieldIntegrity
              checkAbove: false
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 5
            - !type:DeleteEntity
          steps:
            - tool: Welding
              doAfter: 3
