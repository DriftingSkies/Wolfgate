# The work packages' files. Wiring and trimming happen by hand after the copy; the script only does the mechanical part.
groups:
  # WP1: base operator layer, grid mover, the small components the mover reads, client mover and debug commands.
  - wp: 1
    source: rmc
    from: Content.Shared/Vehicle
    to: Content.Shared/_WF/Vehicles/Base
    files:
      - Components/VehicleComponent.cs: RMCVehicleComponent.cs
      - Components/VehicleOperatorComponent.cs: RMCVehicleOperatorComponent.cs
      - VehicleSystem.cs: RMCVehicleSystem.cs
    # Not imported: StrapVehicle, ContainerVehicle, GenericKeyedVehicle, VehicleSystem.Key.cs, VehicleSystem.Operator.cs.
  - wp: 1
    source: rmc
    from: Content.Shared/_RMC14/Vehicle
    to: Content.Shared/_WF/Vehicles/Base
    files:
      - VehicleWatchingComponent.cs
  - wp: 1
    source: rmc
    from: Content.Shared/_RMC14/Vehicle/Grid
    to: Content.Shared/_WF/Vehicles/Grid
    files:
      - Components/GridVehicleMoverComponent.cs
      - Components/GridVehicleOperatorComponent.cs
      - GridVehicleMotionSimulator.cs
      - GridVehicleMoveSystem.cs
      - GridVehicleMoveSystem.Movement.cs
      - GridVehicleMoveSystem.Collision.cs
      # What is left of RMC's Push file once the xeno pusher is gone: the driver's input.
      - GridVehicleMoveSystem.Push.cs: GridVehicleMoveSystem.Input.cs
    # Not imported: ToxicWater, SqueezeUnder, RideSurface (all deferred), the autopilot component.
    # Hand-trimmed after the copy: the xeno, barricade, weeds, water, push and bypass code is gone, and the wheel and
    # crash calls became VehicleCollisionEvent (Grid/VehicleCollisionEvent.cs, new). See design.md.
    # WP2 then reworked the movement and collision files by hand, so do not re-import over them: the narrowphase is in
    # the grid's frame, the floor check is GridVehicleMoveSystem.Floor.cs (new, with GridVehicleGeometry.cs and
    # VehicleOpenTileAttemptEvent.cs), every smash read is TryGetSmashable (VehicleSmashSettings.cs, new), and the
    # mover keeps its speed and re-reads its facing when the grid changes. See the Hardening section of design.md.
  - wp: 1
    source: rmc
    from: Content.Shared/_RMC14/Vehicle/Core
    to: Content.Shared/_WF/Vehicles/Core
    files:
      - VehicleSoundComponent.cs
      - VehicleSmashableComponent.cs
      - VehicleRunoverComponent.cs
      - VehicleRunoverSystem.cs
      - VehicleOverchargeComponent.cs
  - wp: 1
    source: rmc
    from: Content.Shared/_RMC14/Vehicle/Hardpoint
    to: Content.Shared/_WF/Vehicles/Hardpoint
    files:
      # Speed and acceleration modifiers (the mover reads them), and the gunner view and weapon support parts. Weapon accuracy
      # is stripped, so the two AccuracyMultiplier fields on the weapon support components were removed after the copy.
      - VehicleSupportModifierComponents.cs
  - wp: 1
    source: rmc
    from: Content.Client/_RMC14/Vehicle
    to: Content.Client/_WF/Vehicles/Grid
    files:
      # Hand-trimmed: no hardpoint overlay (WP6 adds it and its console command back) and no entry or exit point
      # drawing (WP4 adds it back; the removed methods are DrawEntryAndExitPoints, FindFirstGrid, DrawEntryPoints and
      # DrawExitPoints in the source overlay). Ride surfaces are not drawn.
      - GridVehicleMoverSystem.cs
      - GridVehicleMoverOverlay.cs
  - wp: 1
    source: rmc
    from: Content.Client/_RMC14/Vehicle
    to: Content.Client/_WF/Vehicles/Overlays
    files:
      # Hand-trimmed: rmc_vehicle_hardpoint comes back with the overlay in WP6. Strings are Fluent keys in
