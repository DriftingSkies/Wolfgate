# The explicit file list and rewrite rules for Tools/_WF/Vehicles/import_rmc.py (the Vehicles port; see
# Docs/_WF/Vehicles/design.md). A file is imported only if it is listed here under its work package.
#
# A group copies files from `from` (a folder in the source repo) to `to` (a folder in this repo). An entry in `files`
# is a path relative to both folders, or `{source path: destination path}` to rename or flatten the copy. Anything
# that is not .cs or .xaml is copied byte for byte. The script never overwrites a file that exists unless told to.

# `dir` is the folder of a source checkout; source_paths.py finds it beside this checkout (or WOLFGATE_RMC_PATH,
# WOLFGATE_CMU_PATH, WOLFGATE_ENGINE_PATH, or the tools' --rmc, --cmu, --engine options) and fills in `path`.
sources:
  rmc:
    dir: RMC-14
    commit: e4627aee9e5bbd2d3841ddaa6c25593529a0638a
    date: 2026-10-09
    licence: MIT
    copyright: Copyright (c) 2023-2026 RMC-14
  cmu:
    dir: ColonialMarinesUniverse
    commit: b3cac1a18a631ad5669e0255eaa4a0a4b3add0f6
    date: 2026-10-10
    licence: AGPL-3.0
    copyright: Colonial Marines Universe contributors
  engine:
    dir: RMC-14/RobustToolbox
    commit: ea09bdafbf0f55919b237960c4d7ed534daed9f8
    date: 2025-09-06
    licence: MIT
    copyright: Space Wizards Federation (RobustToolbox 264.0.2, RMC-14's fork)

# Rewrites applied to every imported .cs and .xaml file, in this order. They map the source namespaces onto the flat
# module namespace; a real import then runs fix_namespaces.py, which moves each file into the namespace of its folder
# (AGENTS.md: namespaces follow the folder) and repairs the usings that named it.
rewrite:
  # Fully qualified names that must change before the namespaces do.
  qualified:
    Content.Shared.Vehicle.VehicleSystem: Content.Shared._WF.Vehicles.RMCVehicleSystem
    Content.Shared.Vehicle.Components.VehicleComponent: Content.Shared._WF.Vehicles.RMCVehicleComponent
    Content.Shared.Vehicle.Components.VehicleOperatorComponent: Content.Shared._WF.Vehicles.RMCVehicleOperatorComponent

  # A namespace and everything below it. Longest first is not needed; the script sorts.
  prefix:
    Content.Shared.Vehicle.Components: Content.Shared._WF.Vehicles
    Content.Shared.Vehicle: Content.Shared._WF.Vehicles
    Content.Shared._RMC14.Vehicle: Content.Shared._WF.Vehicles
    Content.Server._RMC14.Vehicle: Content.Server._WF.Vehicles
    Content.Client._RMC14.Vehicle: Content.Client._WF.Vehicles

  # Only a `using` or `namespace` line that names exactly this namespace. The RMC namespaces below also hold types
  # Wolfgate has under other names, so sub-namespaces are left alone.
  exact:
    Content.Shared._RMC14.UserInterface: Content.Shared._WF.Vehicles
    Content.Shared._RMC14.Teleporter: Content.Shared._WF.Vehicles
    Content.Shared._RMC14.Weapons.Ranged: Content.Shared._WF.Vehicles
    Content.Shared._RMC14.Weapons.Ranged.Ammo.BulletBox: Content.Shared._WF.Vehicles
    Content.Server._RMC14.Trigger: Content.Server._WF.Vehicles
    Content.Shared.CMU14.Vehicle: Content.Shared._WF.Vehicles
    Content.Shared.CMU14.CargoVehicle: Content.Shared._WF.Vehicles
    Content.Server.CMU14.CargoVehicle: Content.Server._WF.Vehicles

  # Whole-word type renames.
  types:
    VehicleComponent: RMCVehicleComponent
    VehicleOperatorComponent: RMCVehicleOperatorComponent
    VehicleVisuals: RMCVehicleVisuals
    RMCUserInterfaceSystem: VehicleUserInterfaceSystem
    SharedRMCTeleporterSystem: VehiclePullingSystem
    # `VehicleSystem` is decided per file: RMCVehicleSystem in files that come from Content.Shared/Vehicle, otherwise
    # VehicleInteriorSystem (RMC's interior system). See import_rmc.py.

  # Plain call rewrites (regex to replacement).
  calls:
    '\b_physics\.IsHardCollidable\(': 'VehicleHardCollision.IsHardCollidable('

# Tokens that mark RMC systems the game does not have; the report counts them per file so the strip pass is easy.
strip_hints:
  - Xeno
  - Skill
  - PowerLoader
  - Flamer
  - IFF
  - TacticalMap
  - RMCSizes
  - Areas
  - Squad
  - Marine
  - Requisition
  - Dropship
  - Barricade

